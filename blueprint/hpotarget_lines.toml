[[rule]]
id = "RULE.OPTIM_LAMBDA_evidence"
title = "OPTIM LAMBDA starts from a LAMBDA of 0 or above"
check = "parse"
keys = ["ROOT.OPTIM", "OPTIM.TARGET.LAMBDA"]
msg = "OPTIM LAMBDA: the training configuration has LAMBDA -1, which requests the evidence approximation: each fit then finds the penalty itself, and OPTIM LAMBDA would replace it with the values of the box. LAMBDA >= 0 in the training configuration is the starting point of a search of LAMBDA; without OPTIM LAMBDA the evidence approximation finds it in every evaluation."
doc = """\
OPTIM LAMBDA searches a fixed ridge penalty. LAMBDA -1 in the training \
configuration requests the evidence approximation, which finds the \
penalty in each fit, so it is refused with OPTIM LAMBDA, at the line."""

[[rule.examples]]
wrap = "root"
context = "lines_oalgo"
doc = "The training configuration has LAMBDA 1e-3, the starting point of the search."
text = "OPTIM LAMBDA (1) 1e-6 1e-2 LOG"

