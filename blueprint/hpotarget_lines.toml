# ===================================================== PC_FAILPROBE =====

[[key]]
id = "ROOT.PC_FAILPROBE"
name = "PC_FAILPROBE"
blocks = ["ROOT"]
synopsis = "PC_FAILPROBE --script <file> --outvar <S> [--gate <g>] [--s0 <s0>] [<option> ...] [<LAMMPS option> ...]"
repeat = "error"
repeat_msg = "only one PC_FAILPROBE line is allowed"
doc = """\
A LAMMPS script that each evaluation runs first to measure how unsound \
the candidate potential is: its first --outvar is the probe value S, \
which fails the evaluation above --gate or when it is negative, not \
finite or at or above --failscore, and grades failed evaluations under \
FAILSCORE_GRADING ON. It adds no loss term."""
long_doc = """\
The line takes the options of a PC_LAMMPS line except --varloss, \
--hotvar and --failvar, and the options --gate and --s0 of its own. Its \
--failscore is a positive number. A probe whose script fails, or whose S \
is negative, not finite, or at or above its --failscore, has failed: the \
evaluation fails, with the loss of the least sound evaluation under \
FAILSCORE_GRADING ON and with FAILSCORE under OFF, and hpo_run.log has a \
warning that gives S. The rules that relate PC_LAMMPS lines to the optimiser \
apply to a file with a PC_FAILPROBE line too. The script is read, and \
LAMMPS started, as for a PC_LAMMPS line, with the same refusals. The line \
gives no loss term: a file needs another loss source."""
quirk = """\
A token after --gate or --s0 is its value whatever it is."""
checks = [
  { msg = "{key}: the line has no --script option; --script <file> names the LAMMPS script the line runs", doc = "At the line: no --script option." },
  { msg = "PC_FAILPROBE requires --outvar <S> (the sanity scalar)", doc = "At the line: no --outvar option." },
  { msg = "PC_FAILPROBE must not declare --varloss (it grades failures; it must not shape the feasible objective)", doc = "At the line: a --varloss option." },
  { msg = "PC_FAILPROBE must not declare --hotvar/--failvar", doc = "At the line: a --hotvar or --failvar option." },
  { msg = "{key}: unknown option '{option}'{note}: a {key} line takes the options {list}, and LAMMPS command-line options, which start with a single '-'", doc = "At the line: an option that starts with -- and is none of the line's; {note} names the option meant, or the other line it belongs to." },
  { msg = "{key}: LAMMPS cannot start with this line's command-line options: {why}", doc = "At the line: LAMMPS refuses a command-line option of the line; {why} is the message of LAMMPS." },
]

[[key.args]]
name = "option"
kind = "tokens"
optional = true
repeat = true
doc = "An option of the line, which starts with --, with its values."

[[key.args]]
name = "LAMMPS option"
kind = "tokens"
optional = true
repeat = true
doc = "A LAMMPS command-line option, which starts with a single -, with the values that follow it."

[[key.examples]]
wrap = "root"
text = "PC_FAILPROBE --script lines_pc.in --outvar S"

[[key.examples]]
doc = "With the probe value that stops the other scripts, its scale under FAILSCORE_GRADING ON and the value that marks a failed probe."
wrap = "root"
text = '''
FAILSCORE 1e9
FAILSCORE_GRADING ON
PC_FAILPROBE --script lines_pc.in --outvar S --gate 3 --s0 2 --failscore 10'''

[[key.invalid]]
wrap = "root"
at = 2
text = '''
PC_FAILPROBE --script lines_pc.in --outvar S
PC_FAILPROBE --script lines_pc2.in --outvar E2'''
error = "only one PC_FAILPROBE line is allowed"

[[key.invalid]]
wrap = "root"
text = "PC_FAILPROBE --script lines_pc.in"
error = "PC_FAILPROBE requires --outvar <S> (the sanity scalar)"

[[key.invalid]]
wrap = "root"
text = "PC_FAILPROBE --script lines_pc.in --outvar S --varloss E 1 1"
error = "PC_FAILPROBE must not declare --varloss (it grades failures; it must not shape the feasible objective)"

[[key.invalid]]
wrap = "root"
text = "PC_FAILPROBE --script lines_pc.in --outvar S --hotvar a 1 2"
error = "PC_FAILPROBE must not declare --hotvar/--failvar"

[[key.invalid]]
wrap = "root"
text = "PC_FAILPROBE --script lines_pc.in --outvar S --failvar V"
error = "PC_FAILPROBE must not declare --hotvar/--failvar"

[[key.invalid]]
wrap = "root"
text = "PC_FAILPROBE --script lines_pc.in --outvar S --hotvars a 1 2"
error = "PC_FAILPROBE: unknown option '--hotvars': a PC_FAILPROBE line takes the options --script, --invar, --outvar, --failscore, --maxtime, --gate and --s0, and LAMMPS command-line options, which start with a single '-'"

[[key.invalid]]
wrap = "root"
text = "PC_FAILPROBE --outvar S"
error = "PC_FAILPROBE: the line has no --script option; --script <file> names the LAMMPS script the line runs"

[[key.invalid]]
wrap = "root"
text = "PC_FAILPROBE --script /missing/probe.in --outvar S"
error = "LAMMPS include file not found: /missing/probe.in"
msg_of = "ROOT.PC_LAMMPS"

[[key.invalid]]
wrap = "root"
text = "PC_FAILPROBE --script lines_pc.in --outvar S -sff 3"
error = "PC_FAILPROBE: LAMMPS cannot start with this line's command-line options: ERROR: Invalid command-line argument: -sff (src/lammps.cpp:490)"

[[line_option]]
id = "PC_FAILPROBE.--gate"
option = "--gate"
lines = ["PC_FAILPROBE"]
synopsis = "--gate <g>"
repeat = "error"
repeat_msg = "PC_FAILPROBE --gate is given twice on this line; each option is given once"
default = { text = "none: only an S that is negative, not finite or at or above --failscore stops an evaluation" }
doc = """\
An evaluation whose probe value S exceeds <g> stops its other scripts and \
fails: under FAILSCORE_GRADING ON with a loss graded by S, under OFF with \
FAILSCORE."""

[[line_option.args]]
name = "g"
kind = "number"
what = "PC_FAILPROBE --gate"

[[line_option.checks]]
msg = "PC_FAILPROBE --gate requires a value"
doc = "The option ends the line without its value."

[[line_option.examples]]
wrap = "root"
text = "PC_FAILPROBE --script lines_pc.in --outvar S --gate 0.5"

[[line_option.invalid]]
wrap = "root"
text = "PC_FAILPROBE --script lines_pc.in --outvar S --gate"
error = "PC_FAILPROBE --gate requires a value"

[[line_option.invalid]]
wrap = "root"
text = "PC_FAILPROBE --script lines_pc.in --outvar S --gate x"
error = "PC_FAILPROBE --gate must be a finite number, got 'x'"

[[line_option.invalid]]
wrap = "root"
text = "PC_FAILPROBE --script lines_pc.in --outvar S --gate 1 --gate 2"
error = "PC_FAILPROBE --gate is given twice on this line; each option is given once"

[[line_option.invalid]]
wrap = "root"
doc = "A word after the value, which no option takes: it is named with --gate."
text = "PC_FAILPROBE --script lines_pc.in --outvar S --gate 1 stray"
error = "PC_FAILPROBE --gate takes one value (unexpected 'stray')"


[[line_option]]
id = "PC_FAILPROBE.--s0"
option = "--s0"
lines = ["PC_FAILPROBE"]
synopsis = "--s0 <s0>"
repeat = "error"
repeat_msg = "PC_FAILPROBE --s0 is given twice on this line; each option is given once"
default = { literal = "1" }
doc = """\
The scale of the probe value S in the graded failure loss of an \
evaluation under FAILSCORE_GRADING ON; refused under OFF, where a failed \
evaluation scores FAILSCORE."""

[[line_option.args]]
name = "s0"
kind = "positive"
noun = "number"
what = "PC_FAILPROBE --s0"

[[line_option.checks]]
msg = "PC_FAILPROBE --s0 requires a value"
doc = "The option ends the line without its value."

[[line_option.checks]]
msg = "PC_FAILPROBE --s0 grades failed evaluations, which FAILSCORE_GRADING ON does; under FAILSCORE_GRADING OFF every failed evaluation scores FAILSCORE, so --s0 would have no effect"
doc = "At startup, at the line, under FAILSCORE_GRADING OFF: the line has --s0."

[[line_option.examples]]
wrap = "root"
text = '''
FAILSCORE 1e9
FAILSCORE_GRADING ON
PC_FAILPROBE --script lines_pc.in --outvar S --s0 0.2'''

[[line_option.invalid]]
wrap = "root"
text = "PC_FAILPROBE --script lines_pc.in --outvar S --s0"
error = "PC_FAILPROBE --s0 requires a value"

[[line_option.invalid]]
wrap = "root"
text = "PC_FAILPROBE --script lines_pc.in --outvar S --s0 0"
error = "PC_FAILPROBE --s0 must be a positive number, got '0'"

[[line_option.invalid]]
wrap = "root"
text = "PC_FAILPROBE --script lines_pc.in --outvar S --s0 1 --s0 2"
error = "PC_FAILPROBE --s0 is given twice on this line; each option is given once"

[[line_option.invalid]]
wrap = "root"
doc = "A word after the value, which no option takes: it is named with --s0."
text = "PC_FAILPROBE --script lines_pc.in --outvar S --s0 1 stray"
error = "PC_FAILPROBE --s0 takes one value (unexpected 'stray')"

[[line_option.invalid]]
wrap = "root"
check = "startup"
doc = "Under FAILSCORE_GRADING OFF, the default."
text = "PC_FAILPROBE --script lines_pc.in --outvar S --s0 0.2"
error = "PC_FAILPROBE --s0 grades failed evaluations, which FAILSCORE_GRADING ON does; under FAILSCORE_GRADING OFF every failed evaluation scores FAILSCORE, so --s0 would have no effect"


# ==================================================== PC_OBSERVABLE =====

[[key]]
id = "ROOT.PC_OBSERVABLE"
name = "PC_OBSERVABLE"
blocks = ["ROOT"]
synopsis = "PC_OBSERVABLE <kind> <option> ..."
repeat = "add"
doc = """\
A loss term on a property that tadah computes with the candidate \
potential, without LAMMPS. The kind names the property; cohesive_energy \
is the one kind."""
long_doc = """\
cohesive_energy provides the analytical gradient of its term, except \
for the value of --unconverged force-scaled. A file has PC_OBSERVABLE \
lines or PC_LAMMPS lines, not both."""
checks = [
  { msg = "PC_OBSERVABLE: empty line", doc = "At the line: no observable kind follows the key." },
]

[[key.args]]
name = "kind"
kind = "name"
msg = "PC_OBSERVABLE: unknown observable kind '{tok}'"
doc = "The observable, the word of a form PC_OBSERVABLE.<kind>."

[[key.args]]
name = "option"
kind = "tokens"
repeat = true
doc = "An option of the kind, with its values."

[[key.examples]]
wrap = "root"
text = "PC_OBSERVABLE cohesive_energy --species H --target 2.0 --weight 1 --hotvar a0 1.5 2.5 2.0"

[[key.invalid]]
wrap = "root"
text = "PC_OBSERVABLE"
error = "PC_OBSERVABLE: empty line"

[[key.invalid]]
wrap = "root"
text = "PC_OBSERVABLE lattice_param --species H"
error = "PC_OBSERVABLE: unknown observable kind 'lattice_param'"

[[form]]
id = "PC_OBSERVABLE.cohesive_energy"
line = "PC_OBSERVABLE"
word = "cohesive_energy"
synopsis = "PC_OBSERVABLE cohesive_energy --species <element> --target <E> --weight <w> --hotvar a0 <lo> <hi> [<init>] [<option> ...]"
doc = """\
The cohesive energy of a bcc crystal of one species, in eV/atom and \
positive for a bound crystal: the energy of an isolated atom less the \
energy per atom of the crystal relaxed at zero pressure."""
long_doc = """\
Each evaluation builds a bcc supercell with the lattice constant a0, \
relaxes it at zero pressure with tadah's own relaxer and compares the \
cohesive energy with the target through the loss function. The \
relaxation ends when the magnitude of the cell's pressure is below \
--ptol and the largest atomic force below --fmax-converged. Each \
relaxation starts from the lattice constant at which the previous \
relaxation of the same replica (TADAH:ANNEAL_PT), walker \
(TADAH:ANNEAL_PA) or ASA trial-state slot (the n-th trial state of each \
generated batch, see Gener_Block) ended; the first starts from the \
start value of --hotvar. Every other optimiser hands the lattice constant \
on from each evaluation to the next, across MULTISTART starts and \
PRESTAGE phases. A relaxation whose a0 ends outside the --hotvar window \
fails the term, and with it the evaluation, and hands on the lattice \
constant it started from. A relaxation that does not converge reports \
the value that --unconverged sets."""

[[form.checks]]
msg = "PC_OBSERVABLE cohesive_energy: --species is required"
doc = "The line has no --species."

[[form.checks]]
msg = "PC_OBSERVABLE cohesive_energy: --target is required"
doc = "The line has no --target."

[[form.checks]]
msg = "PC_OBSERVABLE cohesive_energy: --weight is required"
doc = "The line has no --weight."

[[form.checks]]
msg = "PC_OBSERVABLE cohesive_energy: --hotvar a0 <lo> <hi> [<init>] is required"
doc = "The line has no --hotvar."

[[form.checks]]
msg = "PC_OBSERVABLE cohesive_energy: unknown option '{tok}'"
doc = "A token is not an option of the kind, nor a value of one."

[[form.checks]]
msg = "PC_OBSERVABLE cohesive_energy: '{option}' requires a value"
doc = "An option ends the line without its value; {option} names the option or the value missing."

[[form.checks]]
msg = "PC_OBSERVABLE cohesive_energy: {option} takes a finite number (got '{tok}'){underflow}"
doc = "A number of an option is not a number."

[[form.examples]]
wrap = "root"
text = "PC_OBSERVABLE cohesive_energy --species H --target 2.0 --weight 1 --hotvar a0 1.5 2.5"

[[form.invalid]]
wrap = "root"
text = "PC_OBSERVABLE cohesive_energy --target 2.0 --weight 1 --hotvar a0 1.5 2.5"
error = "PC_OBSERVABLE cohesive_energy: --species is required"

[[form.invalid]]
wrap = "root"
text = "PC_OBSERVABLE cohesive_energy --species H --weight 1 --hotvar a0 1.5 2.5"
error = "PC_OBSERVABLE cohesive_energy: --target is required"

[[form.invalid]]
wrap = "root"
text = "PC_OBSERVABLE cohesive_energy --species H --target 2 --hotvar a0 1.5 2.5"
error = "PC_OBSERVABLE cohesive_energy: --weight is required"

[[form.invalid]]
wrap = "root"
text = "PC_OBSERVABLE cohesive_energy --species H --target 2 --weight 1"
error = "PC_OBSERVABLE cohesive_energy: --hotvar a0 <lo> <hi> [<init>] is required"

[[form.invalid]]
wrap = "root"
text = "PC_OBSERVABLE cohesive_energy --species H --target 2 --weight 1 --hotvar a0 1.5 2.5 --bogus"
error = "PC_OBSERVABLE cohesive_energy: unknown option '--bogus'"

[[form.invalid]]
wrap = "root"
text = "PC_OBSERVABLE cohesive_energy --species H --target -1 --weight 1 --hotvar a0 2.0 3.0 --etol"
error = "PC_OBSERVABLE cohesive_energy: '--etol' requires a value"

[[form.invalid]]
wrap = "root"
text = "PC_OBSERVABLE cohesive_energy --species H --target -1 --weight 1 --hotvar a0 2.0 3.0 --etol x"
error = "PC_OBSERVABLE cohesive_energy: --etol takes a finite number (got 'x')"

[[line_option]]
id = "PC_OBSERVABLE.cohesive_energy.--species"
option = "--species"
lines = ["PC_OBSERVABLE.cohesive_energy"]
synopsis = "--species <element>"
repeat = "error"
repeat_msg = "PC_OBSERVABLE cohesive_energy: --species is given twice on this line; each option is given once"
doc = "The chemical element of the crystal, an element of the potential. The line requires it."

[[line_option.args]]
name = "element"
kind = "name"

[[line_option.checks]]
msg = "PC_OBSERVABLE cohesive_energy: --species {name} is not the symbol of an element"
doc = "The word is no element symbol, in its case."

[[line_option.checks]]
msg = "PC_OBSERVABLE cohesive_energy --species {name}: the potential has no element {name} (its elements: {list})"
doc = "At startup, at the line: the element is none of the run (ATOM, or the elements of the training data)."

[[line_option.examples]]
wrap = "root"
text = "PC_OBSERVABLE cohesive_energy --species H --target 2.0 --weight 1 --hotvar a0 1.5 2.5"

[[line_option.invalid]]
wrap = "root"
text = "PC_OBSERVABLE cohesive_energy --species"
error = "PC_OBSERVABLE cohesive_energy: '--species' requires a value"

[[line_option.invalid]]
wrap = "root"
text = "PC_OBSERVABLE cohesive_energy --species H --species H --target 2 --weight 1 --hotvar a0 1.5 2.5"
error = "PC_OBSERVABLE cohesive_energy: --species is given twice on this line; each option is given once"

[[line_option.invalid]]
