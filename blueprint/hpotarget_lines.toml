error = "PC_OBSERVABLE cohesive_energy --species Ta: the potential has no element Ta (its elements: H)"



[[line_option]]
id = "PC_OBSERVABLE.cohesive_energy.--target"
option = "--target"
lines = ["PC_OBSERVABLE.cohesive_energy"]
synopsis = "--target <E>"
repeat = "error"
repeat_msg = "PC_OBSERVABLE cohesive_energy: --target is given twice on this line; each option is given once"
doc = "The cohesive energy the search aims at, in eV/atom. The line requires it."

[[line_option.args]]
name = "E"
kind = "number"
msg = "PC_OBSERVABLE cohesive_energy: --target takes a finite number (got '{tok}'){underflow}"

[[line_option.checks]]
msg = "PC_OBSERVABLE cohesive_energy --target {tok}: {why}"
doc = "At the end of the line: the loss function of the term cannot measure the target: MAPE divides by it, and it is 0, or RMSLE takes the logarithm of the target plus 1e-12, and it is at or below -1e-12; {why} says which."

[[line_option.examples]]
