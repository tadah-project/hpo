id = "RULE.OPTIM_OALGO_threshold_box"
title = "OPTIM OALGO (2) searches a rank threshold inside (0, 1)"
check = "parse"
keys = ["ROOT.OPTIM", "OPTIM.TARGET.OALGO"]
msg = "OPTIM OALGO (2): the box [{low}, {high}] is not inside (0, 1), but the second value of OALGO is the rank threshold M of OALGO 1 and 3, which only a value 0 < M < 1 sets: every M below 0 is the machine precision under OALGO 1, every M of 0 or below leaves out only a singular value of 0 under OALGO 3, and a fit refuses an M of 1 or more, so the box of a search is inside (0, 1)"
doc = """\
OPTIM OALGO (2) searches the rank threshold of OALGO 1 and 3. A box that \
reaches 0 or below, or 1 or above, is refused at the line."""
msg_doc = "The message gives the low and the high bound of the box."

[[rule.examples]]
wrap = "root"
context = "lines_oalgo"
doc = "The training configuration has OALGO 3 1e-8, inside the box."
text = "OPTIM OALGO (2) 1e-12 0.001 LOG"

[[rule.invalid]]
wrap = "root"
context = "lines_oalgo"
text = "OPTIM OALGO (2) 0 0.5"
error = "OPTIM OALGO (2): the box [0, 0.5] is not inside (0, 1), but the second value of OALGO is the rank threshold M of OALGO 1 and 3, which only a value 0 < M < 1 sets: every M below 0 is the machine precision under OALGO 1, every M of 0 or below leaves out only a singular value of 0 under OALGO 3, and a fit refuses an M of 1 or more, so the box of a search is inside (0, 1)"

[[rule.invalid]]
wrap = "root"
context = "lines_oalgo"
text = "OPTIM OALGO (2) 0.001 2"
error = "OPTIM OALGO (2): the box [0.001, 2] is not inside (0, 1), but the second value of OALGO is the rank threshold M of OALGO 1 and 3, which only a value 0 < M < 1 sets: every M below 0 is the machine precision under OALGO 1, every M of 0 or below leaves out only a singular value of 0 under OALGO 3, and a fit refuses an M of 1 or more, so the box of a search is inside (0, 1)"

[[rule]]
id = "RULE.fit_OALGO3_intercepts"
title = "OALGO 3 fits an intercept column with LAMBDA 0"
check = "startup"
msg = "OALGO=3 (SVD with uniform ridge) does not support intercept exclusion from regularisation. The model has {count} intercept column(s) (BIAS=true with ATOM) and LAMBDA != 0; OALGO 1, 2 or 4 fits such a model with LAMBDA != 0."
doc = """\
OALGO 3 penalises every weight alike, and a ridge penalty leaves the \
intercept columns out (BIAS true), so a fit with an intercept column that \
FIXINDEX does not pin refuses OALGO 3 with a positive LAMBDA; tadah hpo \
refuses it when the run starts, without a line, if its evaluations fit \
the model."""
msg_doc = "The message gives the number of intercept columns the fit has."

[[rule.invalid]]
wrap = "root"
check = "startup"
context = "lines_oalgo3_bias"
at = "none"
text = "PC_EMAE 5 1"
error = "OALGO=3 (SVD with uniform ridge) does not support intercept exclusion from regularisation. The model has 1 intercept column(s) (BIAS=true with ATOM) and LAMBDA != 0; OALGO 1, 2 or 4 fits such a model with LAMBDA != 0."

[[rule]]
id = "RULE.fit_OALGO3_intercepts_evidence"
title = "The evidence approximation fits no intercept column"
check = "startup"
msg = "LAMBDA -1 requests the evidence approximation, which only OALGO 3 runs; OALGO 3 penalises every weight alike, and the model has {count} intercept column(s) (BIAS true with ATOM), which a ridge penalty leaves out. The evidence approximation needs BIAS false, or every intercept weight pinned with FIXINDEX and FIXWEIGHT. With BIAS true, LAMBDA 0 fits with any OALGO, and LAMBDA > 0 with OALGO 1, 2 or 4."
doc = """\
LAMBDA -1 runs the evidence approximation under OALGO 3, which penalises \
every weight alike, so a fit with an intercept column that FIXINDEX does \
not pin refuses it; tadah hpo refuses it when the run starts, without a \
line, if its evaluations fit the model."""
msg_doc = "The message gives the number of intercept columns the fit has and what fits with BIAS true."

[[rule.invalid]]
wrap = "root"
check = "startup"
context = "lines_oalgo3_bias_evidence"
at = "none"
text = "PC_EMAE 5 1"
error = "LAMBDA -1 requests the evidence approximation, which only OALGO 3 runs; OALGO 3 penalises every weight alike, and the model has 1 intercept column(s) (BIAS true with ATOM), which a ridge penalty leaves out. The evidence approximation needs BIAS false, or every intercept weight pinned with FIXINDEX and FIXWEIGHT. With BIAS true, LAMBDA 0 fits with any OALGO, and LAMBDA > 0 with OALGO 1, 2 or 4."

[[rule]]
id = "RULE.optim_LAMBDA_OALGO3_intercepts"
title = "OPTIM LAMBDA under OALGO 3 needs no intercept column"
check = "startup"
keys = ["ROOT.OPTIM"]
msg = "OPTIM LAMBDA: OALGO 3 penalises every weight alike, and the fit has {count} intercept column(s) (BIAS true with ATOM), which a ridge penalty leaves out, so every fit refuses a LAMBDA other than 0: each candidate of the box but 0 would fail its evaluation. OALGO 1, 2 or 4 fits a positive LAMBDA with the intercepts unpenalised."
doc = """\
Under OALGO 3 a fit with an intercept column that FIXINDEX does not pin \
refuses a LAMBDA other than 0, so tadah hpo refuses OPTIM LAMBDA when the \
run starts, without a line, if its evaluations fit the model."""
msg_doc = "The message gives the number of intercept columns the fit has."

[[rule.invalid]]
wrap = "root"
check = "startup"
context = "lines_oalgo3_bias_lambda0"
at = "none"
text = "OPTIM LAMBDA (1) 0 1e-2"
error = "OPTIM LAMBDA: OALGO 3 penalises every weight alike, and the fit has 1 intercept column(s) (BIAS true with ATOM), which a ridge penalty leaves out, so every fit refuses a LAMBDA other than 0: each candidate of the box but 0 would fail its evaluation. OALGO 1, 2 or 4 fits a positive LAMBDA with the intercepts unpenalised."

[[rule]]
id = "RULE.fit_krr_implementation"
title = "An M_KRR model is implementation 1 or 2"
check = "startup"
msg = "{text}: M_KRR has implementation 1, which fits the energies, forces and stresses of the structures, and implementation 2, which fits the energies per atom of whole structures (the third value of MODEL, 1 when it is left out); {value} is neither."
doc = """\
The third value of MODEL M_KRR selects implementation 1 or 2; tadah hpo \
refuses another when the run starts, without a line, also when FIXINDEX \
pins every weight: the MODEL line is the potential's."""
msg_doc = "The message starts with the MODEL line and names its third value."

[[rule.invalid]]
wrap = "root"
check = "startup"
context = "lines_krr_implementation3"
at = "none"
text = "PC_EMAE 5 1"
error = "MODEL M_KRR Kern_Linear 3: M_KRR has implementation 1, which fits the energies, forces and stresses of the structures, and implementation 2, which fits the energies per atom of whole structures (the third value of MODEL, 1 when it is left out); 3 is neither."

[[rule.invalid]]
wrap = "root"
check = "startup"
context = "lines_krr_implementation3_pinned"
at = "none"
doc = "FIXINDEX pins every weight and the run has no training data."
text = "PC_EMAE 5 1"
error = "MODEL M_KRR Kern_Linear 3: M_KRR has implementation 1, which fits the energies, forces and stresses of the structures, and implementation 2, which fits the energies per atom of whole structures (the third value of MODEL, 1 when it is left out); 3 is neither."

[[rule]]
id = "RULE.fit_krr_implementation2_LAMBDA"
title = "M_KRR implementation 2 has a LAMBDA of 0 or above"
check = "startup"
msg = "MODEL M_KRR {name} 2 cannot use LAMBDA -1: implementation 2 solves (K + LAMBDA sigma^2 I) w = t, sigma = ESIGMA in eV, with a fixed LAMBDA and does not run the evidence approximation. Implementation 1 (MODEL M_KRR {name} 1) with OALGO 3 runs it; LAMBDA >= 0 fits with either."
doc = """\
M_KRR implementation 2 fits with a fixed LAMBDA; tadah hpo refuses LAMBDA \
-1 with it when the run starts, without a line, if its evaluations fit \
the model."""
msg_doc = "The message names the kernel of MODEL."

[[rule.invalid]]
wrap = "root"
check = "startup"
context = "lines_krr2_evidence"
at = "none"
text = "PC_EMAE 5 1"
error = "MODEL M_KRR Kern_Linear 2 cannot use LAMBDA -1: implementation 2 solves (K + LAMBDA sigma^2 I) w = t, sigma = ESIGMA in eV, with a fixed LAMBDA and does not run the evidence approximation. Implementation 1 (MODEL M_KRR Kern_Linear 1) with OALGO 3 runs it; LAMBDA >= 0 fits with either."

[[rule]]
id = "RULE.optim_relative_error_scale"
title = "The relative part of FSIGMA or SSIGMA is searched from 0 up"
check = "parse"
keys = ["OPTIM.TARGET.FSIGMA", "OPTIM.TARGET.SSIGMA"]
msg = "OPTIM {key} ({index}): the low bound {low} is negative, but the relative part b of {key} is a number >= 0, and every fit refuses a negative one, so the low bound of its box is >= 0"
doc = """\
Index 2 of OPTIM FSIGMA and OPTIM SSIGMA, the relative part b of the \
error scale, takes values from 0 up: an explicit box whose low bound is \
below 0 is refused at its line, and so is an AUTO box around a negative \
value of the training configuration."""

[[rule.examples]]
wrap = "root"
context = "lines_force_relative"
doc = "An AUTO box of the relative part is linear and clamped at 0: [0, 0.1] around 0.05."
text = "OPTIM FSIGMA (2) AUTO FRAC 1"

[[rule.invalid]]
wrap = "root"
context = "lines_force_relative"
text = "OPTIM FSIGMA (2) -0.1 0.1"
error = "OPTIM FSIGMA (2): the low bound -0.1 is negative, but the relative part b of FSIGMA is a number >= 0, and every fit refuses a negative one, so the low bound of its box is >= 0"

[[rule.invalid]]
wrap = "root"
context = "lines_stress"
text = "OPTIM SSIGMA (2) -0.1 0.1"
error = "OPTIM SSIGMA (2): the low bound -0.1 is negative, but the relative part b of SSIGMA is a number >= 0, and every fit refuses a negative one, so the low bound of its box is >= 0"

[[rule]]
id = "RULE.fit_krr_implementation2_ignores"
title = "M_KRR implementation 2 fits without forces, stresses or priorities"
check = "startup"
keys = ["ROOT.OPTIM"]
msg = "MODEL M_KRR {name} 2 fits the energies per atom of whole structures over ESIGMA, without forces, stresses or priorities: {what} would be ignored. Implementation 1 (MODEL M_KRR {name} 1) {why}; implementation 2 fits {text}."
doc = """\
M_KRR implementation 2 fits the energies per atom of whole structures, \
their residuals over ESIGMA, which OPTIM ESIGMA may search. When the run \
starts, without a line, tadah hpo refuses OPTIM of FSIGMA, SSIGMA or \
WDBFILE with it, and, once it has read the training data, FORCE true, \
STRESS true, ENERGY false, ENORM SQRT, an FSIGMA or SSIGMA other than its \
default, a WDBFILE value other than 1 and a training structure whose \
eweight is not 1."""
msg_doc = """\
The message names the kernel of MODEL, what implementation 2 would ignore \
(an OPTIM line, a key with its values, or a structure with its eweight), \
what implementation 1 does with it and how implementation 2 fits."""

[[rule.examples]]
wrap = "root"
context = "lines_krr2"
doc = "Under implementation 2 (MODEL M_KRR Kern_Linear 2), OPTIM LAMBDA searches the penalty of its solve."
text = "OPTIM LAMBDA (1) 1e-6 1e-2 LOG"

[[rule.examples]]
wrap = "root"
context = "lines_krr2"
doc = "Under implementation 2 with LAMBDA 1e-3, OPTIM ESIGMA searches the error scale of the energies, which the penalty weighs against."
text = "OPTIM ESIGMA (1) 0.5 2"

[[rule.invalid]]
wrap = "root"
check = "startup"
context = "lines_krr2_wdbfile"
at = "none"
text = "OPTIM WDBFILE (1) 0.5 2"
error = "MODEL M_KRR Kern_Linear 2 fits the energies per atom of whole structures over ESIGMA, without forces, stresses or priorities: OPTIM WDBFILE would be ignored. Implementation 1 (MODEL M_KRR Kern_Linear 1) applies it; implementation 2 fits without WDBFILE."

[[rule.invalid]]
wrap = "root"
check = "check"
context = "lines_krr2_no_energy"
at = "none"
doc = "The training structures have energy priority 0."
text = "PC_FRMSE 0.1 1"
error = "MODEL M_KRR Kern_Linear 2 fits the energies per atom of whole structures over ESIGMA, without forces, stresses or priorities: eweight 0 of structure 1 of 2 ('H2 at 0.8 A') of dataset 1 (lines_no_energy.db) would be ignored. Implementation 1 (MODEL M_KRR Kern_Linear 1) gives each structure's energy its priority (and leaves out one of eweight 0); implementation 2 fits when every structure has eweight 1."

[[rule]]
id = "RULE.fit_krr_implementation2_OALGO"
title = "M_KRR implementation 2 reads no OALGO"
check = "startup"
keys = ["ROOT.OPTIM"]
msg = "MODEL M_KRR {name} 2 solves (K + LAMBDA sigma^2 I) w = t by Cholesky and reads no OALGO: {what} would be ignored. Implementation 1 (MODEL M_KRR {name} 1) solves with OALGO; implementation 2 fits {text}."
doc = """\
M_KRR implementation 2 solves its system by Cholesky and reads no OALGO. \
When the run starts, without a line, tadah hpo refuses OPTIM OALGO with \
it, and, once it has read the training data, an OALGO other than the \
default (OALGO 1, with no second value or 1e-8)."""
msg_doc = """\
The message names the kernel of MODEL, what implementation 2 would ignore \
(OPTIM OALGO, or the OALGO line with its values) and how implementation 2 \
fits: without OPTIM OALGO, or without an OALGO line or with the default \
written out, OALGO 1 or OALGO 1 1e-8."""

[[rule.invalid]]
wrap = "root"
check = "startup"
context = "lines_krr2_rcond"
at = "none"
text = "OPTIM OALGO (2) 1e-9 1e-7"
error = "MODEL M_KRR Kern_Linear 2 solves (K + LAMBDA sigma^2 I) w = t by Cholesky and reads no OALGO: OPTIM OALGO would be ignored. Implementation 1 (MODEL M_KRR Kern_Linear 1) solves with OALGO; implementation 2 fits without OPTIM OALGO."

[[rule.invalid]]
wrap = "root"
check = "check"
context = "lines_krr2_oalgo4"
at = "none"
doc = "The training configuration has OALGO 4."
text = "PC_EMAE 5 1"
error = "MODEL M_KRR Kern_Linear 2 solves (K + LAMBDA sigma^2 I) w = t by Cholesky and reads no OALGO: OALGO 4 would be ignored. Implementation 1 (MODEL M_KRR Kern_Linear 1) solves with OALGO; implementation 2 fits without an OALGO line or with the default written out, OALGO 1 or OALGO 1 1e-8."

[[rule]]
id = "RULE.fit_error_scales"
title = "The error scales of the fit are numbers above 0"
check = "startup"
msg = "tadah hpo: ESIGMA {value}: the energy error scale is a number > 0 ({what} that costs as much as a force off by FSIGMA); no coefficients were fitted."
doc = """\
Every fit refuses an ESIGMA, or an absolute part of FSIGMA or SSIGMA, that \
is not a number > 0, a relative part below 0, an error scale other than \
its default for a quantity the fit does not have (ENERGY, FORCE or STRESS \
false), ENERGY, FORCE and STRESS all false, and a key that Tadah! 1.6.0 \
retired (with its conversion); tadah hpo refuses each when the run starts, \
without a line, with the message of the fit."""
msg_doc = "The message names the value of ESIGMA and its unit by ENORM: meV/atom, the error of the energy per atom, or under ENORM SQRT meV per sqrt(atom), the error of the energy over the square root of its number of atoms."

[[rule.invalid]]
wrap = "root"
check = "startup"
context = "lines_negative_esigma"
at = "none"
text = "PC_EMAE 5 1"
error = "tadah hpo: ESIGMA -1: the energy error scale is a number > 0 (meV/atom, the error of the energy per atom that costs as much as a force off by FSIGMA); no coefficients were fitted."

[[rule]]
id = "RULE.optim_error_scale_quantity_off"
title = "OPTIM of the error scale of a quantity the fit does not have"
check = "startup"
keys = ["OPTIM.TARGET.ESIGMA", "OPTIM.TARGET.FSIGMA", "OPTIM.TARGET.SSIGMA"]
msg = "OPTIM {key}: {name} is false: the fit has no {what}, so {key} would change nothing and every candidate would give the same fit. {name} true fits the {what}."
doc = """\
OPTIM ESIGMA needs ENERGY true, OPTIM FSIGMA FORCE true and OPTIM SSIGMA \
STRESS true; tadah hpo refuses another when the run starts, without a \
line, if its evaluations fit the model."""
msg_doc = "The message names the key, its switch and the quantity."

[[rule.examples]]
wrap = "root"
context = "lines_force"
doc = "With FORCE true, OPTIM FSIGMA searches the force error scale."
text = "OPTIM FSIGMA (1) 0.05 0.2"

[[rule.invalid]]
wrap = "root"
check = "startup"
at = "none"
text = "OPTIM FSIGMA (1) 0.05 0.2"
error = "OPTIM FSIGMA: FORCE is false: the fit has no forces, so FSIGMA would change nothing and every candidate would give the same fit. FORCE true fits the forces."

[[rule]]
id = "RULE.optim_error_scale_only_quantity"
title = "OPTIM of the error scale of the only quantity of the fit with LAMBDA 0 or -1"
check = "startup"
keys = ["OPTIM.TARGET.ESIGMA", "OPTIM.TARGET.FSIGMA", "OPTIM.TARGET.SSIGMA", "OPTIM.TARGET.LAMBDA"]
msg = "OPTIM {key}: the {what} are the only quantity of the fit and LAMBDA is {value}: the error scale of the only quantity scales every row of the fit alike, which changes no coefficient, so every candidate would give the same fit. With a LAMBDA > 0 the error scale weighs the data against the penalty, and with {text} in the fit, the {what} against them."
doc = """\
With LAMBDA 0 or -1, which OPTIM does not search, tadah hpo refuses OPTIM \
of the error scale of the only quantity of the fit when the run starts, \
without a line. When every error scale of the fit is searched with LAMBDA \
0 or -1, or with OPTIM LAMBDA, hpo_run.log has a warning instead."""
msg_doc = """\
The message names the key, the quantity, the LAMBDA and the other \
quantities. The error scale of the only quantity is ESIGMA, or the \
absolute part of FSIGMA or SSIGMA with no relative part set or searched: \
every error scale times c fits as LAMBDA times c^2."""

[[rule.examples]]
wrap = "root"
doc = "With LAMBDA 1e-3, ESIGMA weighs the energies against the penalty."
text = "OPTIM ESIGMA (1) 0.5 2"

[[rule.invalid]]
wrap = "root"
check = "startup"
context = "lines_lambda0"
at = "none"
text = "OPTIM ESIGMA (1) 0.5 2"
error = "OPTIM ESIGMA: the energies are the only quantity of the fit and LAMBDA is 0: the error scale of the only quantity scales every row of the fit alike, which changes no coefficient, so every candidate would give the same fit. With a LAMBDA > 0 the error scale weighs the data against the penalty, and with forces or stresses in the fit, the energies against them."

[[rule]]
id = "RULE.optim_wdbfile_one_dataset"
title = "OPTIM WDBFILE of the only training dataset with LAMBDA 0 or -1"
check = "startup"
keys = ["OPTIM.TARGET.WDBFILE", "OPTIM.TARGET.LAMBDA"]
msg = "OPTIM WDBFILE: the run has one training dataset and LAMBDA is {value}: its WDBFILE value multiplies the priority of every row of the fit alike, which changes no coefficient, so every candidate would give the same fit. With a LAMBDA > 0 the priority weighs the data against the penalty, and with more training datasets, the dataset against the others."
doc = """\
With one training dataset and LAMBDA 0 or -1, which OPTIM does not \
search, tadah hpo refuses OPTIM WDBFILE when the run starts, without a \
line. When the WDBFILE value of every training dataset is searched with \
LAMBDA 0 or -1, or with OPTIM LAMBDA, hpo_run.log has a warning instead: \
every priority times c fits as LAMBDA divided by c."""
msg_doc = "The message names the LAMBDA."

[[rule.examples]]
wrap = "root"
context = "lines_wdbfile"
doc = "With LAMBDA 1e-3, the priority of the dataset weighs its data against the penalty."
text = "OPTIM WDBFILE (1) 0.5 2"

[[rule.invalid]]
wrap = "root"
check = "startup"
context = "lines_wdbfile_lambda0"
at = "none"
text = "OPTIM WDBFILE (1) 0.5 2"
error = "OPTIM WDBFILE: the run has one training dataset and LAMBDA is 0: its WDBFILE value multiplies the priority of every row of the fit alike, which changes no coefficient, so every candidate would give the same fit. With a LAMBDA > 0 the priority weighs the data against the penalty, and with more training datasets, the dataset against the others."

[[rule]]
id = "RULE.optim_error_scale_no_fit"
title = "OPTIM of an error scale or of WDBFILE when no evaluation fits"
check = "startup"
keys = ["OPTIM.TARGET.ESIGMA", "OPTIM.TARGET.FSIGMA", "OPTIM.TARGET.SSIGMA", "OPTIM.TARGET.WDBFILE"]
msg = "OPTIM {key}: the evaluations of this run fit no coefficient ({why}), so {key} would change nothing and every candidate would give the same potential."
doc = """\
Without training data, or with FIXINDEX pinning every weight, the \
evaluations fit nothing, and tadah hpo refuses OPTIM of ESIGMA, FSIGMA, \
SSIGMA and WDBFILE when the run starts, without a line."""
msg_doc = "The message names the key and why the evaluations fit no coefficient."

[[rule.invalid]]
wrap = "root"
check = "startup"
context = "lines_pinned_all"
at = "none"
text = "OPTIM ESIGMA (1) 0.5 2"
error = "OPTIM ESIGMA: the evaluations of this run fit no coefficient (FIXINDEX pins every weight), so ESIGMA would change nothing and every candidate would give the same potential."

# ============================================== wrappers and contexts ====

[wrapper.lines_metric]
block = "ROOT"
doc = """\
The slot is the first line, at the top level; the loss term of the file \
is PC_EMAE, so a PC_ERMSE line in the slot is the first of its key."""
text = """
{line}
OPTIM CGRID2B (1) 0.5 1.5
PC_EMAE 0 1
OPTIMIZER
STRATEGY
LIB NLOPT
ALGO LN_SBPLX
MAXEVAL 10
ENDSTRATEGY
ENDOPTIMIZER
"""

[context.lines_two_datasets]
doc = "The default training configuration with two datasets, which tadah hpo --check also takes as the validation configuration."
config = """
ATOM H
WATOM 1.0
DBFILE dummy.db dummy2.db
INIT2B true
INITMB false
TYPE2B D2_BP 2 2 H H
CGRID2B 1.0 2.0
SGRID2B 0.5 1.0
RCTYPE2B Cut_Cos
RCUT2B 5.0
VERBOSE 0
MODEL M_BLR BF_Linear
OALGO 4
LAMBDA 1e-3
"""

[context.lines_no_validation]
doc = "The default training configuration, run without a validation configuration."
has_validation = false
config = """
