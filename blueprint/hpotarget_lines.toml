[[optim_target]]
id = "OPTIM.TARGET.EWEIGHT"
key = "EWEIGHT"
status = "refused"
msg = "OPTIM EWEIGHT is not a valid search target: EWEIGHT is a retired key: EWEIGHT multiplied the squared residual of the total energy of each structure, so one value meant a different accuracy for cells of different sizes. Replaced by: ESIGMA, the energy error scale per atom in meV/atom (ENERGY false for EWEIGHT 0). For cells of N atoms, ESIGMA = 1000/(N sqrt(EWEIGHT)) meV/atom gives the same fit. For cells of different sizes, ESIGMA = 1000/sqrt(EWEIGHT) with the eweight of each structure in the data file multiplied by N^2 reproduces the objective of Tadah! 1.5.0. EWEIGHT 0 (no energies in the fit) is ENERGY false. Under M_KRR implementation 2 (MODEL M_KRR <kernel> 2), whose solve did not read EWEIGHT, deleting the line converts it, and ESIGMA 1000, or LAMBDA times 10^6 with ESIGMA 1, gives the solve of Tadah! 1.5.0, (K + LAMBDA I) w = t."
doc = "EWEIGHT is a retired key; OPTIM ESIGMA searches the energy error scale."

[[optim_target.invalid]]
wrap = "root"
text = "OPTIM EWEIGHT (1) 0.5 2"
error = "OPTIM EWEIGHT is not a valid search target: EWEIGHT is a retired key: EWEIGHT multiplied the squared residual of the total energy of each structure, so one value meant a different accuracy for cells of different sizes. Replaced by: ESIGMA, the energy error scale per atom in meV/atom (ENERGY false for EWEIGHT 0). For cells of N atoms, ESIGMA = 1000/(N sqrt(EWEIGHT)) meV/atom gives the same fit. For cells of different sizes, ESIGMA = 1000/sqrt(EWEIGHT) with the eweight of each structure in the data file multiplied by N^2 reproduces the objective of Tadah! 1.5.0. EWEIGHT 0 (no energies in the fit) is ENERGY false. Under M_KRR implementation 2 (MODEL M_KRR <kernel> 2), whose solve did not read EWEIGHT, deleting the line converts it, and ESIGMA 1000, or LAMBDA times 10^6 with ESIGMA 1, gives the solve of Tadah! 1.5.0, (K + LAMBDA I) w = t."

[[optim_target]]
id = "OPTIM.TARGET.FWEIGHT"
key = "FWEIGHT"
status = "refused"
msg = "OPTIM FWEIGHT is not a valid search target: FWEIGHT is a retired key: FWEIGHT multiplied the squared residual of each force component, a number without a unit an accuracy could be read in. Replaced by: FSIGMA, the force error scale in eV/Å (FORCE false for FWEIGHT 0). FSIGMA = 1/sqrt(FWEIGHT) eV/Å gives the same fit. With FORCE false, deleting the line converts it (FSIGMA keeps its default). FWEIGHT 0 (no forces in the fit) is FORCE false."
doc = "FWEIGHT is a retired key; OPTIM FSIGMA searches the force error scale."

[[optim_target.invalid]]
wrap = "root"
text = "OPTIM FWEIGHT (1) 0.5 2"
error = "OPTIM FWEIGHT is not a valid search target: FWEIGHT is a retired key: FWEIGHT multiplied the squared residual of each force component, a number without a unit an accuracy could be read in. Replaced by: FSIGMA, the force error scale in eV/Å (FORCE false for FWEIGHT 0). FSIGMA = 1/sqrt(FWEIGHT) eV/Å gives the same fit. With FORCE false, deleting the line converts it (FSIGMA keeps its default). FWEIGHT 0 (no forces in the fit) is FORCE false."

[[optim_target]]
id = "OPTIM.TARGET.SWEIGHT"
key = "SWEIGHT"
status = "refused"
msg = "OPTIM SWEIGHT is not a valid search target: SWEIGHT is a retired key: SWEIGHT multiplied the squared residual of each of the six stress entries xx, xy, xz, yy, yz and zz, in eV/Å^3, so a shear cost depended on the orientation of the cell. Replaced by: SSIGMA, the stress error scale in GPa (STRESS false for SWEIGHT 0). SSIGMA = 160.2/sqrt(SWEIGHT) GPa gives the diagonal entries (xx, yy, zz) the same weight; a fit counts each off-diagonal entry twice (the nine entries of the tensor), so the conversion is exact for the diagonal only. With STRESS false, deleting the line converts it (SSIGMA keeps its default). SWEIGHT 0 (no stresses in the fit) is STRESS false."
doc = "SWEIGHT is a retired key; OPTIM SSIGMA searches the stress error scale."

[[optim_target.invalid]]
wrap = "root"
text = "OPTIM SWEIGHT (1) 0.5 2"
error = "OPTIM SWEIGHT is not a valid search target: SWEIGHT is a retired key: SWEIGHT multiplied the squared residual of each of the six stress entries xx, xy, xz, yy, yz and zz, in eV/Å^3, so a shear cost depended on the orientation of the cell. Replaced by: SSIGMA, the stress error scale in GPa (STRESS false for SWEIGHT 0). SSIGMA = 160.2/sqrt(SWEIGHT) GPa gives the diagonal entries (xx, yy, zz) the same weight; a fit counts each off-diagonal entry twice (the nine entries of the tensor), so the conversion is exact for the diagonal only. With STRESS false, deleting the line converts it (SSIGMA keeps its default). SWEIGHT 0 (no stresses in the fit) is STRESS false."

[[optim_target]]
id = "OPTIM.TARGET.WDBFILE_AUTO"
key = "WDBFILE_AUTO"
status = "refused"
msg = "OPTIM WDBFILE_AUTO is not a valid search target: WDBFILE_AUTO is a retired key: WDBFILE_AUTO a multiplied the priorities of each dataset by n_d^-a, n_d its number of structures, so a priority in the fit depended on how many structures each dataset had. Replaced by: WDBFILE, a priority for each dataset. Each WDBFILE value (1 for every dataset without WDBFILE) multiplied by n_d^-a, n_d the number of structures of dataset d after EFILTER and FFILTER, gives the same fit. For WDBFILE_AUTO 0, deleting the line converts it (WDBFILE as it is). A retrain does not read a potential's WDBFILE line: the WDBFILE values of a potential (those converted, or those of its WDBFILE line) go on the command line (--wdbfile) or into a file that includes the potential with CONFIG. Under M_KRR implementation 2 (MODEL M_KRR <kernel> 2), whose solve read no priority, deleting the line converts it, and ESIGMA 1000, or LAMBDA times 10^6 with ESIGMA 1, gives the solve of Tadah! 1.5.0, (K + LAMBDA I) w = t."
doc = "WDBFILE_AUTO is a retired key; OPTIM WDBFILE searches the priority of each dataset."

[[optim_target.invalid]]
wrap = "root"
text = "OPTIM WDBFILE_AUTO (1) 0.5 2"
error = "OPTIM WDBFILE_AUTO is not a valid search target: WDBFILE_AUTO is a retired key: WDBFILE_AUTO a multiplied the priorities of each dataset by n_d^-a, n_d its number of structures, so a priority in the fit depended on how many structures each dataset had. Replaced by: WDBFILE, a priority for each dataset. Each WDBFILE value (1 for every dataset without WDBFILE) multiplied by n_d^-a, n_d the number of structures of dataset d after EFILTER and FFILTER, gives the same fit. For WDBFILE_AUTO 0, deleting the line converts it (WDBFILE as it is). A retrain does not read a potential's WDBFILE line: the WDBFILE values of a potential (those converted, or those of its WDBFILE line) go on the command line (--wdbfile) or into a file that includes the potential with CONFIG. Under M_KRR implementation 2 (MODEL M_KRR <kernel> 2), whose solve read no priority, deleting the line converts it, and ESIGMA 1000, or LAMBDA times 10^6 with ESIGMA 1, gives the solve of Tadah! 1.5.0, (K + LAMBDA I) w = t."

[[optim_target]]
id = "OPTIM.TARGET.EWEIGHT_TEMP"
key = "EWEIGHT_TEMP"
status = "refused"
msg = "OPTIM EWEIGHT_TEMP is not a valid search target: EWEIGHT_TEMP is a retired key: EWEIGHT_TEMP T multiplied the energy priority of each structure by exp(-(E/N - E_min)/(kB T)), which reads energy above the lowest as heat: compressed or strained structures, high in energy but cold, got almost no priority. Replaced by: the priorities of the data: WDBFILE for each dataset, and the eweight of each structure in its data file. No key converts it. WDBFILE gives each dataset its priority, and the eweight of a structure in its data file the priority of its energy."
doc = "EWEIGHT_TEMP is a retired key; OPTIM WDBFILE searches the priority of each dataset."

[[optim_target.invalid]]
wrap = "root"
text = "OPTIM EWEIGHT_TEMP (1) 0.5 2"
error = "OPTIM EWEIGHT_TEMP is not a valid search target: EWEIGHT_TEMP is a retired key: EWEIGHT_TEMP T multiplied the energy priority of each structure by exp(-(E/N - E_min)/(kB T)), which reads energy above the lowest as heat: compressed or strained structures, high in energy but cold, got almost no priority. Replaced by: the priorities of the data: WDBFILE for each dataset, and the eweight of each structure in its data file. No key converts it. WDBFILE gives each dataset its priority, and the eweight of a structure in its data file the priority of its energy."

[[optim_target]]
id = "OPTIM.TARGET.UNCERTAINTY"
key = "UNCERTAINTY"
status = "refused"
msg = "OPTIM UNCERTAINTY is not a valid search target: UNCERTAINTY is a retired key: tadah train --uncertainty wrote weights.tadah, each coefficient of the fit beside a diagonal entry of SIGMA. Uncertainty output is removed: the errors of Tadah! 1.0.0 to 1.5.0 were not standard deviations, and no calibrated estimate replaces them. Replaced by: nothing. Deleting the option, or the UNCERTAINTY line, converts it: the fit and its coefficients are unaffected."
doc = "UNCERTAINTY is a retired key; uncertainty output is removed."

[[optim_target.invalid]]
wrap = "root"
text = "OPTIM UNCERTAINTY (1) 0.5 2"
error = "OPTIM UNCERTAINTY is not a valid search target: UNCERTAINTY is a retired key: tadah train --uncertainty wrote weights.tadah, each coefficient of the fit beside a diagonal entry of SIGMA. Uncertainty output is removed: the errors of Tadah! 1.0.0 to 1.5.0 were not standard deviations, and no calibrated estimate replaces them. Replaced by: nothing. Deleting the option, or the UNCERTAINTY line, converts it: the fit and its coefficients are unaffected."

[[optim_target]]
id = "OPTIM.TARGET.WCOV"
key = "WCOV"
status = "refused"
msg = "OPTIM WCOV is not a valid search target: WCOV is a retired key: No release of Tadah! wrote or read WCOV. Uncertainty output is removed: the errors of Tadah! 1.0.0 to 1.5.0 were not standard deviations, and no calibrated estimate replaces them. Replaced by: nothing. Deleting the line converts it: no prediction reads it, and the fit is unaffected."
doc = "WCOV is a retired key, which no release wrote."

[[optim_target.invalid]]
wrap = "root"
text = "OPTIM WCOV (1) 0.5 2"
error = "OPTIM WCOV is not a valid search target: WCOV is a retired key: No release of Tadah! wrote or read WCOV. Uncertainty output is removed: the errors of Tadah! 1.0.0 to 1.5.0 were not standard deviations, and no calibrated estimate replaces them. Replaced by: nothing. Deleting the line converts it: no prediction reads it, and the fit is unaffected."

[[optim_target]]
id = "OPTIM.TARGET.WNOISE"
key = "WNOISE"
status = "refused"
msg = "OPTIM WNOISE is not a valid search target: WNOISE is a retired key: No release of Tadah! wrote or read WNOISE. Uncertainty output is removed: the errors of Tadah! 1.0.0 to 1.5.0 were not standard deviations, and no calibrated estimate replaces them. Replaced by: nothing. Deleting the line converts it: no prediction reads it, and the fit is unaffected."
doc = "WNOISE is a retired key, which no release wrote."

[[optim_target.invalid]]
wrap = "root"
text = "OPTIM WNOISE (1) 0.5 2"
error = "OPTIM WNOISE is not a valid search target: WNOISE is a retired key: No release of Tadah! wrote or read WNOISE. Uncertainty output is removed: the errors of Tadah! 1.0.0 to 1.5.0 were not standard deviations, and no calibrated estimate replaces them. Replaced by: nothing. Deleting the line converts it: no prediction reads it, and the fit is unaffected."

[[optim_target]]
id = "OPTIM.TARGET.ERROR"
key = "ERROR"
status = "refused"
msg = "OPTIM ERROR is not a valid search target: ERROR is a retired key: ERROR, the key of --error, asked tadah predict and tadah properties pairwise for errors computed from SIGMA. Uncertainty output is removed: the errors of Tadah! 1.0.0 to 1.5.0 were not standard deviations, and no calibrated estimate replaces them. Replaced by: nothing. Deleting the line converts it: no command reads it, and the fit is unaffected."
doc = "ERROR is a retired key; uncertainty output is removed."

[[optim_target.invalid]]
wrap = "root"
text = "OPTIM ERROR (1) 0.5 2"
error = "OPTIM ERROR is not a valid search target: ERROR is a retired key: ERROR, the key of --error, asked tadah predict and tadah properties pairwise for errors computed from SIGMA. Uncertainty output is removed: the errors of Tadah! 1.0.0 to 1.5.0 were not standard deviations, and no calibrated estimate replaces them. Replaced by: nothing. Deleting the line converts it: no command reads it, and the fit is unaffected."

[[optim_target]]
id = "OPTIM.TARGET.LAMBDA"
key = "LAMBDA"
status = "special"
condition = "The low bound of the box, explicit or made by AUTO, is below 0."
msg = "OPTIM LAMBDA ({index}): the low bound {low} is negative, but LAMBDA is the ridge penalty, a number >= 0: every fit refuses a negative value other than -1, and -1, which requests the evidence approximation, is no value of a box, so the low bound of its box is >= 0"
doc = "OPTIM LAMBDA searches the ridge penalty of the fit, a number >= 0."

[[optim_target.examples]]
wrap = "root"
text = "OPTIM LAMBDA (1) 1e-6 1e-2 LOG"

[[optim_target.invalid]]
wrap = "root"
text = "OPTIM LAMBDA (1) -0.5 2"
error = "OPTIM LAMBDA (1): the low bound -0.5 is negative, but LAMBDA is the ridge penalty, a number >= 0: every fit refuses a negative value other than -1, and -1, which requests the evidence approximation, is no value of a box, so the low bound of its box is >= 0"

# ============================================================= rules ====

[[rule]]
id = "RULE.OPTIM_MPARAMS"
title = "OPTIM MPARAMS searches a continuous value of the model function"
check = "startup"
keys = ["ROOT.OPTIM"]
msg = "OPTIM MPARAMS ({index}) is not a valid search target: {why}"
doc = """\
OPTIM MPARAMS searches a value that the model function of the training \
configuration reads, a continuous one: MPARAMS (i) is the i-th MPARAMS \
value. The refusal comes at startup and names no line."""
msg_doc = """\
The message says that the function reads no MPARAMS, that it reads fewer \
values than the index, or that the value is an integer, such as the degree \
of Kern_Polynomial."""

[[rule.examples]]
wrap = "root"
context = "lines_rbf"
text = "OPTIM MPARAMS (1) 0.5 2"

[[rule.invalid]]
wrap = "root"
check = "startup"
context = "lines_mparams"
at = "none"
text = "OPTIM MPARAMS (1) 0.5 1.5"
error = "OPTIM MPARAMS (1) is not a valid search target: BF_Linear reads no MPARAMS, so every evaluation would train the same model."

[[rule.invalid]]
wrap = "root"
check = "startup"
context = "lines_rbf"
at = "none"
text = "OPTIM MPARAMS (2) 0.5 1.5"
error = "OPTIM MPARAMS (2) is not a valid search target: Kern_RBF reads 1 MPARAMS value (sigma), so MPARAMS (2) changes nothing."

[[rule.invalid]]
wrap = "root"
check = "startup"
context = "lines_poly"
at = "none"
text = "OPTIM MPARAMS (1) 1 3"
error = "OPTIM MPARAMS (1) is not a valid search target: MPARAMS (1) of Kern_Polynomial is its d, an integer, a discrete value rather than a continuous parameter; the training configuration sets it."

[[rule]]
id = "RULE.OPTIM_MPARAMS_positive"
title = "A positive MPARAMS value has an OPTIM box above 0"
check = "startup"
keys = ["ROOT.OPTIM"]
msg = "OPTIM MPARAMS ({index}): the box [{low}, {high}] of {name}'s {key} must be positive ({key} > 0)."
doc = """\
An MPARAMS value that the model function needs above 0, such as the width \
sigma of Kern_RBF, has an OPTIM box above 0. The refusal comes at startup \
and names no line."""
msg_doc = "The message names the function and its value."

[[rule.invalid]]
wrap = "root"
check = "startup"
context = "lines_rbf"
at = "none"
text = "OPTIM MPARAMS (1) 0 2"
error = "OPTIM MPARAMS (1): the box [0, 2] of Kern_RBF's sigma must be positive (sigma > 0)."

[[rule]]
id = "RULE.OPTIM_file_cutoff"
title = "OPTIM does not search a cutoff that a setfl file sets"
check = "startup"
keys = ["ROOT.OPTIM"]
msg = "OPTIM {key} ({index}) is not a valid search target: {why} and refuses another value, so every candidate but the value of the training configuration would fail."
doc = """\
A D2_EAM or DM_EAM descriptor, alone or in a D2_mJoin or DM_mJoin, takes \
its cutoff RCUT2B or RCUTMB from its setfl file (SETFL), and OPTIM does \
not search that cutoff. The refusal comes at startup and names no line."""
msg_doc = "The message names the descriptor, the cutoff and the file."

[[rule.invalid]]
wrap = "none"
check = "startup"
context = "lines_setfl"
at = "none"
text = '''
OPTIM RCUT2B (1) 4.5 5.5
PC_ERMSE 0 1
OPTIMIZER
LIB NLOPT
ALGO LN_SBPLX
MAXEVAL 10
ENDOPTIMIZER'''
error = "OPTIM RCUT2B (1) is not a valid search target: D2_EAM takes the cutoff 5 of its setfl file 'lines_ta.eam.alloy' (SETFL) and refuses another value, so every candidate but the value of the training configuration would fail."

[[rule]]
id = "RULE.OPTIM_unread_watom"
title = "OPTIM does not search a WATOM that no descriptor reads"
check = "startup"
keys = ["ROOT.OPTIM"]
msg = "OPTIM WATOM (line {line} of the target file) is not a valid search target: no descriptor of the training configuration reads WATOM (D2_EAM, DM_EAM, D2_Dummy and DM_Dummy read none), and a fit refuses a WATOM other than 1 that no descriptor reads, so every candidate other than 1 would fail its evaluation."
doc = """\
OPTIM does not search WATOM when no descriptor of the training \
configuration reads it (D2_EAM and DM_EAM take their pair and density \
functions from the setfl file, SETFL, unweighted, and the dummies \
D2_Dummy and DM_Dummy read none), as a fit refuses a WATOM other than 1 \
that no descriptor reads. The refusal comes at startup."""
msg_doc = "The message names the OPTIM WATOM line of the target file and the descriptors that read no WATOM."

[[rule.invalid]]
wrap = "none"
check = "startup"
context = "lines_setfl"
at = "none"
text = '''
OPTIM WATOM (1) 0.5 2.0
PC_ERMSE 0 1
OPTIMIZER
LIB NLOPT
ALGO LN_SBPLX
MAXEVAL 10
ENDOPTIMIZER'''
error = "OPTIM WATOM (line 1 of the target file) is not a valid search target: no descriptor of the training configuration reads WATOM (D2_EAM, DM_EAM, D2_Dummy and DM_Dummy read none), and a fit refuses a WATOM other than 1 that no descriptor reads, so every candidate other than 1 would fail its evaluation."

[[rule]]
id = "RULE.settings_taken_by_lines"
title = "FAILSCORE, LOSS and PC_SCRIPT_TIMEOUT repeat after a line that reads them"
check = "parse"
keys = ["ROOT.FAILSCORE", "ROOT.LOSS", "ROOT.PC_SCRIPT_TIMEOUT", "ROOT.MAXTIME", "ROOT.PC_LAMMPS", "ROOT.PC_FAILPROBE", "ROOT.PC_OBSERVABLE"]
msg = "{key} is set twice (first on line {first_line}{note}) and no line between reads the first ({list}); each key is given once"
doc = """\
A second FAILSCORE, LOSS or PC_SCRIPT_TIMEOUT line needs a line between \
that reads the first, one that uses its value: a PC_LAMMPS or \
PC_FAILPROBE line without --failscore (--maxtime), or a --varloss or \
PC_OBSERVABLE term that names no loss function. The rest of the run \
takes the last line: the metric terms its LOSS, a failed evaluation its \
FAILSCORE, and the hpo_run.log summary its PC_SCRIPT_TIMEOUT."""
msg_doc = """\
The message names the key as the second line writes it, the line of the \
first and the lines that read the key: a PC_LAMMPS or PC_FAILPROBE line \
without --failscore for FAILSCORE, one without --maxtime for the script \
limit, a --varloss or PC_OBSERVABLE term that names no loss function for \
LOSS. When the first wrote the other name of the script limit, MAXTIME or \
PC_SCRIPT_TIMEOUT, that name follows the line number."""
quirk = """\
MAXTIME and PC_SCRIPT_TIMEOUT are one key: a line of either name after a \
line of the other is a second line."""

[[rule.examples]]
wrap = "none"
doc = "Each PC_LAMMPS line takes the LOSS above it: L1 for the first, L2 for the second and for the validation metric."
text = '''
OPTIM CGRID2B (1) 0.5 1.5
LOSS L1
PC_LAMMPS --script lines_pc.in --varloss E 1 1
LOSS L2
PC_LAMMPS --script lines_pc.in --varloss S 0 1
PC_ERMSE 0 1
OPTIMIZER
LIB NLOPT
ALGO LN_SBPLX
MAXEVAL 10
ENDOPTIMIZER'''

[[rule.invalid]]
wrap = "root"
at = 2
text = '''
FAILSCORE 1e9
FAILSCORE 1e10'''
error = "FAILSCORE is set twice (first on line 1) and no line between reads the first (a PC_LAMMPS or PC_FAILPROBE line without --failscore); each key is given once"

[[rule.invalid]]
wrap = "none"
at = 4
doc = "The PC_LAMMPS line between names the loss function of its term."
text = '''
OPTIM CGRID2B (1) 0.5 1.5
LOSS L1
PC_LAMMPS --script lines_pc.in --varloss E 1 1 L2
LOSS HUBER 10
PC_ERMSE 0 1
OPTIMIZER
LIB NLOPT
ALGO LN_SBPLX
MAXEVAL 10
ENDOPTIMIZER'''
error = "LOSS is set twice (first on line 2) and no line between reads the first (a --varloss or PC_OBSERVABLE term that names no loss function); each key is given once"

[[rule.invalid]]
wrap = "root"
at = 2
doc = "The two names of the script limit, with no PC_LAMMPS line between."
text = '''
PC_SCRIPT_TIMEOUT 10:00
MAXTIME 5:00'''
error = "MAXTIME is set twice (first on line 1, as PC_SCRIPT_TIMEOUT) and no line between reads the first (a PC_LAMMPS or PC_FAILPROBE line without --maxtime); each key is given once"

[[rule]]
id = "RULE.PC_OBSERVABLE_excludes_PC_LAMMPS"
title = "PC_OBSERVABLE lines and PC_LAMMPS lines are not combined"
check = "parse"
keys = ["ROOT.PC_OBSERVABLE", "ROOT.PC_LAMMPS"]
msg = "{key}: this target file also has {list}; PC_OBSERVABLE lines do not share a target file with PC_LAMMPS or PC_FAILPROBE lines"
doc = """\
A target file has PC_OBSERVABLE lines or PC_LAMMPS and PC_FAILPROBE lines, \
not both. The refusal comes after the whole file is read, at the first \
line of the group that comes later in the file."""
msg_doc = "The message names the key of that line, and gives the number of lines of each key of the other group, with the first of them."

[[rule.invalid]]
wrap = "root"
at = 2
text = '''
PC_OBSERVABLE cohesive_energy --species H --target 2 --weight 1 --hotvar a0 1.5 2.5
PC_LAMMPS --script lines_pc.in --varloss E 1 1'''
error = "PC_LAMMPS: this target file also has 1 PC_OBSERVABLE line (line 1); PC_OBSERVABLE lines do not share a target file with PC_LAMMPS or PC_FAILPROBE lines"

[[rule.invalid]]
wrap = "root"
at = 2
doc = "A PC_FAILPROBE line, and no PC_LAMMPS line: the message counts it as a PC_LAMMPS entry."
text = '''
PC_FAILPROBE --script lines_pc.in --outvar S
PC_OBSERVABLE cohesive_energy --species H --target 2 --weight 1 --hotvar a0 1.5 2.5'''
error = "PC_OBSERVABLE: this target file also has 1 PC_FAILPROBE line (line 1); PC_OBSERVABLE lines do not share a target file with PC_LAMMPS or PC_FAILPROBE lines"

[[rule]]
id = "RULE.PC_LAMMPS_hotvar_unique"
title = "A --hotvar name is declared by one PC_LAMMPS line"
check = "parse"
keys = ["ROOT.PC_LAMMPS", "PC_LAMMPS.--hotvar"]
msg = "PC_LAMMPS --hotvar {name}: line {line} declares --hotvar {name} as well (script {script}); one line declares each --hotvar name, as an evaluation keeps one value of each name for the scripts that read it, and the line that finished last would set it"
doc = """\
A --hotvar name is declared by one PC_LAMMPS line; two lines that run the \
same script are two declarations too. The refusal comes after the whole \
file is read, at the later of the two lines."""
msg_doc = "The message names the earlier line and its script."

[[rule.examples]]
wrap = "root"
doc = "One line may declare several names, and two lines different ones."
text = '''
PC_LAMMPS --script lines_pc.in --varloss E 1 1 --hotvar a 1 2 --hotvar b 0 1
PC_LAMMPS --script lines_pc2.in --varloss E2 1 1 --hotvar c 1 2'''

[[rule.invalid]]
wrap = "root"
at = 2
text = '''
PC_LAMMPS --script lines_pc.in --varloss E 1 1 --hotvar a 1 2
PC_LAMMPS --script lines_pc2.in --varloss E2 1 1 --hotvar a 1 2'''
error = "PC_LAMMPS --hotvar a: line 1 declares --hotvar a as well (script lines_pc.in); one line declares each --hotvar name, as an evaluation keeps one value of each name for the scripts that read it, and the line that finished last would set it"

[[rule.invalid]]
wrap = "root"
at = 2
text = '''
PC_LAMMPS --script lines_pc.in --varloss E 1 1 --hotvar a 1 2
PC_LAMMPS --script lines_pc.in --varloss E 2 1 --hotvar a 1 2'''
error = "PC_LAMMPS --hotvar a: line 1 declares --hotvar a as well (script lines_pc.in); one line declares each --hotvar name, as an evaluation keeps one value of each name for the scripts that read it, and the line that finished last would set it"

[[rule]]
id = "RULE.PC_OBSERVABLE_GRAD_STRATEGY"
title = "PC_OBSERVABLE refuses GRAD_STRATEGY NUMERICAL"
check = "parse"
keys = ["ROOT.PC_OBSERVABLE", "OPTIMIZER.GRAD_STRATEGY"]
msg = "--hpotarget defines PC_OBSERVABLE but {block} GRAD_STRATEGY=NUMERICAL is set. PC_OBSERVABLE is built for the analytical gradient: use GRAD_STRATEGY ANALYTICAL (an unset GRAD_STRATEGY resolves to it in a block that obtains gradients; it needs the settings of the analytical gradient, such as OALGO 4 with a fixed LAMBDA >= 0, and startup names a missing one) or GRAD_STRATEGY HYBRID, which uses finite differences where the analytical gradient is unavailable."
doc = """\
With a PC_OBSERVABLE line, GRAD_STRATEGY NUMERICAL is refused, and a block \
that obtains gradients without a GRAD_STRATEGY line takes ANALYTICAL. The \
refusal names the GRAD_STRATEGY line."""
msg_doc = "The message names the block, OPTIMIZER or EXPLORE."

[[rule.examples]]
wrap = "none"
doc = "A gradient-based optimiser without GRAD_STRATEGY takes the analytical gradient."
text = '''
OPTIM CGRID2B (1) 0.5 1.5
PC_OBSERVABLE cohesive_energy --species H --target 2 --weight 1 --hotvar a0 1.5 2.5
OPTIMIZER
LIB NLOPT
ALGO LD_LBFGS
MAXEVAL 10
ENDOPTIMIZER'''

[[rule.invalid]]
wrap = "none"
at = "GRAD_STRATEGY"
text = '''
OPTIM CGRID2B (1) 0.5 1.5
PC_OBSERVABLE cohesive_energy --species H --target 2 --weight 1 --hotvar a0 1.5 2.5
OPTIMIZER
LIB NLOPT
ALGO LD_LBFGS
MAXEVAL 10
GRAD_STRATEGY NUMERICAL
ENDOPTIMIZER'''
error = "--hpotarget defines PC_OBSERVABLE but OPTIMIZER's GRAD_STRATEGY=NUMERICAL is set. PC_OBSERVABLE is built for the analytical gradient: use GRAD_STRATEGY ANALYTICAL (an unset GRAD_STRATEGY resolves to it in a block that obtains gradients; it needs the settings of the analytical gradient, such as OALGO 4 with a fixed LAMBDA >= 0, and startup names a missing one) or GRAD_STRATEGY HYBRID, which uses finite differences where the analytical gradient is unavailable."

[[rule]]
id = "RULE.PC_LAMMPS_GRAD_STRATEGY"
title = "PC_LAMMPS and PC_FAILPROBE refuse a GRAD_STRATEGY line"
check = "parse"
keys = ["ROOT.PC_LAMMPS", "ROOT.PC_FAILPROBE", "OPTIMIZER.GRAD_STRATEGY"]
msg = "--hpotarget defines {key} on line {line} but {block} GRAD_STRATEGY is set. A PC_LAMMPS or PC_FAILPROBE line does not support analytical/numerical/hybrid gradients. Drop the GRAD_STRATEGY line."
doc = """\
With a PC_LAMMPS or PC_FAILPROBE line, no block has a GRAD_STRATEGY line. \
The refusal names the GRAD_STRATEGY line."""
msg_doc = """\
The message names PC_LAMMPS and its line, or the PC_FAILPROBE line in a \
file without a PC_LAMMPS line, and the block, OPTIMIZER or EXPLORE."""

[[rule.invalid]]
wrap = "none"
at = "GRAD_STRATEGY"
text = '''
OPTIM CGRID2B (1) 0.5 1.5
PC_LAMMPS --script lines_pc.in --varloss E 1 1
OPTIMIZER
LIB NLOPT
ALGO LN_SBPLX
MAXEVAL 10
GRAD_STRATEGY NUMERICAL
ENDOPTIMIZER'''
error = "--hpotarget defines PC_LAMMPS on line 2 but OPTIMIZER's GRAD_STRATEGY is set. A PC_LAMMPS or PC_FAILPROBE line does not support analytical/numerical/hybrid gradients. Drop the GRAD_STRATEGY line."

[[rule.invalid]]
wrap = "none"
at = "GRAD_STRATEGY"
doc = "A PC_FAILPROBE line in a file without a PC_LAMMPS line."
text = '''
OPTIM CGRID2B (1) 0.5 1.5
PC_FAILPROBE --script lines_pc.in --outvar S
PC_ERMSE 0 1
OPTIMIZER
LIB NLOPT
ALGO LN_SBPLX
MAXEVAL 10
GRAD_STRATEGY HYBRID
ENDOPTIMIZER'''
error = "--hpotarget defines PC_FAILPROBE on line 2 but OPTIMIZER's GRAD_STRATEGY is set. A PC_LAMMPS or PC_FAILPROBE line does not support analytical/numerical/hybrid gradients. Drop the GRAD_STRATEGY line."

[[rule]]
id = "RULE.PC_LAMMPS_gradient_free"
title = """\
With PC_LAMMPS or PC_FAILPROBE every optimiser runs without gradients"""
check = "parse"
keys = ["ROOT.PC_LAMMPS", "ROOT.PC_FAILPROBE", "OPTIMIZER.ALGO"]
