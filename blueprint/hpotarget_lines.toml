error = "PC_OBSERVABLE cohesive_energy: --fmax-converged must be > 0 (got 0)"


[[line_option]]
id = "PC_OBSERVABLE.cohesive_energy.--ptol"
option = "--ptol"
lines = ["PC_OBSERVABLE.cohesive_energy"]
synopsis = "--ptol <pressure>"
repeat = "error"
repeat_msg = "PC_OBSERVABLE cohesive_energy: --ptol is given twice on this line; each option is given once"
default = { literal = "1e-4" }
doc = """\
The pressure tolerance of the relaxation, in GPa, a number > 0: the cell \
has relaxed when the magnitude of its pressure falls below it."""
long_doc = """\
The magnitude of the pressure is |dE/dε| / (3V), for the isotropic \
strain ε of the cell and its volume V, a central difference of the \
energy over a strain of ±1e-5. A residual pressure P leaves the energy \
per atom of the crystal above its minimum by about P² (V/N) / (2B), for \
N atoms and the bulk modulus B, so the cohesive energy below its value \
at zero pressure. The cell moves by a search for the zero of its \
pressure, which uses the pressure alone, so a tight --ptol is reached \
also where the energy is too flat or too noisy to show the change; a \
--ptol below the rounding error of the central difference is not met, \
and the relaxation then ends unconverged."""

[[line_option.args]]
name = "pressure"
kind = "number"
min = 0
min_open = true
msg = "PC_OBSERVABLE cohesive_energy: --ptol takes a finite number (got '{tok}'){underflow}"

[[line_option.checks]]
msg = "PC_OBSERVABLE cohesive_energy: --ptol must be > 0 (got {tok})"
doc = "The value is 0 or negative."

[[line_option.examples]]
wrap = "root"
text = "PC_OBSERVABLE cohesive_energy --species H --target 2.0 --weight 1 --hotvar a0 1.5 2.5 --ptol 1e-3"

[[line_option.invalid]]
wrap = "root"
text = "PC_OBSERVABLE cohesive_energy --species H --target 2 --weight 1 --hotvar a0 1.5 2.5 --ptol"
error = "PC_OBSERVABLE cohesive_energy: '--ptol' requires a value"

[[line_option.invalid]]
wrap = "root"
text = "PC_OBSERVABLE cohesive_energy --species H --target 2 --weight 1 --hotvar a0 1.5 2.5 --ptol x"
error = "PC_OBSERVABLE cohesive_energy: --ptol takes a finite number (got 'x')"

[[line_option.invalid]]
wrap = "root"
text = "PC_OBSERVABLE cohesive_energy --species H --target 2 --weight 1 --hotvar a0 1.5 2.5 --ptol 1e-3 --ptol 1e-4"
error = "PC_OBSERVABLE cohesive_energy: --ptol is given twice on this line; each option is given once"

[[line_option.invalid]]
wrap = "root"
text = "PC_OBSERVABLE cohesive_energy --species H --target 2 --weight 1 --hotvar a0 1.5 2.5 --ptol 0"
error = "PC_OBSERVABLE cohesive_energy: --ptol must be > 0 (got 0)"



[[line_option]]
id = "PC_OBSERVABLE.cohesive_energy.--unconverged"
option = "--unconverged"
lines = ["PC_OBSERVABLE.cohesive_energy"]
synopsis = "--unconverged const <value> | --unconverged force-scaled <value>"
repeat = "error"
repeat_msg = "PC_OBSERVABLE cohesive_energy: --unconverged is given twice on this line; each option is given once"
default = { literal = "const 100" }
doc = """\
The value the observable reports for a relaxation that does not converge: \
const <value> reports <value> in eV/atom, force-scaled <slope> reports \
the cohesive energy of the cell the relaxation ends at, moved away from \
the target by <slope> times the larger of the largest atomic force, in \
eV/Å, and the magnitude of the cell's pressure, in eV/Å³, there."""
long_doc = """\
The largest atomic force is the one --fmax-converged bounds; the \
magnitude of the cell's pressure, |dE/dε| / (3V), is the one --ptol \
bounds in GPa. In the bcc cell the atomic forces vanish by symmetry, so \
the pressure decides. Under \
force-scaled the loss of the term is at least that of the cohesive \
energy of the final cell and tends to it as the relaxation nears \
convergence, so the loss slopes towards converged candidates; its value \
has no analytical gradient. The slope is a number >= 0."""

[[line_option.args]]
name = "kind"
kind = "word"
words = ["const", "force-scaled"]
msg = "PC_OBSERVABLE cohesive_energy: --unconverged kind must be 'const' or 'force-scaled' (got '{tok}')"

[[line_option.args]]
name = "value"
kind = "number"
msg = "PC_OBSERVABLE cohesive_energy: --unconverged {kind} takes a finite number (got '{tok}'){underflow}"
doc = "For const, the value in eV/atom, of either sign; for force-scaled, the slope, a number >= 0."

[[line_option.checks]]
msg = "PC_OBSERVABLE cohesive_energy: the slope of --unconverged force-scaled must be >= 0 (got {tok})"
doc = "The slope of force-scaled is negative."

[[line_option.examples]]
wrap = "root"
text = "PC_OBSERVABLE cohesive_energy --species H --target 2.0 --weight 1 --hotvar a0 1.5 2.5 --unconverged const 50"

[[line_option.examples]]
doc = "The cohesive energy of the final cell, moved away from the target by 10 times the larger of the largest atomic force and the magnitude of the pressure there."
wrap = "root"
text = "PC_OBSERVABLE cohesive_energy --species H --target 2.0 --weight 1 --hotvar a0 1.5 2.5 --unconverged force-scaled 10"

[[line_option.invalid]]
wrap = "root"
text = "PC_OBSERVABLE cohesive_energy --species H --target 2 --weight 1 --hotvar a0 1.5 2.5 --unconverged linear 5"
error = "PC_OBSERVABLE cohesive_energy: --unconverged kind must be 'const' or 'force-scaled' (got 'linear')"

[[line_option.invalid]]
wrap = "root"
text = "PC_OBSERVABLE cohesive_energy --species H --target 2 --weight 1 --hotvar a0 1.5 2.5 --unconverged const"
error = "PC_OBSERVABLE cohesive_energy: '--unconverged const <value>' requires a value"

[[line_option.invalid]]
wrap = "root"
text = "PC_OBSERVABLE cohesive_energy --species H --target 2 --weight 1 --hotvar a0 1.5 2.5 --unconverged const x"
error = "PC_OBSERVABLE cohesive_energy: --unconverged const takes a finite number (got 'x')"

[[line_option.invalid]]
wrap = "root"
text = "PC_OBSERVABLE cohesive_energy --species H --target 2 --weight 1 --hotvar a0 1.5 2.5 --unconverged const 50 --unconverged const 60"
error = "PC_OBSERVABLE cohesive_energy: --unconverged is given twice on this line; each option is given once"

[[line_option.invalid]]
wrap = "root"
text = "PC_OBSERVABLE cohesive_energy --species H --target 2 --weight 1 --hotvar a0 1.5 2.5 --unconverged force-scaled -1"
error = "PC_OBSERVABLE cohesive_energy: the slope of --unconverged force-scaled must be >= 0 (got -1)"


# ============================================================== LOSS ====

[[key]]
id = "ROOT.LOSS"
name = "LOSS"
blocks = ["ROOT"]
synopsis = "LOSS <function> [<param>]"
repeat = "error"
repeat_msg = "LOSS is set twice (first on line {first_line}) and no line between reads the first (a --varloss or PC_OBSERVABLE term that names no loss function); each key is given once"
repeat_doc = "Again only after a line that reads the value given above it, a --varloss or PC_OBSERVABLE term that names no loss function; a second line with no such term between is refused."
default = { literal = "L2" }
doc = """\
The loss function of the validation metric terms (PC_EMAE, PC_ERMSE and \
the others), and the default loss function of a --varloss term and of a \
PC_OBSERVABLE line."""
long_doc = """\
The name is one of the loss functions below, in any case; HUBER \
and TUKEY take an optional positive parameter. In a file without a \
metric line, a LOSS line is refused when no --varloss or PC_OBSERVABLE \
term that names no loss function follows it: it would have no effect. A \
target that the loss function of its term \
cannot measure is refused at its line: 0 under MAPE, or one at or below \
-1e-12 under RMSLE."""
quirk = """\
A PC_LAMMPS or PC_OBSERVABLE line takes the LOSS of the lines read before \
it as the default loss function of its terms, while the metric terms take \
the last LOSS line wherever it is."""
checks = [
  { msg = "LOSS requires a loss type", doc = "At the line: no loss function follows the key." },
  { msg = "{what}: unknown loss function '{tok}'; the loss functions are L1, L2, LOG_COSH, MAPE, HUBER, RMSLE and TUKEY, in any case", doc = "At the line: a name that is no loss function, in any case; {what} is LOSS, --varloss <name> on a PC_LAMMPS line, or PC_OBSERVABLE cohesive_energy: --loss." },
  { msg = "LOSS {name}: parameter '{tok}' is not a number{underflow}", doc = "At the line: a parameter that is no number of the number grammar." },
  { msg = "loss {name} takes no parameter (got {count})", doc = "At the line: a parameter of a loss function that takes none; {count} is the number given." },
  { msg = "loss {name} takes at most {max} parameter (got {count})", doc = "At the line: more parameters than the loss function takes." },
  { msg = "loss {name} parameter ({key}) must be finite and > 0 (got {value}); omit it to use the default {default}", doc = "At the line: a parameter of HUBER or TUKEY that is 0, negative or not finite; {key} is delta or c." },
  { msg = "LOSS sets the loss function of the --varloss and PC_OBSERVABLE terms after it that name none, and of the metric lines (PC_EMAE, PC_ERMSE, PC_ErRMSE, PC_ERSQ, PC_FRMSE, PC_SRMSE_GPA), and the file has no metric line and no such term after it; it would have no effect", doc = "At the line, at the end of the file: the file has no metric line, and no --varloss or PC_OBSERVABLE term that names no loss function follows the LOSS line." },
  { msg = "{key} {value}: the metric lines take the loss function of the last LOSS line (line {line}): {why}", doc = "At a metric line, at the end of the file: the loss function of the last LOSS line cannot measure its target; {key} is the key, with the index of an indexed line, and {why} says why: MAPE divides by the target, which is 0, or RMSLE takes the logarithm of the target plus 1e-12, which is at or below -1e-12." },
]

[[key.args]]
name = "function"
kind = "loss"

[[key.examples]]
wrap = "root"
text = "LOSS HUBER 20"

[[key.examples]]
doc = "A loss function without a parameter, in lower case."
wrap = "root"
text = "LOSS log_cosh"

[[key.invalid]]
wrap = "root"
text = "LOSS"
error = "LOSS requires a loss type"

[[key.invalid]]
wrap = "root"
text = "LOSS FOO"
error = "LOSS: unknown loss function 'FOO'; the loss functions are L1, L2, LOG_COSH, MAPE, HUBER, RMSLE and TUKEY, in any case"

[[key.invalid]]
wrap = "root"
text = "LOSS HUBER x"
error = "LOSS HUBER: parameter 'x' is not a number"

[[key.invalid]]
wrap = "root"
text = "LOSS L2 1"
error = "loss L2 takes no parameter (got 1)"

[[key.invalid]]
wrap = "root"
text = "LOSS TUKEY 1 2"
error = "loss TUKEY takes at most 1 parameter (got 2)"

[[key.invalid]]
wrap = "optimizer"
text = "LOSS L1"
error = "LOSS is a top-level key, and the OPTIMIZER block opened on line 3 is still open (ENDOPTIMIZER closes it)"

[[key.invalid]]
wrap = "root"
at = 2
text = '''
LOSS L1
LOSS L2'''
error = "LOSS is set twice (first on line 1) and no line between reads the first (a --varloss or PC_OBSERVABLE term that names no loss function); each key is given once"

[[key.invalid]]
wrap = "none"
at = 3
doc = "No metric line, and no PC_LAMMPS or PC_OBSERVABLE line after the LOSS line."
text = '''
OPTIM CGRID2B (1) 0.5 1.5
PC_LAMMPS --script lines_pc.in --varloss E 1 1
LOSS L1
OPTIMIZER
LIB NLOPT
ALGO LN_SBPLX
MAXEVAL 10
ENDOPTIMIZER'''
error = "LOSS sets the loss function of the --varloss and PC_OBSERVABLE terms after it that name none, and of the metric lines (PC_EMAE, PC_ERMSE, PC_ErRMSE, PC_ERSQ, PC_FRMSE, PC_SRMSE_GPA), and the file has no metric line and no such term after it; it would have no effect"

[[key.invalid]]
wrap = "none"
at = 2
doc = "No metric line, and the only term after the LOSS line names its loss function."
text = '''
OPTIM CGRID2B (1) 0.5 1.5
LOSS HUBER 10
PC_LAMMPS --script lines_pc.in --varloss E 1 1 L1
OPTIMIZER
LIB NLOPT
ALGO LN_SBPLX
MAXEVAL 10
ENDOPTIMIZER'''
error = "LOSS sets the loss function of the --varloss and PC_OBSERVABLE terms after it that name none, and of the metric lines (PC_EMAE, PC_ERMSE, PC_ErRMSE, PC_ERSQ, PC_FRMSE, PC_SRMSE_GPA), and the file has no metric line and no such term after it; it would have no effect"

[[key.invalid]]
wrap = "none"
at = "PC_EMAE"
doc = "RMSLE and a target of a metric line below -1e-12."
text = '''
LOSS RMSLE
OPTIM CGRID2B (1) 0.5 1.5
PC_EMAE -1 1
OPTIMIZER
LIB NLOPT
ALGO LN_SBPLX
MAXEVAL 10
ENDOPTIMIZER'''
error = "PC_EMAE -1: the metric lines take the loss function of the last LOSS line (line 1): RMSLE takes ln(target + 1e-12), and the target -1 is at or below -1e-12"


[[loss_function]]
id = "LOSS.L1"
name = "L1"
doc = "The weight times the absolute difference of the measured value and the target."

[[loss_function.examples]]
wrap = "root"
text = "LOSS L1"

[[loss_function]]
id = "LOSS.L2"
name = "L2"
doc = "The weight times the squared difference of the measured value and the target."

[[loss_function.examples]]
wrap = "root"
text = "LOSS L2"

[[loss_function]]
id = "LOSS.LOG_COSH"
name = "LOG_COSH"
doc = "The weight times ln(cosh(r)), where r is the difference of the measured value and the target."

[[loss_function.examples]]
wrap = "root"
text = "LOSS LOG_COSH"

[[loss_function]]
id = "LOSS.MAPE"
name = "MAPE"
doc = """\
The weight times the absolute difference of the measured value and the \
target, divided by the absolute target. A target of 0 is refused at its \
line."""

[[loss_function.examples]]
wrap = "none"
text = '''
LOSS MAPE
OPTIM CGRID2B (1) 0.5 1.5
PC_ERMSE 0.01 1
OPTIMIZER
LIB NLOPT
ALGO LN_SBPLX
MAXEVAL 10
ENDOPTIMIZER'''

[[loss_function.invalid]]
wrap = "root"
at = "PC_ERMSE"
doc = "The metric line PC_ERMSE 0 1 of the file takes MAPE, which divides by its target 0."
text = "LOSS MAPE"
error = "PC_ERMSE 0: the metric lines take the loss function of the last LOSS line (line 1): MAPE divides by the target, and the target is 0"
msg_of = "ROOT.LOSS"

[[loss_function]]
id = "LOSS.HUBER"
name = "HUBER"
doc = """\
The weight times r^2/2 for a difference r of the measured value and the \
target with |r| <= delta, and times delta (|r| - delta/2) beyond it."""

[[loss_function.params]]
name = "delta"
default = 50.0
gt = 0.0
doc = "The difference at which the loss turns from quadratic to linear."

[[loss_function.examples]]
wrap = "root"
text = "LOSS HUBER"

[[loss_function.invalid]]
wrap = "root"
text = "LOSS HUBER 0"
error = "loss HUBER parameter (delta) must be finite and > 0 (got 0); omit it to use the default 50"
msg_of = "ROOT.LOSS"

[[loss_function]]
id = "LOSS.RMSLE"
name = "RMSLE"
doc = """\
The weight times the squared difference of ln(measured + 1e-12) and \
ln(target + 1e-12). A target at or below -1e-12 is refused at its line, \
and a measured value at or below -1e-12 fails the evaluation."""

[[loss_function.examples]]
wrap = "root"
text = "LOSS RMSLE"

[[loss_function]]
id = "LOSS.TUKEY"
name = "TUKEY"
doc = """\
The weight times 1 - (1 - (r/c)^2)^3 for a difference r of the measured \
value and the target with |r| <= c, and the weight beyond it."""

[[loss_function.params]]
name = "c"
default = 4.685
gt = 0.0
doc = "The difference beyond which the loss stays at the weight."

[[loss_function.examples]]
wrap = "root"
text = "LOSS TUKEY 2"

[[loss_function.invalid]]
wrap = "root"
text = "LOSS TUKEY -1"
error = "loss TUKEY parameter (c) must be finite and > 0 (got -1); omit it to use the default 4.685"
msg_of = "ROOT.LOSS"

# ============================================================= OPTIM ====

[[key]]
id = "ROOT.OPTIM"
name = "OPTIM"
blocks = ["ROOT"]
synopsis = "OPTIM <KEY> (<indices>) <low> <high> [LIN | LOG | ASINH <c>]"
repeat = "add"
doc = """\
A search parameter: the values of a training-configuration key that the \
indices select, each searched in a box, the explicit <low> <high> or one \
that AUTO derives from the value of the configuration."""
long_doc = """\
Each value of a key is selected by one OPTIM line; several lines of one \
key select different values. Some keys are refused as search \
parameters, such as the structure keys of the potential. A file without \
an OPTIM line runs with a TADAH optimiser only: NLOPT, DLIB, CERES and \
ASA refuse it at startup."""
quirk = """\
The key, the AUTO option names and the shape tags are read in any case \
(OPTIM cgrid2b (1) 1 2 log), while every other key of the target file is \
matched as written."""

[[key.args]]
name = "KEY"
kind = "name"
doc = "A key of the training configuration, or the path of a DM_Embed parameter."

[[key.args]]
name = "indices"
kind = "indices"

[[key.args]]
name = "low"
kind = "number"
doc = "The lower end of the box; in the AUTO form, AUTO and its options in place of both ends."

[[key.args]]
name = "high"
kind = "number"
doc = "The upper end of the box, above the lower end."

[[key.examples]]
wrap = "root"
text = "OPTIM CGRID2B (2) 1.5 2.5"

[[key.examples]]
doc = "The key and the shape tag in lower case."
wrap = "root"
text = "OPTIM cgrid2b (2) 1.5 2.5 log"

[[key.invalid]]
wrap = "strategy"
text = "OPTIM CGRID2B (2) 1.5 2.5"
error = "OPTIM is a top-level key, and the STRATEGY block opened on line 4 is still open (ENDSTRATEGY closes it)"

[optim]
doc = """\
An OPTIM line selects values of a key of the training configuration with \
an index list and searches each in a box. The indices count the numeric \
values of the key from 1; for FIXWEIGHT they name model weights, those \
FIXINDEX lists."""
long_doc = """\
The index list is one or more entries separated by commas, each an index \
n, a range a-b or a range with a stride a-b:s, without a repeated index; \
blanks inside the parentheses are allowed. A key with a dot names a \
parameter of a DM_Embed component (a DESCRIPTOR block), such as \
H.DENSITY.CENTRES. The key is upper-cased, and each value of a key is \
selected by one line. Every number is a finite number of the number \
grammar."""
synopsis = [
  "OPTIM <KEY> (<indices>) <low> <high> [LIN | LOG | ASINH <c>]",
  "OPTIM <KEY> (<indices>) AUTO [RATIO <f> | FRAC <p>] [FLOOR <a>] [GROUP_FLOOR <r>] [LIN | LOG | ASINH <c>]",
]
positive_only = ["SGRID2B", "SGRIDMB", "SEMBFUNC"]
auto_excluded_prefix = "RCUT"
untested = [
  { msg = "OPTIM {key} ({index}): the AUTO box [{low}, {high}] has the low bound {low}, which is negative, but {what} requires {value}, so the low bound of its box is >= 0", why = "Every key whose low-bound rule takes 0 is a non-negative amplitude, whose AUTO FRAC box is clamped at 0 and whose RATIO box lies above 0." },
]

[[optim.checks]]
msg = "Failed to read key from input."
doc = "The line has no key."

[[optim.checks]]
msg = "{what}: the key is followed by its indices in parentheses, such as {what} (1)"
doc = "No index list in parentheses follows the key."

[[optim.checks]]
msg = "{what}: the indices have no closing parenthesis"
doc = "The index list has no closing parenthesis."

[[optim.checks]]
msg = "{what}: the indices hold another opening parenthesis"
doc = "The index list holds an opening parenthesis."

[[optim.checks]]
msg = "{what}: the parentheses hold no index"
doc = "The parentheses hold no index."

[[optim.checks]]
msg = "{what}: a space follows the closing parenthesis of the indices"
doc = "A token is joined to the closing parenthesis."

[[optim.checks]]
msg = "{what}: the line takes one list of indices in parentheses (unexpected '{tok}')"
doc = "A token after the index list holds a parenthesis."

[[optim.checks]]
msg = "OPTIM {key}: expected `(indices) <low> <high>` or `(indices) AUTO ...` (got {count} token(s))"
doc = "Nothing follows the index list."

[[optim.checks]]
msg = "OPTIM {key}: bad index list ({indices}): {why}"
doc = """\
The index list is not valid; {why} is "OPTIM indices start at 1", \
"Invalid index number '<n>'", "Descending index range '<a-b>'", \
"Duplicate index in '<list>'" or "Index stride must be positive"."""

[[optim.checks]]
msg = "OPTIM {key}: {key} is not a key of the training configuration (closest key: {name})"
doc = "The key is not a key of the training configuration; {name} is the key of the closest name."

[[optim.checks]]
msg = "OPTIM {key}: the training configuration has no {key} line, and OPTIM {key} searches the values the training configuration gives"
doc = "The training configuration has no line of the key, and the key has no default."

[[optim.checks]]
msg = "DM_Embed: unknown, inactive or discrete parameter '{key}'"
doc = "A key with a dot names no continuous parameter of a DM_Embed component."

[[optim.checks]]
msg = "OPTIM {key} is not a valid search target: {key} is an internal key, a value tadah computes itself (no configuration sets it, so no evaluation can take a candidate value of it)."
doc = "The key is one that tadah computes, such as DSIZE or RCUTMAX."

[[optim.checks]]
msg = "OPTIM {key} ({index}) is not a valid search target: value {index} of {key} is an integer ({key} takes {list}), a discrete value rather than a continuous parameter; the training configuration sets it."
doc = "The selected value is an integer in every format of the key; {list} names the formats."

[[optim.checks]]
msg = "OPTIM {key} ({index}): {key} has {count} values in the training configuration, so the indices of OPTIM {key} run from 1 to {max}"
doc = "The key has fewer numeric values than the index; {count} is their number."

[[optim.checks]]
msg = "OPTIM {key} ({index}): {key} has 1 value in the training configuration, so the index of OPTIM {key} is 1{note}"
doc = "The same for a key of one value; for FSIGMA and SSIGMA, {note} says that index 2 is the relative part b."

[[optim.checks]]
msg = "OPTIM {key} ({index}): {key} has {count} that the descriptors read, so {what}{note}"
doc = """\
The potential given with the training configuration holds values its \
descriptors do not read, which the run leaves out: {note} says in \
parentheses which, that the indices address the values kept, and the \
index among them of the value at the given index when it is kept."""

[[optim.checks]]
msg = "OPTIM {key} ({index}): {key} has no numeric value in the training configuration, so no index of OPTIM {key} selects one"
doc = "The key holds words only."

[[optim.checks]]
msg = "OPTIM {key} ({index}): the OPTIM {key} line on line {line} selects this index as well; one OPTIM line selects each index (OPTIM keys match in any case)"
doc = "An earlier OPTIM line of the key selects the value."

[[optim.checks]]
msg = "OPTIM {key} ({index}): the low bound {low} is not > 0, but {what} requires {value}, so the low bound of its box is > 0"
doc = """\
A box of a value that must be positive reaches 0; {what} names the rule \
and {value} what it requires. The values are a width of a radial bump \
basis (SGRID2B of D2_Blip and D2_Blip5, SGRIDMB of a Blip or Blip5 \
density) and a positive DM_Embed parameter. So are WATOM under RHOFORM \
NONNEG or MONOTONE, and SGRIDMB under MONOTONE and, for the Gaussian \
basis, under NONNEG."""

[[optim.checks]]
msg = "OPTIM {key} ({index}): the low bound {low} is negative, but {what} requires {value}, so the low bound of its box is >= 0 (its AUTO FRAC box, the default, is clamped at 0)"
doc = """\
A box of a non-negative value reaches below 0: AMPGRIDMB under RHOFORM \
NONNEG or MONOTONE, or the amplitudes of a DM_Embed density with \
non-negative amplitudes."""

[[optim.checks]]
msg = "OPTIM {key} ({index}): the AUTO box [{low}, {high}] has the low bound {low}, which is not > 0, but {what} requires {value}, so the low bound of its box is > 0"
doc = "The same for an AUTO box, which the line does not write."

[[optim.checks]]
msg = "OPTIM {key} ({index}): the AUTO box [{low}, {high}] has the low bound {low}, which is negative, but {what} requires {value}, so the low bound of its box is >= 0"
doc = "The same for an AUTO box of a value that must not be negative."

[[optim.checks]]
msg = "OPTIM FIXWEIGHT requires FIXINDEX in the training configuration (FIXINDEX names the coefficients the FIXWEIGHT values hold)."
doc = "At the line: OPTIM FIXWEIGHT with a training configuration without FIXINDEX."

[[optim.checks]]
msg = "OPTIM FIXWEIGHT requires FIXWEIGHT in the training configuration (the FIXWEIGHT values hold the coefficients FIXINDEX names, and OPTIM FIXWEIGHT searches those values)."
doc = "At the line: OPTIM FIXWEIGHT with a training configuration that has FIXINDEX and no FIXWEIGHT."

[[optim.checks]]
msg = "OPTIM FIXWEIGHT requires FIXINDEX and FIXWEIGHT in the training configuration (FIXINDEX names the coefficients the FIXWEIGHT values hold, and OPTIM FIXWEIGHT searches those values)."
doc = "At the line: OPTIM FIXWEIGHT with a training configuration without FIXINDEX and FIXWEIGHT."
[[optim.examples]]
wrap = "root"
text = "OPTIM CGRID2B (2) 1.5 2.5"

[[optim.examples]]
wrap = "root"
doc = "Two lines of one key select different values."
text = '''
OPTIM SGRID2B (1) 0.25 0.75
OPTIM SGRID2B (2) 0.5 1.5'''

[[optim.examples]]
wrap = "root"
context = "lines_dm_embed"
doc = "A key with a dot names a parameter of a DM_Embed component."
text = "OPTIM H.DENSITY.CENTRES (1) 0.5 1.5"

[[optim.examples]]
doc = "A DM_Embed path in lower case, upper-cased as the key is, and an index range."
wrap = "root"
context = "lines_dm_embed"
text = "OPTIM h.density.eta (1-2) AUTO"

[[optim.invalid]]
wrap = "root"
text = "OPTIM"
error = "Failed to read key from input."

[[optim.invalid]]
wrap = "root"
text = "OPTIM CGRID2B 2 1.5 2.5"
error = "OPTIM CGRID2B: the key is followed by its indices in parentheses, such as OPTIM CGRID2B (1)"

[[optim.invalid]]
wrap = "root"
text = "OPTIM CGRID2B (2 1.5 2.5"
error = "OPTIM CGRID2B: the indices have no closing parenthesis"
msg_of = "OPTIM"

[[optim.invalid]]
wrap = "root"
text = "OPTIM CGRID2B ((2) 1.5 2.5"
error = "OPTIM CGRID2B: the indices hold another opening parenthesis"
msg_of = "OPTIM"

[[optim.invalid]]
wrap = "root"
text = "OPTIM CGRID2B ( ) 1.5 2.5"
error = "OPTIM CGRID2B: the parentheses hold no index"
msg_of = "OPTIM"

[[optim.invalid]]
wrap = "root"
text = "OPTIM CGRID2B (2)1.5 2.5"
error = "OPTIM CGRID2B: a space follows the closing parenthesis of the indices"
msg_of = "OPTIM"

[[optim.invalid]]
wrap = "root"
text = "OPTIM CGRID2B (1) (2) 0.5 1.5"
error = "OPTIM CGRID2B: the line takes one list of indices in parentheses (unexpected '(2)')"

[[optim.invalid]]
wrap = "root"
text = "OPTIM CGRID2B (2)"
error = "OPTIM CGRID2B: expected `(indices) <low> <high>` or `(indices) AUTO ...` (got 0 token(s))"

[[optim.invalid]]
wrap = "root"
text = "OPTIM CGRID2B (0) 0.5 1.5"
error = "OPTIM CGRID2B: bad index list (0): OPTIM indices start at 1"

[[optim.invalid]]
wrap = "root"
text = "OPTIM CGRID2B (a) 0.5 1.5"
error = "OPTIM CGRID2B: bad index list (a): Invalid index number 'a'"

[[optim.invalid]]
wrap = "root"
text = "OPTIM CGRID2B (2-1) 0.5 1.5"
error = "OPTIM CGRID2B: bad index list (2-1): Descending index range '2-1'"

