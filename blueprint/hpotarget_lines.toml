[[key]]
id = "ROOT.PC_ERSQ"
name = "PC_ERSQ"
blocks = ["ROOT"]
synopsis = "PC_ERSQ <target> <weight>"
repeat = "error"
repeat_msg = "PC_ERSQ: repeated declaration (first declared on line {first_line})"
doc = """\
A loss term on the coefficient of determination (R squared) of the \
energies of the validation datasets: the LOSS function of the metric \
averaged over the datasets, its target and its weight."""
long_doc = """\
R squared is better when higher, so PC_ERSQ takes neither --skip-above \
nor --skip-rel: a cap rejects an evaluation whose metric is above it. \
The term needs a validation configuration (--validation). The weight is \
a number >= 0. A structure with energy \
priority 0 (eweight) is left out of the metric. A dataset whose structures \
all have energy priority 0 is not measured: the average leaves it out, and \
hpo_run.log names it. A run in which no validation dataset has an energy \
is refused."""
checks = [
  { msg = "tadah hpo: {keys} on the validation set: no dataset has a structure with an energy ({list}): every structure has energy priority 0 (eweight), so the energy metrics have nothing to measure", doc = "When the run starts, once the validation data are read, without a line: no validation structure has an energy to measure; {keys} names the energy metrics of the file, {list} the files." },
  { msg = "tadah hpo: PC_ERSQ on the validation set: the energies per atom of validation dataset {index} ({file}) are all equal, so its R^2 has no value; PC_ERSQ needs two different energies per atom in every validation dataset it measures", doc = "When the run starts, once the validation data are read, without a line: the structures of a measured validation dataset, those with an energy priority above 0, have one energy per atom (a single structure, or structures with the same energy per atom)." },
  { msg = "{key} requires <target> <weight>", doc = "At the line: fewer than two values follow the key and its index list." },
  { msg = "{key}: unknown flag '{tok}'", doc = "At the line: a token after the weight that is no option of the metric lines." },
  { msg = "{key}: indexed targets are supported only for PC_ERMSE, PC_FRMSE and PC_SRMSE_GPA", doc = "At the line: an index list, which only PC_ERMSE, PC_FRMSE and PC_SRMSE_GPA take." },
  { msg = "PC_ERSQ takes no {option}: a cap rejects an evaluation whose metric is above it, and a higher R^2 is a better fit, so the cap would reject the better fits", doc = "At the line: a --skip-above or --skip-rel option; {option} is the first of them on the line." },
]

[[key.args]]
name = "target"
kind = "number"
what = "{key} <target>"
doc = "The value of the metric the search aims at."

[[key.args]]
name = "weight"
kind = "number"
min = 0
what = "{key} <weight>"
msg = "{key} <weight> must be a number >= 0, got '{tok}'"
doc = "The weight of the term. The loss of an evaluation is the mean of its terms, so a term of weight 0 adds 0 and still counts in the mean."

