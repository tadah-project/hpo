# ============================================================= rules ====

[[rule]]
id = "RULE.OPTIM_MPARAMS"
title = "OPTIM MPARAMS searches a continuous value of the model function"
check = "startup"
keys = ["ROOT.OPTIM"]
msg = "OPTIM MPARAMS ({index}) is not a valid search target: {why}"
doc = """\
OPTIM MPARAMS searches a value that the model function of the training \
configuration reads, a continuous one: MPARAMS (i) is the i-th MPARAMS \
value. The refusal comes at startup and names no line."""
msg_doc = """\
The message says that the function reads no MPARAMS, that it reads fewer \
values than the index, or that the value is an integer, such as the degree \
of Kern_Polynomial."""

[[rule.examples]]
wrap = "root"
context = "lines_rbf"
text = "OPTIM MPARAMS (1) 0.5 2"

[[rule.invalid]]
wrap = "root"
check = "startup"
context = "lines_mparams"
at = "none"
text = "OPTIM MPARAMS (1) 0.5 1.5"
error = "OPTIM MPARAMS (1) is not a valid search target: BF_Linear reads no MPARAMS, so every evaluation would train the same model."

[[rule.invalid]]
wrap = "root"
check = "startup"
context = "lines_rbf"
at = "none"
text = "OPTIM MPARAMS (2) 0.5 1.5"
error = "OPTIM MPARAMS (2) is not a valid search target: Kern_RBF reads 1 MPARAMS value (sigma), so MPARAMS (2) changes nothing."

[[rule.invalid]]
wrap = "root"
check = "startup"
context = "lines_poly"
at = "none"
text = "OPTIM MPARAMS (1) 1 3"
error = "OPTIM MPARAMS (1) is not a valid search target: MPARAMS (1) of Kern_Polynomial is its d, an integer, a discrete value rather than a continuous parameter; set it in the -c potential/configuration."

[[rule]]
id = "RULE.OPTIM_MPARAMS_positive"
title = "A positive MPARAMS value has an OPTIM box above 0"
check = "startup"
keys = ["ROOT.OPTIM"]
msg = "OPTIM MPARAMS ({index}): the box [{low}, {high}] of {name}'s {key} must be positive ({key} > 0)."
doc = """\
An MPARAMS value that the model function needs above 0, such as the width \
sigma of Kern_RBF, has an OPTIM box above 0. The refusal comes at startup \
and names no line."""
msg_doc = "The message names the function and its value."

[[rule.invalid]]
wrap = "root"
check = "startup"
context = "lines_rbf"
at = "none"
text = "OPTIM MPARAMS (1) 0 2"
error = "OPTIM MPARAMS (1): the box [0, 2] of Kern_RBF's sigma must be positive (sigma > 0)."

[[rule]]
id = "RULE.OPTIM_file_cutoff"
title = "OPTIM does not search a cutoff that a setfl file sets"
check = "startup"
keys = ["ROOT.OPTIM"]
msg = "OPTIM {key} ({index}) is not a valid search target: {why} and refuses another value, so every candidate but the -c value would fail; leave {key} ({index}) out of OPTIM."
doc = """\
A D2_EAM or DM_EAM descriptor, alone or in a D2_mJoin or DM_mJoin, takes \
its cutoff RCUT2B or RCUTMB from its setfl file (SETFL), and OPTIM does \
not search that cutoff. The refusal comes at startup and names no line."""
msg_doc = "The message names the descriptor, the cutoff and the file."

[[rule.invalid]]
wrap = "none"
check = "startup"
context = "lines_setfl"
at = "none"
text = '''
OPTIM RCUT2B (1) 4.5 5.5
PC_ERMSE 0 1
OPTIMIZER
LIB NLOPT
ALGO LN_SBPLX
MAXEVAL 10
ENDOPTIMIZER'''
error = "OPTIM RCUT2B (1) is not a valid search target: D2_EAM takes the cutoff 5 of its setfl file 'lines_ta.eam.alloy' (SETFL) and refuses another value, so every candidate but the -c value would fail; leave RCUT2B (1) out of OPTIM."

[[rule]]
id = "RULE.settings_taken_by_lines"
title = "FAILSCORE, LOSS and PC_SCRIPT_TIMEOUT repeat after PC_LAMMPS or PC_FAILPROBE"
check = "parse"
keys = ["ROOT.FAILSCORE", "ROOT.LOSS", "ROOT.PC_SCRIPT_TIMEOUT", "ROOT.MAXTIME", "ROOT.PC_LAMMPS", "ROOT.PC_FAILPROBE"]
msg = "{key} is set twice (first on line {first_line}{note}) and no PC_LAMMPS or PC_FAILPROBE line between takes the first; each key is given once"
doc = """\
Each PC_LAMMPS and PC_FAILPROBE line takes the FAILSCORE, LOSS and \
PC_SCRIPT_TIMEOUT above it; a second line of these keys needs such a line \
between. The rest of the run takes the last line: the metric terms its \
LOSS, a failed evaluation its FAILSCORE, and the hpo_run.log summary its \
PC_SCRIPT_TIMEOUT."""
msg_doc = """\
The message names the key as the second line writes it and the line of \
the first; when the first wrote the other name of the script limit, \
MAXTIME or PC_SCRIPT_TIMEOUT, that name follows the line number."""
quirk = """\
MAXTIME and PC_SCRIPT_TIMEOUT are one key: a line of either name after a \
line of the other is a second line."""

[[rule.examples]]
wrap = "none"
doc = "Each PC_LAMMPS line takes the LOSS above it: L1 for the first, L2 for the second and for the validation metric."
text = '''
OPTIM CGRID2B (1) 0.5 1.5
LOSS L1
PC_LAMMPS --script lines_pc.in --varloss E 1 1
LOSS L2
PC_LAMMPS --script lines_pc.in --varloss S 0 1
PC_ERMSE 0 1
OPTIMIZER
LIB NLOPT
ALGO LN_SBPLX
MAXEVAL 10
ENDOPTIMIZER'''

[[rule.invalid]]
wrap = "root"
at = 2
text = '''
FAILSCORE 1e9
FAILSCORE 1e10'''
error = "FAILSCORE is set twice (first on line 1) and no PC_LAMMPS or PC_FAILPROBE line between takes the first; each key is given once"

[[rule.invalid]]
wrap = "root"
at = 2
doc = "The two names of the script limit, with no PC_LAMMPS line between."
text = '''
PC_SCRIPT_TIMEOUT 10:00
MAXTIME 5:00'''
error = "MAXTIME is set twice (first on line 1, as PC_SCRIPT_TIMEOUT) and no PC_LAMMPS or PC_FAILPROBE line between takes the first; each key is given once"

[[rule]]
id = "RULE.PC_OBSERVABLE_excludes_PC_LAMMPS"
title = "PC_OBSERVABLE lines and PC_LAMMPS lines are not combined"
check = "parse"
keys = ["ROOT.PC_OBSERVABLE", "ROOT.PC_LAMMPS"]
msg = "--hpotarget defines both PC_OBSERVABLE ({count} entries) and PC_LAMMPS ({count} entries); PC_OBSERVABLE and PC_LAMMPS lines are mutually exclusive. Remove one set of lines and rerun."
doc = """\
A target file has PC_OBSERVABLE lines or PC_LAMMPS and PC_FAILPROBE lines, \
not both. The refusal comes after the whole file is read and names no \
line."""
quirk = """\
The message counts a PC_FAILPROBE line as a PC_LAMMPS entry, and names \
PC_LAMMPS when the file has PC_FAILPROBE lines only."""
msg_doc = "The message gives the number of lines of each key."

[[rule.invalid]]
wrap = "root"
at = "none"
text = '''
PC_OBSERVABLE cohesive_energy --species H --target 2 --weight 1 --hotvar a0 1.5 2.5
PC_LAMMPS --script lines_pc.in --varloss E 1 1'''
error = "--hpotarget defines both PC_OBSERVABLE (1 entries) and PC_LAMMPS (1 entries); PC_OBSERVABLE and PC_LAMMPS lines are mutually exclusive. Remove one set of lines and rerun."

[[rule.invalid]]
wrap = "root"
at = "none"
doc = "A PC_FAILPROBE line, and no PC_LAMMPS line: the message counts it as a PC_LAMMPS entry."
text = '''
PC_FAILPROBE --script lines_pc.in --outvar S
PC_OBSERVABLE cohesive_energy --species H --target 2 --weight 1 --hotvar a0 1.5 2.5'''
error = "--hpotarget defines both PC_OBSERVABLE (1 entries) and PC_LAMMPS (1 entries); PC_OBSERVABLE and PC_LAMMPS lines are mutually exclusive. Remove one set of lines and rerun."

[[rule]]
id = "RULE.PC_LAMMPS_hotvar_unique"
title = "A --hotvar name is declared by one PC_LAMMPS line"
check = "parse"
keys = ["ROOT.PC_LAMMPS", "PC_LAMMPS.--hotvar"]
msg = "PC_LAMMPS: --hotvar name '{name}' is declared by two different scripts ('{script}' and '{script}'). Hot-var names must be unique across scripts: the per-iter hot value is keyed by name only, so sharing a name makes the injected value order-dependent. Rename one of them."
doc = """\
A --hotvar name is declared by one PC_LAMMPS line. The refusal comes after \
the whole file is read and names no line."""
msg_doc = "The message names the scripts of the two lines."
quirk = """\
Two lines that run the same script are two declarations too: the \
message then names that script twice."""

[[rule.examples]]
wrap = "root"
doc = "One line may declare several names, and two lines different ones."
text = '''
PC_LAMMPS --script lines_pc.in --varloss E 1 1 --hotvar a 1 2 --hotvar b 0 1
PC_LAMMPS --script lines_pc2.in --varloss E2 1 1 --hotvar c 1 2'''

[[rule.invalid]]
wrap = "root"
at = "none"
text = '''
PC_LAMMPS --script lines_pc.in --varloss E 1 1 --hotvar a 1 2
PC_LAMMPS --script lines_pc2.in --varloss E2 1 1 --hotvar a 1 2'''
error = "PC_LAMMPS: --hotvar name 'a' is declared by two different scripts ('lines_pc.in' and 'lines_pc2.in'). Hot-var names must be unique across scripts: the per-iter hot value is keyed by name only, so sharing a name makes the injected value order-dependent. Rename one of them."

[[rule.invalid]]
wrap = "root"
at = "none"
text = '''
PC_LAMMPS --script lines_pc.in --varloss E 1 1 --hotvar a 1 2
PC_LAMMPS --script lines_pc.in --varloss E 2 1 --hotvar a 1 2'''
error = "PC_LAMMPS: --hotvar name 'a' is declared by two different scripts ('lines_pc.in' and 'lines_pc.in'). Hot-var names must be unique across scripts: the per-iter hot value is keyed by name only, so sharing a name makes the injected value order-dependent. Rename one of them."

[[rule]]
id = "RULE.PC_OBSERVABLE_GRAD_STRATEGY"
title = "PC_OBSERVABLE refuses GRAD_STRATEGY NUMERICAL"
check = "parse"
keys = ["ROOT.PC_OBSERVABLE", "OPTIMIZER.GRAD_STRATEGY"]
msg = "--hpotarget defines PC_OBSERVABLE but {block} GRAD_STRATEGY=NUMERICAL is set. PC_OBSERVABLE is built for the analytical gradient: use GRAD_STRATEGY ANALYTICAL (an unset GRAD_STRATEGY resolves to it in a block that obtains gradients; it needs the settings of the analytical gradient, such as OALGO 4 with a fixed LAMBDA >= 0, and startup names a missing one) or GRAD_STRATEGY HYBRID, which uses finite differences where the analytical gradient is unavailable."
doc = """\
With a PC_OBSERVABLE line, GRAD_STRATEGY NUMERICAL is refused, and a block \
that obtains gradients without a GRAD_STRATEGY line takes ANALYTICAL. The \
refusal names the END line of the block."""
msg_doc = "The message names the block, OPTIMIZER or EXPLORE."

[[rule.examples]]
wrap = "none"
doc = "A gradient-based optimiser without GRAD_STRATEGY takes the analytical gradient."
text = '''
OPTIM CGRID2B (1) 0.5 1.5
PC_OBSERVABLE cohesive_energy --species H --target 2 --weight 1 --hotvar a0 1.5 2.5
OPTIMIZER
LIB NLOPT
ALGO LD_LBFGS
MAXEVAL 10
ENDOPTIMIZER'''

[[rule.invalid]]
wrap = "none"
at = "ENDOPTIMIZER"
text = '''
OPTIM CGRID2B (1) 0.5 1.5
PC_OBSERVABLE cohesive_energy --species H --target 2 --weight 1 --hotvar a0 1.5 2.5
OPTIMIZER
LIB NLOPT
ALGO LD_LBFGS
MAXEVAL 10
GRAD_STRATEGY NUMERICAL
ENDOPTIMIZER'''
error = "--hpotarget defines PC_OBSERVABLE but OPTIMIZER's GRAD_STRATEGY=NUMERICAL is set. PC_OBSERVABLE is built for the analytical gradient: use GRAD_STRATEGY ANALYTICAL (an unset GRAD_STRATEGY resolves to it in a block that obtains gradients; it needs the settings of the analytical gradient, such as OALGO 4 with a fixed LAMBDA >= 0, and startup names a missing one) or GRAD_STRATEGY HYBRID, which uses finite differences where the analytical gradient is unavailable."

[[rule]]
id = "RULE.PC_LAMMPS_GRAD_STRATEGY"
title = "PC_LAMMPS refuses a GRAD_STRATEGY line"
check = "parse"
keys = ["ROOT.PC_LAMMPS", "OPTIMIZER.GRAD_STRATEGY"]
msg = "--hpotarget defines PC_LAMMPS but {block} GRAD_STRATEGY is set. PC_LAMMPS does not support analytical/numerical/hybrid gradients. Drop the GRAD_STRATEGY line."
doc = """\
With a PC_LAMMPS or PC_FAILPROBE line, no block has a GRAD_STRATEGY line. \
The refusal names the END line of the block."""
msg_doc = "The message names the block, OPTIMIZER or EXPLORE."

[[rule.invalid]]
wrap = "none"
at = "ENDOPTIMIZER"
text = '''
OPTIM CGRID2B (1) 0.5 1.5
PC_LAMMPS --script lines_pc.in --varloss E 1 1
OPTIMIZER
LIB NLOPT
ALGO LN_SBPLX
MAXEVAL 10
GRAD_STRATEGY NUMERICAL
ENDOPTIMIZER'''
error = "--hpotarget defines PC_LAMMPS but OPTIMIZER's GRAD_STRATEGY is set. PC_LAMMPS does not support analytical/numerical/hybrid gradients. Drop the GRAD_STRATEGY line."

[[rule]]
id = "RULE.PC_LAMMPS_gradient_free"
title = """\
With PC_LAMMPS every optimiser runs without gradients, or is DLIB:BFGS"""
check = "parse"
keys = ["ROOT.PC_LAMMPS", "OPTIMIZER.ALGO"]
msg = "--hpotarget defines PC_LAMMPS but {block} optimiser {lib}:{algo} is gradient-based. PC_LAMMPS requires a gradient-free optimiser ({list}) or DLIB:BFGS, the one gradient-based optimiser it accepts; an NLopt MLSL or AUGLAG algorithm is accepted with a derivative-free INNER block."
doc = """\
With a PC_LAMMPS or PC_FAILPROBE line, every optimiser of the file runs \
without gradients; DLIB:BFGS is accepted. The refusal names the END line \
of the block."""
msg_doc = """\
The message names the block, OPTIMIZER or EXPLORE, and its optimiser, and \
lists the optimisers that run without gradients as a block names them."""

[[rule.examples]]
wrap = "none"
text = '''
OPTIM CGRID2B (1) 0.5 1.5
PC_LAMMPS --script lines_pc.in --varloss E 1 1
OPTIMIZER
LIB DLIB
ALGO BFGS
MAXEVAL 10
ENDOPTIMIZER'''

[[rule.invalid]]
wrap = "none"
at = "ENDOPTIMIZER"
text = '''
OPTIM CGRID2B (1) 0.5 1.5
PC_LAMMPS --script lines_pc.in --varloss E 1 1
OPTIMIZER
LIB NLOPT
ALGO LD_LBFGS
MAXEVAL 10
ENDOPTIMIZER'''
error = "--hpotarget defines PC_LAMMPS but OPTIMIZER's optimiser NLOPT:LD_LBFGS is gradient-based. PC_LAMMPS requires a gradient-free optimiser (ASA:ASA, DLIB:GFS, NLOPT:GN_AGS, NLOPT:GN_CRS2_LM, NLOPT:GN_DIRECT, NLOPT:GN_DIRECT_L, NLOPT:GN_DIRECT_L_NOSCAL, NLOPT:GN_DIRECT_L_RAND, NLOPT:GN_DIRECT_L_RAND_NOSCAL, NLOPT:GN_DIRECT_NOSCAL, NLOPT:GN_ESCH, NLOPT:GN_ISRES, NLOPT:GN_MLSL, NLOPT:GN_MLSL_LDS, NLOPT:GN_ORIG_DIRECT, NLOPT:GN_ORIG_DIRECT_L, NLOPT:LN_AUGLAG, NLOPT:LN_AUGLAG_EQ, NLOPT:LN_BOBYQA, NLOPT:LN_COBYLA, NLOPT:LN_NELDERMEAD, NLOPT:LN_PRAXIS, NLOPT:LN_SBPLX, TADAH:ANNEAL, TADAH:ANNEAL_PA, TADAH:ANNEAL_PT, TADAH:GRID, TADAH:RANDOM) or DLIB:BFGS, the one gradient-based optimiser it accepts; an NLopt MLSL or AUGLAG algorithm is accepted with a derivative-free INNER block."

[[rule.invalid]]
wrap = "none"
at = "ENDEXPLORE"
text = '''
OPTIM CGRID2B (1) 0.5 1.5
PC_FAILPROBE --script lines_pc.in --outvar S
PC_ERMSE 0 1
OPTIMIZER
STRATEGY
TYPE PRESTAGE
LIB NLOPT
ALGO LN_SBPLX
MAXEVAL 10
EXPLORE
LIB NLOPT
ALGO LD_LBFGS
MAXEVAL 5
ENDEXPLORE
ENDSTRATEGY
ENDOPTIMIZER'''
error = "--hpotarget defines PC_LAMMPS but EXPLORE's optimiser NLOPT:LD_LBFGS is gradient-based. PC_LAMMPS requires a gradient-free optimiser (ASA:ASA, DLIB:GFS, NLOPT:GN_AGS, NLOPT:GN_CRS2_LM, NLOPT:GN_DIRECT, NLOPT:GN_DIRECT_L, NLOPT:GN_DIRECT_L_NOSCAL, NLOPT:GN_DIRECT_L_RAND, NLOPT:GN_DIRECT_L_RAND_NOSCAL, NLOPT:GN_DIRECT_NOSCAL, NLOPT:GN_ESCH, NLOPT:GN_ISRES, NLOPT:GN_MLSL, NLOPT:GN_MLSL_LDS, NLOPT:GN_ORIG_DIRECT, NLOPT:GN_ORIG_DIRECT_L, NLOPT:LN_AUGLAG, NLOPT:LN_AUGLAG_EQ, NLOPT:LN_BOBYQA, NLOPT:LN_COBYLA, NLOPT:LN_NELDERMEAD, NLOPT:LN_PRAXIS, NLOPT:LN_SBPLX, TADAH:ANNEAL, TADAH:ANNEAL_PA, TADAH:ANNEAL_PT, TADAH:GRID, TADAH:RANDOM) or DLIB:BFGS, the one gradient-based optimiser it accepts; an NLopt MLSL or AUGLAG algorithm is accepted with a derivative-free INNER block."

[[rule]]
id = "RULE.PC_LAMMPS_local_optimiser"
title = """\
With PC_LAMMPS an MLSL or AUGLAG search has a derivative-free local search"""
check = "parse"
keys = ["ROOT.PC_LAMMPS", "BLOCK.INNER"]
msg = "--hpotarget defines PC_LAMMPS but {block} optimiser {lib}:{algo} takes a gradient: NLopt's MLSL and AUGLAG take one for their local search, and NLopt's default local optimiser, {name}, is gradient-based; an INNER block with a derivative-free one takes none. PC_LAMMPS requires a gradient-free optimiser ({list}) or DLIB:BFGS, the one gradient-based optimiser it accepts; an NLopt MLSL or AUGLAG algorithm is accepted with a derivative-free INNER block."
doc = """\
With a PC_LAMMPS or PC_FAILPROBE line, an NLopt MLSL or AUGLAG without an \
INNER block is refused when NLopt's default local optimiser takes \
gradients. The refusal names the END line of the block."""
msg_doc = """\
The message names the block, OPTIMIZER or EXPLORE, its optimiser and the \
default local optimiser, and lists the optimisers that run without \
gradients as a block names them."""

[[rule.invalid]]
wrap = "none"
