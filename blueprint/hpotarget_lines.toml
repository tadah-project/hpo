[[line_option.invalid]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E 1 1 --invar a 1 -v a 2"
error = "-v a: the variable a is defined twice on this line (first by --invar a); each variable is defined once"


[[line_option]]
id = "PC_LAMMPS.--outvar"
option = "--outvar"
lines = ["PC_LAMMPS", "PC_FAILPROBE"]
synopsis = "--outvar <name>"
repeat = "add"
doc = """\
An equal-style LAMMPS variable of the script that each evaluation \
records without a loss term. On a PC_FAILPROBE line the first --outvar \
is the probe value S."""

[[line_option.args]]
