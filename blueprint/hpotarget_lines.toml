text = "OPTIM CGRID2B (1, 1) 0.5 1.5"
error = "OPTIM CGRID2B: bad index list (1, 1): Duplicate index in '1, 1'"

[[optim.invalid]]
wrap = "root"
text = "OPTIM CGRID2B (1-2:0) 0.5 1.5"
error = "OPTIM CGRID2B: bad index list (1-2:0): Index stride must be positive"

[[optim.invalid]]
wrap = "root"
text = "OPTIM FOO (1) 0 1"
error = "OPTIM FOO: FOO is not a key of the training configuration (closest key: FUSE)"

[[optim.invalid]]
wrap = "root"
text = "OPTIM CGRIDMB (1) 0 2"
error = "OPTIM CGRIDMB: the training configuration has no CGRIDMB line, and OPTIM CGRIDMB searches the values the training configuration gives"

[[optim.invalid]]
wrap = "root"
text = "OPTIM X.Y (1) 0 1"
error = "DM_Embed: unknown, inactive or discrete parameter 'X.Y'"

[[optim.invalid]]
wrap = "root"
text = "OPTIM DSIZE (1) 0 2"
error = "OPTIM DSIZE is not a valid search target: DSIZE is an internal key, a value tadah computes itself (no configuration sets it, so no evaluation can take a candidate value of it)."

[[optim.invalid]]
wrap = "root"
text = "OPTIM VERBOSE (1) 0 2"
error = "OPTIM VERBOSE (1) is not a valid search target: value 1 of VERBOSE is an integer (VERBOSE takes UINT), a discrete value rather than a continuous parameter; the training configuration sets it."

[[optim.invalid]]
wrap = "root"
text = "OPTIM CGRID2B (3) 1.5 2.5"
error = "OPTIM CGRID2B (3): CGRID2B has 2 values in the training configuration, so the indices of OPTIM CGRID2B run from 1 to 2"

[[optim.invalid]]
wrap = "end"
text = "OPTIM CGRID2B (1) 0.5 1.5"
error = "OPTIM CGRID2B (1): the OPTIM CGRID2B line on line 1 selects this index as well; one OPTIM line selects each index (OPTIM keys match in any case)"

[[optim.invalid]]
wrap = "end"
text = "OPTIM cgrid2b (1) 0.5 1.5"
error = "OPTIM CGRID2B (1): the OPTIM CGRID2B line on line 1 selects this index as well; one OPTIM line selects each index (OPTIM keys match in any case)"

[[optim.invalid]]
wrap = "root"
context = "lines_blip"
text = "OPTIM SGRID2B (1) 0 2"
error = "OPTIM SGRID2B (1): the low bound 0 is not > 0, but the D2_Blip pair basis requires every SGRID2B width > 0 (a radial bump spans [c - w/s, c + w/s]; a width <= 0 has no support edge), so the low bound of its box is > 0"

[[optim.invalid]]
wrap = "root"
context = "lines_ream"
text = "OPTIM WATOM (1) 0 2"
error = "OPTIM WATOM (1): the low bound 0 is not > 0, but RHOFORM NONNEG requires every density pair weight W > 0, so the low bound of its box is > 0"

[[optim.invalid]]
wrap = "root"
context = "lines_ream"
text = "OPTIM AMPGRIDMB (2) -0.1 0.5"
error = "OPTIM AMPGRIDMB (2): the low bound -0.1 is negative, but RHOFORM NONNEG requires every AMPGRIDMB amplitude >= 0, so the low bound of its box is >= 0 (its AUTO FRAC box, the default, is clamped at 0)"

[[optim.invalid]]
wrap = "root"
context = "lines_blip"
doc = "An AUTO box of a width of the radial bump basis that reaches below 0."
text = "OPTIM SGRID2B (1) AUTO FRAC 2"
error = "OPTIM SGRID2B (1): the AUTO box [-0.5, 1.5] has the low bound -0.5, which is not > 0, but the D2_Blip pair basis requires every SGRID2B width > 0 (a radial bump spans [c - w/s, c + w/s]; a width <= 0 has no support edge), so the low bound of its box is > 0"

[[optim.invalid]]
wrap = "root"
doc = "A key that holds words only."
text = "OPTIM ATOM (1) 0 1"
error = "OPTIM ATOM (1): ATOM has no numeric value in the training configuration, so no index of OPTIM ATOM selects one"

[[optim.invalid]]
wrap = "root"
context = "lines_left_out"
doc = "A value of the potential its descriptor does not read is left out."
text = "OPTIM RCUT2B (2) 5.5 6.5"
error = "OPTIM RCUT2B (2): RCUT2B has 1 value that the descriptors read, so the index of OPTIM RCUT2B is 1 (of the potential's RCUT2B 4 6, the descriptors do not read 4, which was left out, and OPTIM indices address the values kept, 6; the potential's value at index 2, 6, is index 1)"

# ---------------------------------------------------- OPTIM forms ------

[[form]]
id = "OPTIM.range"
line = "OPTIM"
synopsis = "OPTIM <KEY> (<indices>) <low> <high> [LIN | LOG | ASINH <c>]"
doc = "The box [<low>, <high>] for every value the indices select; <high> is greater than <low>."

[[form.args]]
name = "indices"
kind = "indices"

[[form.args]]
name = "low"
kind = "number"
msg = "OPTIM {key}: <low> must be a finite number (got '{tok}'){underflow}"

[[form.args]]
name = "high"
kind = "number"
msg = "OPTIM {key}: <high> must be a finite number (got '{tok}'){underflow}"

[[form.checks]]
msg = "OPTIM {key}: unexpected token(s) '{text}' -- the grammar is OPTIM <KEY> (indices) <low> <high> [LIN | LOG | ASINH <c>] or OPTIM <KEY> (indices) AUTO [RATIO <f> | FRAC <p>] [FLOOR <a>] [GROUP_FLOOR <r>] [LIN | LOG | ASINH <c>]"
doc = "The tokens after the index list, less a shape tag, are not two."

[[form.checks]]
msg = "OPTIM {key}: <high> {high} is not greater than <low> {low}"
doc = "<high> is not greater than <low>."

[[form.checks]]
msg = "OPTIM {key}: under ASINH {value} the box [{low}, {high}] maps to [{min}, {max}], which has no finite width; a c of the size of the values of the box gives one"
doc = "Under ASINH <c> the box, in the coordinate of its shape tag, is empty or not finite."

[[form.checks]]
msg = "OPTIM {key}: the line is tagged LOG, and <low> {low} is not > 0, and a box tagged LOG lies above 0{hint}"
doc = "A LOG box whose lower bound is 0 or below."

[[form.checks]]
msg = "the starting point {index} of the INIT block of {phase}: {key} = {value} lies outside its OPTIM box [{low}, {high}]"
doc = "At startup, without a line: a starting point of the INIT block, such as the value of the training configuration that METHOD CONFIG takes, lies outside the box. {phase} names the optimiser, such as the STRATEGY-level optimiser."
[[form.examples]]
wrap = "root"
text = "OPTIM CGRID2B (2) 1.5 2.5"

[[form.examples]]
doc = "Two values in one box, with the ASINH shape of scale 0.1."
wrap = "root"
text = "OPTIM SGRID2B (1-2) -0.5 1.5 ASINH 0.1"

[[form.invalid]]
wrap = "root"
text = "OPTIM CGRID2B (2) 1.5"
error = "OPTIM CGRID2B: unexpected token(s) '1.5' -- the grammar is OPTIM <KEY> (indices) <low> <high> [LIN | LOG | ASINH <c>] or OPTIM <KEY> (indices) AUTO [RATIO <f> | FRAC <p>] [FLOOR <a>] [GROUP_FLOOR <r>] [LIN | LOG | ASINH <c>]"

[[form.invalid]]
wrap = "root"
text = "OPTIM CGRID2B (2) 1 2 LIN LOG"
error = "OPTIM CGRID2B: unexpected token(s) '1 2 LIN' -- the grammar is OPTIM <KEY> (indices) <low> <high> [LIN | LOG | ASINH <c>] or OPTIM <KEY> (indices) AUTO [RATIO <f> | FRAC <p>] [FLOOR <a>] [GROUP_FLOOR <r>] [LIN | LOG | ASINH <c>]"

[[form.invalid]]
wrap = "root"
text = "OPTIM CGRID2B (2) x 2"
error = "OPTIM CGRID2B: <low> must be a finite number (got 'x')"

[[form.invalid]]
wrap = "root"
text = "OPTIM CGRID2B (2) 1e-400 2"
error = "OPTIM CGRID2B: <low> must be a finite number (got '1e-400') (too small: its magnitude is below the smallest normal double, 2.2250738585072014e-308)"

[[form.invalid]]
wrap = "root"
text = "OPTIM CGRID2B (2) 1 inf"
error = "OPTIM CGRID2B: <high> must be a finite number (got 'inf')"

[[form.invalid]]
wrap = "root"
text = "OPTIM CGRID2B (2) 2.5 1.5"
error = "OPTIM CGRID2B: <high> 1.5 is not greater than <low> 2.5"

[[form.invalid]]
wrap = "root"
check = "startup"
at = "none"
doc = "Without an INIT block the search starts from the values of the training configuration: CGRID2B 1.0 2.0."
text = "OPTIM CGRID2B (2) 2.5 3.5"
error = "the starting point 1 of the INIT block of the STRATEGY-level optimiser: CGRID2B[2] = 2 lies outside its OPTIM box [2.5, 3.5]"

[[form.invalid]]
wrap = "root"
text = "OPTIM CGRID2B (2) 0 3 LOG"
error = "OPTIM CGRID2B: the line is tagged LOG, and <low> 0 is not > 0, and a box tagged LOG lies above 0; a line without a tag, or tagged LIN or ASINH <c>, takes this box"

[[form.invalid]]
wrap = "root"
text = "OPTIM CGRID2B (2) 1 1e300 ASINH 1e-300"
error = "OPTIM CGRID2B: under ASINH 1e-300 the box [1, 1e300] maps to [691.4686750787737, inf], which has no finite width; a c of the size of the values of the box gives one"

[[form]]
id = "OPTIM.AUTO"
line = "OPTIM"
word = "AUTO"
synopsis = "OPTIM <KEY> (<indices>) AUTO [RATIO <f> | FRAC <p>] [FLOOR <a>] [GROUP_FLOOR <r>] [LIN | LOG | ASINH <c>]"
doc = """\
A box around the value x0 of the configuration for every value the \
indices select: [x0/f, x0*f] under RATIO, x0 +/- d under FRAC, with \
d = max(p|x0|, a, r max|x0|) and the maximum over the values of the line."""
long_doc = """\
Without RATIO or FRAC the rule is RATIO 2 for the keys whose values stay \
positive (SGRID2B, SGRIDMB, SEMBFUNC) and for a positive DM_Embed \
parameter other than an amplitude, and FRAC 0.5 for the others. The \
non-negative amplitudes (AMPGRIDMB under RHOFORM NONNEG or MONOTONE, a \
DM_Embed density with non-negative amplitudes) keep a FRAC box at or \
above 0, and take GROUP_FLOOR 1e-3 when the line sets neither FLOOR nor \
GROUP_FLOOR; so does the relative part b of FSIGMA and SSIGMA. A \
negative seed of a value that every fit takes >= 0 (a non-negative \
amplitude, the relative part b of FSIGMA or SSIGMA, LAMBDA) is refused. A \
cutoff key (a key that starts with RCUT) takes no AUTO \
box. hpo_optim_resolved.hpo records the boxes as explicit lines. The \
option names are read in any case."""

[[form.args]]
name = "indices"
kind = "indices"

[[form.checks]]
msg = "OPTIM {key}: AUTO option '{tok}' needs a value -- the grammar is OPTIM <KEY> (indices) <low> <high> [LIN | LOG | ASINH <c>] or OPTIM <KEY> (indices) AUTO [RATIO <f> | FRAC <p>] [FLOOR <a>] [GROUP_FLOOR <r>] [LIN | LOG | ASINH <c>]"
doc = "An option ends the line without its value."

[[form.checks]]
msg = "OPTIM {key}: AUTO {option} must be a finite number (got '{tok}'){underflow}"
doc = """\
The value of an option, or the token after a word that is no option, is \
not a number; {option} is the word upper-cased."""

[[form.checks]]
msg = "OPTIM {key}: '{tok}' is not an AUTO option (RATIO, FRAC, FLOOR or GROUP_FLOOR) -- the grammar is OPTIM <KEY> (indices) <low> <high> [LIN | LOG | ASINH <c>] or OPTIM <KEY> (indices) AUTO [RATIO <f> | FRAC <p>] [FLOOR <a>] [GROUP_FLOOR <r>] [LIN | LOG | ASINH <c>]"
doc = """\
A word followed by a number is not an AUTO option."""

[[form.checks]]
msg = "OPTIM {key}: a cutoff key takes explicit bounds, OPTIM {key} (indices) <low> <high>, and no AUTO box: the neighbour list is sized from the explicit high bound"
doc = "The key starts with RCUT."

[[form.checks]]
msg = "OPTIM {key} ({index}): the seed {value} is negative, but {what} requires every AMPGRIDMB amplitude >= 0"
doc = "A non-negative amplitude has a negative value in the configuration; {what} is the RHOFORM line."

[[form.checks]]
msg = "OPTIM {key} ({index}): the seed {value} is negative, but {why}"
doc = "A value that every fit takes >= 0 (the relative part b of FSIGMA or SSIGMA, LAMBDA) is negative in the training configuration; {why} says what the fit takes."

[[form.checks]]
msg = "OPTIM {key} ({index}): the line is tagged LOG, and the AUTO box [{low}, {high}] reaches 0 or below, and a box tagged LOG lies above 0{hint}"
doc = "The line has the shape tag LOG and the AUTO box reaches 0 or below."

[[form.checks]]
msg = "OPTIM {key}: AUTO takes RATIO or FRAC, not both"
doc = "The line gives RATIO and FRAC."

[[form.checks]]
msg = "OPTIM {key} ({index}): AUTO without RATIO or FRAC gives {name} the box [seed/2, seed*2] (RATIO 2), which needs a seed other than 0, and the seed is 0{hint}"
doc = "The default box of the key is geometric, and a selected value is 0 in the configuration."

[[form.checks]]
msg = "OPTIM {key} ({index}): the AUTO box [{low}, {high}] around the seed {seed} is not finite; a smaller RATIO or FRAC gives a finite box"
doc = "The box reaches past the largest double."

[[form.examples]]
wrap = "root"
text = "OPTIM SGRID2B (1,2) AUTO"

[[form.examples]]
doc = "FRAC 0.2 and the LOG shape, in lower case."
wrap = "root"
text = "OPTIM CGRID2B (2) auto frac 0.2 log"

[[form.examples]]
doc = "A value of 0 of a key whose values stay positive, in a FRAC box with a FLOOR (read only: the D2_BP model refuses a width of 0)."
wrap = "root"
check = "parse"
context = "lines_zero_width"
text = "OPTIM SGRID2B (1) AUTO FRAC 0.5 FLOOR 0.5"

[[form.invalid]]
wrap = "root"
text = "OPTIM CGRID2B (2) AUTO RATIO"
error = "OPTIM CGRID2B: AUTO option 'RATIO' needs a value -- the grammar is OPTIM <KEY> (indices) <low> <high> [LIN | LOG | ASINH <c>] or OPTIM <KEY> (indices) AUTO [RATIO <f> | FRAC <p>] [FLOOR <a>] [GROUP_FLOOR <r>] [LIN | LOG | ASINH <c>]"

[[form.invalid]]
wrap = "root"
text = "OPTIM CGRID2B (2) AUTO ratio x"
error = "OPTIM CGRID2B: AUTO RATIO must be a finite number (got 'x')"

[[form.invalid]]
wrap = "root"
text = "OPTIM CGRID2B (2) AUTO BOGUS 1"
error = "OPTIM CGRID2B: 'BOGUS' is not an AUTO option (RATIO, FRAC, FLOOR or GROUP_FLOOR) -- the grammar is OPTIM <KEY> (indices) <low> <high> [LIN | LOG | ASINH <c>] or OPTIM <KEY> (indices) AUTO [RATIO <f> | FRAC <p>] [FLOOR <a>] [GROUP_FLOOR <r>] [LIN | LOG | ASINH <c>]"

[[form.invalid]]
wrap = "root"
text = "OPTIM RCUT2B (1) AUTO"
error = "OPTIM RCUT2B: a cutoff key takes explicit bounds, OPTIM RCUT2B (indices) <low> <high>, and no AUTO box: the neighbour list is sized from the explicit high bound"

[[form.invalid]]
wrap = "root"
context = "lines_ream"
text = "OPTIM AMPGRIDMB (3) AUTO"
error = "OPTIM AMPGRIDMB (3): the seed -0.1 is negative, but RHOFORM NONNEG requires every AMPGRIDMB amplitude >= 0"

[[form.invalid]]
wrap = "root"
context = "lines_force_relative_negative"
doc = "A negative relative part b of FSIGMA, the value the AUTO box is made around."
text = "OPTIM FSIGMA (2) AUTO"
error = "OPTIM FSIGMA (2): the seed -0.5 is negative, but the relative part b of FSIGMA is a number >= 0, and every fit refuses a negative one"

[[form.invalid]]
wrap = "root"
context = "lines_stress_relative_negative"
doc = "A negative relative part b of SSIGMA, with a FRAC that would reach above 0."
text = "OPTIM SSIGMA (2) AUTO FRAC 2"
error = "OPTIM SSIGMA (2): the seed -0.2 is negative, but the relative part b of SSIGMA is a number >= 0, and every fit refuses a negative one"

[[form.invalid]]
wrap = "root"
context = "lines_lambda_negative"
doc = "A negative LAMBDA other than -1."
text = "OPTIM LAMBDA (1) AUTO"
error = "OPTIM LAMBDA (1): the seed -2 is negative, but LAMBDA is the ridge penalty, a number >= 0: every fit refuses a negative value other than -1, and -1, which requests the evidence approximation, is no value of a box"

[[form.invalid]]
wrap = "root"
text = "OPTIM CGRID2B (2) AUTO FRAC 1.5 LOG"
error = "OPTIM CGRID2B (2): the line is tagged LOG, and the AUTO box [-1, 5] reaches 0 or below, and a box tagged LOG lies above 0; AUTO RATIO <f> gives a box above 0 around this seed; a line without a tag, or tagged LIN or ASINH <c>, takes this box"

[[form.invalid]]
wrap = "root"
context = "lines_ream"
text = "OPTIM AMPGRIDMB (2) AUTO FRAC 2 LOG"
error = "OPTIM AMPGRIDMB (2): the line is tagged LOG, and the AUTO box [0, 0.8999999999999999] reaches 0 or below, and a box tagged LOG lies above 0; AUTO RATIO <f> gives a box above 0 around this seed; a line without a tag, or tagged LIN or ASINH <c>, takes this box"

[[form.invalid]]
wrap = "root"
doc = "An unknown word followed by a token that is no number."
text = "OPTIM CGRID2B (2) AUTO BOGUS x"
error = "OPTIM CGRID2B: 'BOGUS' is not an AUTO option (RATIO, FRAC, FLOOR or GROUP_FLOOR) -- the grammar is OPTIM <KEY> (indices) <low> <high> [LIN | LOG | ASINH <c>] or OPTIM <KEY> (indices) AUTO [RATIO <f> | FRAC <p>] [FLOOR <a>] [GROUP_FLOOR <r>] [LIN | LOG | ASINH <c>]"

[[form.invalid]]
wrap = "root"
doc = "A number in place of an option."
text = "OPTIM CGRID2B (2) AUTO 0.1"
error = "OPTIM CGRID2B: '0.1' is not an AUTO option (RATIO, FRAC, FLOOR or GROUP_FLOOR) -- the grammar is OPTIM <KEY> (indices) <low> <high> [LIN | LOG | ASINH <c>] or OPTIM <KEY> (indices) AUTO [RATIO <f> | FRAC <p>] [FLOOR <a>] [GROUP_FLOOR <r>] [LIN | LOG | ASINH <c>]"

[[form.invalid]]
wrap = "root"
context = "lines_zero_width"
doc = "A key whose values stay positive, with a value of 0 and the default geometric box."
text = "OPTIM SGRID2B (1) AUTO"
error = "OPTIM SGRID2B (1): AUTO without RATIO or FRAC gives SGRID2B the box [seed/2, seed*2] (RATIO 2), which needs a seed other than 0, and the seed is 0; AUTO FRAC <p> FLOOR <a> gives a box of half-width a or more around it"

[[form.invalid]]
wrap = "root"
context = "lines_wdbfile_zero"
doc = "A WDBFILE value of 0, whose box stays above 0."
text = "OPTIM WDBFILE (2) AUTO"
error = "OPTIM WDBFILE (2): AUTO without RATIO or FRAC gives WDBFILE the box [seed/2, seed*2] (RATIO 2), which needs a seed other than 0, and the seed is 0; the explicit bounds `OPTIM WDBFILE (2) <low> <high>` with <low> > 0 give it a box"

[[form.invalid]]
wrap = "root"
doc = "A box past the largest double."
text = "OPTIM CGRID2B (2) AUTO FRAC 1e308"
error = "OPTIM CGRID2B (2): the AUTO box [-inf, inf] around the seed 2 is not finite; a smaller RATIO or FRAC gives a finite box"

# ---------------------------------------------- the AUTO options ------

[[line_option]]
id = "OPTIM.AUTO.RATIO"
option = "RATIO"
lines = ["OPTIM.AUTO"]
synopsis = "RATIO <f>"
repeat = "error"
repeat_msg = "OPTIM {key}: AUTO RATIO is given twice on this line; each option is given once"
default = { text = "RATIO 2 for SGRID2B, SGRIDMB and SEMBFUNC, whose values stay positive, and for a positive DM_Embed parameter other than an amplitude; FRAC 0.5 otherwise" }
doc = "The geometric box [x0/f, x0*f] (mirrored for x0 < 0), for a factor f > 1."

[[line_option.args]]
name = "f"
kind = "number"

[[line_option.checks]]
msg = "OPTIM {key}: AUTO RATIO must be > 1 (got {tok})"
doc = "f is 1 or less."

[[line_option.checks]]
msg = "OPTIM {key} ({index}): AUTO RATIO {value} gives the box [seed/{value}, seed*{value}], which needs a seed other than 0, and the seed is 0{hint}"
doc = "A selected value is 0 in the configuration."

[[line_option.checks]]
msg = "OPTIM {key} ({index}): AUTO RATIO under {what} needs every seed on the line > 0 (got {value}); FRAC, the default, gives a box clamped at 0"
doc = "A non-negative amplitude of the line is 0 in the configuration; {what} is the RHOFORM line."

[[line_option.examples]]
wrap = "root"
text = "OPTIM CGRID2B (2) AUTO RATIO 1.5"

[[line_option.invalid]]
wrap = "root"
text = "OPTIM CGRID2B (2) AUTO RATIO 1"
error = "OPTIM CGRID2B: AUTO RATIO must be > 1 (got 1)"

[[line_option.invalid]]
wrap = "root"
text = "OPTIM CGRID2B (2) AUTO RATIO 2 RATIO 3"
error = "OPTIM CGRID2B: AUTO RATIO is given twice on this line; each option is given once"

[[line_option.invalid]]
wrap = "root"
context = "lines_zero_seed"
text = "OPTIM CGRID2B (1) AUTO RATIO 2"
error = "OPTIM CGRID2B (1): AUTO RATIO 2 gives the box [seed/2, seed*2], which needs a seed other than 0, and the seed is 0; AUTO FRAC <p> FLOOR <a> gives a box of half-width a or more around it"

[[line_option.invalid]]
wrap = "root"
context = "lines_lambda0"
doc = "LAMBDA 0, whose FRAC box is not clamped at 0."
text = "OPTIM LAMBDA (1) AUTO RATIO 2"
error = "OPTIM LAMBDA (1): AUTO RATIO 2 gives the box [seed/2, seed*2], which needs a seed other than 0, and the seed is 0; the explicit bounds `OPTIM LAMBDA (1) 0 <high>` give it a box"

[[line_option.invalid]]
wrap = "root"
context = "lines_dm_embed_nonneg"
doc = "The amplitudes of a DM_Embed density under FORM NONNEG."
text = "OPTIM H.DENSITY.AMPLITUDES (1-2) AUTO RATIO 2"
error = "OPTIM H.DENSITY.AMPLITUDES (1): AUTO RATIO under FORM NONNEG of the DENSITY of DESCRIPTOR h needs every seed on the line > 0 (got 0); FRAC, the default, gives a box clamped at 0"

[[line_option.invalid]]
wrap = "root"
context = "lines_dm_embed_two"
doc = "The amplitudes of the second of two DM_Embed components."
text = "OPTIM G.DENSITY.AMPLITUDES (1-2) AUTO RATIO 2"
error = "OPTIM G.DENSITY.AMPLITUDES (1): AUTO RATIO under FORM NONNEG of the DENSITY of DESCRIPTOR g needs every seed on the line > 0 (got 0); FRAC, the default, gives a box clamped at 0"

[[line_option.invalid]]
wrap = "root"
context = "lines_ream"
text = "OPTIM AMPGRIDMB (1-2) AUTO RATIO 2"
error = "OPTIM AMPGRIDMB (1): AUTO RATIO under RHOFORM NONNEG needs every seed on the line > 0 (got 0.0); FRAC, the default, gives a box clamped at 0"

[[line_option]]
id = "OPTIM.AUTO.FRAC"
option = "FRAC"
lines = ["OPTIM.AUTO"]
synopsis = "FRAC <p>"
repeat = "error"
repeat_msg = "OPTIM {key}: AUTO FRAC is given twice on this line; each option is given once"
default = { text = "FRAC 0.5 for the keys that RATIO 2 does not apply to" }
doc = """\
The linear box x0 +/- d with d = max(p|x0|, a, r max|x0|), for p >= 0; \
FRAC 0 with FLOOR gives every value the half-width a."""

[[line_option.args]]
name = "p"
kind = "number"

[[line_option.checks]]
msg = "OPTIM {key}: AUTO FRAC must be >= 0 (got {tok}); FRAC 0 with FLOOR or GROUP_FLOOR gives a constant half-width"
doc = "p is negative."

[[line_option.checks]]
msg = "OPTIM {key} ({index}): AUTO FRAC gives a zero-width box (the seed {seed} times FRAC {value} is 0){hint}"
doc = "d is 0."

[[line_option.checks]]
msg = "OPTIM {key} ({index}): every seed on this line is 0, so AUTO FRAC gives a zero-width box, and GROUP_FLOOR {value}, a fraction of the largest seed on the line, adds nothing{hint}"
doc = "d is 0 with a GROUP_FLOOR, every value of the line being 0."

[[line_option.checks]]
msg = "OPTIM {key} ({index}): every seed on this line is 0, so the AUTO box has zero width (FRAC and the GROUP_FLOOR 1e-3 that {what} implies for {key} are relative to the seeds); AUTO FLOOR <a> with a > 0 gives the box [0, a], and the explicit bounds `OPTIM {key} ({index}) 0 <high>` the box [0, <high>]"
doc = "The same for a non-negative amplitude without FLOOR or GROUP_FLOOR; {what} is the RHOFORM line or the FORM of the DENSITY block of a DM_Embed component."

[[line_option.checks]]
