error = "Invalid number of arguments for --invar"

[[line_option.invalid]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E 1 1 --invar a 1 2"
error = "--invar takes <name> <value> (unexpected '2')"

[[line_option.invalid]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E 1 1 --invar maxtime 5"
error = "--invar maxtime: the variable maxtime is reserved for the script timeout HPO injects (timer timeout ${maxtime}); set --maxtime on this line or PC_SCRIPT_TIMEOUT instead"

[[line_option]]
id = "PC_LAMMPS.--outvar"
option = "--outvar"
lines = ["PC_LAMMPS", "PC_FAILPROBE"]
synopsis = "--outvar <name>"
repeat = "add"
doc = """\
An equal-style LAMMPS variable of the script that each evaluation \
records without a loss term. On a PC_FAILPROBE line the first --outvar \
is the probe value S."""

[[line_option.args]]
name = "name"
kind = "name"

[[line_option.checks]]
msg = "Invalid number of arguments for --outvar"
doc = "The option ends the line without its value."

[[line_option.examples]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E -5.0 1.0 --outvar S --outvar V"

[[line_option.invalid]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E 1 1 --outvar"
error = "Invalid number of arguments for --outvar"

[[line_option.invalid]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E 1 1 --outvar S T"
error = "--outvar takes a single value (unexpected 'T')"

[[line_option]]
id = "PC_LAMMPS.--failscore"
option = "--failscore"
lines = ["PC_LAMMPS", "PC_FAILPROBE"]
synopsis = "--failscore <value>"
repeat = "last_wins"
default = { text = "the FAILSCORE of the lines read before the line; the largest double without one" }
doc = """\
The value the variables of the line take when its script fails. On a \
PC_FAILPROBE line it is a positive number, and a probe value S at or \
above it marks a failed probe."""
long_doc = """\
On a PC_LAMMPS line the value goes through the loss function like a \
measured value, and the evaluation scores FAILSCORE all the same. Any \
finite number is accepted there."""

[[line_option.args]]
name = "value"
kind = "number"
what = "--failscore"

[[line_option.checks]]
msg = "Invalid number of arguments for --failscore"
doc = "The option ends the line without its value."

[[line_option.checks]]
msg = "PC_FAILPROBE --failscore must be a positive finite number, got '{tok}'{underflow}"
doc = "On a PC_FAILPROBE line."

[[line_option.examples]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E -5.0 1.0 --failscore -100"

[[line_option.invalid]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E 1 1 --failscore"
error = "Invalid number of arguments for --failscore"

[[line_option.invalid]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E 1 1 --failscore x"
error = "--failscore must be a finite number, got 'x'"

[[line_option.invalid]]
wrap = "root"
text = "PC_FAILPROBE --script lines_pc.in --outvar S --failscore 0"
error = "PC_FAILPROBE --failscore must be a positive finite number, got '0'"

[[line_option.invalid]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E 1 1 --failscore 3 7"
error = "--failscore takes a single value (unexpected '7')"

[[line_option.invalid]]
wrap = "root"
text = "PC_FAILPROBE --script lines_pc.in --outvar S --failscore 3 7"
error = "--failscore takes a single value (unexpected '7')"

[[line_option]]
id = "PC_LAMMPS.--maxtime"
option = "--maxtime"
lines = ["PC_LAMMPS", "PC_FAILPROBE"]
synopsis = "--maxtime <time>"
repeat = "last_wins"
default = { text = "the PC_SCRIPT_TIMEOUT (or MAXTIME) of the lines read before the line; off without one" }
doc = """\
The wall-clock limit of the script of the line: off, unlimited or a \
positive time [[HH:]MM:]SS. A script that reaches it stops and fails."""
long_doc = """\
The limit is set in LAMMPS with the timer timeout command after each \
clear command of the script, unless the script has a timer command of \
its own."""

[[line_option.args]]
name = "time"
kind = "timespec"
what = "--maxtime"

[[line_option.checks]]
msg = "Invalid number of arguments for --maxtime"
doc = "The option ends the line without its value."

[[line_option.examples]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E -5.0 1.0 --maxtime 1:30"

[[line_option.examples]]
doc = "No limit for the script of this line."
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E -5.0 1.0 --maxtime off"

[[line_option.invalid]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E 1 1 --maxtime"
error = "Invalid number of arguments for --maxtime"

[[line_option.invalid]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E 1 1 --maxtime x"
error = "--maxtime must be 'off', 'unlimited' or a time [[HH:]MM:]SS, got 'x'"

[[line_option.invalid]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E 1 1 --maxtime 0"
error = "--maxtime must be a positive time, 'off' or 'unlimited' (a limit <= 0 stops every script), got '0'"

[[line_option.invalid]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E 1 1 --maxtime 1e20"
error = "--maxtime is too large for the worker deadline, got '1e20' (the PC_ISOLATION PROCESS deadline max(3t, t + 120 s) is kept in 64-bit milliseconds: t must stay below about 3.07e15 s)"

[[line_option.invalid]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E 1 1 --maxtime 1:30 00"
error = "--maxtime takes a single value (unexpected '00')"

[[line_option]]
id = "PC_LAMMPS.--hotvar"
option = "--hotvar"
lines = ["PC_LAMMPS"]
synopsis = "--hotvar <name> <min> <max> [<initial>]"
repeat = "add"
doc = """\
A LAMMPS variable that the script computes and that other scripts read. A \
script that reads <name> (${<name>} or v_<name>) runs after this one and \
receives its value as the variable <name>; the other scripts run alongside \
it."""
long_doc = """\
A value outside [<min>, <max>] fails the evaluation. The script itself \
receives <name> too: the last value inside the range, else <initial>, \
else the midpoint of the range. A name is declared by one PC_LAMMPS \
line only."""

[[line_option.args]]
name = "name"
kind = "name"

[[line_option.args]]
name = "min"
kind = "number"
what = "--hotvar {name} <min>"

[[line_option.args]]
name = "max"
kind = "number"
what = "--hotvar {name} <max>"

[[line_option.args]]
name = "initial"
kind = "number"
optional = true
what = "--hotvar {name} <initial>"

[[line_option.checks]]
msg = "--hotvar requires <name> <min> <max> [<initial>]"
doc = "Fewer than three tokens follow the option."

[[line_option.checks]]
msg = "--hotvar: <name> must be a non-empty identifier"
doc = "The name starts with - and is not a number."

[[line_option.checks]]
msg = "--hotvar {name}: <max> must exceed <min>"
doc = "<max> is not greater than <min>."

[[line_option.checks]]
msg = "--hotvar takes <name> <min> <max> [<initial>] (unexpected '{tok}')"
doc = "At the line: a token after the initial value that is no option."
[[line_option.examples]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E -5.0 1.0 --hotvar a 1 2 --hotvar b -1 1 0"

[[line_option.invalid]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E 1 1 --hotvar a"
error = "--hotvar requires <name> <min> <max> [<initial>]"

[[line_option.invalid]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E 1 1 --hotvar -x 1 2"
error = "--hotvar: <name> must be a non-empty identifier"

[[line_option.invalid]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E 1 1 --hotvar a x 2"
error = "--hotvar a <min> must be a finite number, got 'x'"

[[line_option.invalid]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E 1 1 --hotvar a 2 1"
error = "--hotvar a: <max> must exceed <min>"

[[line_option.invalid]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E 1 1 --hotvar a 1 2 x"
error = "--hotvar a <initial> must be a finite number, got 'x'"

[[line_option.invalid]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E 1 1 --hotvar a 1 2 1.5 7"
error = "--hotvar takes <name> <min> <max> [<initial>] (unexpected '7')"

[[line_option]]
id = "PC_LAMMPS.--failvar"
option = "--failvar"
lines = ["PC_LAMMPS"]
synopsis = "--failvar <name> [<scale>]"
repeat = "add"
default = { text = "scale 1" }
doc = """\
An equal-style LAMMPS variable that measures how badly the script failed, \
under FAILSCORE_GRADING ON: 0 means the script succeeded, and a value > 0 \
marks it failed, so the evaluation scores a failure."""
long_doc = """\
Under FAILSCORE_GRADING ON, <scale> times the value grades the failure \
loss; the values of several --failvar options of one line add up. The \
variables of a failed script do not enter the loss."""
quirk = """\
Under FAILSCORE_GRADING OFF, the default, a value > 0 does not fail the \
script, and no warning says so: the variable needs only to be a finite \
number."""

[[line_option.args]]
name = "name"
kind = "name"

[[line_option.args]]
name = "scale"
kind = "positive"
noun = "number"
optional = true
what = "--failvar {name} <scale>"

[[line_option.checks]]
msg = "--failvar requires <name> [<scale>]"
doc = "The option ends the line without its name."

[[line_option.checks]]
msg = "--failvar: <name> must be a non-empty identifier"
doc = "The name starts with - and is not a number."

[[line_option.checks]]
msg = "--failvar takes <name> [<scale>] (unexpected '{tok}')"
doc = "At the line: a token after the scale that is no option."
[[line_option.examples]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E -5.0 1.0 --failvar V 0.5"

[[line_option.invalid]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E 1 1 --failvar"
error = "--failvar requires <name> [<scale>]"

[[line_option.invalid]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E 1 1 --failvar -x"
error = "--failvar: <name> must be a non-empty identifier"

[[line_option.invalid]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E 1 1 --failvar V 0"
error = "--failvar V <scale> must be a positive number, got '0'"

[[line_option.invalid]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E 1 1 --failvar V 0.5 7"
error = "--failvar takes <name> [<scale>] (unexpected '7')"

[[line_option.invalid]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E 1 1 --failvar W"
error = """\
PC_LAMMPS validation failed for script 'lines_pc.in'.
Tadah requires every --varloss/--outvar/--failvar variable to be defined in the LAMMPS script (or included files)
as an *equal-style* variable:
  variable <name> equal ...

Problems found:
  - W requested by --failvar but not defined
"""
msg_of = "ROOT.PC_LAMMPS"

[[line_option]]
id = "PC_LAMMPS.--ncpu"
option = "--ncpu"
