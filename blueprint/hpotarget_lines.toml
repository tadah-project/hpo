# ------------------------------------------------ the metric options ----

[[line_option]]
id = "PC_EMAE.--skip-above"
option = "--skip-above"
lines = ["PC_EMAE", "PC_ERMSE", "PC_ErRMSE", "PC_SRMSE_GPA", "PC_FRMSE"]
synopsis = "--skip-above <cap>"
repeat = "error"
repeat_msg = "{key}: repeated --skip-above"
default = { text = "no threshold" }
doc = """\
An evaluation whose metric exceeds <cap>, in the units of the metric, \
skips its PC_OBSERVABLE and PC_LAMMPS terms and scores FAILSCORE (a \
graded failure under FAILSCORE_GRADING ON)."""
long_doc = "On an indexed line the threshold applies to each dataset the line lists. PC_ERSQ, whose R squared is better when higher, refuses the option."

[[line_option.args]]
name = "cap"
kind = "positive"
noun = "number"
what = "{key} --skip-above"

[[line_option.checks]]
msg = "{key} --skip-above requires a positive number"
doc = "The option ends the line without its value."

[[line_option.examples]]
wrap = "root"
text = "PC_EMAE 5 1 --skip-above 50"

[[line_option.invalid]]
wrap = "root"
text = "PC_EMAE 5 1 --skip-above"
error = "PC_EMAE --skip-above requires a positive number"

[[line_option.invalid]]
wrap = "root"
text = "PC_EMAE 5 1 --skip-above 0"
error = "PC_EMAE --skip-above must be a positive number, got '0'"

[[line_option.invalid]]
wrap = "root"
text = "PC_FRMSE 0.1 1 --skip-above 2 --skip-above 3"
error = "PC_FRMSE: repeated --skip-above"

[[line_option]]
id = "PC_EMAE.--skip-rel"
option = "--skip-rel"
lines = ["PC_EMAE", "PC_ERMSE", "PC_ErRMSE", "PC_SRMSE_GPA", "PC_FRMSE"]
synopsis = "--skip-rel <ratio>"
repeat = "error"
repeat_msg = "{key}: repeated --skip-rel"
default = { text = "no threshold" }
doc = """\
An evaluation whose metric exceeds <ratio> times the smallest value of \
the metric so far skips its PC_OBSERVABLE and PC_LAMMPS terms and scores \
FAILSCORE (a graded failure under FAILSCORE_GRADING ON)."""
long_doc = """\
The threshold acts once a finite value of the metric has been seen; on \
an indexed line it applies to each dataset the line lists. PC_ERSQ, whose \
R squared is better when higher, refuses the option. \
Two evaluations of one point can therefore score differently, so a \
search does not answer a repeated point from the record of the run."""

[[line_option.args]]
name = "ratio"
kind = "positive"
noun = "number"
what = "{key} --skip-rel"

[[line_option.checks]]
msg = "{key} --skip-rel requires a positive number"
doc = "The option ends the line without its value."

[[line_option.examples]]
wrap = "root"
text = "PC_ErRMSE 1 1 --skip-rel 2"

[[line_option.invalid]]
wrap = "root"
text = "PC_EMAE 5 1 --skip-rel"
error = "PC_EMAE --skip-rel requires a positive number"

[[line_option.invalid]]
wrap = "root"
text = "PC_EMAE 5 1 --skip-rel x"
error = "PC_EMAE --skip-rel must be a positive number, got 'x'"

[[line_option.invalid]]
wrap = "root"
text = "PC_EMAE 5 1 --skip-rel 2 --skip-rel 3"
error = "PC_EMAE: repeated --skip-rel"

# ====================================================== PC_LAMMPS =======

[[key]]
id = "ROOT.PC_LAMMPS"
name = "PC_LAMMPS"
blocks = ["ROOT"]
synopsis = "PC_LAMMPS --script <file> --varloss <name> <target> <weight> [<loss> [<param>]] [<option> ...] [<LAMMPS option> ...]"
repeat = "add"
doc = """\
A LAMMPS script that each evaluation runs with the candidate potential, \
and the loss terms it contributes: each --varloss compares a LAMMPS \
variable of the script with a target."""
long_doc = """\
The line takes the options of this page, which start with --, and LAMMPS \
command-line options, which start with a single - and go to LAMMPS with \
the values that follow them. A token that is neither an option nor a value \
of one is refused. The scripts run with -screen none and -log none unless \
the line gives -screen or -log, or their short forms -sc and -l. When the \
line is read, the script is read \
with the files its include commands name, and every --varloss, --outvar \
and --failvar variable must be an equal-style variable of it. LAMMPS then \
starts once with the line's command-line options, and an option LAMMPS \
refuses is an error at the line, with the LAMMPS message. A script or \
include file that does not exist is an error naming its absolute path. The \
variable maxtime is reserved for the script timeout: neither --invar nor \
the LAMMPS option -var (-v) may set it. A script with a quit command, or \
an if command that runs one, is refused: quit ends the process that runs \
the script. A variable the line defines with --invar, -var or -v is no \
--hotvar of the line, nor, on a line without --hotvar, of another line \
when the script reads it: the run injects such a --hotvar into the script \
as an equal-style variable, which LAMMPS refuses for a variable of another \
style. A script with a --hotvar is injected its own hot values only."""
quirk = """\
The line takes the FAILSCORE, the PC_SCRIPT_TIMEOUT (or MAXTIME) and the \
LOSS of the lines read before it, for the defaults of its --failscore, \
--maxtime and --varloss loss function: those lines written after it do not \
change them."""
untested = [
  { msg = "Circular include detected at: {file}", why = "The message names the absolute path of the script, which differs from run to run." },
  { msg = "Missing file name in include statement ({file})", why = "The message names the absolute path of the script, which differs from run to run." },
]

[[key.args]]
name = "option"
kind = "tokens"
optional = true
repeat = true
doc = "An option of the line, which starts with --, with its values."

[[key.args]]
name = "LAMMPS option"
kind = "tokens"
optional = true
repeat = true
doc = "A LAMMPS command-line option, which starts with a single -, with the values that follow it."

[[key.checks]]
msg = "{key} {option} maxtime: the variable maxtime is reserved: tadah hpo passes the script's time limit to LAMMPS in it, for `timer timeout ${maxtime}`; --maxtime on this line or PC_SCRIPT_TIMEOUT sets the limit"
doc = "The LAMMPS command-line option -var, or -v, sets the variable maxtime; {key} is PC_LAMMPS or PC_FAILPROBE, and {option} the option as written."

[[key.checks]]
msg = "LAMMPS include file not found: {file}"
doc = """\
The script, or a file an include command of it names, does not exist; \
{file} is its absolute path. A relative path of an include command is \
taken against the directory of the including file, that of the script \
against the working directory."""

[[key.checks]]
msg = "Circular include detected at: {file}"
doc = """\
A file includes itself, directly or through other files; {file} is its \
absolute path."""

[[key.checks]]
msg = "Missing file name in include statement ({file})"
doc = """\
An include command of the file {file}, by its absolute path, has no file \
name after it."""

[[key.checks]]
msg = "{key}: the script {script} has no command: every line of it, and of the files it includes, is blank or a comment"
doc = "The script, with its include files, has no command: every line is blank or a comment; {key} is PC_LAMMPS or PC_FAILPROBE."

[[key.checks]]
msg = "{key}: LAMMPS cannot start with this line's command-line options: {why}"
doc = """\
LAMMPS refuses a command-line option of the line, such as a misspelt \
one; {key} is PC_LAMMPS or PC_FAILPROBE, and {why} the message of LAMMPS, \
or "no reason given"."""

[[key.checks]]
msg = "{key}: the line has no --script option; --script <file> names the LAMMPS script the line runs"
doc = "At the line: no --script option; {key} is PC_LAMMPS or PC_FAILPROBE."

[[key.checks]]
msg = "PC_LAMMPS: the line has no --varloss option; a PC_LAMMPS line gives at least one --varloss <name> <target> <weight>, a loss term (--outvar records a value without one)"
doc = "At the line: no --varloss option (a line that only records --outvar values)."

[[key.checks]]
msg = "PC_LAMMPS validation failed for script '{script}'.\nTadah requires every --varloss/--outvar/--failvar variable to be defined in the LAMMPS script (or included files)\nas an *equal-style* variable:\n  variable <name> equal ...\n\nProblems found:\n{list}"
doc = "At the line: a --varloss, --outvar or --failvar variable that the script and the files it includes do not define as an equal-style variable; {list} has a line for each."

[[key.checks]]
msg = "{key}: unexpected '{tok}': every word after {key} is an option or a value of one (the options of {key} start with --, LAMMPS command-line options with -)"
doc = "At the line: a token that is neither an option nor a value of one; {key} is PC_LAMMPS or PC_FAILPROBE."

[[key.checks]]
msg = "{key}: unknown option '{option}'{note}: a {key} line takes the options {list}, and LAMMPS command-line options, which start with a single '-'"
doc = "At the line: an option that starts with -- and is none of the line's; {note} names the option meant, or the other line it belongs to."

[[key.checks]]
msg = "{key}: the script {script} has a quit command, command {index} of the script with its include files read in ({text}): quit ends the process that runs the script (tadah hpo itself under PC_ISOLATION THREAD)"
doc = "At the line: a command of the script, or of an if command of it, is quit; {key} is PC_LAMMPS or PC_FAILPROBE."

[[key.checks]]
msg = "PC_LAMMPS: the script {script} reads {name}, the --hotvar of line {line}, and this line defines {name} ({option} {name}): the run injects `variable {name} equal <value>` into the script, which LAMMPS refuses for a variable of another style"
doc = "At a PC_LAMMPS line without --hotvar, when the file is read: its --invar, -var or -v defines a variable that its script reads and that another line declares with --hotvar."
[[key.examples]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E -5.0 1.0"

[[key.examples]]
wrap = "root"
doc = "Every option of the line, and a LAMMPS command-line option; the scale of --failvar grades a failure under FAILSCORE_GRADING ON."
text = '''
FAILSCORE 1e9
FAILSCORE_GRADING ON
PC_LAMMPS --script lines_pc.in --varloss E -5.0 1.0 HUBER 2 \
  --outvar S --invar b 1 --maxtime 1:30 --failscore -3 \
  --hotvar a 1 2 1.5 --failvar V 2 -nocite'''

[[key.examples]]
wrap = "root"
doc = "Two lines run two scripts."
text = '''
PC_LAMMPS --script lines_pc.in --varloss E -5.0 1.0
PC_LAMMPS --script lines_pc2.in --varloss E2 2.0 0.5'''

[[key.invalid]]
wrap = "root"
text = "PC_LAMMPS --varloss E 1 1"
error = "PC_LAMMPS: the line has no --script option; --script <file> names the LAMMPS script the line runs"

[[key.invalid]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in"
error = "PC_LAMMPS: the line has no --varloss option; a PC_LAMMPS line gives at least one --varloss <name> <target> <weight>, a loss term (--outvar records a value without one)"

[[key.invalid]]
