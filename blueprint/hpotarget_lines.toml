error = "tadah hpo: PC_FRMSE on the validation set: no dataset has a structure with forces (lines_no_forces.db): every structure has force weight 0 (fweight), so the force metrics have nothing to measure"

[[key.invalid]]
wrap = "none"
check = "check"
context = "lines_val_forces_none"
at = "none"
doc = "The second validation dataset has force weight 0 in every structure, and an indexed line gives it a weight above 0."
text = '''
