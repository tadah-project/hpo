[[key]]
id = "ROOT.PC_FRMSE"
name = "PC_FRMSE"
blocks = ["ROOT"]
synopsis = "PC_FRMSE [(<indices>)] <target> <weight> [--skip-above <cap>] [--skip-rel <ratio>]"
repeat = "add"
repeat_doc = "A line without indices is given once, and not with indexed lines; each indexed line adds the datasets it lists, each dataset once."
doc = """\
A loss term on the force RMSE of the validation datasets, in eV/Å. \
Without an index list the term is the LOSS function of the metric \
averaged over the datasets; with one, each line sets the target and \
weight of the datasets it lists, and the term is the average of their \
losses."""
long_doc = """\
The indices count the DBFILE entries of the validation configuration \
from 1. A file has either one line without indices or indexed lines \
that give each dataset one target and weight; when the run starts, \
every dataset needs one, and no index may exceed the number of \
datasets. The weight is a number >= 0. A dataset whose structures all \
have force priority 0 is not measured: the average leaves it out, and \
hpo_run.log names it; an indexed line that gives it a weight above 0 is \
refused. A run in which no validation dataset has forces is refused."""
untested = [
  { msg = "{key} requires validation DBFILE entries", why = "Needs a validation configuration without DBFILE; in tadah hpo --check the training configuration of a case is also its validation configuration, and its own checks come first." },
]

[[key.args]]
name = "indices"
kind = "indices"
optional = true
doc = "The validation datasets the line sets, counted from 1."

[[key.args]]
