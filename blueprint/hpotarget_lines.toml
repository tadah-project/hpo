MAXEVAL 10
ENDOPTIMIZER'''
error = "tadah hpo: PC_FRMSE (2) gives weight 0.5 to validation dataset 2 (lines_no_forces.db), which has no structure with forces: every one has force weight 0 (fweight). Only weight 0 is accepted for it (or the validation set without the file)"

[[key]]
id = "ROOT.PC_LAMMPS"
name = "PC_LAMMPS"
blocks = ["ROOT"]
synopsis = "PC_LAMMPS --script <file> --varloss <name> <target> <weight> [<loss> [<param>]] [<option> ...] [<LAMMPS option> ...]"
repeat = "add"
doc = """\
A LAMMPS script that each evaluation runs with the candidate potential, \
and the loss terms it contributes: each --varloss compares a LAMMPS \
variable of the script with a target."""
long_doc = """\
The line takes the options of this page, which start with --, and LAMMPS \
command-line options, which start with a single - and go to LAMMPS with \
the values that follow them. A token that is neither an option nor a value \
of one is refused. The scripts run with -screen none and -log none unless \
the line gives -screen or -log. When the line is read, the script is read \
with the files its include commands name, and every --varloss, --outvar \
and --failvar variable must be an equal-style variable of it. LAMMPS then \
starts once with the line's command-line options, and an option LAMMPS \
refuses is an error at the line, with the LAMMPS message. A script or \
include file that does not exist is an error naming its absolute path. The \
variable maxtime is reserved for the script timeout: neither --invar nor \
the LAMMPS option -var (-v) may set it."""
quirk = """\
The line takes the FAILSCORE, the PC_SCRIPT_TIMEOUT (or MAXTIME) and the \
LOSS of the lines read before it, for the defaults of its --failscore, \
--maxtime and --varloss loss function: those lines written after it do not \
change them. The short forms -sc and -l of -screen and -log are not \
recognised: the line still gets -screen none or -log none, which replaces \
them."""
untested = [
  { msg = "Circular include detected at: {file}", why = "The message names the absolute path of the script, which differs from run to run." },
  { msg = "Missing file name in include statement ({file})", why = "The message names the absolute path of the script, which differs from run to run." },
]

[[key.args]]
name = "option"
kind = "tokens"
optional = true
repeat = true
doc = "An option of the line, which starts with --, with its values."

[[key.args]]
name = "LAMMPS option"
kind = "tokens"
optional = true
repeat = true
doc = "A LAMMPS command-line option, which starts with a single -, with the values that follow it."

[[key.checks]]
msg = "{option} maxtime: the variable maxtime is reserved for the script timeout HPO injects (timer timeout ${maxtime}); set --maxtime on this line or PC_SCRIPT_TIMEOUT instead"
doc = "The LAMMPS command-line option -var, or -v, sets the variable maxtime; {option} is the option as written."

[[key.checks]]
msg = "LAMMPS include file not found: {file}"
doc = """\
The script, or a file an include command of it names, does not exist; \
{file} is its absolute path. A relative path of an include command is \
taken against the directory of the including file, that of the script \
against the working directory."""

[[key.checks]]
msg = "Circular include detected at: {file}"
doc = """\
A file includes itself, directly or through other files; {file} is its \
absolute path."""

[[key.checks]]
msg = "Missing file name in include statement ({file})"
doc = """\
An include command of the file {file}, by its absolute path, has no file \
name after it."""

[[key.checks]]
msg = "LammpsSim: script_lines is empty.\n"
doc = "The script, with its include files, has no command: every line is blank or a comment."

[[key.checks]]
msg = "{key}: LAMMPS cannot start with this line's command-line options: {why}"
doc = """\
LAMMPS refuses a command-line option of the line, such as a misspelt \
one; {key} is PC_LAMMPS or PC_FAILPROBE, and {why} the message of LAMMPS, \
or "no reason given"."""

[[key.checks]]
msg = "LammpsSim object must have a script specified.\n"
doc = "At the line: no --script option."

[[key.checks]]
msg = "LammpsSim: --varloss variable is not defined.\n"
doc = "At the line: a --varloss without the name of its variable."

[[key.checks]]
msg = "PC_LAMMPS validation failed for script '{script}'.\nTadah requires every --varloss/--outvar/--failvar variable to be defined in the LAMMPS script (or included files)\nas an *equal-style* variable:\n  variable <name> equal ...\n\nProblems found:\n{list}"
doc = "At the line: a --varloss, --outvar or --failvar variable that the script and the files it includes do not define as an equal-style variable; {list} has a line for each."

[[key.checks]]
msg = "unexpected '{tok}': a PC_LAMMPS token is an option or a value of one (HPO options start with --, LAMMPS command-line options with -)"
doc = "At the line: a token that is neither an option nor a value of one."

[[key.checks]]
msg = "{key}: unknown option '{option}'{note}: HPO's options are {list}; LAMMPS command-line options start with a single '-'"
doc = "At the line: an option that starts with -- and is none of the line's; {note} names the option meant, or the other line it belongs to."
[[key.examples]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E -5.0 1.0"

[[key.examples]]
wrap = "root"
doc = "Every option of the line, and a LAMMPS command-line option."
text = '''
PC_LAMMPS --script lines_pc.in --varloss E -5.0 1.0 HUBER 2 \
  --outvar S --invar a 1 --maxtime 1:30 --failscore -3 \
  --hotvar a 1 2 1.5 --failvar V 2 -nocite'''

[[key.examples]]
wrap = "root"
doc = "Two lines run two scripts."
text = '''
PC_LAMMPS --script lines_pc.in --varloss E -5.0 1.0
PC_LAMMPS --script lines_pc2.in --varloss E2 2.0 0.5'''

[[key.invalid]]
wrap = "root"
text = "PC_LAMMPS --varloss E 1 1"
error = "LammpsSim object must have a script specified.\n"

[[key.invalid]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in"
error = "LammpsSim: --varloss variable is not defined.\n"

[[key.invalid]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss Q 1 1 --outvar T"
error = """\
PC_LAMMPS validation failed for script 'lines_pc.in'.
Tadah requires every --varloss/--outvar/--failvar variable to be defined in the LAMMPS script (or included files)
as an *equal-style* variable:
  variable <name> equal ...

Problems found:
  - Q requested by --varloss but not defined
  - T requested by --outvar but defined as style 'string' (logical command #4 in expanded script)
"""

[[key.invalid]]
wrap = "root"
text = "PC_LAMMPS stray --script lines_pc.in --varloss E 1 1"
error = "unexpected 'stray': a PC_LAMMPS token is an option or a value of one (HPO options start with --, LAMMPS command-line options with -)"

[[key.invalid]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E 1 1 --hotvars a 1 2"
error = "PC_LAMMPS: unknown option '--hotvars' (did you mean '--hotvar'?): HPO's options are --script, --varloss, --invar, --outvar, --failscore, --maxtime, --hotvar and --failvar; LAMMPS command-line options start with a single '-'"

[[key.invalid]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E 1 1 -var maxtime 5"
error = "-var maxtime: the variable maxtime is reserved for the script timeout HPO injects (timer timeout ${maxtime}); set --maxtime on this line or PC_SCRIPT_TIMEOUT instead"

[[key.invalid]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E 1 1 -v maxtime 5"
error = "-v maxtime: the variable maxtime is reserved for the script timeout HPO injects (timer timeout ${maxtime}); set --maxtime on this line or PC_SCRIPT_TIMEOUT instead"

[[key.invalid]]
wrap = "root"
doc = "A script path that does not exist."
text = "PC_LAMMPS --script /missing/run.in --varloss E 1 1"
error = "LAMMPS include file not found: /missing/run.in"

[[key.invalid]]
wrap = "root"
doc = "A script with comments only."
text = "PC_LAMMPS --script lines_empty.in --varloss E 1 1"
error = "LammpsSim: script_lines is empty.\n"

[[key.invalid]]
wrap = "root"
doc = "-sff, a misspelt LAMMPS option."
text = "PC_LAMMPS --script lines_pc.in --varloss E 1 1 -sff 3"
error = "PC_LAMMPS: LAMMPS cannot start with this line's command-line options: ERROR: Invalid command-line argument: -sff (src/lammps.cpp:490)"

[[key.invalid]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E 1 1 --gate 4"
error = "PC_LAMMPS: unknown option '--gate' (a PC_FAILPROBE option): HPO's options are --script, --varloss, --invar, --outvar, --failscore, --maxtime, --hotvar and --failvar; LAMMPS command-line options start with a single '-'"

[[key.invalid]]
wrap = "strategy"
text = "PC_LAMMPS --script lines_pc.in --varloss E 1 1"
error = "unknown key 'PC_LAMMPS' inside STRATEGY block"

[[line_option]]
id = "PC_LAMMPS.--script"
option = "--script"
lines = ["PC_LAMMPS", "PC_FAILPROBE"]
synopsis = "--script <file>"
repeat = "last_wins"
doc = """\
The LAMMPS script of the line, a path relative to the working directory \
of the run. The line requires it."""
long_doc = """\
An include command of the script is replaced by the file it names, a \
path relative to the directory of the including file."""

[[line_option.args]]
name = "file"
kind = "name"

[[line_option.checks]]
msg = "Invalid number of arguments for --script"
doc = "The option ends the line without its value."

[[line_option.examples]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E -5.0 1.0"

[[line_option.invalid]]
wrap = "root"
text = "PC_LAMMPS --varloss E 1 1 --script"
error = "Invalid number of arguments for --script"

[[line_option.invalid]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in lines_pc2.in --varloss E 1 1"
error = "--script takes a single value (unexpected 'lines_pc2.in')"

[[line_option]]
id = "PC_LAMMPS.--varloss"
option = "--varloss"
lines = ["PC_LAMMPS"]
synopsis = "--varloss <name> <target> <weight> [<loss> [<param>]]"
repeat = "add"
doc = """\
A loss term: the equal-style LAMMPS variable <name> of the script, \
compared with <target> by the loss function, with the weight <weight>. \
A PC_LAMMPS line has one or more."""
long_doc = """\
The weight is any finite number; a negative one is accepted. The loss \
function is the LOSS of the lines read before the PC_LAMMPS line (L2 \
without one) unless <loss> names one, with its parameter for HUBER and \
TUKEY. A value that starts with - and reads as a number (-5.0) is a \
value, not an option."""

[[line_option.args]]
name = "name"
kind = "name"

[[line_option.args]]
name = "target"
kind = "number"
what = "--varloss {name} <target>"

[[line_option.args]]
name = "weight"
kind = "number"
what = "--varloss {name} <weight>"
doc = "The weight of the term. The loss of an evaluation is the mean of its terms, so a term of weight 0 adds 0 and still counts in the mean."

[[line_option.args]]
name = "loss"
kind = "loss"
optional = true
doc = "A loss function of LOSS, in any case, and its parameter."

[[line_option.checks]]
msg = "--varloss: missing <name>"
doc = "No variable name follows the option."

[[line_option.checks]]
msg = "--varloss {name}: missing <target>"
doc = "No target follows the name."

[[line_option.checks]]
msg = "--varloss {name}: missing <weight>"
doc = "No weight follows the target."

[[line_option.checks]]
msg = "--varloss {name} {kind} parameter must be a finite number, got '{tok}'{underflow}"
doc = "A parameter of the loss function {kind}, as written, is not a number."

[[line_option.examples]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E -5.0 1.0 --varloss S 0 -0.5 L1"

[[line_option.examples]]
doc = "A loss function of its own for this term, TUKEY with the parameter 2, in lower case."
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E -5.0 1.0 tukey 2"

[[line_option.invalid]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss"
error = "--varloss: missing <name>"

[[line_option.invalid]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E"
error = "--varloss E: missing <target>"

[[line_option.invalid]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E 1"
error = "--varloss E: missing <weight>"

[[line_option.invalid]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E x 1"
error = "--varloss E <target> must be a finite number, got 'x'"

[[line_option.invalid]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E 1 x"
error = "--varloss E <weight> must be a finite number, got 'x'"

[[line_option.invalid]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E 1 1 FOO"
error = "LossFunction::from_string: unknown type 'FOO'"
msg_of = "ROOT.LOSS"

[[line_option.invalid]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E 1 1 HUBER x"
error = "--varloss E HUBER parameter must be a finite number, got 'x'"

[[line_option.invalid]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E 1 1 HUBER 0"
error = "loss HUBER parameter (delta) must be finite and > 0 (got 0); omit it to use the default 50"
msg_of = "ROOT.LOSS"

[[line_option.invalid]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E 1 1 L2 3"
error = "loss L2 takes no parameter (got 1)"
msg_of = "ROOT.LOSS"

[[line_option]]
id = "PC_LAMMPS.--invar"
option = "--invar"
lines = ["PC_LAMMPS", "PC_FAILPROBE"]
synopsis = "--invar <name> <value>"
repeat = "add"
doc = """\
Defines the LAMMPS variable <name> with the value <value> for the \
script, as the LAMMPS command-line option -var does."""
long_doc = "The variable maxtime is reserved for the script timeout."

[[line_option.args]]
name = "name"
kind = "name"

[[line_option.args]]
name = "value"
kind = "name"

[[line_option.checks]]
msg = "Invalid number of arguments for --invar"
doc = "Fewer than two tokens follow the option."

[[line_option.checks]]
msg = "--invar maxtime: the variable maxtime is reserved for the script timeout HPO injects (timer timeout ${maxtime}); set --maxtime on this line or PC_SCRIPT_TIMEOUT instead"
doc = "The variable is maxtime."

[[line_option.checks]]
msg = "--invar takes <name> <value> (unexpected '{tok}')"
doc = "At the line: a token after the value that is no option."
[[line_option.examples]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E -5.0 1.0 --invar a 1 --invar b 2"

[[line_option.invalid]]
wrap = "root"
