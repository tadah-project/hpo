[[line_option]]
id = "OPTIM.LIN"
option = "LIN"
lines = ["OPTIM"]
synopsis = "LIN"
repeat = "error"
repeat_msg = "OPTIM {key}: unexpected token(s) '{text}' -- the grammar is OPTIM <KEY> (indices) <low> <high> [LIN | LOG | ASINH <c>] or OPTIM <KEY> (indices) AUTO [RATIO <f> | FRAC <p>] [FLOOR <a>] [GROUP_FLOOR <r>] [LIN | LOG | ASINH <c>]"
default = { text = "LIN, unless LOG_HP log-scales the box" }
doc = "The optimiser searches the value itself, under LOG_HP too; the tag is the last token of the line."

[[line_option.examples]]
wrap = "root"
text = "OPTIM CGRID2B (2) 1.5 2.5 LIN"

[[line_option.invalid]]
wrap = "root"
text = "OPTIM CGRID2B (2) 1.5 2.5 LIN LIN"
error = "OPTIM CGRID2B: unexpected token(s) '1.5 2.5 LIN' -- the grammar is OPTIM <KEY> (indices) <low> <high> [LIN | LOG | ASINH <c>] or OPTIM <KEY> (indices) AUTO [RATIO <f> | FRAC <p>] [FLOOR <a>] [GROUP_FLOOR <r>] [LIN | LOG | ASINH <c>]"

[[line_option.invalid]]
wrap = "root"
doc = "On an AUTO box the first of two tags is read as an AUTO option."
msg_of = "OPTIM.AUTO"
text = "OPTIM CGRID2B (2) AUTO LIN LOG"
error = "OPTIM CGRID2B: 'LIN' is not an AUTO option (RATIO, FRAC, FLOOR or GROUP_FLOOR) -- the grammar is OPTIM <KEY> (indices) <low> <high> [LIN | LOG | ASINH <c>] or OPTIM <KEY> (indices) AUTO [RATIO <f> | FRAC <p>] [FLOOR <a>] [GROUP_FLOOR <r>] [LIN | LOG | ASINH <c>]"

[[line_option]]
id = "OPTIM.LOG"
option = "LOG"
lines = ["OPTIM"]
synopsis = "LOG"
repeat = "error"
repeat_msg = "OPTIM {key}: unexpected token(s) '{text}' -- the grammar is OPTIM <KEY> (indices) <low> <high> [LIN | LOG | ASINH <c>] or OPTIM <KEY> (indices) AUTO [RATIO <f> | FRAC <p>] [FLOOR <a>] [GROUP_FLOOR <r>] [LIN | LOG | ASINH <c>]"
doc = "The optimiser searches the logarithm of the value; the box is above 0."

[[line_option.checks]]
msg = "OPTIM {key}: the line is tagged LOG, and <low> {low} is not > 0, and a box tagged LOG lies above 0{hint}"
doc = """\
An explicit box reaches 0 or below; {hint} says that a line without the \
tag takes the box when the line's checks of every index take it."""

[[line_option.examples]]
wrap = "root"
text = "OPTIM CGRID2B (2) 1.5 2.5 LOG"

[[line_option.invalid]]
wrap = "root"
text = "OPTIM CGRID2B (2) 0 2.5 LOG"
error = "OPTIM CGRID2B: the line is tagged LOG, and <low> 0 is not > 0, and a box tagged LOG lies above 0; a line without a tag, or tagged LIN or ASINH <c>, takes this box"

[[line_option.invalid]]
wrap = "root"
doc = "Two tags: the first is left over."
text = "OPTIM CGRID2B (2) 1.5 2.5 LIN LOG"
error = "OPTIM CGRID2B: unexpected token(s) '1.5 2.5 LIN' -- the grammar is OPTIM <KEY> (indices) <low> <high> [LIN | LOG | ASINH <c>] or OPTIM <KEY> (indices) AUTO [RATIO <f> | FRAC <p>] [FLOOR <a>] [GROUP_FLOOR <r>] [LIN | LOG | ASINH <c>]"

[[line_option]]
id = "OPTIM.ASINH"
option = "ASINH"
lines = ["OPTIM"]
synopsis = "ASINH <c>"
repeat = "error"
repeat_msg = "OPTIM {key}: unexpected token(s) '{text}' -- the grammar is OPTIM <KEY> (indices) <low> <high> [LIN | LOG | ASINH <c>] or OPTIM <KEY> (indices) AUTO [RATIO <f> | FRAC <p>] [FLOOR <a>] [GROUP_FLOOR <r>] [LIN | LOG | ASINH <c>]"
doc = """\
The optimiser searches asinh(x/c), for a box that crosses 0: linear \
within about c of 0 and logarithmic beyond; c > 0."""

[[line_option.args]]
name = "c"
kind = "number"
msg = "OPTIM {key}: ASINH <c> must be a finite number (got '{tok}'){underflow}"

[[line_option.checks]]
msg = "OPTIM {key}: ASINH needs one argument <c> (the linear scale)"
doc = "ASINH is the last token of the line."

[[line_option.checks]]
msg = "OPTIM {key}: ASINH requires a positive linear scale c (got {tok})"
doc = "c is 0 or below."

[[line_option.examples]]
wrap = "root"
text = "OPTIM CGRID2B (2) -1 2.5 asinh 0.5"

[[line_option.invalid]]
wrap = "root"
text = "OPTIM CGRID2B (2) 1 2.5 ASINH"
error = "OPTIM CGRID2B: ASINH needs one argument <c> (the linear scale)"

[[line_option.invalid]]
wrap = "root"
text = "OPTIM CGRID2B (2) 1 2.5 ASINH x"
error = "OPTIM CGRID2B: ASINH <c> must be a finite number (got 'x')"

[[line_option.invalid]]
wrap = "root"
text = "OPTIM CGRID2B (2) 1 2.5 ASINH -1"
error = "OPTIM CGRID2B: ASINH requires a positive linear scale c (got -1)"

[[line_option.invalid]]
wrap = "root"
text = "OPTIM CGRID2B (2) -1 2.5 ASINH 0.5 ASINH 1"
error = "OPTIM CGRID2B: unexpected token(s) '-1 2.5 ASINH 0.5' -- the grammar is OPTIM <KEY> (indices) <low> <high> [LIN | LOG | ASINH <c>] or OPTIM <KEY> (indices) AUTO [RATIO <f> | FRAC <p>] [FLOOR <a>] [GROUP_FLOOR <r>] [LIN | LOG | ASINH <c>]"

