# Part of the target-file registry (hpotarget.toml lists it in meta.parts):
# the top-level lines with options of their own.
#
# This file holds the per-metric lines (PC_EMAE, PC_ERMSE, PC_ErRMSE,
# PC_ERSQ, PC_SRMSE_GPA, PC_FRMSE) and their options, the PC_LAMMPS and
# PC_FAILPROBE lines and their options, the PC_OBSERVABLE line with its
# observable kinds and their options, the LOSS line and the loss
# functions, and the OPTIM line: its forms, its AUTO options and shape
# tags, and the search targets it refuses; the rules that relate these
# lines to each other and to the optimiser. The tables and fields are
# those of blueprint/README.md ("The target-file registry").
#
# The wrappers, training configurations and fixture files defined here
# start with lines_; the examples also use those of hpotarget.toml.

# ============================================================ metrics ====
# PC_<METRIC> [(indices)] <target> <weight> [--skip-above <cap>]
#             [--skip-rel <ratio>]

[[key]]
id = "ROOT.PC_EMAE"
name = "PC_EMAE"
blocks = ["ROOT"]
synopsis = "PC_EMAE <target> <weight> [--skip-above <cap>] [--skip-rel <ratio>]"
repeat = "error"
repeat_msg = "PC_EMAE: repeated declaration (first declared on line {first_line})"
doc = """\
A loss term on the energy MAE of the validation datasets, in meV/atom: \
the LOSS function of the metric averaged over the datasets, its target \
and its weight."""
long_doc = """\
The term needs a validation configuration (--validation). The weight is a \
number >= 0. With a weight of 0 the term is 0 but still counts in the mean \
of the terms of an evaluation, and --skip-above and --skip-rel still apply \
to the metric. A structure with energy priority 0 (eweight) is left out of \
the metric. A dataset whose structures all have energy priority 0 is not \
measured: the average leaves it out, and hpo_run.log names it. A run in \
which no validation dataset has an energy is refused."""
checks = [
  { msg = "tadah hpo: {keys} on the validation set: no dataset has a structure with an energy ({list}): every structure has energy priority 0 (eweight), so the energy metrics have nothing to measure", doc = "When the run starts, once the validation data are read, without a line: no validation structure has an energy to measure; {keys} names the energy metrics of the file, {list} the files." },
  { msg = "{key} requires <target> <weight>", doc = "At the line: fewer than two values follow the key and its index list." },
  { msg = "{key}: unknown flag '{tok}'", doc = "At the line: a token after the weight that is no option of the metric lines." },
  { msg = "{key}: indexed targets are supported only for PC_ERMSE, PC_FRMSE and PC_SRMSE_GPA", doc = "At the line: an index list, which only PC_ERMSE, PC_FRMSE and PC_SRMSE_GPA take." },
]

[[key.args]]
name = "target"
kind = "number"
what = "{key} <target>"
doc = "The value of the metric the search aims at."

[[key.args]]
name = "weight"
kind = "number"
min = 0
what = "{key} <weight>"
msg = "{key} <weight> must be a number >= 0, got '{tok}'"
doc = "The weight of the term. The loss of an evaluation is the mean of its terms, so a term of weight 0 adds 0 and still counts in the mean."

[[key.examples]]
wrap = "root"
text = "PC_EMAE 5 1"

[[key.examples]]
doc = "With both options that skip the rest of an evaluation whose metric is too large."
wrap = "root"
text = "PC_EMAE 5 1 --skip-above 50 --skip-rel 3"

[[key.invalid]]
wrap = "root"
text = "PC_EMAE 5"
error = "PC_EMAE requires <target> <weight>"

[[key.invalid]]
wrap = "root"
text = "PC_EMAE x 1"
error = "PC_EMAE <target> must be a finite number, got 'x'"

[[key.invalid]]
wrap = "root"
text = "PC_EMAE 5 1e-400"
error = "PC_EMAE <weight> must be a finite number, got '1e-400' (too small: its magnitude is below the smallest normal double, 2.2250738585072014e-308)"

[[key.invalid]]
wrap = "root"
text = "PC_EMAE 5 -1"
error = "PC_EMAE <weight> must be a number >= 0, got '-1'"

[[key.invalid]]
wrap = "root"
text = "PC_EMAE (1) 5 1"
error = "PC_EMAE: indexed targets are supported only for PC_ERMSE, PC_FRMSE and PC_SRMSE_GPA"

[[key.invalid]]
wrap = "root"
text = "PC_EMAE 5 1 --skip 3"
error = "PC_EMAE: unknown flag '--skip'"

[[key.invalid]]
wrap = "optimizer"
text = "PC_EMAE 5 1"
error = "PC_EMAE is a top-level key, and the OPTIMIZER block opened on line 3 is still open (ENDOPTIMIZER closes it)"
doc = "A metric line is a top-level key."

[[key.invalid]]
wrap = "none"
check = "check"
context = "lines_val_no_energy"
at = "none"
doc = "The validation dataset has energy priority 0 in every structure."
text = '''
PC_EMAE 5 1
OPTIM CGRID2B (1) 0.5 1.5
OPTIMIZER
LIB NLOPT
ALGO LN_SBPLX
MAXEVAL 10
ENDOPTIMIZER'''
error = "tadah hpo: PC_EMAE on the validation set: no dataset has a structure with an energy (lines_no_energy.db): every structure has energy priority 0 (eweight), so the energy metrics have nothing to measure"

[[key.invalid]]
wrap = "root"
at = 2
text = '''
PC_EMAE 5 1
PC_EMAE 4 1'''
error = "PC_EMAE: repeated declaration (first declared on line 1)"

[[key]]
id = "ROOT.PC_ERMSE"
name = "PC_ERMSE"
blocks = ["ROOT"]
synopsis = "PC_ERMSE [(<indices>)] <target> <weight> [--skip-above <cap>] [--skip-rel <ratio>]"
repeat = "add"
repeat_doc = "A line without indices is given once, and not with indexed lines; each indexed line adds the datasets it lists, each dataset once."
doc = """\
A loss term on the energy RMSE of the validation datasets, in meV/atom. \
Without an index list the term is the LOSS function of the metric \
averaged over the datasets; with one, each line sets the target and \
weight of the datasets it lists, and the term is the average of their \
losses."""
long_doc = """\
The indices count the DBFILE entries of the validation configuration \
from 1. A file has either one line without indices or indexed lines \
that give each dataset one target and weight; when the run starts, \
every dataset needs one, and no index may exceed the number of \
datasets. The weight is a number >= 0. A structure with energy priority 0 \
(eweight) is left out of the metric. A dataset whose structures all have \
energy priority 0 is not measured: the average leaves it out, and \
hpo_run.log names it; an indexed line that gives it a weight above 0 is \
refused. A run in which no validation dataset has an energy is refused."""
untested = [
  { msg = "{key} requires validation DBFILE entries", why = "Needs a validation configuration without DBFILE; in tadah hpo --check the training configuration of a case is also its validation configuration, and its own checks come first." },
]

[[key.args]]
name = "indices"
kind = "indices"
optional = true
doc = "The validation datasets the line sets, counted from 1."

[[key.args]]
name = "target"
kind = "number"
what = "{key} <target>"
doc = "The value of the metric the search aims at."

[[key.args]]
name = "weight"
kind = "number"
min = 0
what = "{key} <weight>"
msg = "{key} <weight> must be a number >= 0, got '{tok}'"
doc = "The weight of the term. The loss of an evaluation is the mean of its terms, so a term of weight 0 adds 0 and still counts in the mean."

[[key.checks]]
msg = "{key} requires validation DBFILE entries"
doc = """\
When the run starts, before the validation data are read, without a \
line: the validation configuration has no DBFILE."""

[[key.checks]]
msg = "{key}: dataset {index} on line {line} is outside validation DBFILE range 1-{count}"
doc = """\
When the run starts, without a line: the largest index of the indexed \
lines, {index} on line {line}, exceeds the number of DBFILE entries of \
the validation configuration, {count}."""

[[key.checks]]
msg = "{key}: missing target and weight for:{list}"
doc = """\
When the run starts, without a line: the indexed lines give some \
datasets no target and weight; {list} has one line for each, \
"  dataset <i> (<file>)"."""

[[key.checks]]
msg = "tadah hpo: {keys} on the validation set: no dataset has a structure with an energy ({list}): every structure has energy priority 0 (eweight), so the energy metrics have nothing to measure"
doc = """\
When the run starts, once the validation data are read, without a line: \
no validation structure has an energy to measure; {keys} names the energy \
metrics of the file, {list} the files."""

[[key.checks]]
msg = "tadah hpo: PC_ERMSE ({index}) gives weight {value} to validation dataset {index} ({file}), which has no structure with an energy: every one has energy priority 0 (eweight). A weight of 0 for this dataset is accepted, and so is a validation configuration without this file."
doc = """\
When the run starts, once the validation data are read, without a line: \
an indexed line gives a weight above 0 to a dataset whose structures all \
have energy priority 0."""

[[key.checks]]
msg = "{key} requires <target> <weight>"
doc = "At the line: fewer than two values follow the key and its index list."

[[key.checks]]
msg = "{key}: unknown flag '{tok}'"
doc = "At the line: a token after the weight that is no option of the metric lines."

[[key.checks]]
msg = "{key}: repeated declaration (first declared on line {first_line})"
doc = "At the line: a second line without an index list."

[[key.checks]]
msg = "{key}: cannot mix global and indexed forms"
doc = "At the line: a line with an index list and a line without one."

[[key.checks]]
msg = "{key}: duplicate assignment for dataset {index} (first declared on line {first_line})"
doc = "At the line: an index an earlier line of the key lists."

[[key.checks]]
msg = "{key}: validation indices start at 1"
doc = "At the line: an index 0."

[[key.checks]]
msg = "Invalid index number '{tok}'"
doc = "At the line: an entry of the index list that is no whole number."

[[key.checks]]
msg = "Descending index range '{tok}'"
doc = "At the line: a range a-b of the index list with b below a."
[[key.examples]]
wrap = "lines_metric"
text = "PC_ERMSE 2 1"

[[key.examples]]
wrap = "lines_metric"
doc = "Indexed lines set one target and weight per validation dataset."
text = '''
PC_ERMSE (1) 2 1
PC_ERMSE (2-3) 4 0.5 --skip-above 40'''

[[key.invalid]]
wrap = "end"
text = "PC_ERMSE 2 1"
error = "PC_ERMSE: repeated declaration (first declared on line 2)"

[[key.invalid]]
