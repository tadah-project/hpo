error = "PC_LAMMPS --invar takes two values, the name of a LAMMPS variable and its value"

[[line_option.invalid]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E 1 1 --invar a 1 2"
error = "PC_LAMMPS --invar takes <name> <value> (unexpected '2')"

[[line_option.invalid]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E 1 1 --invar maxtime 5"
error = "PC_LAMMPS --invar maxtime: the variable maxtime is reserved: tadah hpo passes the script's time limit to LAMMPS in it, for `timer timeout ${maxtime}`; --maxtime on this line or PC_SCRIPT_TIMEOUT sets the limit"

[[line_option.invalid]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E 1 1 --invar a 1 --invar a 2"
