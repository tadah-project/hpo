[[rule]]
id = "RULE.fit_LAMBDA_negative"
title = "LAMBDA of the training configuration is not negative, -1 aside"
check = "startup"
msg = "{text}: only LAMBDA -1 requests the evidence approximation, which OALGO 3 runs; another negative value requests nothing. LAMBDA 0 fits without a penalty, and a positive LAMBDA is the ridge penalty."
doc = """\
Every fit refuses a negative LAMBDA other than -1, so tadah hpo refuses it \
when the run starts, without a line, if its evaluations fit the model: \
with training data, unless FIXINDEX pins every weight."""
msg_doc = "The message starts with the LAMBDA line of the training configuration."

