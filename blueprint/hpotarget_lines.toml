[[line_option]]
id = "PC_LAMMPS.--failscore"
option = "--failscore"
lines = ["PC_LAMMPS", "PC_FAILPROBE"]
synopsis = "--failscore <value>"
repeat = "error"
repeat_msg = "{key} --failscore is given twice on this line; each option is given once"
default = { text = "the FAILSCORE of the lines read before the line; the largest double without one" }
doc = """\
The value the variables of the line take when its script fails. On a \
PC_FAILPROBE line it is a positive number, and a probe value S at or \
above it marks a failed probe, which fails the evaluation."""
long_doc = """\
On a PC_LAMMPS line the value goes through the loss function like a \
measured value, and the evaluation scores FAILSCORE all the same. Any \
finite number is accepted there."""

[[line_option.args]]
name = "value"
kind = "number"
what = "--failscore"

[[line_option.checks]]
msg = "{key} --failscore takes one value, a number"
doc = "The option ends the line without its value."

[[line_option.checks]]
msg = "PC_FAILPROBE --failscore must be a positive finite number, got '{tok}'{underflow}"
doc = "On a PC_FAILPROBE line."

[[line_option.examples]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E -5.0 1.0 --failscore -100"

[[line_option.invalid]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E 1 1 --failscore"
error = "PC_LAMMPS --failscore takes one value, a number"

[[line_option.invalid]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E 1 1 --failscore x"
error = "--failscore must be a finite number, got 'x'"

[[line_option.invalid]]
wrap = "root"
text = "PC_FAILPROBE --script lines_pc.in --outvar S --failscore 0"
error = "PC_FAILPROBE --failscore must be a positive finite number, got '0'"

[[line_option.invalid]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E 1 1 --failscore 3 7"
error = "PC_LAMMPS --failscore takes one value (unexpected '7')"

[[line_option.invalid]]
wrap = "root"
text = "PC_FAILPROBE --script lines_pc.in --outvar S --failscore 3 7"
error = "PC_FAILPROBE --failscore takes one value (unexpected '7')"

[[line_option.invalid]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E 1 1 --failscore 3 --failscore 4"
error = "PC_LAMMPS --failscore is given twice on this line; each option is given once"


[[line_option]]
id = "PC_LAMMPS.--maxtime"
option = "--maxtime"
lines = ["PC_LAMMPS", "PC_FAILPROBE"]
synopsis = "--maxtime <time>"
repeat = "error"
repeat_msg = "{key} --maxtime is given twice on this line; each option is given once"
default = { text = "the PC_SCRIPT_TIMEOUT (or MAXTIME) of the lines read before the line; off without one" }
doc = """\
The wall-clock limit of the script of the line: off, unlimited or a \
positive time [[HH:]MM:]SS. A script that reaches it stops and fails."""
long_doc = """\
The limit is set in LAMMPS with the timer timeout command after each \
clear command of the script, unless the script has a timer command of \
its own."""

[[line_option.args]]
name = "time"
kind = "timespec"
what = "--maxtime"

[[line_option.checks]]
msg = "{key} --maxtime takes one value, a time limit (off, unlimited or [[HH:]MM:]SS)"
doc = "The option ends the line without its value."

[[line_option.examples]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E -5.0 1.0 --maxtime 1:30"

[[line_option.examples]]
doc = "No limit for the script of this line."
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E -5.0 1.0 --maxtime off"

[[line_option.invalid]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E 1 1 --maxtime"
error = "PC_LAMMPS --maxtime takes one value, a time limit (off, unlimited or [[HH:]MM:]SS)"

[[line_option.invalid]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E 1 1 --maxtime x"
error = "--maxtime must be 'off', 'unlimited' or a time [[HH:]MM:]SS, got 'x'"

[[line_option.invalid]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E 1 1 --maxtime 0"
error = "--maxtime must be a positive time, 'off' or 'unlimited' (a limit <= 0 stops every script), got '0'"

[[line_option.invalid]]
