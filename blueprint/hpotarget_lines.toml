# ====================================================== LAMMPS script ===
# What the LAMMPS script of a PC_LAMMPS or PC_FAILPROBE line provides. The
# fixture is the script the reference page shows; the Catch2 case
# "hpotarget registry: the LAMMPS script of [lammps_script] ..." runs it as
# two evaluations of one line run it, and the conformance case reads the
# line of the example.

[lammps_script]
doc = """\
The script of a PC_LAMMPS or PC_FAILPROBE line takes the candidate \
potential of the evaluation with `pair_style tadah` and `pair_coeff * * \
EXTERN <element> ...`, one element per atom type. A script without such a \
pair_coeff line runs without the candidate potential."""
long_doc = """\
Each evaluation runs the whole script in the LAMMPS instance of an earlier \
evaluation of the line, so the script starts with clear, which removes the \
atoms and settings and keeps the variables. The variables that --varloss, \
--outvar and --failvar name are equal-style variables of the script; \
--invar and --hotvar define variables for it, and the variable maxtime \
holds the script timeout."""
fixture = "lines_contract"

[[lammps_script.examples]]
wrap = "root"
text = "PC_LAMMPS --script lines_contract.in --varloss E -8.1 1"

# ============================================================ fixtures ===

[fixture.lines_contract]
path = "lines_contract.in"
doc = "The energy per atom E of bcc Ta at a lattice constant of 3.3 Å, in eV."
text = """
clear
units           metal
atom_style      atomic
boundary        p p p
lattice         bcc 3.3
region          box block 0 1 0 1 0 1
create_box      1 box
create_atoms    1 box
mass            1 180.95
pair_style      tadah
pair_coeff      * * EXTERN Ta
run             0
variable        E equal $(pe/atoms)
"""

