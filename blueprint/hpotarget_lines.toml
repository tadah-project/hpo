error = "OPTIM AMPGRIDMB (1): OPTIM AMPGRIDMB (1): every seed on this line is 0, so the AUTO box has zero width (FRAC and the GROUP_FLOOR 1e-3 that RHOFORM NONNEG implies for AMPGRIDMB are relative to the seeds); set FLOOR <a> for the box [0, a], or give explicit bounds `OPTIM AMPGRIDMB (1) 0 <high>`"

[[line_option]]
id = "OPTIM.AUTO.FLOOR"
option = "FLOOR"
lines = ["OPTIM.AUTO"]
synopsis = "FLOOR <a>"
repeat = "last_wins"
default = { text = "0", unchecked = "The parser applies the floor when it makes the box; the box does not keep it." }
doc = "The smallest half-width a >= 0 of a FRAC box. A geometric box, given by RATIO or the default of a key whose values stay positive, refuses it."

[[line_option.args]]
name = "a"
kind = "number"

[[line_option.checks]]
msg = "OPTIM {key}: AUTO FLOOR must be >= 0"
doc = "a is negative."

[[line_option.checks]]
msg = "OPTIM {key}: FLOOR and GROUP_FLOOR set the smallest half-width of an AUTO FRAC box; AUTO RATIO makes the geometric box [x0/f, x0*f], which they do not change, so they are given with FRAC <p> only"
doc = "The line gives RATIO."

[[line_option.checks]]
msg = "OPTIM {key}: FLOOR and GROUP_FLOOR set the smallest half-width of an AUTO FRAC box; the AUTO box of {key} is geometric by default (RATIO 2), which they do not change, so they are given with FRAC <p> only"
doc = "The line gives neither RATIO nor FRAC, and the AUTO box of the key is RATIO 2 by default."

[[line_option.examples]]
wrap = "root"
text = "OPTIM CGRID2B (2) AUTO FLOOR 0.3"

[[line_option.invalid]]
wrap = "root"
text = "OPTIM CGRID2B (2) AUTO FLOOR -1"
error = "OPTIM CGRID2B: AUTO FLOOR must be >= 0"

[[line_option.invalid]]
wrap = "root"
text = "OPTIM CGRID2B (2) AUTO RATIO 2 FLOOR 0.3"
error = "OPTIM CGRID2B: FLOOR and GROUP_FLOOR set the smallest half-width of an AUTO FRAC box; AUTO RATIO makes the geometric box [x0/f, x0*f], which they do not change, so they are given with FRAC <p> only"

[[line_option.invalid]]
wrap = "root"
doc = "SGRID2B, whose values stay positive, has the geometric box RATIO 2 by default."
text = "OPTIM SGRID2B (1) AUTO FLOOR 0.1"
error = "OPTIM SGRID2B: FLOOR and GROUP_FLOOR set the smallest half-width of an AUTO FRAC box; the AUTO box of SGRID2B is geometric by default (RATIO 2), which they do not change, so they are given with FRAC <p> only"

[[line_option]]
id = "OPTIM.AUTO.GROUP_FLOOR"
option = "GROUP_FLOOR"
lines = ["OPTIM.AUTO"]
synopsis = "GROUP_FLOOR <r>"
repeat = "last_wins"
default = { text = "0; 1e-3 for a non-negative amplitude under FRAC without FLOOR", unchecked = "The parser applies the floor when it makes the box; the box does not keep it." }
doc = "The smallest half-width of a FRAC box relative to the largest |x0| of the line, r >= 0. A geometric box, given by RATIO or the default of a key whose values stay positive, refuses it."

[[line_option.args]]
name = "r"
kind = "number"

[[line_option.checks]]
msg = "OPTIM {key}: AUTO GROUP_FLOOR must be >= 0"
doc = "r is negative."

[[line_option.checks]]
msg = "OPTIM {key}: FLOOR and GROUP_FLOOR set the smallest half-width of an AUTO FRAC box; AUTO RATIO makes the geometric box [x0/f, x0*f], which they do not change, so they are given with FRAC <p> only"
doc = "The line gives RATIO."

[[line_option.checks]]
msg = "OPTIM {key}: FLOOR and GROUP_FLOOR set the smallest half-width of an AUTO FRAC box; the AUTO box of {key} is geometric by default (RATIO 2), which they do not change, so they are given with FRAC <p> only"
doc = "The line gives neither RATIO nor FRAC, and the AUTO box of the key is RATIO 2 by default."

[[line_option.examples]]
