# ===================================================== PC_FAILPROBE =====

[[key]]
id = "ROOT.PC_FAILPROBE"
name = "PC_FAILPROBE"
blocks = ["ROOT"]
synopsis = "PC_FAILPROBE --script <file> --outvar <S> [--gate <g>] [--s0 <s0>] [<option> ...] [<LAMMPS option> ...]"
repeat = "error"
repeat_msg = "only one PC_FAILPROBE line is allowed"
doc = """\
A LAMMPS script that each evaluation runs first to measure how unsound \
the candidate potential is: its first --outvar is the probe value S, \
which grades failed evaluations under FAILSCORE_GRADING ON. It adds no \
loss term."""
long_doc = """\
The line takes the options of a PC_LAMMPS line except --varloss, \
--hotvar and --failvar, and the options --gate and --s0 of its own. Its \
--failscore is a positive number: a probe value at or above it marks \
the probe as failed, and a failed probe grades the evaluation as the \
least sound. The rules that relate PC_LAMMPS lines to the optimiser \
apply to a file with a PC_FAILPROBE line too. The script is read, and \
LAMMPS started, as for a PC_LAMMPS line, with the same refusals."""
quirk = """\
A token after --gate or --s0 is its value whatever it is, and a second \
--gate or --s0 on the line replaces the first."""
checks = [
  { msg = "LammpsSim object must have a script specified.\n", doc = "At the line: no --script option." },
  { msg = "PC_FAILPROBE requires --outvar <S> (the sanity scalar)", doc = "At the line: no --outvar option." },
  { msg = "PC_FAILPROBE must not declare --varloss (it grades failures; it must not shape the feasible objective)", doc = "At the line: a --varloss option." },
  { msg = "PC_FAILPROBE must not declare --hotvar/--failvar", doc = "At the line: a --hotvar or --failvar option." },
  { msg = "{key}: unknown option '{option}'{note}: HPO's options are {list}; LAMMPS command-line options start with a single '-'", doc = "At the line: an option that starts with -- and is none of the line's; {note} names the option meant, or the other line it belongs to." },
  { msg = "{key}: LAMMPS cannot start with this line's command-line options: {why}", doc = "At the line: LAMMPS refuses a command-line option of the line; {why} is the message of LAMMPS." },
]

[[key.args]]
name = "option"
kind = "tokens"
optional = true
repeat = true
doc = "An option of the line, which starts with --, with its values."

[[key.args]]
name = "LAMMPS option"
kind = "tokens"
optional = true
repeat = true
doc = "A LAMMPS command-line option, which starts with a single -, with the values that follow it."

[[key.examples]]
wrap = "root"
text = "PC_FAILPROBE --script lines_pc.in --outvar S"

[[key.examples]]
doc = "With the probe value that stops the other scripts, its scale and the value that marks a failed probe."
wrap = "root"
text = "PC_FAILPROBE --script lines_pc.in --outvar S --gate 3 --s0 2 --failscore 10"

[[key.invalid]]
wrap = "root"
at = 2
text = '''
PC_FAILPROBE --script lines_pc.in --outvar S
PC_FAILPROBE --script lines_pc2.in --outvar E2'''
error = "only one PC_FAILPROBE line is allowed"

[[key.invalid]]
wrap = "root"
text = "PC_FAILPROBE --script lines_pc.in"
error = "PC_FAILPROBE requires --outvar <S> (the sanity scalar)"

[[key.invalid]]
wrap = "root"
text = "PC_FAILPROBE --script lines_pc.in --outvar S --varloss E 1 1"
error = "PC_FAILPROBE must not declare --varloss (it grades failures; it must not shape the feasible objective)"

[[key.invalid]]
wrap = "root"
text = "PC_FAILPROBE --script lines_pc.in --outvar S --hotvar a 1 2"
error = "PC_FAILPROBE must not declare --hotvar/--failvar"

[[key.invalid]]
wrap = "root"
text = "PC_FAILPROBE --script lines_pc.in --outvar S --failvar V"
error = "PC_FAILPROBE must not declare --hotvar/--failvar"

[[key.invalid]]
wrap = "root"
text = "PC_FAILPROBE --script lines_pc.in --outvar S --hotvars a 1 2"
error = "PC_FAILPROBE: unknown option '--hotvars': HPO's options are --script, --invar, --outvar, --failscore, --maxtime, --gate and --s0; LAMMPS command-line options start with a single '-'"

[[key.invalid]]
wrap = "root"
text = "PC_FAILPROBE --outvar S"
error = "LammpsSim object must have a script specified.\n"

[[key.invalid]]
wrap = "root"
text = "PC_FAILPROBE --script /missing/probe.in --outvar S"
error = "LAMMPS include file not found: /missing/probe.in"
msg_of = "ROOT.PC_LAMMPS"

[[key.invalid]]
wrap = "root"
text = "PC_FAILPROBE --script lines_pc.in --outvar S -sff 3"
error = "PC_FAILPROBE: LAMMPS cannot start with this line's command-line options: ERROR: Invalid command-line argument: -sff (src/lammps.cpp:490)"

[[line_option]]
id = "PC_FAILPROBE.--gate"
option = "--gate"
lines = ["PC_FAILPROBE"]
synopsis = "--gate <g>"
repeat = "last_wins"
default = { text = "none: no probe value stops an evaluation" }
doc = """\
Under FAILSCORE_GRADING ON, an evaluation whose probe value S exceeds \
<g> stops its other scripts and scores a failure graded by S."""

[[line_option.args]]
name = "g"
kind = "number"
what = "PC_FAILPROBE --gate"

[[line_option.checks]]
msg = "PC_FAILPROBE --gate requires a value"
doc = "The option ends the line without its value."

[[line_option.examples]]
wrap = "root"
text = "PC_FAILPROBE --script lines_pc.in --outvar S --gate 0.5"

[[line_option.invalid]]
wrap = "root"
text = "PC_FAILPROBE --script lines_pc.in --outvar S --gate"
error = "PC_FAILPROBE --gate requires a value"

[[line_option.invalid]]
wrap = "root"
text = "PC_FAILPROBE --script lines_pc.in --outvar S --gate x"
error = "PC_FAILPROBE --gate must be a finite number, got 'x'"

[[line_option]]
id = "PC_FAILPROBE.--s0"
option = "--s0"
lines = ["PC_FAILPROBE"]
synopsis = "--s0 <s0>"
repeat = "last_wins"
default = { literal = "1" }
doc = """\
The scale of the probe value S in the graded failure loss of an \
evaluation under FAILSCORE_GRADING ON."""

[[line_option.args]]
name = "s0"
kind = "positive"
noun = "number"
what = "PC_FAILPROBE --s0"

[[line_option.checks]]
msg = "PC_FAILPROBE --s0 requires a value"
doc = "The option ends the line without its value."

[[line_option.examples]]
wrap = "root"
text = "PC_FAILPROBE --script lines_pc.in --outvar S --s0 0.2"

[[line_option.invalid]]
wrap = "root"
text = "PC_FAILPROBE --script lines_pc.in --outvar S --s0"
error = "PC_FAILPROBE --s0 requires a value"

[[line_option.invalid]]
wrap = "root"
text = "PC_FAILPROBE --script lines_pc.in --outvar S --s0 0"
error = "PC_FAILPROBE --s0 must be a positive number, got '0'"

# ==================================================== PC_OBSERVABLE =====

[[key]]
id = "ROOT.PC_OBSERVABLE"
name = "PC_OBSERVABLE"
blocks = ["ROOT"]
synopsis = "PC_OBSERVABLE <kind> <option> ..."
repeat = "add"
doc = """\
A loss term on a property that tadah computes with the candidate \
potential, without LAMMPS. The kind names the property; cohesive_energy \
is the one kind."""
long_doc = """\
cohesive_energy provides the analytical gradient of its term, except \
for the value of --unconverged force-scaled. A file has PC_OBSERVABLE \
lines or PC_LAMMPS lines, not both."""
checks = [
  { msg = "PC_OBSERVABLE: empty line", doc = "At the line: no observable kind follows the key." },
]

[[key.args]]
name = "kind"
kind = "name"
msg = "PC_OBSERVABLE: unknown observable kind '{tok}'"
doc = "The observable, the word of a form PC_OBSERVABLE.<kind>."

[[key.args]]
name = "option"
kind = "tokens"
repeat = true
doc = "An option of the kind, with its values."

[[key.examples]]
wrap = "root"
text = "PC_OBSERVABLE cohesive_energy --species H --target 2.0 --weight 1 --hotvar a0 1.5 2.5 2.0"

[[key.invalid]]
wrap = "root"
text = "PC_OBSERVABLE"
error = "PC_OBSERVABLE: empty line"

[[key.invalid]]
wrap = "root"
text = "PC_OBSERVABLE lattice_param --species H"
error = "PC_OBSERVABLE: unknown observable kind 'lattice_param'"

[[form]]
id = "PC_OBSERVABLE.cohesive_energy"
line = "PC_OBSERVABLE"
word = "cohesive_energy"
synopsis = "PC_OBSERVABLE cohesive_energy --species <element> --target <E> --weight <w> --hotvar a0 <lo> <hi> [<init>] [<option> ...]"
doc = """\
The cohesive energy of a bcc crystal of one species, in eV/atom and \
positive for a bound crystal: the energy of an isolated atom less the \
energy per atom of the crystal relaxed at zero pressure."""
long_doc = """\
Each evaluation builds a bcc supercell with the lattice constant a0, \
relaxes it at zero pressure with tadah's own relaxer and compares the \
cohesive energy with the target through the loss function. The next \
evaluation starts its relaxation from the lattice constant this one \
relaxed to. A relaxation whose a0 ends outside the --hotvar window fails \
the term, and with it the evaluation. A relaxation that does not converge \
reports the value that --unconverged sets."""
quirk = """\
The lattice constant the next relaxation starts from is one value for the \
run. Under TADAH:ANNEAL_PT or TADAH:ANNEAL_PA with THREADS above 1, \
evaluations that run at the same time share it without a lock, so a \
relaxation can start from, and be judged against, the value of another \
evaluation."""

[[form.checks]]
msg = "PC_OBSERVABLE cohesive_energy: --species is required"
doc = "The line has no --species."

[[form.checks]]
msg = "PC_OBSERVABLE cohesive_energy: --target is required"
doc = "The line has no --target."

[[form.checks]]
msg = "PC_OBSERVABLE cohesive_energy: --weight is required"
doc = "The line has no --weight."

[[form.checks]]
msg = "PC_OBSERVABLE cohesive_energy: --hotvar a0 <lo> <hi> [<init>] is required"
doc = "The line has no --hotvar."

[[form.checks]]
msg = "PC_OBSERVABLE cohesive_energy: unknown flag '{tok}'"
doc = "A token is not an option of the kind, nor a value of one."

[[form.checks]]
msg = "PC_OBSERVABLE cohesive_energy: '{option}' requires a value"
doc = "An option ends the line without its value; {option} names the option or the value missing."

[[form.checks]]
msg = "PC_OBSERVABLE: flag '{option}' expected a finite number, got '{tok}'{underflow}"
doc = "A number of an option is not a number."

[[form.examples]]
wrap = "root"
text = "PC_OBSERVABLE cohesive_energy --species H --target 2.0 --weight 1 --hotvar a0 1.5 2.5"

[[form.invalid]]
wrap = "root"
text = "PC_OBSERVABLE cohesive_energy --target 2.0 --weight 1 --hotvar a0 1.5 2.5"
error = "PC_OBSERVABLE cohesive_energy: --species is required"

[[form.invalid]]
wrap = "root"
text = "PC_OBSERVABLE cohesive_energy --species H --weight 1 --hotvar a0 1.5 2.5"
error = "PC_OBSERVABLE cohesive_energy: --target is required"

[[form.invalid]]
wrap = "root"
text = "PC_OBSERVABLE cohesive_energy --species H --target 2 --hotvar a0 1.5 2.5"
error = "PC_OBSERVABLE cohesive_energy: --weight is required"

[[form.invalid]]
wrap = "root"
text = "PC_OBSERVABLE cohesive_energy --species H --target 2 --weight 1"
error = "PC_OBSERVABLE cohesive_energy: --hotvar a0 <lo> <hi> [<init>] is required"

[[form.invalid]]
wrap = "root"
text = "PC_OBSERVABLE cohesive_energy --species H --target 2 --weight 1 --hotvar a0 1.5 2.5 --bogus"
error = "PC_OBSERVABLE cohesive_energy: unknown flag '--bogus'"

[[form.invalid]]
wrap = "root"
text = "PC_OBSERVABLE cohesive_energy --species H --target -1 --weight 1 --hotvar a0 2.0 3.0 --etol"
error = "PC_OBSERVABLE cohesive_energy: '--etol' requires a value"

[[form.invalid]]
wrap = "root"
text = "PC_OBSERVABLE cohesive_energy --species H --target -1 --weight 1 --hotvar a0 2.0 3.0 --etol x"
error = "PC_OBSERVABLE: flag '--etol' expected a finite number, got 'x'"

[[line_option]]
id = "PC_OBSERVABLE.cohesive_energy.--species"
option = "--species"
lines = ["PC_OBSERVABLE.cohesive_energy"]
synopsis = "--species <element>"
repeat = "last_wins"
doc = "The chemical element of the crystal. The line requires it."
quirk = """\
The element is not checked. A name that is no element fails every \
evaluation when it runs, and an element the potential does not hold gives \
a constant term, with no message."""

[[line_option.args]]
name = "element"
kind = "name"

[[line_option.examples]]
wrap = "root"
text = "PC_OBSERVABLE cohesive_energy --species H --target 2.0 --weight 1 --hotvar a0 1.5 2.5"

[[line_option.invalid]]
wrap = "root"
text = "PC_OBSERVABLE cohesive_energy --species"
error = "PC_OBSERVABLE cohesive_energy: '--species' requires a value"

[[line_option]]
id = "PC_OBSERVABLE.cohesive_energy.--target"
option = "--target"
lines = ["PC_OBSERVABLE.cohesive_energy"]
synopsis = "--target <E>"
repeat = "last_wins"
doc = "The cohesive energy the search aims at, in eV/atom. The line requires it."

[[line_option.args]]
name = "E"
kind = "number"
msg = "PC_OBSERVABLE: flag '--target' expected a finite number, got '{tok}'{underflow}"

[[line_option.examples]]
wrap = "root"
text = "PC_OBSERVABLE cohesive_energy --species H --target 8.1 --weight 1 --hotvar a0 1.5 2.5"

[[line_option.invalid]]
wrap = "root"
text = "PC_OBSERVABLE cohesive_energy --species H --target x"
error = "PC_OBSERVABLE: flag '--target' expected a finite number, got 'x'"

[[line_option]]
id = "PC_OBSERVABLE.cohesive_energy.--weight"
option = "--weight"
lines = ["PC_OBSERVABLE.cohesive_energy"]
synopsis = "--weight <w>"
repeat = "last_wins"
doc = """\
The weight of the term, a number >= 0; the line requires it. The loss of \
an evaluation is the mean of its terms, so a term of weight 0 adds 0 and \
still counts in the mean."""

[[line_option.args]]
name = "w"
kind = "number"
min = 0
msg = "PC_OBSERVABLE: flag '--weight' expected a finite number, got '{tok}'{underflow}"

[[line_option.checks]]
msg = "CohesiveEnergyObservable: weight must be >= 0"
doc = "The weight is negative."

[[line_option.examples]]
wrap = "root"
text = "PC_OBSERVABLE cohesive_energy --species H --target 2.0 --weight 0 --hotvar a0 1.5 2.5"

[[line_option.invalid]]
wrap = "root"
text = "PC_OBSERVABLE cohesive_energy --species H --target 2.0 --weight -1 --hotvar a0 1.5 2.5"
error = "CohesiveEnergyObservable: weight must be >= 0"

[[line_option.invalid]]
wrap = "root"
text = "PC_OBSERVABLE cohesive_energy --species H --target -1 --weight x --hotvar a0 2.0 3.0"
error = "PC_OBSERVABLE: flag '--weight' expected a finite number, got 'x'"

[[line_option]]
id = "PC_OBSERVABLE.cohesive_energy.--hotvar"
option = "--hotvar"
lines = ["PC_OBSERVABLE.cohesive_energy"]
synopsis = "--hotvar a0 <lo> <hi> [<init>]"
repeat = "last_wins"
default = { text = "<init>: the midpoint of [<lo>, <hi>]" }
doc = """\
The lattice constant a0, in Å: the window [<lo>, <hi>] of the relaxed \
value, and the value the first relaxation starts from. A relaxation whose \
a0 ends outside the window fails the term, and with it the evaluation; the \
line requires the option."""
quirk = "An <init> outside [<lo>, <hi>] is moved to the nearer end of the range without a message."

[[line_option.args]]
name = "name"
kind = "word"
words = ["a0"]
msg = "PC_OBSERVABLE cohesive_energy: only --hotvar a0 is supported in MVP (got '{tok}')."

[[line_option.args]]
name = "lo"
kind = "number"
msg = "PC_OBSERVABLE: flag '--hotvar a0 lo' expected a finite number, got '{tok}'{underflow}"

[[line_option.args]]
name = "hi"
kind = "number"
msg = "PC_OBSERVABLE: flag '--hotvar a0 hi' expected a finite number, got '{tok}'{underflow}"

[[line_option.args]]
name = "init"
kind = "number"
optional = true
msg = "PC_OBSERVABLE: flag '--hotvar a0 init' expected a finite number, got '{tok}'{underflow}"
doc = "A token that does not start with -- is <init>."

[[line_option.checks]]
msg = "CohesiveEnergyObservable: a0_max must be > a0_min"
doc = "<hi> is not greater than <lo>."

[[line_option.examples]]
wrap = "root"
text = "PC_OBSERVABLE cohesive_energy --species H --target 2.0 --weight 1 --hotvar a0 1.5 2.5 1.8"

[[line_option.invalid]]
wrap = "root"
text = "PC_OBSERVABLE cohesive_energy --species H --target 2 --weight 1 --hotvar b 1.5 2.5"
error = "PC_OBSERVABLE cohesive_energy: only --hotvar a0 is supported in MVP (got 'b')."

[[line_option.invalid]]
wrap = "root"
text = "PC_OBSERVABLE cohesive_energy --species H --target 2 --weight 1 --hotvar a0 1.5"
error = "PC_OBSERVABLE cohesive_energy: '--hotvar a0 <hi>' requires a value"

[[line_option.invalid]]
wrap = "root"
text = "PC_OBSERVABLE cohesive_energy --species H --target 2 --weight 1 --hotvar a0 x 2.5"
error = "PC_OBSERVABLE: flag '--hotvar a0 lo' expected a finite number, got 'x'"

[[line_option.invalid]]
wrap = "root"
text = "PC_OBSERVABLE cohesive_energy --species H --target 2 --weight 1 --hotvar a0 1.5 2.5 x"
error = "PC_OBSERVABLE: flag '--hotvar a0 init' expected a finite number, got 'x'"

[[line_option.invalid]]
wrap = "root"
text = "PC_OBSERVABLE cohesive_energy --species H --target 2 --weight 1 --hotvar a0 2.5 1.5"
error = "CohesiveEnergyObservable: a0_max must be > a0_min"

[[line_option.invalid]]
wrap = "root"
text = "PC_OBSERVABLE cohesive_energy --species H --target -1 --weight 1 --hotvar a0 2.0 x"
error = "PC_OBSERVABLE: flag '--hotvar a0 hi' expected a finite number, got 'x'"

[[line_option]]
id = "PC_OBSERVABLE.cohesive_energy.--lattice"
option = "--lattice"
lines = ["PC_OBSERVABLE.cohesive_energy"]
synopsis = "--lattice bcc"
repeat = "last_wins"
default = { text = "bcc, the only lattice the term takes" }
doc = "The crystal lattice; bcc is the one lattice."

[[line_option.args]]
name = "lattice"
kind = "word"
words = ["bcc"]
msg = "PC_OBSERVABLE cohesive_energy: lattice='{tok}' not supported in MVP (only bcc)."

[[line_option.examples]]
wrap = "root"
text = "PC_OBSERVABLE cohesive_energy --species H --target 2.0 --weight 1 --hotvar a0 1.5 2.5 --lattice bcc"

[[line_option.invalid]]
wrap = "root"
text = "PC_OBSERVABLE cohesive_energy --species H --target 2 --weight 1 --hotvar a0 1.5 2.5 --lattice fcc"
error = "PC_OBSERVABLE cohesive_energy: lattice='fcc' not supported in MVP (only bcc)."

[[line_option]]
id = "PC_OBSERVABLE.cohesive_energy.--supercell"
option = "--supercell"
lines = ["PC_OBSERVABLE.cohesive_energy"]
synopsis = "--supercell <nx> <ny> <nz>"
repeat = "last_wins"
default = { literal = "4 4 4" }
doc = "The number of bcc cubic cells of the crystal along each axis."

[[line_option.args]]
name = "nx"
kind = "integer"
min = 1
max = "INT_MAX"
what = "PC_OBSERVABLE: flag '--supercell nx'"

[[line_option.args]]
name = "ny"
kind = "integer"
min = 1
max = "INT_MAX"
what = "PC_OBSERVABLE: flag '--supercell ny'"

[[line_option.args]]
name = "nz"
kind = "integer"
min = 1
max = "INT_MAX"
what = "PC_OBSERVABLE: flag '--supercell nz'"

[[line_option.examples]]
wrap = "root"
text = "PC_OBSERVABLE cohesive_energy --species H --target 2.0 --weight 1 --hotvar a0 1.5 2.5 --supercell 2 2 3"

[[line_option.invalid]]
wrap = "root"
text = "PC_OBSERVABLE cohesive_energy --species H --target 2 --weight 1 --hotvar a0 1.5 2.5 --supercell 0 1 1"
error = "PC_OBSERVABLE: flag '--supercell nx' must be an integer from 1 to 2147483647, got '0'"

[[line_option.invalid]]
wrap = "root"
text = "PC_OBSERVABLE cohesive_energy --species H --target 2 --weight 1 --hotvar a0 1.5 2.5 --supercell 2 2"
error = "PC_OBSERVABLE cohesive_energy: '--supercell' requires a value"

[[line_option]]
id = "PC_OBSERVABLE.cohesive_energy.--loss"
option = "--loss"
lines = ["PC_OBSERVABLE.cohesive_energy"]
synopsis = "--loss <function>"
repeat = "last_wins"
default = { literal = "L2" }
doc = """\
The loss function of the term, one of the loss functions of LOSS, in \
any case. The LOSS line does not apply to PC_OBSERVABLE."""
quirk = """\
The option takes the name alone: HUBER and TUKEY keep their default \
parameter, and a number after the name is refused as an unknown flag."""

[[line_option.args]]
name = "function"
kind = "loss"

[[line_option.examples]]
wrap = "root"
text = "PC_OBSERVABLE cohesive_energy --species H --target 2.0 --weight 1 --hotvar a0 1.5 2.5 --loss huber"

[[line_option.invalid]]
wrap = "root"
text = "PC_OBSERVABLE cohesive_energy --species H --target 2 --weight 1 --hotvar a0 1.5 2.5 --loss foo"
error = "LossFunction::from_string: unknown type 'foo'"
msg_of = "ROOT.LOSS"

[[line_option.invalid]]
wrap = "root"
text = "PC_OBSERVABLE cohesive_energy --species H --target 2 --weight 1 --hotvar a0 1.5 2.5 --loss HUBER 20"
error = "PC_OBSERVABLE cohesive_energy: unknown flag '20'"
msg_of = "PC_OBSERVABLE.cohesive_energy"

[[line_option]]
id = "PC_OBSERVABLE.cohesive_energy.--maxiter"
option = "--maxiter"
lines = ["PC_OBSERVABLE.cohesive_energy"]
synopsis = "--maxiter <n>"
repeat = "last_wins"
default = { literal = "5000" }
doc = "The largest number of iterations of the relaxation."

[[line_option.args]]
name = "n"
kind = "integer"
min = 0
max = "INT_MAX"
what = "PC_OBSERVABLE: flag '--maxiter'"

[[line_option.examples]]
wrap = "root"
text = "PC_OBSERVABLE cohesive_energy --species H --target 2.0 --weight 1 --hotvar a0 1.5 2.5 --maxiter 200"

[[line_option.invalid]]
wrap = "root"
text = "PC_OBSERVABLE cohesive_energy --species H --target 2 --weight 1 --hotvar a0 1.5 2.5 --maxiter -1"
error = "PC_OBSERVABLE: flag '--maxiter' must be an integer from 0 to 2147483647, got '-1'"

[[line_option]]
id = "PC_OBSERVABLE.cohesive_energy.--maxeval"
option = "--maxeval"
lines = ["PC_OBSERVABLE.cohesive_energy"]
synopsis = "--maxeval <n>"
repeat = "last_wins"
default = { literal = "5000" }
doc = "The largest number of energy and force evaluations of the relaxation."

[[line_option.args]]
name = "n"
kind = "integer"
min = 0
max = "INT_MAX"
what = "PC_OBSERVABLE: flag '--maxeval'"

[[line_option.examples]]
wrap = "root"
text = "PC_OBSERVABLE cohesive_energy --species H --target 2.0 --weight 1 --hotvar a0 1.5 2.5 --maxeval 400"

[[line_option.invalid]]
wrap = "root"
text = "PC_OBSERVABLE cohesive_energy --species H --target 2 --weight 1 --hotvar a0 1.5 2.5 --maxeval 1.5"
error = "PC_OBSERVABLE: flag '--maxeval' must be an integer from 0 to 2147483647, got '1.5'"

[[line_option]]
id = "PC_OBSERVABLE.cohesive_energy.--max-wall-time"
option = "--max-wall-time"
lines = ["PC_OBSERVABLE.cohesive_energy"]
synopsis = "--max-wall-time <seconds>"
repeat = "last_wins"
default = { literal = "0" }
doc = "The wall-clock limit of one relaxation in seconds; a value of 0 or below sets no limit."

[[line_option.args]]
name = "seconds"
kind = "number"
msg = "PC_OBSERVABLE: flag '--max-wall-time' expected a finite number, got '{tok}'{underflow}"

[[line_option.examples]]
wrap = "root"
text = "PC_OBSERVABLE cohesive_energy --species H --target 2.0 --weight 1 --hotvar a0 1.5 2.5 --max-wall-time 1"

[[line_option.examples]]
wrap = "root"
doc = "A negative value, as 0, sets no limit."
text = "PC_OBSERVABLE cohesive_energy --species H --target 2.0 --weight 1 --hotvar a0 1.5 2.5 --max-wall-time -5"

[[line_option.invalid]]
wrap = "root"
text = "PC_OBSERVABLE cohesive_energy --species H --target 2 --weight 1 --hotvar a0 1.5 2.5 --max-wall-time x"
error = "PC_OBSERVABLE: flag '--max-wall-time' expected a finite number, got 'x'"

[[line_option]]
id = "PC_OBSERVABLE.cohesive_energy.--etol"
option = "--etol"
lines = ["PC_OBSERVABLE.cohesive_energy"]
synopsis = "--etol <tol>"
repeat = "last_wins"
default = { literal = "0" }
doc = """\
The energy tolerance of the relaxation, as the first value of the LAMMPS \
minimize command; a value of 0 or below leaves the forces alone to decide \
convergence."""

[[line_option.args]]
name = "tol"
kind = "number"
msg = "PC_OBSERVABLE: flag '--etol' expected a finite number, got '{tok}'{underflow}"

[[line_option.examples]]
wrap = "root"
text = "PC_OBSERVABLE cohesive_energy --species H --target 2.0 --weight 1 --hotvar a0 1.5 2.5 --etol 1e-15"

[[line_option.examples]]
wrap = "root"
doc = "A negative value, as 0, sets no energy tolerance."
text = "PC_OBSERVABLE cohesive_energy --species H --target 2.0 --weight 1 --hotvar a0 1.5 2.5 --etol -1"

[[line_option.invalid]]
wrap = "root"
text = "PC_OBSERVABLE cohesive_energy --species H --target 2 --weight 1 --hotvar a0 1.5 2.5 --etol 1e-400"
error = "PC_OBSERVABLE: flag '--etol' expected a finite number, got '1e-400' (too small: its magnitude is below the smallest normal double, 2.2250738585072014e-308)"

[[line_option]]
id = "PC_OBSERVABLE.cohesive_energy.--fmax-converged"
option = "--fmax-converged"
lines = ["PC_OBSERVABLE.cohesive_energy"]
synopsis = "--fmax-converged <fmax>"
repeat = "last_wins"
default = { literal = "0.1" }
doc = """\
The largest force, in eV/Å, at the end of a relaxation that counts as \
converged; above it the observable reports the --unconverged value."""
quirk = """\
The relaxation itself ends when the largest force falls below 0.1 eV/Å, so \
a value above 0.1 loosens the test only when --etol ends the relaxation."""

[[line_option.args]]
name = "fmax"
kind = "number"
msg = "PC_OBSERVABLE: flag '--fmax-converged' expected a finite number, got '{tok}'{underflow}"

[[line_option.examples]]
wrap = "root"
text = "PC_OBSERVABLE cohesive_energy --species H --target 2.0 --weight 1 --hotvar a0 1.5 2.5 --fmax-converged 0.05"

[[line_option.invalid]]
wrap = "root"
text = "PC_OBSERVABLE cohesive_energy --species H --target 2 --weight 1 --hotvar a0 1.5 2.5 --fmax-converged"
error = "PC_OBSERVABLE cohesive_energy: '--fmax-converged' requires a value"

[[line_option.invalid]]
wrap = "root"
text = "PC_OBSERVABLE cohesive_energy --species H --target -1 --weight 1 --hotvar a0 2.0 3.0 --fmax-converged x"
error = "PC_OBSERVABLE: flag '--fmax-converged' expected a finite number, got 'x'"

[[line_option]]
id = "PC_OBSERVABLE.cohesive_energy.--unconverged"
option = "--unconverged"
lines = ["PC_OBSERVABLE.cohesive_energy"]
synopsis = "--unconverged const <value> | --unconverged force-scaled <value>"
repeat = "last_wins"
default = { literal = "const 100" }
doc = """\
The value the observable reports for a relaxation that does not converge: \
const <value> reports <value> in eV/atom, force-scaled <slope> reports \
the target plus <slope> times the largest force at the end."""
long_doc = """\
force-scaled leaves the loss sloping towards converged candidates; its \
value has no analytical gradient."""

[[line_option.args]]
name = "kind"
kind = "word"
words = ["const", "force-scaled"]
msg = "PC_OBSERVABLE cohesive_energy: --unconverged kind must be 'const' or 'force-scaled' (got '{tok}')"

[[line_option.args]]
name = "value"
kind = "number"
msg = "PC_OBSERVABLE: flag '--unconverged {kind}' expected a finite number, got '{tok}'{underflow}"
doc = "The value of const, in eV/atom, or the slope of force-scaled."

[[line_option.examples]]
wrap = "root"
text = "PC_OBSERVABLE cohesive_energy --species H --target 2.0 --weight 1 --hotvar a0 1.5 2.5 --unconverged const 50"

[[line_option.examples]]
doc = "The target plus 10 times the largest force at the end of the relaxation."
wrap = "root"
text = "PC_OBSERVABLE cohesive_energy --species H --target 2.0 --weight 1 --hotvar a0 1.5 2.5 --unconverged force-scaled 10"

[[line_option.invalid]]
wrap = "root"
text = "PC_OBSERVABLE cohesive_energy --species H --target 2 --weight 1 --hotvar a0 1.5 2.5 --unconverged linear 5"
error = "PC_OBSERVABLE cohesive_energy: --unconverged kind must be 'const' or 'force-scaled' (got 'linear')"

[[line_option.invalid]]
wrap = "root"
text = "PC_OBSERVABLE cohesive_energy --species H --target 2 --weight 1 --hotvar a0 1.5 2.5 --unconverged const"
error = "PC_OBSERVABLE cohesive_energy: '--unconverged const <value>' requires a value"

[[line_option.invalid]]
wrap = "root"
text = "PC_OBSERVABLE cohesive_energy --species H --target 2 --weight 1 --hotvar a0 1.5 2.5 --unconverged const x"
error = "PC_OBSERVABLE: flag '--unconverged const' expected a finite number, got 'x'"

# ============================================================== LOSS ====

[[key]]
id = "ROOT.LOSS"
name = "LOSS"
blocks = ["ROOT"]
synopsis = "LOSS <function> [<param>]"
repeat = "error"
repeat_msg = "LOSS is set twice (first on line {first_line}) and no PC_LAMMPS or PC_FAILPROBE line between takes the first; each key is given once"
repeat_doc = "Again only after a PC_LAMMPS or PC_FAILPROBE line, which takes the value given above it; a second line with no such line between is refused."
default = { literal = "L2" }
doc = """\
The loss function of the validation metric terms (PC_EMAE, PC_ERMSE and \
the others), and the default loss function of a --varloss term."""
long_doc = """\
The name is one of the loss functions below, in any case; HUBER \
and TUKEY take an optional positive parameter. The loss function of a \
PC_OBSERVABLE line is its --loss (L2 by default)."""
quirk = """\
A PC_LAMMPS line takes the LOSS of the lines read before it as the \
default of its --varloss terms, while the metric terms take the last \
LOSS line wherever it is."""
checks = [
  { msg = "LOSS requires a loss type", doc = "At the line: no loss function follows the key." },
  { msg = "LossFunction::from_string: unknown type '{tok}'", doc = "At the line: a name that is no loss function, in any case." },
  { msg = "LOSS {name}: parameter '{tok}' is not a number{underflow}", doc = "At the line: a parameter that is no number of the number grammar." },
  { msg = "loss {name} takes no parameter (got {count})", doc = "At the line: a parameter of a loss function that takes none; {count} is the number given." },
  { msg = "loss {name} takes at most {max} parameter (got {count})", doc = "At the line: more parameters than the loss function takes." },
  { msg = "loss {name} parameter ({key}) must be finite and > 0 (got {value}); omit it to use the default {default}", doc = "At the line: a parameter of HUBER or TUKEY that is 0, negative or not finite; {key} is delta or c." },
]

[[key.args]]
name = "function"
kind = "loss"

[[key.examples]]
wrap = "root"
text = "LOSS HUBER 20"

[[key.examples]]
doc = "A loss function without a parameter, in lower case."
wrap = "root"
text = "LOSS log_cosh"

[[key.invalid]]
wrap = "root"
text = "LOSS"
error = "LOSS requires a loss type"

[[key.invalid]]
wrap = "root"
text = "LOSS FOO"
error = "LossFunction::from_string: unknown type 'FOO'"

[[key.invalid]]
wrap = "root"
text = "LOSS HUBER x"
error = "LOSS HUBER: parameter 'x' is not a number"

[[key.invalid]]
wrap = "root"
text = "LOSS L2 1"
error = "loss L2 takes no parameter (got 1)"

[[key.invalid]]
wrap = "root"
text = "LOSS TUKEY 1 2"
error = "loss TUKEY takes at most 1 parameter (got 2)"

[[key.invalid]]
wrap = "optimizer"
text = "LOSS L1"
error = "unknown key 'LOSS' in this block"

[[key.invalid]]
wrap = "root"
at = 2
text = '''
LOSS L1
LOSS L2'''
error = "LOSS is set twice (first on line 1) and no PC_LAMMPS or PC_FAILPROBE line between takes the first; each key is given once"

[[loss_function]]
id = "LOSS.L1"
name = "L1"
doc = "The weight times the absolute difference of the measured value and the target."

[[loss_function.examples]]
wrap = "root"
text = "LOSS L1"

[[loss_function]]
id = "LOSS.L2"
name = "L2"
doc = "The weight times the squared difference of the measured value and the target."

[[loss_function.examples]]
wrap = "root"
text = "LOSS L2"

[[loss_function]]
id = "LOSS.LOG_COSH"
name = "LOG_COSH"
doc = "The weight times ln(cosh(r)), where r is the difference of the measured value and the target."

[[loss_function.examples]]
wrap = "root"
text = "LOSS LOG_COSH"

[[loss_function]]
id = "LOSS.MAPE"
name = "MAPE"
doc = """\
The weight times the absolute difference of the measured value and the \
target, divided by the absolute measured value (plus 1e-12)."""

[[loss_function.examples]]
wrap = "root"
text = "LOSS MAPE"

[[loss_function]]
id = "LOSS.HUBER"
name = "HUBER"
doc = """\
The weight times r^2/2 for a difference r of the measured value and the \
target with |r| <= delta, and times delta (|r| - delta/2) beyond it."""

[[loss_function.params]]
name = "delta"
default = 50.0
gt = 0.0
doc = "The difference at which the loss turns from quadratic to linear."

[[loss_function.examples]]
wrap = "root"
text = "LOSS HUBER"

[[loss_function.invalid]]
wrap = "root"
text = "LOSS HUBER 0"
error = "loss HUBER parameter (delta) must be finite and > 0 (got 0); omit it to use the default 50"
msg_of = "ROOT.LOSS"

[[loss_function]]
id = "LOSS.RMSLE"
name = "RMSLE"
doc = """\
The weight times the squared difference of ln(measured + 1e-12) and \
ln(target + 1e-12). A measured value or a target at or below -1e-12 fails \
the evaluation, and the startup checks do not refuse such a target."""

[[loss_function.examples]]
wrap = "root"
text = "LOSS RMSLE"

[[loss_function]]
id = "LOSS.TUKEY"
name = "TUKEY"
doc = """\
The weight times 1 - (1 - (r/c)^2)^3 for a difference r of the measured \
value and the target with |r| <= c, and the weight beyond it."""

[[loss_function.params]]
name = "c"
default = 4.685
gt = 0.0
doc = "The difference beyond which the loss stays at the weight."

[[loss_function.examples]]
wrap = "root"
text = "LOSS TUKEY 2"

[[loss_function.invalid]]
wrap = "root"
text = "LOSS TUKEY -1"
error = "loss TUKEY parameter (c) must be finite and > 0 (got -1); omit it to use the default 4.685"
msg_of = "ROOT.LOSS"

# ============================================================= OPTIM ====

[[key]]
id = "ROOT.OPTIM"
name = "OPTIM"
blocks = ["ROOT"]
synopsis = "OPTIM <KEY> (<indices>) <low> <high> [LIN | LOG | ASINH <c>]"
repeat = "add"
doc = """\
A search parameter: the values of a training-configuration key that the \
indices select, each searched in a box, the explicit <low> <high> or one \
that AUTO derives from the value of the configuration."""
long_doc = """\
Each value of a key is selected by one OPTIM line; several lines of one \
key select different values. Some keys are refused as search \
parameters, such as the structure keys of the potential. A file without \
an OPTIM line runs with a TADAH optimiser only: NLOPT, DLIB, CERES and \
ASA refuse it at startup."""
quirk = """\
The key, the AUTO option names and the shape tags are read in any case \
(OPTIM cgrid2b (1) 1 2 log), while every other key of the target file is \
matched as written."""

[[key.args]]
name = "KEY"
kind = "name"
doc = "A key of the training configuration, or the path of a DM_Embed parameter."

[[key.args]]
name = "indices"
kind = "indices"

[[key.args]]
name = "low"
kind = "number"
doc = "The lower end of the box; in the AUTO form, AUTO and its options in place of both ends."

[[key.args]]
name = "high"
kind = "number"
doc = "The upper end of the box, above the lower end."

[[key.examples]]
wrap = "root"
text = "OPTIM CGRID2B (2) 1.5 2.5"

[[key.examples]]
doc = "The key and the shape tag in lower case."
wrap = "root"
text = "OPTIM cgrid2b (2) 1.5 2.5 log"

[[key.invalid]]
wrap = "strategy"
text = "OPTIM CGRID2B (2) 1.5 2.5"
error = "unknown key 'OPTIM' inside STRATEGY block"

[optim]
doc = """\
An OPTIM line selects values of a key of the training configuration with \
an index list and searches each in a box. The indices count the numeric \
values of the key from 1; for FIXWEIGHT they name model weights, those \
FIXINDEX lists."""
long_doc = """\
The index list is one or more entries separated by commas, each an index \
n, a range a-b or a range with a stride a-b:s, without a repeated index; \
blanks inside the parentheses are allowed. A key with a dot names a \
parameter of a DM_Embed component (a DESCRIPTOR block), such as \
H.DENSITY.CENTRES. The key is upper-cased, and each value of a key is \
selected by one line. Every number is a finite number of the number \
grammar."""
synopsis = [
  "OPTIM <KEY> (<indices>) <low> <high> [LIN | LOG | ASINH <c>]",
  "OPTIM <KEY> (<indices>) AUTO [RATIO <f> | FRAC <p>] [FLOOR <a>] [GROUP_FLOOR <r>] [LIN | LOG | ASINH <c>]",
]
positive_only = ["SGRID2B", "SGRIDMB", "SEMBFUNC"]
auto_excluded_prefix = "RCUT"

[[optim.checks]]
msg = "Failed to read key from input."
doc = "The line has no key."

[[optim.checks]]
msg = "Expected (indices)"
doc = "No index list in parentheses follows the key."

[[optim.checks]]
msg = "Unmatched opening parenthesis in index selector"
doc = "The index list has no closing parenthesis."

[[optim.checks]]
msg = "Nested parentheses in index selector"
doc = "The index list holds an opening parenthesis."

[[optim.checks]]
msg = "Empty index selector"
doc = "The parentheses hold no index."

[[optim.checks]]
msg = "Expected whitespace after (indices)"
doc = "A token is joined to the closing parenthesis."

[[optim.checks]]
msg = "Only one (indices) selector is accepted"
doc = "A token after the index list holds a parenthesis."

[[optim.checks]]
msg = "OPTIM {key}: expected `(indices) <low> <high>` or `(indices) AUTO ...` (got {count} token(s))"
doc = "Nothing follows the index list."

[[optim.checks]]
msg = "OPTIM {key}: bad index list ({indices}): {why}"
doc = """\
The index list is not valid; {why} is "OPTIM indices start at 1", \
"Invalid index number '<n>'", "Descending index range '<a-b>'", \
"Duplicate index in '<list>'" or "Index stride must be positive"."""

[[optim.checks]]
msg = "Key not allowed: {key}"
doc = "The key is not a key of the training configuration."

[[optim.checks]]
msg = "Key not found in the Context object: {key}"
doc = "The training configuration does not hold the key."

[[optim.checks]]
msg = "DM_Embed: unknown, inactive or discrete parameter '{key}'"
doc = "A key with a dot names no continuous parameter of a DM_Embed component."

[[optim.checks]]
msg = "OPTIM {key} is not a valid search target: {key} is an internal key, a value tadah computes itself (no configuration sets it, so no evaluation can take a candidate value of it)."
doc = "The key is one that tadah computes, such as DSIZE or RCUTMAX."

[[optim.checks]]
msg = "OPTIM {key} ({index}) is not a valid search target: value {index} of {key} is an integer ({key} takes {list}), a discrete value rather than a continuous parameter; set it in the -c potential/configuration."
doc = "The selected value is an integer in every format of the key; {list} names the formats."

[[optim.checks]]
msg = "OPTIM {key} ({index}): Out of bound index: {index}{note}"
doc = """\
The key has fewer numeric values than the index. {note} is empty when the \
potential given with -c holds only values its descriptors read. Otherwise \
the run leaves the other values out, and {note} says in parentheses which, \
that the indices address the values kept, and the index among them of the \
value at the given index when it is kept."""

[[optim.checks]]
msg = "OPTIM {key} ({index}): the index is already selected by the OPTIM {key} line on line {line} (OPTIM keys are case-insensitive); give each index one OPTIM line"
doc = "An earlier OPTIM line of the key selects the value."

[[optim.checks]]
msg = "OPTIM {key} ({index}): OPTIM {key} ({index}): the low bound {low} is not > 0, but {what} requires {value}; use a low bound > 0"
doc = """\
A box of a value that must be positive reaches 0; {what} names the rule \
and {value} what it requires. The values are a width of a radial bump \
basis (SGRID2B of D2_Blip and D2_Blip5, SGRIDMB of a Blip or Blip5 \
density) and a positive DM_Embed parameter. So are WATOM under RHOFORM \
NONNEG or MONOTONE, and SGRIDMB under MONOTONE and, for the Gaussian \
basis, under NONNEG."""

[[optim.checks]]
msg = "OPTIM {key} ({index}): OPTIM {key} ({index}): the low bound {low} is negative, but {what} requires {value}; use a low bound >= 0 (0 is allowed) or AUTO"
doc = """\
A box of a non-negative value reaches below 0: AMPGRIDMB under RHOFORM \
NONNEG or MONOTONE, or the amplitudes of a DM_Embed density with \
non-negative amplitudes."""

[[optim.checks]]
msg = "OPTIM FIXWEIGHT requires FIXINDEX in the training configuration (FIXINDEX names which model weights the FIXWEIGHT values pin)."
doc = "At the line: OPTIM FIXWEIGHT with a training configuration without FIXINDEX."
[[optim.examples]]
wrap = "root"
text = "OPTIM CGRID2B (2) 1.5 2.5"

[[optim.examples]]
wrap = "root"
doc = "Two lines of one key select different values."
text = '''
OPTIM SGRID2B (1) 0.25 0.75
OPTIM SGRID2B (2) 0.5 1.5'''

[[optim.examples]]
wrap = "root"
context = "lines_dm_embed"
doc = "A key with a dot names a parameter of a DM_Embed component."
text = "OPTIM H.DENSITY.CENTRES (1) 0.5 1.5"

[[optim.examples]]
doc = "A DM_Embed path in lower case, upper-cased as the key is, and an index range."
wrap = "root"
context = "lines_dm_embed"
text = "OPTIM h.density.eta (1-2) AUTO"

[[optim.invalid]]
wrap = "root"
text = "OPTIM"
error = "Failed to read key from input."

[[optim.invalid]]
wrap = "root"
text = "OPTIM CGRID2B 2 1.5 2.5"
error = "Expected (indices)"

[[optim.invalid]]
wrap = "root"
text = "OPTIM CGRID2B (2 1.5 2.5"
error = "Unmatched opening parenthesis in index selector"
msg_of = "OPTIM"

[[optim.invalid]]
wrap = "root"
text = "OPTIM CGRID2B ((2) 1.5 2.5"
error = "Nested parentheses in index selector"
msg_of = "OPTIM"

[[optim.invalid]]
wrap = "root"
text = "OPTIM CGRID2B ( ) 1.5 2.5"
error = "Empty index selector"
msg_of = "OPTIM"

[[optim.invalid]]
wrap = "root"
text = "OPTIM CGRID2B (2)1.5 2.5"
error = "Expected whitespace after (indices)"
msg_of = "OPTIM"

[[optim.invalid]]
wrap = "root"
text = "OPTIM CGRID2B (1) (2) 0.5 1.5"
error = "Only one (indices) selector is accepted"

[[optim.invalid]]
wrap = "root"
text = "OPTIM CGRID2B (2)"
error = "OPTIM CGRID2B: expected `(indices) <low> <high>` or `(indices) AUTO ...` (got 0 token(s))"

[[optim.invalid]]
wrap = "root"
text = "OPTIM CGRID2B (0) 0.5 1.5"
error = "OPTIM CGRID2B: bad index list (0): OPTIM indices start at 1"

[[optim.invalid]]
wrap = "root"
text = "OPTIM CGRID2B (a) 0.5 1.5"
error = "OPTIM CGRID2B: bad index list (a): Invalid index number 'a'"

[[optim.invalid]]
wrap = "root"
text = "OPTIM CGRID2B (2-1) 0.5 1.5"
error = "OPTIM CGRID2B: bad index list (2-1): Descending index range '2-1'"

[[optim.invalid]]
wrap = "root"
text = "OPTIM CGRID2B (1, 1) 0.5 1.5"
error = "OPTIM CGRID2B: bad index list (1, 1): Duplicate index in '1, 1'"

[[optim.invalid]]
wrap = "root"
text = "OPTIM CGRID2B (1-2:0) 0.5 1.5"
error = "OPTIM CGRID2B: bad index list (1-2:0): Index stride must be positive"

[[optim.invalid]]
wrap = "root"
text = "OPTIM FOO (1) 0 1"
error = "Key not allowed: FOO"

[[optim.invalid]]
wrap = "root"
text = "OPTIM CGRIDMB (1) 0 2"
error = "Key not found in the Context object: CGRIDMB"

[[optim.invalid]]
wrap = "root"
text = "OPTIM X.Y (1) 0 1"
error = "DM_Embed: unknown, inactive or discrete parameter 'X.Y'"

[[optim.invalid]]
wrap = "root"
text = "OPTIM DSIZE (1) 0 2"
error = "OPTIM DSIZE is not a valid search target: DSIZE is an internal key, a value tadah computes itself (no configuration sets it, so no evaluation can take a candidate value of it)."

[[optim.invalid]]
wrap = "root"
text = "OPTIM VERBOSE (1) 0 2"
error = "OPTIM VERBOSE (1) is not a valid search target: value 1 of VERBOSE is an integer (VERBOSE takes UINT), a discrete value rather than a continuous parameter; set it in the -c potential/configuration."

[[optim.invalid]]
wrap = "root"
text = "OPTIM CGRID2B (3) 1.5 2.5"
error = "OPTIM CGRID2B (3): Out of bound index: 3"

[[optim.invalid]]
wrap = "end"
text = "OPTIM CGRID2B (1) 0.5 1.5"
error = "OPTIM CGRID2B (1): the index is already selected by the OPTIM CGRID2B line on line 1 (OPTIM keys are case-insensitive); give each index one OPTIM line"

[[optim.invalid]]
wrap = "end"
text = "OPTIM cgrid2b (1) 0.5 1.5"
error = "OPTIM CGRID2B (1): the index is already selected by the OPTIM CGRID2B line on line 1 (OPTIM keys are case-insensitive); give each index one OPTIM line"

[[optim.invalid]]
wrap = "root"
context = "lines_blip"
text = "OPTIM SGRID2B (1) 0 2"
error = "OPTIM SGRID2B (1): OPTIM SGRID2B (1): the low bound 0 is not > 0, but the D2_Blip pair basis requires every SGRID2B width > 0 (a radial bump spans [c - w/s, c + w/s]; a width <= 0 has no support edge); use a low bound > 0"

[[optim.invalid]]
wrap = "root"
context = "lines_ream"
text = "OPTIM WATOM (1) 0 2"
error = "OPTIM WATOM (1): OPTIM WATOM (1): the low bound 0 is not > 0, but RHOFORM NONNEG requires every density pair weight W > 0; use a low bound > 0"

[[optim.invalid]]
wrap = "root"
context = "lines_ream"
text = "OPTIM AMPGRIDMB (2) -0.1 0.5"
error = "OPTIM AMPGRIDMB (2): OPTIM AMPGRIDMB (2): the low bound -0.1 is negative, but RHOFORM NONNEG requires every AMPGRIDMB amplitude >= 0; use a low bound >= 0 (0 is allowed) or AUTO"

# ---------------------------------------------------- OPTIM forms ------

[[form]]
id = "OPTIM.range"
line = "OPTIM"
synopsis = "OPTIM <KEY> (<indices>) <low> <high> [LIN | LOG | ASINH <c>]"
doc = "The box [<low>, <high>] for every value the indices select; <high> is greater than <low>."

[[form.args]]
name = "indices"
kind = "indices"

[[form.args]]
name = "low"
kind = "number"
msg = "OPTIM {key}: <low> must be a finite number (got '{tok}'){underflow}"

[[form.args]]
name = "high"
kind = "number"
msg = "OPTIM {key}: <high> must be a finite number (got '{tok}'){underflow}"

[[form.checks]]
msg = "OPTIM {key}: unexpected token(s) '{text}' -- the grammar is OPTIM <KEY> (indices) <low> <high> [LIN | LOG | ASINH <c>] or OPTIM <KEY> (indices) AUTO [RATIO <f> | FRAC <p>] [FLOOR <a>] [GROUP_FLOOR <r>] [LIN | LOG | ASINH <c>]"
doc = "The tokens after the index list, less a shape tag, are not two."

[[form.checks]]
msg = "Error: Highbound must be greater than lowbound: {low}>={high}\n"
doc = "<high> is not greater than <low>."

[[form.checks]]
msg = "OPTIM {name}: transformed bounds are degenerate ({kind}: [{low}, {high}])"
doc = """\
The box, in the coordinate of its shape tag, is empty or not finite; the \
message has no line frame. {name} is the key, with [<index>] for a key \
of more than one value."""

[[form.checks]]
msg = "OPTIM {name}: LOG scale requires low > 0 (got {low}); use ASINH <c> for sign-crossing ranges"
doc = "Once the file is read: a LOG box whose lower bound is 0 or below."
[[form.examples]]
wrap = "root"
text = "OPTIM CGRID2B (2) 1.5 2.5"

[[form.examples]]
doc = "Two values in one box, with the ASINH shape of scale 0.1."
wrap = "root"
text = "OPTIM SGRID2B (1-2) -0.5 1.5 ASINH 0.1"

[[form.invalid]]
wrap = "root"
text = "OPTIM CGRID2B (2) 1.5"
error = "OPTIM CGRID2B: unexpected token(s) '1.5' -- the grammar is OPTIM <KEY> (indices) <low> <high> [LIN | LOG | ASINH <c>] or OPTIM <KEY> (indices) AUTO [RATIO <f> | FRAC <p>] [FLOOR <a>] [GROUP_FLOOR <r>] [LIN | LOG | ASINH <c>]"

[[form.invalid]]
wrap = "root"
text = "OPTIM CGRID2B (2) 1 2 LIN LOG"
error = "OPTIM CGRID2B: unexpected token(s) '1 2 LIN' -- the grammar is OPTIM <KEY> (indices) <low> <high> [LIN | LOG | ASINH <c>] or OPTIM <KEY> (indices) AUTO [RATIO <f> | FRAC <p>] [FLOOR <a>] [GROUP_FLOOR <r>] [LIN | LOG | ASINH <c>]"

[[form.invalid]]
wrap = "root"
text = "OPTIM CGRID2B (2) x 2"
error = "OPTIM CGRID2B: <low> must be a finite number (got 'x')"

[[form.invalid]]
wrap = "root"
text = "OPTIM CGRID2B (2) 1e-400 2"
error = "OPTIM CGRID2B: <low> must be a finite number (got '1e-400') (too small: its magnitude is below the smallest normal double, 2.2250738585072014e-308)"

[[form.invalid]]
wrap = "root"
text = "OPTIM CGRID2B (2) 1 inf"
error = "OPTIM CGRID2B: <high> must be a finite number (got 'inf')"

[[form.invalid]]
wrap = "root"
text = "OPTIM CGRID2B (2) 2.5 1.5"
error = "Error: Highbound must be greater than lowbound: 2.5>=1.5\n"

[[form.invalid]]
wrap = "root"
at = "none"
text = "OPTIM CGRID2B (2) 0 3 LOG"
error = "OPTIM CGRID2B[2]: LOG scale requires low > 0 (got 0); use ASINH <c> for sign-crossing ranges"

[[form.invalid]]
wrap = "root"
at = "none"
text = "OPTIM CGRID2B (2) 1 1e300 ASINH 1e-300"
error = "OPTIM CGRID2B[2]: transformed bounds are degenerate (ASINH: [691.469, inf])"

[[form]]
id = "OPTIM.AUTO"
line = "OPTIM"
word = "AUTO"
synopsis = "OPTIM <KEY> (<indices>) AUTO [RATIO <f> | FRAC <p>] [FLOOR <a>] [GROUP_FLOOR <r>] [LIN | LOG | ASINH <c>]"
doc = """\
A box around the value x0 of the configuration for every value the \
indices select: [x0/f, x0*f] under RATIO, x0 +/- d under FRAC, with \
d = max(p|x0|, a, r max|x0|) and the maximum over the values of the line."""
long_doc = """\
Without RATIO or FRAC the rule is RATIO 2 for the keys whose values stay \
positive (SGRID2B, SGRIDMB, SEMBFUNC) and for a positive DM_Embed \
parameter other than an amplitude, and FRAC 0.5 for the others. The \
non-negative amplitudes (AMPGRIDMB under RHOFORM NONNEG or MONOTONE, a \
DM_Embed density with non-negative amplitudes) keep a FRAC box at or \
above 0, and take GROUP_FLOOR 1e-3 when the line sets neither FLOOR nor \
GROUP_FLOOR. A cutoff key (a key that starts with RCUT) takes no AUTO \
box. hpo_optim_resolved.hpo records the boxes as explicit lines. The \
option names are read in any case."""
quirk = """\
An unknown word followed by a token that is no number gets the message \
that AUTO <WORD> must be a finite number, not the message about an \
unexpected option."""

[[form.args]]
name = "indices"
kind = "indices"

[[form.checks]]
msg = "OPTIM {key}: AUTO option '{tok}' needs a value -- the grammar is OPTIM <KEY> (indices) <low> <high> [LIN | LOG | ASINH <c>] or OPTIM <KEY> (indices) AUTO [RATIO <f> | FRAC <p>] [FLOOR <a>] [GROUP_FLOOR <r>] [LIN | LOG | ASINH <c>]"
doc = "An option ends the line without its value."

[[form.checks]]
msg = "OPTIM {key}: AUTO {option} must be a finite number (got '{tok}'){underflow}"
doc = """\
The value of an option, or the token after a word that is no option, is \
not a number; {option} is the word upper-cased."""

[[form.checks]]
msg = "OPTIM {key}: unexpected AUTO option '{tok}' -- the grammar is OPTIM <KEY> (indices) <low> <high> [LIN | LOG | ASINH <c>] or OPTIM <KEY> (indices) AUTO [RATIO <f> | FRAC <p>] [FLOOR <a>] [GROUP_FLOOR <r>] [LIN | LOG | ASINH <c>]"
doc = """\
A word followed by a number is not an AUTO option."""

[[form.checks]]
msg = "OPTIM {key}: AUTO boxes are not allowed on cutoff keys (the neighbour list is sized from an explicit high bound); give explicit bounds"
doc = "The key starts with RCUT."

[[form.checks]]
msg = "OPTIM {key} ({index}): OPTIM {key} ({index}): the seed {value} is negative, but {what} requires every AMPGRIDMB amplitude >= 0"
doc = "A non-negative amplitude has a negative value in the configuration; {what} is the RHOFORM line."

[[form.checks]]
msg = "OPTIM {key} ({index}): OPTIM {key} ({index}): AUTO box [{low}, {high}] is not positive but the dim is tagged LOG; use RATIO (geometric) or drop the tag"
doc = "The line has the shape tag LOG and the AUTO box reaches 0 or below."

[[form.examples]]
wrap = "root"
text = "OPTIM SGRID2B (1,2) AUTO"

[[form.examples]]
doc = "FRAC 0.2 and the LOG shape, in lower case."
wrap = "root"
text = "OPTIM CGRID2B (2) auto frac 0.2 log"

[[form.invalid]]
wrap = "root"
text = "OPTIM CGRID2B (2) AUTO RATIO"
error = "OPTIM CGRID2B: AUTO option 'RATIO' needs a value -- the grammar is OPTIM <KEY> (indices) <low> <high> [LIN | LOG | ASINH <c>] or OPTIM <KEY> (indices) AUTO [RATIO <f> | FRAC <p>] [FLOOR <a>] [GROUP_FLOOR <r>] [LIN | LOG | ASINH <c>]"

[[form.invalid]]
wrap = "root"
text = "OPTIM CGRID2B (2) AUTO ratio x"
error = "OPTIM CGRID2B: AUTO RATIO must be a finite number (got 'x')"

[[form.invalid]]
wrap = "root"
text = "OPTIM CGRID2B (2) AUTO BOGUS 1"
error = "OPTIM CGRID2B: unexpected AUTO option 'BOGUS' -- the grammar is OPTIM <KEY> (indices) <low> <high> [LIN | LOG | ASINH <c>] or OPTIM <KEY> (indices) AUTO [RATIO <f> | FRAC <p>] [FLOOR <a>] [GROUP_FLOOR <r>] [LIN | LOG | ASINH <c>]"

[[form.invalid]]
wrap = "root"
text = "OPTIM RCUT2B (1) AUTO"
error = "OPTIM RCUT2B: AUTO boxes are not allowed on cutoff keys (the neighbour list is sized from an explicit high bound); give explicit bounds"

[[form.invalid]]
wrap = "root"
context = "lines_ream"
text = "OPTIM AMPGRIDMB (3) AUTO"
error = "OPTIM AMPGRIDMB (3): OPTIM AMPGRIDMB (3): the seed -0.1 is negative, but RHOFORM NONNEG requires every AMPGRIDMB amplitude >= 0"

[[form.invalid]]
wrap = "root"
text = "OPTIM CGRID2B (2) AUTO FRAC 1.5 LOG"
error = "OPTIM CGRID2B (2): OPTIM CGRID2B (2): AUTO box [-1, 5] is not positive but the dim is tagged LOG; use RATIO (geometric) or drop the tag"

[[form.invalid]]
wrap = "root"
context = "lines_ream"
text = "OPTIM AMPGRIDMB (2) AUTO FRAC 2 LOG"
error = "OPTIM AMPGRIDMB (2): OPTIM AMPGRIDMB (2): AUTO box [0, 0.9] is not positive but the dim is tagged LOG; use RATIO (geometric) or drop the tag"

[[form.invalid]]
wrap = "root"
doc = "An unknown word followed by a token that is no number."
text = "OPTIM CGRID2B (2) AUTO BOGUS x"
error = "OPTIM CGRID2B: AUTO BOGUS must be a finite number (got 'x')"

# ---------------------------------------------- the AUTO options ------

[[line_option]]
id = "OPTIM.AUTO.RATIO"
option = "RATIO"
lines = ["OPTIM.AUTO"]
synopsis = "RATIO <f>"
repeat = "error"
repeat_msg = "OPTIM {key}: RATIO and FRAC are mutually exclusive"
default = { text = "RATIO 2 for SGRID2B, SGRIDMB and SEMBFUNC, whose values stay positive, and for a positive DM_Embed parameter other than an amplitude; FRAC 0.5 otherwise" }
doc = "The geometric box [x0/f, x0*f] (mirrored for x0 < 0), for a factor f > 1."
quirk = "A second RATIO on the line is refused with the message for RATIO beside FRAC."

[[line_option.args]]
name = "f"
kind = "number"

[[line_option.checks]]
msg = "OPTIM {key}: AUTO RATIO must be > 1 (got {tok})"
doc = "f is 1 or less."

[[line_option.checks]]
msg = "OPTIM {key} ({index}): OPTIM {key} ({index}): AUTO RATIO needs a non-zero seed; use FRAC + FLOOR"
doc = "A selected value is 0 in the configuration."

[[line_option.checks]]
msg = "OPTIM {key} ({index}): AUTO RATIO under {what} needs every seed on the line > 0 (got {value}); use FRAC (the default), whose box is clamped at 0"
doc = "A non-negative amplitude of the line is 0 in the configuration; {what} is the RHOFORM line."

[[line_option.examples]]
wrap = "root"
text = "OPTIM CGRID2B (2) AUTO RATIO 1.5"

[[line_option.invalid]]
wrap = "root"
text = "OPTIM CGRID2B (2) AUTO RATIO 1"
error = "OPTIM CGRID2B: AUTO RATIO must be > 1 (got 1)"

[[line_option.invalid]]
wrap = "root"
text = "OPTIM CGRID2B (2) AUTO RATIO 2 RATIO 3"
error = "OPTIM CGRID2B: RATIO and FRAC are mutually exclusive"

[[line_option.invalid]]
wrap = "root"
context = "lines_zero_seed"
text = "OPTIM CGRID2B (1) AUTO RATIO 2"
error = "OPTIM CGRID2B (1): OPTIM CGRID2B (1): AUTO RATIO needs a non-zero seed; use FRAC + FLOOR"

[[line_option.invalid]]
wrap = "root"
context = "lines_ream"
text = "OPTIM AMPGRIDMB (1-2) AUTO RATIO 2"
error = "OPTIM AMPGRIDMB (1): AUTO RATIO under RHOFORM NONNEG needs every seed on the line > 0 (got 0.0); use FRAC (the default), whose box is clamped at 0"

[[line_option]]
id = "OPTIM.AUTO.FRAC"
option = "FRAC"
lines = ["OPTIM.AUTO"]
synopsis = "FRAC <p>"
repeat = "error"
repeat_msg = "OPTIM {key}: RATIO and FRAC are mutually exclusive"
default = { text = "FRAC 0.5 for the keys that RATIO 2 does not apply to" }
doc = """\
The linear box x0 +/- d with d = max(p|x0|, a, r max|x0|), for p >= 0; \
FRAC 0 with FLOOR gives every value the half-width a."""
quirk = "A second FRAC on the line is refused with the message for RATIO beside FRAC."

[[line_option.args]]
name = "p"
kind = "number"

[[line_option.checks]]
msg = "OPTIM {key}: AUTO FRAC must be >= 0 (got {tok}); FRAC 0 with FLOOR/GROUP_FLOOR gives a constant absolute half-width"
doc = "p is negative."

[[line_option.checks]]
msg = "OPTIM {key} ({index}): OPTIM {key} ({index}): AUTO FRAC gives a zero-width box (seed 0 or FRAC 0); set FLOOR or GROUP_FLOOR"
doc = "d is 0."

[[line_option.checks]]
msg = "OPTIM {key} ({index}): OPTIM {key} ({index}): AUTO FRAC gives a zero-width box (seed 0 or FRAC 0); every seed on this line is 0, so GROUP_FLOOR has nothing to scale; set FLOOR"
doc = "d is 0 with a GROUP_FLOOR, every value of the line being 0."

[[line_option.checks]]
msg = "OPTIM {key} ({index}): OPTIM {key} ({index}): every seed on this line is 0, so the AUTO box has zero width (FRAC and the GROUP_FLOOR 1e-3 that {what} implies for AMPGRIDMB are relative to the seeds); set FLOOR <a> for the box [0, a], or give explicit bounds `OPTIM {key} ({index}) 0 <high>`"
doc = "The same for a non-negative amplitude without FLOOR or GROUP_FLOOR; {what} is the RHOFORM line."

[[line_option.examples]]
wrap = "root"
text = "OPTIM CGRID2B (2) AUTO FRAC 0.2"

[[line_option.examples]]
wrap = "none"
context = "lines_zero_seed"
doc = "FRAC 0 with FLOOR gives each value, 0 included, the half-width 0.25."
text = '''
OPTIM CGRID2B (1-2) AUTO FRAC 0 FLOOR 0.25
PC_ERMSE 0 1
OPTIMIZER
LIB NLOPT
ALGO LN_SBPLX
MAXEVAL 10
ENDOPTIMIZER'''

[[line_option.invalid]]
wrap = "root"
text = "OPTIM CGRID2B (2) AUTO FRAC -1"
error = "OPTIM CGRID2B: AUTO FRAC must be >= 0 (got -1); FRAC 0 with FLOOR/GROUP_FLOOR gives a constant absolute half-width"

[[line_option.invalid]]
wrap = "root"
text = "OPTIM CGRID2B (2) AUTO RATIO 2 FRAC 0.1"
error = "OPTIM CGRID2B: RATIO and FRAC are mutually exclusive"

[[line_option.invalid]]
wrap = "root"
text = "OPTIM CGRID2B (2) AUTO FRAC 0.1 FRAC 0.2"
error = "OPTIM CGRID2B: RATIO and FRAC are mutually exclusive"

[[line_option.invalid]]
wrap = "root"
text = "OPTIM CGRID2B (2) AUTO FRAC 0"
error = "OPTIM CGRID2B (2): OPTIM CGRID2B (2): AUTO FRAC gives a zero-width box (seed 0 or FRAC 0); set FLOOR or GROUP_FLOOR"

[[line_option.invalid]]
wrap = "root"
context = "lines_zero_seed"
text = "OPTIM CGRID2B (1) AUTO GROUP_FLOOR 0.1"
error = "OPTIM CGRID2B (1): OPTIM CGRID2B (1): AUTO FRAC gives a zero-width box (seed 0 or FRAC 0); every seed on this line is 0, so GROUP_FLOOR has nothing to scale; set FLOOR"

[[line_option.invalid]]
wrap = "root"
context = "lines_ream"
