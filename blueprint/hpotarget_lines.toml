error = "PC_LAMMPS --maxtime is given twice on this line; each option is given once"


[[line_option]]
id = "PC_LAMMPS.--hotvar"
option = "--hotvar"
lines = ["PC_LAMMPS"]
synopsis = "--hotvar <name> <min> <max> [<initial>]"
repeat = "add"
doc = """\
A LAMMPS variable that the script computes and that other scripts read. A \
script without --hotvar that reads <name> (${<name>}, v_<name>, or \
$<name> for a one-character name) runs after this one and receives its \
value as the variable <name>; the other scripts run alongside it."""
long_doc = """\
A value outside [<min>, <max>] fails the evaluation. The script itself \
receives <name> too: the last value inside the range, else <initial>, \
else the midpoint of the range. A script with a --hotvar receives no other \
line's hot value. A name is declared once, by one PC_LAMMPS line, and that \
line defines no LAMMPS variable of the name (--invar, -var, -v)."""

[[line_option.args]]
name = "name"
kind = "name"

[[line_option.args]]
name = "min"
kind = "number"
what = "--hotvar {name} <min>"

[[line_option.args]]
name = "max"
kind = "number"
what = "--hotvar {name} <max>"

[[line_option.args]]
name = "initial"
kind = "number"
optional = true
what = "--hotvar {name} <initial>"

[[line_option.checks]]
msg = "--hotvar requires <name> <min> <max> [<initial>]"
doc = "Fewer than three tokens follow the option."

[[line_option.checks]]
msg = "--hotvar: <name> must be a non-empty identifier"
doc = "The name starts with - and is not a number."

[[line_option.checks]]
msg = "--hotvar {name}: <max> must exceed <min>"
doc = "<max> is not greater than <min>."

[[line_option.checks]]
msg = "{key} --hotvar takes <name> <min> <max> [<initial>] (unexpected '{tok}')"
doc = "At the line: a token after the initial value that is no option."

[[line_option.checks]]
msg = "--hotvar {name} is declared twice on this line; each variable is declared once"
doc = "A second --hotvar of the line names the variable of the first."

[[line_option.checks]]
msg = "--hotvar {name}: the variable {name} is defined on this line by {option} {name} too; a --hotvar variable is injected as `variable {name} equal <value>`, which LAMMPS refuses for a variable of another style"
doc = "At the end of the line: an --invar, -var or -v of the line defines the variable too."
[[line_option.examples]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E -5.0 1.0 --hotvar a 1 2 --hotvar b -1 1 0"

[[line_option.invalid]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E 1 1 --hotvar a"
error = "--hotvar requires <name> <min> <max> [<initial>]"

[[line_option.invalid]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E 1 1 --hotvar -x 1 2"
error = "--hotvar: <name> must be a non-empty identifier"

[[line_option.invalid]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E 1 1 --hotvar a x 2"
error = "--hotvar a <min> must be a finite number, got 'x'"

[[line_option.invalid]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E 1 1 --hotvar a 2 1"
error = "--hotvar a: <max> must exceed <min>"

[[line_option.invalid]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E 1 1 --hotvar a 1 2 x"
error = "--hotvar a <initial> must be a finite number, got 'x'"

[[line_option.invalid]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E 1 1 --hotvar a 1 2 1.5 7"
error = "PC_LAMMPS --hotvar takes <name> <min> <max> [<initial>] (unexpected '7')"

[[line_option.invalid]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E 1 1 --hotvar a 1 2 --hotvar a 0 3"
error = "--hotvar a is declared twice on this line; each variable is declared once"

[[line_option.invalid]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E 1 1 --invar a 1.5 --hotvar a 1 2"
error = "--hotvar a: the variable a is defined on this line by --invar a too; a --hotvar variable is injected as `variable a equal <value>`, which LAMMPS refuses for a variable of another style"

[[line_option.invalid]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E 1 1 --hotvar a 1 2 -var a 1.5"
error = "--hotvar a: the variable a is defined on this line by -var a too; a --hotvar variable is injected as `variable a equal <value>`, which LAMMPS refuses for a variable of another style"


[[line_option]]
id = "PC_LAMMPS.--failvar"
option = "--failvar"
lines = ["PC_LAMMPS"]
synopsis = "--failvar <name> [<scale>]"
repeat = "add"
default = { text = "scale 1" }
doc = """\
An equal-style LAMMPS variable that measures how badly the script failed: \
0 means the script succeeded, and a value > 0 marks it failed, so the \
evaluation fails."""
long_doc = """\
In both modes hpo_run.log has a WARNING naming the variable and its \
value. Under FAILSCORE_GRADING OFF the failed evaluation scores \
FAILSCORE, and a <scale> is refused, as it only grades. Under \
FAILSCORE_GRADING ON, <scale> times the value grades the failure loss; \
the values of several --failvar options of one line add up. The \
variables of a failed script do not enter the loss."""

[[line_option.args]]
name = "name"
kind = "name"

[[line_option.args]]
name = "scale"
kind = "positive"
noun = "number"
optional = true
what = "--failvar {name} <scale>"

[[line_option.checks]]
msg = "--failvar requires <name> [<scale>]"
doc = "The option ends the line without its name."

[[line_option.checks]]
msg = "--failvar: <name> must be a non-empty identifier"
doc = "The name starts with - and is not a number."

[[line_option.checks]]
msg = "{key} --failvar takes <name> [<scale>] (unexpected '{tok}')"
doc = "At the line: a token after the scale that is no option."

[[line_option.checks]]
msg = "--failvar {name} is declared twice on this line; each variable is declared once"
doc = "A second --failvar of the line names the variable of the first."

[[line_option.checks]]
msg = "--failvar {name} {value}: the scale grades the failure, which FAILSCORE_GRADING ON does; under FAILSCORE_GRADING OFF a failed evaluation scores FAILSCORE, so the scale would have no effect (--failvar {name} alone fails the evaluation when {name} > 0)"
doc = "At startup, at the line, under FAILSCORE_GRADING OFF: the option has a scale."

[[line_option.examples]]
wrap = "root"
doc = "Under FAILSCORE_GRADING OFF, the default: a value of V above 0 fails the evaluation."
text = "PC_LAMMPS --script lines_pc.in --varloss E -5.0 1.0 --failvar V"

[[line_option.examples]]
wrap = "root"
doc = "Under FAILSCORE_GRADING ON, 0.5 times the value of V grades the failure."
text = '''
FAILSCORE 1e9
FAILSCORE_GRADING ON
PC_LAMMPS --script lines_pc.in --varloss E -5.0 1.0 --failvar V 0.5'''

[[line_option.invalid]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E 1 1 --failvar"
error = "--failvar requires <name> [<scale>]"

[[line_option.invalid]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E 1 1 --failvar -x"
error = "--failvar: <name> must be a non-empty identifier"

[[line_option.invalid]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E 1 1 --failvar V 0"
error = "--failvar V <scale> must be a positive number, got '0'"

[[line_option.invalid]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E 1 1 --failvar V 0.5 7"
error = "PC_LAMMPS --failvar takes <name> [<scale>] (unexpected '7')"

[[line_option.invalid]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E 1 1 --failvar W"
error = """\
PC_LAMMPS validation failed for script 'lines_pc.in'.
Tadah requires every --varloss/--outvar/--failvar variable to be defined in the LAMMPS script (or included files)
as an *equal-style* variable:
  variable <name> equal ...

Problems found:
  - W requested by --failvar but not defined
"""
msg_of = "ROOT.PC_LAMMPS"

[[line_option.invalid]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E 1 1 --failvar V --failvar V 2"
error = "--failvar V is declared twice on this line; each variable is declared once"

[[line_option.invalid]]
wrap = "root"
check = "startup"
doc = "A scale under FAILSCORE_GRADING OFF, the default."
text = "PC_LAMMPS --script lines_pc.in --varloss E 1 1 --failvar V 0.5"
error = "--failvar V 0.5: the scale grades the failure, which FAILSCORE_GRADING ON does; under FAILSCORE_GRADING OFF a failed evaluation scores FAILSCORE, so the scale would have no effect (--failvar V alone fails the evaluation when V > 0)"


[[line_option]]
id = "PC_LAMMPS.--ncpu"
option = "--ncpu"
lines = ["PC_LAMMPS", "PC_FAILPROBE"]
synopsis = "--ncpu <n>"
refused = """\
The scripts of the PC_LAMMPS lines run in parallel as THREADS and \
PC_ISOLATION set; a line has no rank count of its own."""
doc = "Refused: THREADS and PC_ISOLATION set the parallelism of the scripts."
checks = [
  { msg = "{key} --ncpu: a removed option: it set the MPI ranks of one script in an MPI build of Tadah! 1.5.0; THREADS sets the number of workers that run the scripts, and PC_ISOLATION whether they run in worker processes or inside the tadah process", doc = "At the line, wherever the option appears; {key} is PC_LAMMPS or PC_FAILPROBE." },
]

[[line_option.invalid]]
