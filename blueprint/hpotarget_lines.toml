kind = "indices"
optional = true
doc = "The validation datasets the line sets, counted from 1."

[[key.args]]
name = "target"
kind = "number"
what = "{key} <target>"
doc = "The value of the metric the search aims at."

[[key.args]]
name = "weight"
kind = "number"
min = 0
what = "{key} <weight>"
msg = "{key} <weight> must be a number >= 0, got '{tok}'"
doc = "The weight of the term. The loss of an evaluation is the mean of its terms, so a term of weight 0 adds 0 and still counts in the mean."

[[key.checks]]
msg = "{key} requires validation DBFILE entries"
doc = """\
When the run starts, before the validation data are read, without a \
line: the validation configuration has no DBFILE."""

[[key.checks]]
msg = "{key}: dataset {index} on line {line} is outside validation DBFILE range 1-{count}"
doc = """\
When the run starts, without a line: the largest index of the indexed \
lines, {index} on line {line}, exceeds the number of DBFILE entries of \
the validation configuration, {count}."""

[[key.checks]]
msg = "{key}: missing target and weight for:{list}"
doc = """\
When the run starts, without a line: the indexed lines give some \
datasets no target and weight; {list} has one line for each, \
"  dataset <i> (<file>)"."""

[[key.checks]]
msg = "tadah hpo: PC_FRMSE on the validation set: no dataset has a structure with forces ({list}): every structure has force weight 0 (fweight), so the force metrics have nothing to measure"
doc = """\
When the run starts, once the validation data are read, without a line: \
no validation structure has forces to measure; {list} names the files."""

[[key.checks]]
msg = "tadah hpo: PC_FRMSE ({index}) gives weight {value} to validation dataset {index} ({file}), which has no structure with forces: every one has force weight 0 (fweight). Only weight 0 is accepted for it (or the validation set without the file)"
doc = """\
When the run starts, once the validation data are read, without a line: \
an indexed line gives a weight above 0 to a dataset whose structures all \
have force weight 0."""

[[key.checks]]
msg = "{key} requires <target> <weight>"
doc = "At the line: fewer than two values follow the key and its index list."

[[key.checks]]
msg = "{key}: unknown flag '{tok}'"
doc = "At the line: a token after the weight that is no option of the metric lines."

[[key.checks]]
msg = "{key}: repeated declaration (first declared on line {first_line})"
doc = "At the line: a second line without an index list."

[[key.checks]]
msg = "{key}: cannot mix global and indexed forms"
doc = "At the line: a line with an index list and a line without one."

[[key.checks]]
msg = "{key}: duplicate assignment for dataset {index} (first declared on line {first_line})"
doc = "At the line: an index an earlier line of the key lists."

[[key.checks]]
msg = "{key}: validation indices start at 1"
doc = "At the line: an index 0."

[[key.checks]]
msg = "Invalid index number '{tok}'"
doc = "At the line: an entry of the index list that is no whole number."

[[key.checks]]
msg = "Descending index range '{tok}'"
doc = "At the line: a range a-b of the index list with b below a."
[[key.examples]]
wrap = "root"
text = "PC_FRMSE 0.1 1"

[[key.examples]]
doc = "A target and a weight per dataset: 0.1 and 1 for datasets 1 and 3, 0.2 and 0.5 for dataset 2."
wrap = "root"
text = '''
PC_FRMSE (1,3) 0.1 1
PC_FRMSE (2) 0.2 0.5'''

[[key.invalid]]
wrap = "root"
at = 2
text = '''
PC_FRMSE 0.1 1
PC_FRMSE 0.2 1'''
error = "PC_FRMSE: repeated declaration (first declared on line 1)"

[[key.invalid]]
wrap = "root"
at = 2
text = '''
PC_FRMSE (1) 0.1 1
PC_FRMSE 0.2 1'''
error = "PC_FRMSE: cannot mix global and indexed forms"

[[key.invalid]]
wrap = "root"
text = "PC_FRMSE (2-1) 0.1 1"
error = "Descending index range '2-1'"

[[key.invalid]]
wrap = "root"
text = "PC_FRMSE 0.1"
error = "PC_FRMSE requires <target> <weight>"

[[key.invalid]]
wrap = "root"
text = "PC_FRMSE 0.1 1 --skip 3"
error = "PC_FRMSE: unknown flag '--skip'"

[[key.invalid]]
wrap = "root"
at = 2
text = '''
PC_FRMSE (1,2) 0.1 1
PC_FRMSE (2) 0.2 1'''
error = "PC_FRMSE: duplicate assignment for dataset 2 (first declared on line 1)"

[[key.invalid]]
wrap = "root"
text = "PC_FRMSE (0) 0.1 1"
error = "PC_FRMSE: validation indices start at 1"

[[key.invalid]]
wrap = "root"
text = "PC_FRMSE (a) 0.1 1"
error = "Invalid index number 'a'"

[[key.invalid]]
wrap = "root"
text = "PC_FRMSE 0.1 -1"
error = "PC_FRMSE <weight> must be a number >= 0, got '-1'"

[[key.invalid]]
wrap = "lines_metric"
check = "check"
context = "lines_two_datasets"
at = "none"
text = "PC_FRMSE (1) 0.1 1"
error = "PC_FRMSE: missing target and weight for:\n  dataset 2 (dummy2.db)"

[[key.invalid]]
wrap = "lines_metric"
check = "check"
at = "none"
text = "PC_FRMSE (1-4) 0.1 1"
error = "PC_FRMSE: dataset 4 on line 1 is outside validation DBFILE range 1-1"

# ------------------------------------------------ the metric options ----

[[line_option]]
id = "PC_EMAE.--skip-above"
option = "--skip-above"
lines = ["PC_EMAE", "PC_ERMSE", "PC_ErRMSE", "PC_ERSQ", "PC_SRMSE", "PC_FRMSE"]
synopsis = "--skip-above <cap>"
repeat = "error"
repeat_msg = "{key}: repeated --skip-above"
default = { text = "no threshold" }
doc = """\
An evaluation whose metric exceeds <cap>, in the units of the metric, \
skips its PC_OBSERVABLE and PC_LAMMPS terms and scores FAILSCORE (a \
graded failure under FAILSCORE_GRADING ON)."""
long_doc = "On an indexed line the threshold applies to each dataset the line lists."

[[line_option.args]]
name = "cap"
kind = "positive"
noun = "number"
what = "{key} --skip-above"

[[line_option.checks]]
msg = "{key} --skip-above requires a positive number"
doc = "The option ends the line without its value."

[[line_option.examples]]
wrap = "root"
text = "PC_EMAE 5 1 --skip-above 50"

[[line_option.invalid]]
wrap = "root"
text = "PC_EMAE 5 1 --skip-above"
error = "PC_EMAE --skip-above requires a positive number"

[[line_option.invalid]]
wrap = "root"
text = "PC_EMAE 5 1 --skip-above 0"
error = "PC_EMAE --skip-above must be a positive number, got '0'"

[[line_option.invalid]]
wrap = "root"
text = "PC_FRMSE 0.1 1 --skip-above 2 --skip-above 3"
error = "PC_FRMSE: repeated --skip-above"

[[line_option]]
id = "PC_EMAE.--skip-rel"
option = "--skip-rel"
lines = ["PC_EMAE", "PC_ERMSE", "PC_ErRMSE", "PC_ERSQ", "PC_SRMSE", "PC_FRMSE"]
synopsis = "--skip-rel <ratio>"
repeat = "error"
repeat_msg = "{key}: repeated --skip-rel"
default = { text = "no threshold" }
doc = """\
An evaluation whose metric exceeds <ratio> times the smallest value of \
the metric so far skips its PC_OBSERVABLE and PC_LAMMPS terms and scores \
FAILSCORE (a graded failure under FAILSCORE_GRADING ON)."""
long_doc = """\
The threshold acts once a finite value of the metric has been seen; on \
an indexed line it applies to each dataset the line lists. \
Two evaluations of one point can therefore score differently, so a \
search does not answer a repeated point from the record of the run."""

[[line_option.args]]
name = "ratio"
kind = "positive"
noun = "number"
what = "{key} --skip-rel"

[[line_option.checks]]
msg = "{key} --skip-rel requires a positive number"
doc = "The option ends the line without its value."

[[line_option.examples]]
wrap = "root"
text = "PC_ERSQ 1 1 --skip-rel 2"

[[line_option.invalid]]
wrap = "root"
text = "PC_EMAE 5 1 --skip-rel"
error = "PC_EMAE --skip-rel requires a positive number"

[[line_option.invalid]]
wrap = "root"
text = "PC_EMAE 5 1 --skip-rel x"
error = "PC_EMAE --skip-rel must be a positive number, got 'x'"

[[line_option.invalid]]
wrap = "root"
text = "PC_EMAE 5 1 --skip-rel 2 --skip-rel 3"
error = "PC_EMAE: repeated --skip-rel"

# ====================================================== PC_LAMMPS =======

