[[line_option]]
id = "PC_OBSERVABLE.cohesive_energy.--fmax-converged"
option = "--fmax-converged"
lines = ["PC_OBSERVABLE.cohesive_energy"]
synopsis = "--fmax-converged <fmax>"
repeat = "error"
repeat_msg = "PC_OBSERVABLE cohesive_energy: --fmax-converged is given twice on this line; each option is given once"
default = { literal = "0.1" }
doc = """\
The force tolerance of the atoms in the relaxation, in eV/Å, a number \
> 0: the atoms have relaxed when the largest atomic force falls below it."""
long_doc = """\
In the bcc cell the atomic forces vanish by symmetry; the pressure of the \
cell is bounded by --ptol. A relaxation is converged when the cell it \
ends at meets both tolerances, also when it stops there at --maxiter, \
--maxeval or --max-wall-time. It reports the --unconverged value when it \
reaches one of these limits first, when the line search of the atoms \
finds no lower energy, or when a step of the cell falls below 1e-12 of \
the lattice constant before the pressure meets --ptol. One that --etol \
stops counts as converged when its largest atomic force is below \
--fmax-converged, whatever its pressure."""

[[line_option.args]]
name = "fmax"
kind = "number"
min = 0
min_open = true
msg = "PC_OBSERVABLE cohesive_energy: --fmax-converged takes a finite number (got '{tok}'){underflow}"

[[line_option.checks]]
msg = "PC_OBSERVABLE cohesive_energy: --fmax-converged must be > 0 (got {tok})"
doc = "The value is 0 or negative."

[[line_option.examples]]
wrap = "root"
text = "PC_OBSERVABLE cohesive_energy --species H --target 2.0 --weight 1 --hotvar a0 1.5 2.5 --fmax-converged 0.05"

[[line_option.invalid]]
