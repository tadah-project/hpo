error = "PC_LAMMPS --script is given twice on this line; each option is given once"


[[line_option]]
id = "PC_LAMMPS.--varloss"
option = "--varloss"
lines = ["PC_LAMMPS"]
synopsis = "--varloss <name> <target> <weight> [<loss> [<param>]]"
repeat = "add"
doc = """\
A loss term: the equal-style LAMMPS variable <name> of the script, \
compared with <target> by the loss function, with the weight <weight>. \
A PC_LAMMPS line has one or more."""
long_doc = """\
The weight is any finite number; a negative one is accepted. The loss \
function is the LOSS of the lines read before the PC_LAMMPS line (L2 \
without one) unless <loss> names one, with its parameter for HUBER and \
TUKEY. A value that starts with - and reads as a number (-5.0) is a \
value, not an option."""

[[line_option.args]]
name = "name"
kind = "name"

[[line_option.args]]
name = "target"
kind = "number"
what = "--varloss {name} <target>"

[[line_option.args]]
name = "weight"
kind = "number"
what = "--varloss {name} <weight>"
doc = "The weight of the term. The loss of an evaluation is the mean of its terms, so a term of weight 0 adds 0 and still counts in the mean."

[[line_option.args]]
name = "loss"
kind = "loss"
optional = true
doc = "A loss function of LOSS, in any case, and its parameter."

[[line_option.checks]]
msg = "{key} --varloss takes <name> <target> <weight> (the name is missing)"
doc = "No variable name follows the option."

[[line_option.checks]]
msg = "{key} --varloss takes <name> <target> <weight> ({name} has no target)"
doc = "No target follows the name."

[[line_option.checks]]
msg = "{key} --varloss takes <name> <target> <weight> ({name} has no weight)"
doc = "No weight follows the target."

[[line_option.checks]]
msg = "--varloss {name} {kind} parameter must be a finite number, got '{tok}'{underflow}"
doc = "A parameter of the loss function {kind}, as written, is not a number."

[[line_option.checks]]
msg = "--varloss {name} {tok}: {why}"
doc = "The loss function of the term cannot measure the target {tok}: MAPE divides by it, and it is 0, or RMSLE takes the logarithm of the target plus 1e-12, and it is at or below -1e-12; {why} says which."

[[line_option.examples]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E -5.0 1.0 --varloss S 0 -0.5 L1"

[[line_option.examples]]
doc = "A loss function of its own for this term, TUKEY with the parameter 2, in lower case."
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E -5.0 1.0 tukey 2"

[[line_option.invalid]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss"
error = "PC_LAMMPS --varloss takes <name> <target> <weight> (the name is missing)"

[[line_option.invalid]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E"
error = "PC_LAMMPS --varloss takes <name> <target> <weight> (E has no target)"

[[line_option.invalid]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E 1"
error = "PC_LAMMPS --varloss takes <name> <target> <weight> (E has no weight)"

[[line_option.invalid]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E x 1"
error = "--varloss E <target> must be a finite number, got 'x'"

[[line_option.invalid]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E 1 x"
error = "--varloss E <weight> must be a finite number, got 'x'"

[[line_option.invalid]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E 1 1 FOO"
error = "--varloss E: unknown loss function 'FOO'; the loss functions are L1, L2, LOG_COSH, MAPE, HUBER, RMSLE and TUKEY, in any case"
msg_of = "ROOT.LOSS"

[[line_option.invalid]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E 1 1 HUBER x"
error = "--varloss E HUBER parameter must be a finite number, got 'x'"

[[line_option.invalid]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E 1 1 HUBER 0"
error = "loss HUBER parameter (delta) must be finite and > 0 (got 0); omit it to use the default 50"
msg_of = "ROOT.LOSS"

[[line_option.invalid]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E 1 1 L2 3"
error = "loss L2 takes no parameter (got 1)"
msg_of = "ROOT.LOSS"

[[line_option.invalid]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E 0 1 MAPE"
error = "--varloss E 0: MAPE divides by the target, and the target is 0"

[[line_option.invalid]]
wrap = "root"
text = "PC_LAMMPS --script lines_pc.in --varloss E -1 1 rmsle"
error = "--varloss E -1: RMSLE takes ln(target + 1e-12), and the target -1 is at or below -1e-12"

[[line_option.invalid]]
wrap = "root"
at = 2
doc = "The loss function of the term is the LOSS above the line."
text = '''
LOSS MAPE
PC_LAMMPS --script lines_pc.in --varloss E 0.0 1'''
error = "--varloss E 0.0: MAPE divides by the target, and the target is 0"


[[line_option]]
id = "PC_LAMMPS.--invar"
option = "--invar"
lines = ["PC_LAMMPS", "PC_FAILPROBE"]
synopsis = "--invar <name> <value>"
repeat = "add"
doc = """\
Defines the LAMMPS variable <name> with the value <value> for the \
script, as the LAMMPS command-line option -var does."""
long_doc = "The variable maxtime is reserved for the script timeout."

[[line_option.args]]
name = "name"
kind = "name"

[[line_option.args]]
name = "value"
kind = "name"

[[line_option.checks]]
msg = "{key} --invar takes two values, the name of a LAMMPS variable and its value"
doc = "Fewer than two tokens follow the option."

[[line_option.checks]]
msg = "{key} --invar maxtime: the variable maxtime is reserved: tadah hpo passes the script's time limit to LAMMPS in it, for `timer timeout ${maxtime}`; --maxtime on this line or PC_SCRIPT_TIMEOUT sets the limit"
doc = "The variable is maxtime."

[[line_option.checks]]
msg = "{key} --invar takes <name> <value> (unexpected '{tok}')"
doc = "At the line: a token after the value that is no option."

[[line_option.checks]]
msg = "{option} {name}: the variable {name} is defined twice on this line (first by {flag} {name}); each variable is defined once"
doc = "A second --invar, -var or -v of the line defines a variable of the line again; {option} is the second, {flag} the first."
[[line_option.examples]]
