[[key]]
id = "STRATEGY.PARALLEL"
name = "PARALLEL"
blocks = ["STRATEGY"]
synopsis = "PARALLEL <n>"
args = [ { name = "n", kind = "integer", min = 1, max = "UINT64_MAX", what = "{key}" } ]
repeat = "error"
repeat_msg = "PARALLEL is set twice in the STRATEGY block (first on line {first_line}); each key is given once"
default = { literal = "1" }
doc = """\
The number of MULTISTART starts to run at the same time. The starts run \
one after another whatever its value."""
quirk = """\
PARALLEL is read and checked, but the starts of STRATEGY TYPE MULTISTART \
run one after another. A value above 1 only adds a warning to the journal \
when the starts begin."""

