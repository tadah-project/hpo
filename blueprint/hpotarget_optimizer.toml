error = "WARM: cannot open seed file 'opt_missing.tadah'. Provide the file (production submit scripts copy it into the run dir) or drop the WARM line to start from the in-config values."

[[init_method]]
id = "METHOD.NOISE_AUTO"
name = "NOISE_AUTO"
refused = "The method name is reserved and has no starting points: a METHOD line naming it is refused."
doc = "A reserved method name, refused."

[[init_method.checks]]
msg = "INIT.{key} NOISE_AUTO is not implemented (reserved keyword). Use RANDOM/LHS/SOBOL/WARM/CONFIG."
doc = "At the METHOD line; {key} is METHOD, or STRATEGY for a STRATEGY line."

[[init_method.invalid]]
wrap = "init"
text = "METHOD NOISE_AUTO"
error = "INIT.METHOD NOISE_AUTO is not implemented (reserved keyword). Use RANDOM/LHS/SOBOL/WARM/CONFIG."

[[init_method.invalid]]
wrap = "restart"
text = "STRATEGY NOISE_AUTO"
error = "INIT.STRATEGY NOISE_AUTO is not implemented (reserved keyword). Use RANDOM/LHS/SOBOL/WARM/CONFIG."

# =========================================================== NOISE keys ==

[[key]]
id = "NOISE.AUTO"
name = "AUTO"
blocks = ["NOISE"]
synopsis = "AUTO [<bool>]"
args = [ { name = "bool", kind = "bool", optional = true, what = "NOISE.AUTO" } ]
repeat = "error"
repeat_msg = "AUTO is set twice in the NOISE block (first on line {first_line}); each key is given once"
default = { literal = "false" }
doc = """\
Derives PARAM fd_step, the finite-difference step of the STRATEGY-level \
optimiser, from the size of the OPTIM boxes. AUTO alone means AUTO true."""
long_doc = """\
The step is 1e-3 times the diagonal of the boxes, divided by the square \
root of the number of search parameters. It is at least 1e-6, and it is \
measured in the coordinates of the search. A search that takes no finite-difference \
gradients is refused at startup with AUTO true, and so is a block that \
also sets PARAM fd_step. Like a PARAM fd_step, the derived step gives \
every point of every OPTIM box a stencil inside the box, or startup \
refuses it."""
checks = [
  { msg = "{phase} {lib}:{algo}: NOISE AUTO has no effect: {why}; remove AUTO from the NOISE block.", doc = "At startup, at the ENDOPTIMIZER line: the STRATEGY-level optimiser measures no slopes with finite differences; {why} says why." },
]

[[key.examples]]
wrap = "noise"
text = "AUTO"

[[key.examples]]
doc = "The same, with the boolean written."
wrap = "noise"
text = "AUTO true"

[[key.examples]]
doc = "Switched off."
wrap = "noise"
text = "AUTO OFF"

[[key.invalid]]
wrap = "noise"
text = "AUTO maybe"
error = "NOISE.AUTO: expected boolean (true/false/1/0/yes/no/on/off), got 'maybe'"

[[key.invalid]]
wrap = "noise"
text = "AUTO true false"
error = "AUTO takes a single value (unexpected 'false')"

[[key.invalid]]
wrap = "none"
check = "startup"
at = "ENDOPTIMIZER"
doc = "NLOPT:LN_SBPLX takes no gradient."
text = '''
OPTIM CGRID2B (1) 0.5 1.5
PC_ERMSE 0 1
OPTIMIZER
NOISE
AUTO true
ENDNOISE
LIB NLOPT
ALGO LN_SBPLX
MAXEVAL 10
ENDOPTIMIZER'''
error = "the STRATEGY-level optimiser NLOPT:LN_SBPLX: NOISE AUTO has no effect: NLOPT:LN_SBPLX measures no slopes; remove AUTO from the NOISE block."

[[key.invalid]]
wrap = "noise"
at = 2
text = '''
AUTO true
AUTO false'''
error = "AUTO is set twice in the NOISE block (first on line 5); each key is given once"

[[key]]
id = "NOISE.CALIBRATION"
name = "CALIBRATION"
blocks = ["NOISE"]
synopsis = "CALIBRATION <n>"
args = [ { name = "n", kind = "integer", min = 0, max = "INT_MAX", what = "{key}" } ]
repeat = "error"
repeat_msg = "CALIBRATION is set twice in the NOISE block (first on line {first_line}); each key is given once"
default = { literal = "0" }
doc = """\
Evaluates the first starting point N times before the search, reports the \
spread of the loss and suggests an FTOL_REL from it. 0 turns it off; 1 is \
refused."""
long_doc = """\
The N evaluations are written to the output files like any other, and do \
not count towards MAXEVAL."""
checks = [
  { msg = "NOISE.CALIBRATION must be 0 (off) or >= 2", doc = "A value of 1." },
]

[[key.examples]]
wrap = "noise"
text = "CALIBRATION 5"

[[key.examples]]
doc = "0 switches the calibration off."
wrap = "noise"
text = "CALIBRATION 0"

[[key.invalid]]
wrap = "noise"
text = "CALIBRATION 1"
error = "NOISE.CALIBRATION must be 0 (off) or >= 2"

[[key.invalid]]
wrap = "noise"
text = "CALIBRATION -2"
error = "CALIBRATION must be an integer from 0 to 2147483647, got '-2'"

[[key.invalid]]
wrap = "noise"
at = 2
text = '''
CALIBRATION 5
CALIBRATION 6'''
error = "CALIBRATION is set twice in the NOISE block (first on line 5); each key is given once"

# ========================================================= RESTART keys ==

[[key]]
id = "RESTART.AFTER_STAGNATION"
name = "AFTER_STAGNATION"
blocks = ["RESTART"]
synopsis = "AFTER_STAGNATION <n>"
args = [ { name = "n", kind = "integer", min = 0, max = "UINT64_MAX", what = "{key}" } ]
repeat = "error"
repeat_msg = "AFTER_STAGNATION is set twice in the RESTART block (first on line {first_line}); each key is given once"
default = { literal = "0" }
doc = """\
The number of evaluations without a better loss after which the search \
restarts from the starting points that the METHOD lines of the RESTART \
block draw."""
long_doc = """\
A restart runs the whole STRATEGY TYPE again. Without a METHOD line it \
starts from the values of the training configuration. The RESTART block \
takes effect only when AFTER_STAGNATION and MAX are both above 0."""
quirk = """\
A RESTART block with AFTER_STAGNATION or MAX left at 0 has no effect, \
without a warning."""

[[key.examples]]
wrap = "restart"
text = '''
AFTER_STAGNATION 20
MAX 3'''

[[key.invalid]]
wrap = "restart"
text = "AFTER_STAGNATION -1"
error = "AFTER_STAGNATION must be an integer >= 0, got '-1'"

[[key.invalid]]
wrap = "restart"
text = "AFTER_STAGNATION 20 3"
error = "AFTER_STAGNATION takes a single value (unexpected '3')"

[[key.invalid]]
wrap = "restart"
at = 2
text = '''
AFTER_STAGNATION 5
AFTER_STAGNATION 6'''
error = "AFTER_STAGNATION is set twice in the RESTART block (first on line 9); each key is given once"

[[key]]
id = "RESTART.MAX"
name = "MAX"
blocks = ["RESTART"]
synopsis = "MAX <n>"
args = [ { name = "n", kind = "integer", min = 0, max = "UINT64_MAX", what = "{key}" } ]
repeat = "error"
repeat_msg = "MAX is set twice in the RESTART block (first on line {first_line}); each key is given once"
default = { literal = "0" }
doc = """\
The largest number of restarts of the search. Once they are used, the \
next stagnation ends the search."""
long_doc = """\
The RESTART block takes effect only when AFTER_STAGNATION and MAX are both \
above 0. Each round runs with the whole MAXEVAL of the optimiser."""

[[key.examples]]
wrap = "restart"
text = '''
MAX 2
AFTER_STAGNATION 50'''

[[key.invalid]]
wrap = "restart"
text = "MAX x"
error = "MAX must be an integer >= 0, got 'x'"

[[key.invalid]]
wrap = "restart"
at = 2
text = '''
MAX 2
MAX 3'''
error = "MAX is set twice in the RESTART block (first on line 9); each key is given once"

# ========================================================== INNER rules ==
# The startup rules of an INNER block: the optimiser of the block around it
# runs its INNER search with NLopt. Each refusal names the ENDINNER line or
# the END line of the optimiser around the INNER search (ENDOPTIMIZER, or
# ENDEXPLORE inside EXPLORE); each rule says which.

[[rule]]
id = "RULE.inner_block_required"
title = """\
An MLSL or AUGLAG form without a default local optimiser has an INNER \
block"""
check = "startup"
keys = ["BLOCK.INNER", "OPTIMIZER.ALGO"]
msg = "{name} needs an INNER block ({phase}): NLopt has no default local optimiser for it; add INNER ... ENDINNER with LIB NLOPT and a local ALGO such as LN_BOBYQA, or use one of {list}, which run {default} without one"
doc = """\
An NLopt MLSL or AUGLAG algorithm for which NLopt has no default local \
optimiser has an INNER block."""
msg_doc = """\
The message lists the MLSL and AUGLAG forms that have a default local \
optimiser, and those optimisers."""

[[rule.invalid]]
wrap = "none"
check = "startup"
at = "ENDOPTIMIZER"
text = '''
OPTIM CGRID2B (1) 0.5 1.5
PC_ERMSE 0 1
OPTIMIZER
STRATEGY
LIB NLOPT
ALGO G_MLSL_LDS
MAXEVAL 10
ENDSTRATEGY
ENDOPTIMIZER'''
error = "NLOPT:G_MLSL_LDS needs an INNER block (the STRATEGY-level optimiser): NLopt has no default local optimiser for it; add INNER ... ENDINNER with LIB NLOPT and a local ALGO such as LN_BOBYQA, or use one of NLOPT:GD_MLSL, NLOPT:GD_MLSL_LDS, NLOPT:GN_MLSL, NLOPT:GN_MLSL_LDS, NLOPT:LD_AUGLAG, NLOPT:LD_AUGLAG_EQ, NLOPT:LN_AUGLAG, NLOPT:LN_AUGLAG_EQ, which run LD_MMA or LN_COBYLA without one"

[[rule]]
id = "RULE.inner_block_not_accepted"
title = "Only an MLSL or AUGLAG algorithm has an INNER block"
check = "startup"
keys = ["BLOCK.INNER", "OPTIMIZER.ALGO"]
msg = "{name} does not accept an INNER sub-optimiser (the INNER block of {phase}): only NLopt's MLSL and AUGLAG algorithms run a local search inside their run ({list}); remove the INNER block or pick one of them"
doc = "Only an NLopt MLSL or AUGLAG algorithm has an INNER block."

[[rule.invalid]]
wrap = "strategy"
check = "startup"
at = "ENDINNER"
text = '''
INNER
LIB NLOPT
ALGO LN_BOBYQA
ENDINNER'''
error = "NLOPT:LN_SBPLX does not accept an INNER sub-optimiser (the INNER block of the STRATEGY-level optimiser): only NLopt's MLSL and AUGLAG algorithms run a local search inside their run (NLOPT:AUGLAG, NLOPT:AUGLAG_EQ, NLOPT:GD_MLSL, NLOPT:GD_MLSL_LDS, NLOPT:GN_MLSL, NLOPT:GN_MLSL_LDS, ... (6 more)); remove the INNER block or pick one of them"

[[rule]]
id = "RULE.inner_not_nlopt"
title = "The optimiser of an INNER block is an NLopt algorithm"
check = "startup"
keys = ["BLOCK.INNER", "OPTIMIZER.LIB"]
msg = "the INNER block of {phase} names {lib}:{algo}, but {name} runs its INNER search with NLopt: set LIB NLOPT and an NLopt ALGO (such as LN_BOBYQA) inside the INNER block"
doc = "The INNER block names an NLopt algorithm: LIB is NLOPT."

[[rule.invalid]]
wrap = "none"
check = "startup"
at = "ENDINNER"
text = '''
OPTIM CGRID2B (1) 0.5 1.5
PC_ERMSE 0 1
OPTIMIZER
STRATEGY
LIB NLOPT
ALGO LN_AUGLAG
MAXEVAL 10
INNER
LIB TADAH
ALGO RANDOM
ENDINNER
ENDSTRATEGY
ENDOPTIMIZER'''
error = "the INNER block of the STRATEGY-level optimiser names TADAH:RANDOM, but NLOPT:LN_AUGLAG runs its INNER search with NLopt: set LIB NLOPT and an NLopt ALGO (such as LN_BOBYQA) inside the INNER block"

[[rule]]
id = "RULE.inner_needs_own_inner"
title = "The optimiser of an INNER block needs no INNER block of its own"
check = "startup"
keys = ["BLOCK.INNER", "OPTIMIZER.ALGO"]
msg = "the INNER block of {phase} names {lib}:{algo}, which needs an INNER block of its own; INNER blocks do not nest: pick a local algorithm such as LN_BOBYQA"
doc = "The INNER block names an algorithm that needs no INNER block of its own."

[[rule.invalid]]
wrap = "none"
check = "startup"
at = "ENDINNER"
text = '''
OPTIM CGRID2B (1) 0.5 1.5
PC_ERMSE 0 1
OPTIMIZER
STRATEGY
LIB NLOPT
ALGO LN_AUGLAG
MAXEVAL 10
INNER
LIB NLOPT
ALGO G_MLSL_LDS
MAXEVAL 5
ENDINNER
ENDSTRATEGY
ENDOPTIMIZER'''
error = "the INNER block of the STRATEGY-level optimiser names NLOPT:G_MLSL_LDS, which needs an INNER block of its own; INNER blocks do not nest: pick a local algorithm such as LN_BOBYQA"

[[rule]]
id = "RULE.inner_global_search"
title = "The optimiser of an INNER block is a local search"
check = "startup"
keys = ["BLOCK.INNER", "OPTIMIZER.ALGO"]
msg = "the INNER block of {phase}: {name} cannot run {lib}:{algo} as its INNER search: an INNER search is a local search, which {name} starts at {text}, and {what}. Use a local NLopt algorithm in the INNER block, which starts at the point it is given ({list}), or run {lib}:{algo} as the exploration (EXPLORE block) or once, as STRATEGY TYPE PLAIN."
doc = """\
The INNER block names a local algorithm, which starts at the point it is \
given."""
msg_doc = """\
The message says where the enclosing optimiser starts the INNER search: at \
the points it samples in the OPTIM box for a global optimiser, at its own \
starting point for a local one. It then says that the INNER algorithm is a \
global optimiser, or where it starts when that is not the point it is \
given."""

[[rule.invalid]]
wrap = "none"
check = "startup"
at = "ENDINNER"
text = '''
OPTIM CGRID2B (1) 0.5 1.5
PC_ERMSE 0 1
OPTIMIZER
STRATEGY
LIB NLOPT
ALGO LN_AUGLAG
MAXEVAL 10
INNER
LIB NLOPT
ALGO GN_DIRECT_L
MAXEVAL 5
ENDINNER
ENDSTRATEGY
ENDOPTIMIZER'''
error = "the INNER block of the STRATEGY-level optimiser: NLOPT:LN_AUGLAG cannot run NLOPT:GN_DIRECT_L as its INNER search: an INNER search is a local search, which NLOPT:LN_AUGLAG starts at its own starting point, and NLOPT:GN_DIRECT_L is a global optimiser that does not start at the point it is given (DIRECT evaluates the centre of the OPTIM box first and then divides the whole box; NLopt never reads that point). Use a local NLopt algorithm in the INNER block, which starts at the point it is given (NLOPT:LD_AUGLAG, NLOPT:LD_AUGLAG_EQ, NLOPT:LD_CCSAQ, NLOPT:LD_LBFGS, NLOPT:LD_MMA, NLOPT:LD_SLSQP, NLOPT:LD_TNEWTON, NLOPT:LD_TNEWTON_PRECOND, NLOPT:LD_TNEWTON_PRECOND_RESTART, NLOPT:LD_TNEWTON_RESTART, NLOPT:LD_VAR1, NLOPT:LD_VAR2, NLOPT:LN_AUGLAG, NLOPT:LN_AUGLAG_EQ, NLOPT:LN_BOBYQA, NLOPT:LN_COBYLA, NLOPT:LN_NELDERMEAD, NLOPT:LN_PRAXIS, NLOPT:LN_SBPLX), or run NLOPT:GN_DIRECT_L as the exploration (EXPLORE block) or once, as STRATEGY TYPE PLAIN."

[[rule]]
id = "RULE.local_search_needs_stop"
title = """\
The default local search of MLSL or AUGLAG has a stop when it needs one"""
check = "startup"
keys = ["OPTIMIZER.ALGO", "OPTIMIZER.MAXEVAL", "BLOCK.INNER"]
msg = "{phase}: the local search of {name} (NLopt's default {lib}:{algo}, as the block has no INNER block) needs a stop: {why}; set {list} in the {name} block, which NLopt hands on to it{note}"
doc = """\
An NLopt MLSL or AUGLAG without an INNER block runs NLopt's default local \
optimiser; when that optimiser needs a stop (the optimiser list says which \
do), the block sets one, which NLopt hands on to it. The refusal names the \
END line of its optimiser (ENDOPTIMIZER, or ENDEXPLORE for the EXPLORE \
block)."""
msg_doc = """\
The message names the default local optimiser, says why it needs a stop \
and lists the stops it honours."""

[[rule.examples]]
wrap = "none"
text = '''
OPTIM CGRID2B (1) 0.5 1.5
PC_ERMSE 0 1
OPTIMIZER
LIB NLOPT
ALGO LD_AUGLAG
MAXEVAL 10
ENDOPTIMIZER'''

[[rule.invalid]]
wrap = "none"
check = "startup"
at = "ENDOPTIMIZER"
text = '''
OPTIM CGRID2B (1) 0.5 1.5
PC_ERMSE 0 1
OPTIMIZER
LIB NLOPT
ALGO LD_AUGLAG
ENDOPTIMIZER'''
error = "the STRATEGY-level optimiser: the local search of NLOPT:LD_AUGLAG (NLopt's default NLOPT:LD_MMA, as the block has no INNER block) needs a stop: without a tolerance it has no convergence test and runs until it is interrupted; set MAXEVAL, MAXTIME, STOPVAL or a positive tolerance it honours (FTOL_REL, FTOL_ABS, XTOL_REL, XTOL_ABS) in the NLOPT:LD_AUGLAG block, which NLopt hands on to it"

[[rule]]
id = "RULE.inner_search_needs_stop"
title = "An INNER search that needs a stop has one"
check = "startup"
keys = ["BLOCK.INNER", "OPTIMIZER.ALGO", "OPTIMIZER.MAXEVAL"]
msg = "{phase}: the INNER search of {name} ({lib}:{algo}) needs a stop: {why}; set {list} in the INNER block, or {keys} in the {name} block, which NLopt hands on to it{note}"
doc = """\
An INNER block whose optimiser needs a stop (the optimiser list says which \
do) sets one, or the enclosing block does, which NLopt hands on to the \
INNER search. The refusal names the END line of the optimiser that runs \
the INNER search: ENDOPTIMIZER for an INNER block inside STRATEGY or \
REFINE, ENDEXPLORE for one inside EXPLORE."""
msg_doc = """\
The message says why the INNER search needs a stop, lists the stops it \
honours and the keys of the enclosing block that NLopt hands on."""

[[rule.invalid]]
wrap = "none"
check = "startup"
at = "ENDOPTIMIZER"
text = '''
OPTIM CGRID2B (1) 0.5 1.5
PC_ERMSE 0 1
OPTIMIZER
STRATEGY
LIB NLOPT
ALGO LD_AUGLAG
INNER
LIB NLOPT
ALGO LD_MMA
ENDINNER
ENDSTRATEGY
ENDOPTIMIZER'''
error = "the STRATEGY-level optimiser: the INNER search of NLOPT:LD_AUGLAG (NLOPT:LD_MMA) needs a stop: without a tolerance it has no convergence test and runs until it is interrupted; set MAXEVAL, MAXTIME or a positive tolerance it honours (FTOL_REL, FTOL_ABS, XTOL_REL, XTOL_ABS) in the INNER block, or MAXEVAL, MAXTIME or STOPVAL in the NLOPT:LD_AUGLAG block, which NLopt hands on to it"

# ============================================== the search space and MPI ==

[[rule]]
id = "RULE.search_dimensions_required"
title = "An NLopt, Dlib or Ceres optimiser needs an OPTIM line"
check = "startup"
keys = ["ROOT.OPTIM", "OPTIMIZER.LIB"]
msg = "{phase}: {lib}:{algo} cannot optimise a zero-dimensional search space (there is no OPTIM line; the failure would only surface once the optimiser starts). Add at least one OPTIM line, or use a TADAH-native optimiser, which evaluates the INIT start point once."
doc = """\
An NLOPT, DLIB or CERES optimiser searches at least one OPTIM line; a \
TADAH optimiser runs without one. The refusal names the END line of the \
block of the optimiser."""

[[rule.examples]]
wrap = "none"
doc = "A TADAH optimiser runs without an OPTIM line."
text = '''
PC_ERMSE 0 1
OPTIMIZER
LIB TADAH
ALGO RANDOM
MAXEVAL 10
ENDOPTIMIZER'''

[[rule.invalid]]
wrap = "none"
check = "startup"
at = "ENDOPTIMIZER"
text = '''
PC_ERMSE 0 1
OPTIMIZER
LIB NLOPT
ALGO LN_SBPLX
MAXEVAL 10
ENDOPTIMIZER'''
error = "the STRATEGY-level optimiser: NLOPT:LN_SBPLX cannot optimise a zero-dimensional search space (there is no OPTIM line; the failure would only surface once the optimiser starts). Add at least one OPTIM line, or use a TADAH-native optimiser, which evaluates the INIT start point once."

[[rule]]
id = "RULE.asa_search_dimensions"
title = "ASA:ASA needs an OPTIM line"
check = "startup"
keys = ["ROOT.OPTIM", "OPTIMIZER.LIB"]
msg = "{phase}: ASA:ASA requires at least one OPTIM dimension"
doc = """\
ASA:ASA searches at least one OPTIM line. The refusal names the END line \
of its block."""

[[rule.invalid]]
wrap = "none"
check = "startup"
at = "ENDOPTIMIZER"
text = '''
PC_ERMSE 0 1
OPTIMIZER
LIB ASA
ALGO ASA
MAXEVAL 10
ENDOPTIMIZER'''
error = "the STRATEGY-level optimiser: ASA:ASA requires at least one OPTIM dimension"

[[rule]]
id = "RULE.multi_rank_optimiser"
title = """\
A run on several MPI ranks uses ANNEAL_PT or ANNEAL_PA under TYPE PLAIN"""
check = "startup"
keys = ["STRATEGY.TYPE", "OPTIMIZER.LIB", "OPTIMIZER.ALGO"]
msg = "multi-rank HPO supports only STRATEGY TYPE PLAIN with LIB TADAH and ALGO ANNEAL_PT or ANNEAL_PA; got {lib}:{algo} on {count} ranks"
doc = """\
A run on more than one MPI rank, in the MPI build of tadah, has STRATEGY \
TYPE PLAIN and the optimiser TADAH:ANNEAL_PT or TADAH:ANNEAL_PA. The \
refusal comes when the run starts, before any evaluation, at the \
ENDOPTIMIZER line."""
msg_doc = "The message gives the optimiser and the number of ranks."
untested = [
  { msg = "multi-rank HPO supports only STRATEGY TYPE PLAIN with LIB TADAH and ALGO ANNEAL_PT or ANNEAL_PA; got {lib}:{algo} on {count} ranks", why = "A run on more than one MPI rank, in the MPI build." },
]

[[rule]]
id = "RULE.multi_rank_restart"
title = "A run on several MPI ranks has no RESTART block"
check = "startup"
keys = ["BLOCK.RESTART", "RESTART.AFTER_STAGNATION", "RESTART.MAX"]
msg = "multi-rank HPO does not support RESTART (AFTER_STAGNATION {value}, MAX {max} on {count} ranks): stagnation is tracked per rank; run on one rank or remove RESTART"
doc = """\
A run on more than one MPI rank has no active RESTART block. The refusal \
comes when the run starts, before any evaluation, at the ENDOPTIMIZER \
line, after that of the optimiser."""
untested = [
  { msg = "multi-rank HPO does not support RESTART (AFTER_STAGNATION {value}, MAX {max} on {count} ranks): stagnation is tracked per rank; run on one rank or remove RESTART", why = "A run on more than one MPI rank, in the MPI build." },
]

[[rule]]
id = "RULE.multi_rank_population"
title = """\
On several MPI ranks there are as many replicas or walkers as ranks"""
check = "startup"
keys = ["OPTIMIZER.POPULATION", "OPTIMIZER.ALGO"]
msg = "TADAH:{algo}: {key} ({value}) must be >= the MPI world size ({count})"
doc = """\
On more than one MPI rank, TADAH:ANNEAL_PT has at least as many replicas \
(PARAM REPLICAS) and TADAH:ANNEAL_PA at least as many walkers (POPULATION) \
as there are ranks. The refusal comes when the search starts, without a \
line."""
msg_doc = """\
The message names the key, REPLICAS or POPULATION, its value and the \
number of ranks."""
untested = [
  { msg = "TADAH:{algo}: {key} ({value}) must be >= the MPI world size ({count})", why = "A run on more than one MPI rank, in the MPI build." },
]

# ========================================================== set once ==
# A key is set once for what it configures. OPTIMIZER, STRATEGY and REFINE
# configure one optimiser, OPTIMIZER and STRATEGY one search space, and the
# INIT blocks inside OPTIMIZER, STRATEGY and REFINE one set of starting
# points; a repeated block continues the first. Each key's entry gives the
# refusal of a second line in one block.

[[rule]]
id = "RULE.set_once_for_optimiser"
title = "A key of the STRATEGY-level optimiser, or LOG_HP, is given in one block"
check = "parse"
keys = ["BLOCK.OPTIMIZER", "BLOCK.STRATEGY", "BLOCK.REFINE", "GROUP.OPTIMIZER", "OPTIMIZER.LOG_HP"]
msg = "{key} is set on line {first_line} in the {open} block and again here in the {block} block; both blocks configure the same {what}, so each key is given once"
doc = """\
OPTIMIZER, STRATEGY and REFINE configure the STRATEGY-level optimiser, and \
OPTIMIZER and STRATEGY the search space. A key of the optimiser group, or \
LOG_HP, given in two of these blocks is refused at the second line."""
msg_doc = """\
The message names the key, the line and the block of the first line, the \
block of the second, and what both blocks configure: the optimiser, or the \
search space for LOG_HP."""

[[rule.examples]]
wrap = "none"
doc = "The STRATEGY block and the EXPLORE block configure two optimisers, each with a MAXEVAL of its own."
text = '''
OPTIM CGRID2B (1) 0.5 1.5
PC_ERMSE 0 1
OPTIMIZER
STRATEGY
TYPE PRESTAGE
LIB NLOPT
ALGO LN_SBPLX
MAXEVAL 10
EXPLORE
LIB TADAH
ALGO RANDOM
MAXEVAL 5
ENDEXPLORE
ENDSTRATEGY
ENDOPTIMIZER'''

[[rule.invalid]]
wrap = "optimizer"
at = 2
doc = "MAXEVAL in the OPTIMIZER block and again in its STRATEGY block."
text = '''
STRATEGY
MAXEVAL 20
ENDSTRATEGY'''
error = "MAXEVAL is set on line 6 in the OPTIMIZER block and again here in the STRATEGY block; both blocks configure the same optimiser, so each key is given once"

[[rule.invalid]]
wrap = "none"
at = 14
doc = "ALGO in the STRATEGY block and again in the REFINE block."
text = '''
OPTIM CGRID2B (1) 0.5 1.5
PC_ERMSE 0 1
OPTIMIZER
STRATEGY
TYPE PRESTAGE
LIB NLOPT
ALGO LN_SBPLX
EXPLORE
LIB TADAH
ALGO RANDOM
MAXEVAL 5
ENDEXPLORE
REFINE
ALGO LN_BOBYQA
ENDREFINE
ENDSTRATEGY
ENDOPTIMIZER'''
error = "ALGO is set on line 7 in the STRATEGY block and again here in the REFINE block; both blocks configure the same optimiser, so each key is given once"

[[rule]]
id = "RULE.set_once_for_starting_points"
title = "A key of the STRATEGY-level starting points is given in one INIT block"
check = "parse"
keys = ["BLOCK.INIT", "INIT.K_TOTAL", "INIT.SEED", "INIT.WARM_ON_MISMATCH"]
msg = "{key} is set on line {first_line} in the INIT block inside {parent} and again here in the INIT block inside {enclosing}; both blocks configure the same starting points, so each key is given once"
doc = """\
The INIT blocks inside OPTIMIZER, STRATEGY and REFINE configure the \
starting points of the STRATEGY-level optimiser: their METHOD lines make \
one chain, and another key given in two of them is refused at the second \
line."""
msg_doc = """\
The message names the key, the line of the first, and the blocks the two \
INIT blocks are in."""

[[rule.examples]]
wrap = "none"
doc = "The METHOD lines of both INIT blocks make one chain, and SEED is given once."
text = '''
OPTIM CGRID2B (1) 0.5 1.5
PC_ERMSE 0 1
OPTIMIZER
INIT
METHOD CONFIG
SEED 1
ENDINIT
STRATEGY
TYPE MULTISTART
N_STARTS 3
LIB NLOPT
ALGO LN_SBPLX
MAXEVAL 30
INIT
METHOD RANDOM 2
ENDINIT
ENDSTRATEGY
ENDOPTIMIZER'''

[[rule.invalid]]
wrap = "none"
at = 12
text = '''
OPTIM CGRID2B (1) 0.5 1.5
PC_ERMSE 0 1
OPTIMIZER
INIT
SEED 1
ENDINIT
STRATEGY
LIB NLOPT
ALGO LN_SBPLX
MAXEVAL 10
INIT
SEED 2
ENDINIT
ENDSTRATEGY
ENDOPTIMIZER'''
error = "SEED is set on line 5 in the INIT block inside OPTIMIZER and again here in the INIT block inside STRATEGY; both blocks configure the same starting points, so each key is given once"

