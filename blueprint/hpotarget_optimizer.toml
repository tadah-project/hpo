[[key]]
id = "OPTIMIZER.MAXTIME"
name = "MAXTIME"
group = "OPTIMIZER"
synopsis = "MAXTIME <seconds>"
args = [ { name = "seconds", kind = "positive", noun = "number of seconds", what = "{key}" } ]
repeat = "error"
repeat_msg = "MAXTIME is set twice in the {block} block (first on line {first_line}); each key is given once"
repeat_doc = "Once for each optimiser: a second line is refused, in the same block, in a second block of that type, or in another of OPTIMIZER, STRATEGY and REFINE, which set the same optimiser."
default = { text = "No time limit." }
doc = """\
The wall-clock time of the optimiser of the block, in seconds: the search \
stops once it has run that long."""
long_doc = """\
Inside a block MAXTIME is a number of seconds. MAXTIME at the top level is \
another key, the time limit of each LAMMPS script, written as a LAMMPS \
time. Only the optimisers that read it take it (the optimiser list names \
the stops of each): DLIB:BFGS and CERES:STEEPEST_DESCENT refuse it at \
startup, at the END line of the block."""
checks = [
  { msg = "{phase}: {lib}:{algo} does not support MAXTIME", doc = "At startup, at the END line of its optimiser: DLIB:BFGS or CERES:STEEPEST_DESCENT." },
]

[[key.examples]]
wrap = "strategy"
text = "MAXTIME 3600"

[[key.examples]]
doc = "Half a second: the time is a number."
wrap = "strategy"
text = "MAXTIME 0.5"

[[key.invalid]]
wrap = "strategy"
text = "MAXTIME 0"
error = "MAXTIME must be a positive number of seconds, got '0'"

[[key.invalid]]
wrap = "strategy"
text = "MAXTIME 1:00"
error = "MAXTIME must be a positive number of seconds, got '1:00'"

[[key.invalid]]
wrap = "strategy"
text = "MAXTIME 1e-320"
error = "MAXTIME must be a positive number of seconds, got '1e-320' (too small: its magnitude is below the smallest normal double, 2.2250738585072014e-308)"

[[key.invalid]]
wrap = "opt_bfgs"
check = "startup"
at = "ENDOPTIMIZER"
text = "MAXTIME 10"
error = "the STRATEGY-level optimiser: DLIB:BFGS does not support MAXTIME"

[[key.invalid]]
wrap = "opt_ceres"
check = "startup"
at = "ENDOPTIMIZER"
text = "MAXTIME 10"
error = "the STRATEGY-level optimiser: CERES:STEEPEST_DESCENT does not support MAXTIME"

[[key.invalid]]
wrap = "strategy"
at = 2
text = '''
MAXTIME 10
MAXTIME 20'''
error = "MAXTIME is set twice in the STRATEGY block (first on line 8); each key is given once"

[[key]]
id = "OPTIMIZER.STOPVAL"
name = "STOPVAL"
group = "OPTIMIZER"
synopsis = "STOPVAL <loss>"
args = [ { name = "loss", kind = "number", what = "{key}" } ]
repeat = "error"
repeat_msg = "STOPVAL is set twice in the {block} block (first on line {first_line}); each key is given once"
repeat_doc = "Once for each optimiser: a second line is refused, in the same block, in a second block of that type, or in another of OPTIMIZER, STRATEGY and REFINE, which set the same optimiser."
default = { text = "No target loss." }
doc = """\
A target loss: the search stops once it finds a loss at or below this \
value."""
long_doc = """\
TADAH:RANDOM, TADAH:GRID, DLIB:GFS and the annealers stop only at a \
usable loss at or below STOPVAL. NLopt and ASA:ASA stop at any loss at or \
below it, the loss of a failed evaluation included. Only the optimisers \
that read it take it (the optimiser list names the stops of each): \
DLIB:BFGS and CERES:STEEPEST_DESCENT refuse it at startup, at the END \
line of the block. An INNER block refuses STOPVAL: NLopt's MLSL and \
AUGLAG stop their local search at the STOPVAL of the enclosing block."""
checks = [
  { msg = "{phase}: {lib}:{algo} does not support STOPVAL", doc = "At startup, at the END line of its optimiser: DLIB:BFGS or CERES:STEEPEST_DESCENT." },
]

[[key.examples]]
wrap = "strategy"
text = "STOPVAL 0.001"

[[key.examples]]
doc = "A negative target loss."
wrap = "strategy"
text = "STOPVAL -5"

[[key.invalid]]
wrap = "strategy"
text = "STOPVAL inf"
error = "STOPVAL must be a finite number, got 'inf'"

[[key.invalid]]
wrap = "strategy"
text = "STOPVAL 1e400"
error = "STOPVAL must be a finite number, got '1e400'"

[[key.invalid]]
wrap = "opt_bfgs"
check = "startup"
at = "ENDOPTIMIZER"
text = "STOPVAL 0.1"
error = "the STRATEGY-level optimiser: DLIB:BFGS does not support STOPVAL"

[[key.invalid]]
wrap = "opt_ceres"
check = "startup"
at = "ENDOPTIMIZER"
text = "STOPVAL 0.1"
error = "the STRATEGY-level optimiser: CERES:STEEPEST_DESCENT does not support STOPVAL"

[[key.invalid]]
wrap = "strategy"
at = 2
text = '''
STOPVAL 0
STOPVAL 1'''
error = "STOPVAL is set twice in the STRATEGY block (first on line 8); each key is given once"

[[key]]
id = "OPTIMIZER.FTOL_REL"
name = "FTOL_REL"
group = "OPTIMIZER"
synopsis = "FTOL_REL <tolerance>"
args = [ { name = "tolerance", kind = "number", what = "{key}" } ]
repeat = "error"
repeat_msg = "FTOL_REL is set twice in the {block} block (first on line {first_line}); each key is given once"
repeat_doc = "Once for each optimiser: a second line is refused, in the same block, in a second block of that type, or in another of OPTIMIZER, STRATEGY and REFINE, which set the same optimiser."
default = { text = "Not set: no tolerance; CERES:STEEPEST_DESCENT uses 1e-6, and the local search of an NLopt MLSL 1e-15 when it has no other tolerance.", unchecked = "NLopt applies its own tolerances to the local search of an MLSL; tadah hpo does not set them." }
doc = """\
The relative tolerance on the loss: the search stops when an iteration \
changes the loss by less than this fraction of it."""
long_doc = """\
Only the optimisers that test it take it (the optimiser list names them); \
another optimiser is refused at startup with this key. An NLopt MLSL or \
AUGLAG without an INNER block hands the tolerance to NLopt's default \
local optimiser, which tests it; with an INNER block the block refuses \
it, and the INNER block takes it. NLopt takes a value of 0 or below as no \
tolerance; the annealers and CERES:STEEPEST_DESCENT refuse a negative \
value at startup. The local search of an NLopt MLSL that has none of \
FTOL_REL, FTOL_ABS and XTOL_REL above 0, in a block without XTOL_ABS \
above 0, runs with NLopt's FTOL_REL 1e-15 and XTOL_REL 1e-7."""
checks = [
  { msg = "{phase}: {lib}:{algo} does not support FTOL_REL with an INNER block: {why}; set it in the INNER block, whose local search tests it", doc = "At startup, at the END line of its optimiser: an NLopt MLSL or AUGLAG with an INNER block; {why} says how the INNER search ends the run." },
  { msg = "{phase}: CERES:{algo} requires FTOL_REL >= 0 (Ceres' function_tolerance), got {value}", doc = "At startup, at the END line of its optimiser." },
  { msg = "{phase}: DLIB:BFGS does not support FTOL_REL; use FTOL_ABS", doc = "At startup, at the END line of its optimiser." },
  { msg = "{phase}: ASA:ASA does not implement FTOL_REL/FTOL_ABS; use ASA's own stops: PARAM Cost_Precision + Maximum_Cost_Repeat (plateau) or Accepted_To_Generated_Ratio", doc = "At startup, at the END line of its optimiser." },
  { msg = "{phase}: TADAH:{algo}: FTOL_REL must be finite and non-negative", doc = "At startup, at the END line of its optimiser: an annealer, with a value below 0." },
  { msg = "{phase}: {lib}:{algo} does not support FTOL_REL{note}", doc = "At startup, at the END line of its optimiser: an optimiser that does not test FTOL_REL; {note} says why and names the stops it honours." },
]

[[key.examples]]
wrap = "strategy"
text = "FTOL_REL 1e-6"

[[key.examples]]
wrap = "none"
doc = "NLopt's default local optimiser of GN_MLSL, NLOPT:LN_COBYLA, tests it."
text = '''
OPTIM CGRID2B (1) 0.5 1.5
PC_ERMSE 0 1
OPTIMIZER
LIB NLOPT
ALGO GN_MLSL
MAXEVAL 10
FTOL_REL 1e-4
ENDOPTIMIZER'''

[[key.invalid]]
wrap = "strategy"
