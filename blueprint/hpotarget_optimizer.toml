PC_ERMSE 0 1
OPTIMIZER
STRATEGY
LIB NLOPT
ALGO LN_AUGLAG
MAXEVAL 10
FTOL_REL 1e-4
INNER
LIB NLOPT
ALGO LN_BOBYQA
ENDINNER
ENDSTRATEGY
ENDOPTIMIZER'''
error = "the STRATEGY-level optimiser: NLOPT:LN_AUGLAG does not support FTOL_REL with an INNER block: AUGLAG ends when its INNER search ends (tadah hpo sets no constraint) and tests the block's tolerances only to name that ending, and NLopt passes them to no INNER search; set it in the INNER block, whose local search tests it"

[[key.invalid]]
wrap = "opt_ceres"
check = "startup"
