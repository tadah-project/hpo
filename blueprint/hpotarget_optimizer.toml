# ================================================================ LOG_HP ==

[[key]]
id = "OPTIMIZER.LOG_HP"
name = "LOG_HP"
blocks = ["OPTIMIZER", "STRATEGY"]
synopsis = "LOG_HP <ratio>"
args = [ { name = "ratio", kind = "number", min = 1, what = "{key}", msg = "LOG_HP must be a finite ratio >= 1 (a dimension is log-scaled when high/low >= LOG_HP and low > 0), got '{tok}'" } ]
repeat = "error"
repeat_msg = "LOG_HP is set twice in the {block} block (first on line {first_line}); each key is given once"
repeat_doc = "Once: a second line is refused, in the same block or in the other of OPTIMIZER and STRATEGY."
misplaced_msg = "LOG_HP is a search-space property; declare it once at the OPTIMIZER or STRATEGY level, not inside a stage, INNER or INIT block"
default = { text = "Not set: no search parameter is log-scaled by its ratio." }
doc = """\
Log-scales each search parameter whose OPTIM box has low > 0 and high/low \
>= LOG_HP, unless its OPTIM line is tagged LOG or ASINH. It holds for the \
whole search space, every optimiser of the run included."""
long_doc = """\
The ratio is a finite number >= 1. LOG_HP is written once, inside \
OPTIMIZER or inside STRATEGY; a second line, in either block, is \
refused. The EXPLORE, REFINE and INNER blocks refuse it, as \
does the top level; inside INIT, RESTART and NOISE it is an unknown key."""
quirk = """\
An OPTIM line tagged LIN is log-scaled too when its box qualifies: the LIN \
tag does not keep it linear. At the top level LOG_HP is refused with the \
message about blocks, not as an unknown key."""

[[key.examples]]
wrap = "strategy"
text = "LOG_HP 10"

[[key.examples]]
doc = "In the OPTIMIZER block, with the ratio 1: every box whose lower end is above 0 is log-scaled."
wrap = "optimizer"
text = "LOG_HP 1"

[[key.invalid]]
wrap = "strategy"
text = "LOG_HP 0.5"
error = "LOG_HP must be a finite ratio >= 1 (a dimension is log-scaled when high/low >= LOG_HP and low > 0), got '0.5'"

[[key.invalid]]
wrap = "strategy"
text = "LOG_HP x"
error = "LOG_HP must be a finite number, got 'x'"

[[key.invalid]]
wrap = "strategy"
text = "LOG_HP"
error = "LOG_HP requires a value"

[[key.invalid]]
wrap = "strategy"
text = "LOG_HP 2 3"
error = "LOG_HP takes a single value (unexpected '3')"

[[key.invalid]]
wrap = "explore"
text = "LOG_HP 10"
error = "LOG_HP is a search-space property; declare it once at the OPTIMIZER or STRATEGY level, not inside a stage, INNER or INIT block"

[[key.invalid]]
wrap = "refine"
text = "LOG_HP 10"
error = "LOG_HP is a search-space property; declare it once at the OPTIMIZER or STRATEGY level, not inside a stage, INNER or INIT block"

[[key.invalid]]
wrap = "inner"
text = "LOG_HP 10"
error = "LOG_HP is a search-space property; declare it once at the OPTIMIZER or STRATEGY level, not inside a stage, INNER or INIT block"

[[key.invalid]]
wrap = "root"
text = "LOG_HP 10"
error = "LOG_HP is a search-space property; declare it once at the OPTIMIZER or STRATEGY level, not inside a stage, INNER or INIT block"

[[key.invalid]]
wrap = "restart"
text = "LOG_HP 10"
error = "unknown key 'LOG_HP' inside RESTART block"

[[key.invalid]]
wrap = "noise"
