# Part of the target-file registry (hpotarget.toml lists it in meta.parts):
# the keys of the optimiser blocks.
#
# This file holds the keys of the OPTIMIZER group (LIB, ALGO, the stops,
# STEP, SEED, THREADS, GRAD_STRATEGY, PARAM, ...), LOG_HP, the STRATEGY
# keys and the STRATEGY types, the INIT keys and the INIT methods, the
# NOISE keys and the RESTART keys, and the startup rules of the INNER
# block. The tables and fields are those of blueprint/README.md ("The
# target-file registry"); hpotarget.toml holds the blocks, the wrappers
# and the training configurations the examples use. The wrappers and
# fixtures below, named opt_*, are those of this file.

# ===================================================== the optimiser group ==
# Valid in OPTIMIZER, STRATEGY, EXPLORE, REFINE and INNER ([group.OPTIMIZER]
# in hpotarget.toml). A value after the last one a key reads is refused
# with the group's leftover_msg.

[[key]]
id = "OPTIMIZER.LIB"
name = "LIB"
group = "OPTIMIZER"
synopsis = "LIB <library>"
args = [ { name = "library", kind = "name", doc = "ASA, CERES, DLIB, NLOPT or TADAH, as the optimiser list writes it." } ]
repeat = "error"
repeat_msg = "LIB is set twice in the {block} block (first on line {first_line}); each key is given once"
repeat_doc = "Once for each optimiser: a second line is refused, in the same block, in a second block of that type, or in another of OPTIMIZER, STRATEGY and REFINE, which set the same optimiser."
default = { text = "Not set: a block that runs an optimiser is refused at its END line without LIB and ALGO." }
doc = """\
The library of the optimiser of the block. LIB and ALGO together name the \
optimiser, as the optimiser list gives it."""
long_doc = """\
The pair is checked when the block that runs the optimiser closes: a pair \
the optimiser list does not hold, or refuses, is refused there with the \
reason. The value is compared as written, in upper case."""

[[key.examples]]
wrap = "none"
text = '''
OPTIM CGRID2B (1) 0.5 1.5
PC_ERMSE 0 1
OPTIMIZER
STRATEGY
LIB NLOPT
ALGO LN_SBPLX
MAXEVAL 10
ENDSTRATEGY
ENDOPTIMIZER'''

[[key.examples]]
wrap = "none"
doc = "LIB and ALGO written directly inside OPTIMIZER, without a STRATEGY block."
text = '''
OPTIM CGRID2B (1) 0.5 1.5
PC_ERMSE 0 1
OPTIMIZER
LIB TADAH
ALGO RANDOM
MAXEVAL 10
ENDOPTIMIZER'''

[[key.invalid]]
wrap = "strategy"
text = "LIB"
error = "LIB requires a value"

[[key.invalid]]
wrap = "none"
at = "ENDOPTIMIZER"
text = '''
OPTIM CGRID2B (1) 0.5 1.5
PC_ERMSE 0 1
OPTIMIZER
STRATEGY
LIB NOPE
ALGO LN_SBPLX
MAXEVAL 10
ENDSTRATEGY
ENDOPTIMIZER'''
error = "the STRATEGY-level optimiser: unknown optimiser NOPE:LN_SBPLX: there is no LIB NOPE (LIB is ASA, CERES, DLIB, NLOPT or TADAH); `tadah explain ALGO` lists the optimisers"

[[key.invalid]]
wrap = "strategy"
text = "LIB TADAH"
error = "LIB is set twice in the STRATEGY block (first on line 5); each key is given once"

[[key]]
id = "OPTIMIZER.ALGO"
name = "ALGO"
group = "OPTIMIZER"
synopsis = "ALGO <algorithm>"
args = [ { name = "algorithm", kind = "name", doc = "An algorithm of the library LIB names, as the optimiser list writes it." } ]
repeat = "error"
repeat_msg = "ALGO is set twice in the {block} block (first on line {first_line}); each key is given once"
repeat_doc = "Once for each optimiser: a second line is refused, in the same block, in a second block of that type, or in another of OPTIMIZER, STRATEGY and REFINE, which set the same optimiser."
default = { text = "Not set: a block that runs an optimiser is refused at its END line without LIB and ALGO." }
doc = """\
The algorithm of the optimiser, one of the library that LIB names, such as \
LN_SBPLX of NLOPT or RANDOM of TADAH. The command tadah explain ALGO lists \
them."""

[[key.examples]]
wrap = "none"
text = '''
OPTIM CGRID2B (1) 0.5 1.5
PC_ERMSE 0 1
OPTIMIZER
STRATEGY
LIB NLOPT
ALGO LN_BOBYQA
MAXEVAL 10
ENDSTRATEGY
ENDOPTIMIZER'''

[[key.invalid]]
wrap = "strategy"
text = "ALGO"
error = "ALGO requires a value"

[[key.invalid]]
wrap = "none"
at = "ALGO"
text = '''
OPTIM CGRID2B (1) 0.5 1.5
PC_ERMSE 0 1
