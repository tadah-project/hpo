[[key]]
id = "OPTIMIZER.GRAD_STRATEGY"
name = "GRAD_STRATEGY"
group = "OPTIMIZER"
synopsis = "GRAD_STRATEGY NUMERICAL | ANALYTICAL | HYBRID"
repeat = "error"
repeat_msg = "GRAD_STRATEGY is set twice in the {block} block (first on line {first_line}); each key is given once"
repeat_doc = "Once for each optimiser: a second line is refused, in the same block, in a second block of that type, or in another of OPTIMIZER, STRATEGY and REFINE, which set the same optimiser."
default = { literal = "NUMERICAL" }
doc = """\
How a gradient optimiser obtains the gradient of the loss. NUMERICAL takes \
finite differences, ANALYTICAL the analytical derivatives, and HYBRID the \
analytical derivatives with finite differences where none exists."""
long_doc = """\
With PC_OBSERVABLE, an unset GRAD_STRATEGY means ANALYTICAL in each block \
whose optimiser obtains gradients, and NUMERICAL is refused. An optimiser \
that takes no gradient is refused at startup with GRAD_STRATEGY; an NLopt \
MLSL or AUGLAG takes gradients only when its local search does. An INNER \
block refuses GRAD_STRATEGY: the enclosing block's GRAD_STRATEGY gives the \
gradient of its local search. ANALYTICAL, written or taken for \
PC_OBSERVABLE, needs the settings of the analytical gradient, and startup \
refuses a setup without them. In the training configuration these are a \
DBFILE, no FIXINDEX, STRESS false, NORM false, OALGO 4, a fixed LAMBDA >= \
0 and the model MODEL M_BLR BF_Linear or MODEL M_KRR Kern_Linear 1, whose \
least-squares fit of the training rows the gradient differentiates \
(implementation 2 of M_KRR solves over its basis vectors instead). In the \
target file they are no \
PC_SRMSE_GPA line, no PC_OBSERVABLE line with --loss MAPE or RMSLE or with \
--unconverged force-scaled, and no OPTIM line of an error scale of the fit \
(ESIGMA, FSIGMA, SSIGMA) or of WDBFILE, a priority of the fit, which the \
analytical gradient does not differentiate. Another search parameter without an analytical derivative \
passes startup, and stops an ANALYTICAL run at its first gradient."""
checks = [
  { msg = "{block} block: GRAD_STRATEGY ANALYTICAL{note} needs the analytical gradient of the loss, which this setup cannot form: {why}. Change that setting, or set GRAD_STRATEGY HYBRID to use finite differences where no analytical gradient is available.", doc = "At startup, at the END line of its optimiser; {block} is OPTIMIZER or EXPLORE, and {why} names the first setting the analytical gradient does not cover. {note} is \" (resolved for PC_OBSERVABLE: the block sets no GRAD_STRATEGY)\" when the block takes ANALYTICAL for PC_OBSERVABLE." },
  { msg = "{phase}: ASA:ASA does not accept GRAD_STRATEGY (derivative-free; reanneal tangents use PARAM Delta_X finite differences)", doc = "At startup, at the END line of its optimiser." },
  { msg = "{phase}: TADAH:{algo} is derivative-free and does not use GRAD_STRATEGY; remove it", doc = "At startup, at the END line of its optimiser: an annealer." },
  { msg = "{phase} {lib}:{algo}: GRAD_STRATEGY never takes effect: {lib}:{algo} takes no gradient{note}; remove it.", doc = "At startup, at the END line of its optimiser: an optimiser that obtains no gradient; {note} says why, for an NLopt MLSL or AUGLAG." },
]
quirk = """\
GRAD_STRATEGY without a value is refused with the message about its \
words, ending (got ''), not with the message about a missing value."""

[[key.args]]
name = "strategy"
kind = "word"
words = ["NUMERICAL", "ANALYTICAL", "HYBRID"]
msg = "GRAD_STRATEGY must be one of NUMERICAL, ANALYTICAL, HYBRID (got '{tok}')"

[key.args.refused_words]
AUTODIFF = "GRAD_STRATEGY=AUTODIFF was renamed to ANALYTICAL; the prior stub now backs a closed-form analytical gradient. Use GRAD_STRATEGY ANALYTICAL (strict -- every theta must have a registered analytical derivative) or GRAD_STRATEGY HYBRID (analytical-where-registered + finite-difference fallback)."

[[key.examples]]
wrap = "opt_lbfgs"
text = "GRAD_STRATEGY NUMERICAL"

[[key.examples]]
doc = "Analytical derivatives where they exist, finite differences elsewhere."
wrap = "opt_lbfgs"
text = "GRAD_STRATEGY HYBRID"

[[key.examples]]
