[[init_method]]
id = "METHOD.LHS"
name = "LHS"
args = [ { name = "K", kind = "integer", min = 1, max = 1000000, what = "INIT METHOD LHS K" } ]
doc = """\
K starting points of a Latin hypercube: each search parameter has one \
point in each of K equal slices of its box."""

[[init_method.checks]]
msg = "INIT METHOD LHS expects exactly one arg: K"
doc = "At the METHOD line: LHS takes one value."

[[init_method.examples]]
