error = "INIT METHOD LHS expects exactly one arg: K"

[[init_method]]
id = "METHOD.SOBOL"
name = "SOBOL"
args = [ { name = "K", kind = "integer", min = 1, max = 1000000, what = "INIT METHOD SOBOL K" } ]
doc = """\
K consecutive points of the Sobol sequence. The seed of the block selects \
which K points: seeds that differ in their lowest 16 bits draw disjoint \
points."""

[[init_method.checks]]
msg = "INIT METHOD SOBOL expects exactly one arg: K"
doc = "At the METHOD line: SOBOL takes one value."

[[init_method.examples]]
wrap = "init"
text = "METHOD SOBOL 8"

