# ======================================================== STRATEGY keys ==

[[key]]
id = "STRATEGY.TYPE"
name = "TYPE"
blocks = ["STRATEGY"]
synopsis = "TYPE PLAIN | MULTISTART | PRESTAGE"
args = [ { name = "type", kind = "word", words = ["PLAIN", "MULTISTART", "PRESTAGE"], msg = "STRATEGY TYPE must be PLAIN, MULTISTART, or PRESTAGE (got '{tok}')" } ]
repeat = "error"
repeat_msg = "TYPE is set twice in the STRATEGY block (first on line {first_line}); each key is given once"
default = { literal = "PLAIN" }
doc = """\
How the search runs the STRATEGY-level optimiser: once (PLAIN), from \
several starting points (MULTISTART), or as an exploration followed by a \
refinement (PRESTAGE)."""
long_doc = """\
The keys of one TYPE (N_STARTS, PARALLEL, BUDGET_PER_START, TOPK) are \
checked against it when the block ends, so TYPE may follow them; the \
EXPLORE and REFINE blocks need TYPE PRESTAGE before them."""

[[key.examples]]
wrap = "strategy"
text = "TYPE PLAIN"

[[key.examples]]
doc = "A search from several starting points."
wrap = "strategy"
text = "TYPE MULTISTART"

[[key.invalid]]
wrap = "strategy"
text = "TYPE plain"
error = "STRATEGY TYPE must be PLAIN, MULTISTART, or PRESTAGE (got 'plain')"

[[key.invalid]]
wrap = "strategy"
text = "TYPE"
error = "TYPE requires a value"

[[key.invalid]]
wrap = "strategy"
