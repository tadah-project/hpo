wrap = "init"
text = "METHOD SOBOL 8 9"
error = "INIT METHOD SOBOL expects exactly one arg: K"

[[init_method]]
id = "METHOD.WARM"
name = "WARM"
args = [ { name = "file", kind = "name", doc = "A potential file, such as a best_pot.tadah of an earlier run." } ]
doc = """\
One starting point read from a potential file: the values of the search \
parameters it holds. WARM_ON_MISMATCH says what happens when a value is \
missing or outside its OPTIM box; a key the file has no line of is \
missing, whatever its default."""
untested = [
  { msg = "WARM: parse failure in seed file '{file}': {why}", why = "Comes when the run draws its starting points, after it reads its data, which no case does." },
  { msg = "WARM seed {file} {text}, but this run evaluates RHOFORM {type} (from -c) and takes the OPTIM density parameters ({keys}) from the seed: density parameters are meaningful only in the form they were fitted in. {hint}", why = "Needs a WARM seed of a DM_REAM potential, and comes when the run draws its starting points, after it reads its data." },
]

[[init_method.checks]]
msg = "INIT METHOD WARM expects exactly one arg: <pot_file>"
doc = "At the METHOD line: WARM takes one file."

[[init_method.checks]]
msg = "WARM: cannot open seed file '{file}'. Provide the file (production submit scripts copy it into the run dir) or drop the WARM line to start from the in-config values."
doc = "When the points are drawn: the file opens."

[[init_method.checks]]
msg = "WARM: parse failure in seed file '{file}': {why}"
doc = "When the points are drawn: the file reads as a potential file."

[[init_method.checks]]
msg = "WARM: {count} parameter(s) not found in {file}: {list}"
doc = """\
When the points are drawn, with WARM_ON_MISMATCH error: the file holds \
every search parameter; {list} names at most five."""

[[init_method.checks]]
msg = "WARM: {count} parameter(s) from {file} clamped into OPTIM bounds -- the seed point is NOT the one on disk: {list}"
doc = """\
When the points are drawn, with WARM_ON_MISMATCH error: every value lies \
inside its OPTIM box; {list} names at most five."""

[[init_method.checks]]
msg = "WARM seed {file} {text}, but this run evaluates RHOFORM {type} (from -c) and takes the OPTIM density parameters ({keys}) from the seed: density parameters are meaningful only in the form they were fitted in. {hint}"
doc = """\
When the points are drawn, with a DM_REAM density and a searched \
AMPGRIDMB, CGRIDMB or SGRIDMB: the seed declares the RHOFORM of the \
training configuration. Without a searched density key, another RHOFORM \
gets a warning."""

[[init_method.examples]]
wrap = "init"
text = "METHOD WARM opt_seed.tadah"

[[init_method.invalid]]
