[[key]]
id = "OPTIMIZER.FTOL_ABS"
name = "FTOL_ABS"
group = "OPTIMIZER"
synopsis = "FTOL_ABS <tolerance>"
args = [ { name = "tolerance", kind = "number", what = "{key}" } ]
repeat = "error"
repeat_msg = "FTOL_ABS is set twice in the {block} block (first on line {first_line}); each key is given once"
repeat_doc = "Once for each optimiser: a second line is refused, in the same block, in a second block of that type, or in another of OPTIMIZER, STRATEGY and REFINE, which set the same optimiser."
default = { text = "Not set: no tolerance; DLIB:BFGS uses 1e-7, and DLIB:GFS solves to a precision of 1e-3.", unchecked = "The DLIB searches take these values when they start; no setting of the target file holds them." }
doc = """\
The absolute tolerance on the loss: the search stops when an iteration \
changes the loss by less than this value."""
long_doc = """\
Only the optimisers that read it take it (the optimiser list names them); \
another optimiser is refused at startup with this key. DLIB:GFS reads it \
as the precision of its solver, not as a stop, and refuses a value below 0 \
at startup. An NLopt MLSL or AUGLAG \
without an INNER block hands the tolerance to NLopt's default local \
optimiser, which tests it; with an INNER block the block refuses it, and \
the INNER block takes it. NLopt takes a value of 0 or below as no \
tolerance; the annealers refuse a negative value at startup."""
checks = [
  { msg = "{phase}: CERES:{algo} uses relative tolerance; use FTOL_REL (mapped to function_tolerance) instead of FTOL_ABS", doc = "At startup, at the END line of its optimiser." },
  { msg = "{phase}: ASA:ASA does not implement FTOL_REL/FTOL_ABS; use ASA's own stops: PARAM Cost_Precision + Maximum_Cost_Repeat (plateau) or Accepted_To_Generated_Ratio", doc = "At startup, at the END line of its optimiser." },
  { msg = "{phase}: TADAH:{algo}: FTOL_ABS must be finite and non-negative", doc = "At startup, at the END line of its optimiser: an annealer, with a value below 0." },
  { msg = "{phase}: DLIB:GFS: FTOL_ABS is the accuracy of dlib's solver and must be >= 0 (got {value})", doc = "At startup, at the END line of its optimiser: DLIB:GFS, with a value below 0." },
  { msg = "{phase}: {lib}:{algo} does not support FTOL_ABS{note}", doc = "At startup, at the END line of its optimiser: an optimiser that does not test FTOL_ABS; {note} says why and names the stops it honours." },
