[[key]]
id = "STRATEGY.N_STARTS"
name = "N_STARTS"
blocks = ["STRATEGY"]
synopsis = "N_STARTS <n>"
args = [ { name = "n", kind = "integer", min = 1, max = "UINT64_MAX", what = "{key}" } ]
repeat = "error"
repeat_msg = "N_STARTS is set twice in the STRATEGY block (first on line {first_line}); each key is given once"
default = { literal = "1" }
doc = """\
The number of starts of STRATEGY TYPE MULTISTART: the optimiser runs once \
from each of the first N_STARTS starting points of the INIT block."""
long_doc = """\
With fewer starting points than N_STARTS, it runs once from each of them, \
with a warning. Another TYPE refuses N_STARTS when the STRATEGY block \
ends."""

[[key.examples]]
wrap = "opt_multistart"
text = "N_STARTS 4"

[[key.examples]]
wrap = "strategy"
doc = "TYPE may follow the keys of its TYPE."
text = '''
N_STARTS 3
TYPE MULTISTART'''

[[key.invalid]]
