[[key.invalid]]
wrap = "strategy"
text = "ALGO LN_BOBYQA"
error = "ALGO is set twice in the STRATEGY block (first on line 6); each key is given once"

[[key]]
id = "OPTIMIZER.MAXEVAL"
name = "MAXEVAL"
group = "OPTIMIZER"
synopsis = "MAXEVAL <n>"
args = [ { name = "n", kind = "integer", min = 1, max = "INT_MAX", what = "{key}" } ]
repeat = "error"
repeat_msg = "MAXEVAL is set twice in the {block} block (first on line {first_line}); each key is given once"
repeat_doc = "Once for each optimiser: a second line is refused, in the same block, in a second block of that type, or in another of OPTIMIZER, STRATEGY and REFINE, which set the same optimiser."
default = { text = "No evaluation limit: an optimiser that needs a stop is refused at startup without one." }
doc = """\
The evaluation budget of the optimiser of the block. Under STRATEGY TYPE \
MULTISTART, and in a PRESTAGE refinement from more than one candidate, the \
starts share it, unless the optimiser runs every start in one run, as \
DLIB:GFS does."""
long_doc = """\
Each start receives MAXEVAL divided by the number of starts, rounded up; \
under MULTISTART, BUDGET_PER_START sets the budget of each start instead. \
An optimiser that takes several starting points in one run, such as \
DLIB:GFS, runs once with all of them and the whole MAXEVAL. The EXPLORE \
block of STRATEGY TYPE PRESTAGE has a MAXEVAL of its own. Under an active \
RESTART block each round runs with the whole MAXEVAL, so a run can make up \
to (MAX + 1) times MAXEVAL evaluations. An optimiser without a convergence \
test or a finite schedule of its own, such as TADAH:RANDOM, needs MAXEVAL, \
another stop it reads or an active RESTART block; the optimiser list names \
its stops. TADAH:ANNEAL without MAXEVAL needs PARAM CHAIN_LENGTH, or PARAM \
NT under PARAM CORANA ON, which it otherwise derives from MAXEVAL. \
NLOPT:GD_STOGO and NLOPT:GD_STOGO_RAND need MAXEVAL itself: MAXTIME, \
STOPVAL and a RESTART block do not count as their stop. The local search \
of an NLopt MLSL or AUGLAG that needs a stop takes one from its block, \
which NLopt hands on, or from its INNER block."""
checks = [
  { msg = "{phase}: {lib}:{algo} needs a stop: {why}; set {list}", doc = "At startup, at the END line of its optimiser: an optimiser without a convergence test or a finite schedule of its own, and none of its stops; {why} says why it needs one, {list} names the stops it honours." },
  { msg = "{phase}: TADAH:ANNEAL: CHAIN_LENGTH AUTO needs MAXEVAL to derive the per-rung budget; set PARAM CHAIN_LENGTH explicitly (e.g. for MAXTIME- or STOPVAL-driven runs)", doc = "At startup, at the END line of its optimiser: TADAH:ANNEAL without MAXEVAL and without PARAM CHAIN_LENGTH." },
  { msg = "{phase}: TADAH:ANNEAL: NT AUTO needs MAXEVAL to derive the per-rung budget; set PARAM NT explicitly (e.g. for MAXTIME- or STOPVAL-driven runs)", doc = "At startup, at the END line of its optimiser: TADAH:ANNEAL under PARAM CORANA ON without MAXEVAL and without PARAM NT." },
]

[[key.examples]]
wrap = "none"
text = '''
OPTIM CGRID2B (1) 0.5 1.5
PC_ERMSE 0 1
OPTIMIZER
STRATEGY
LIB NLOPT
ALGO LN_SBPLX
MAXEVAL 200
ENDSTRATEGY
ENDOPTIMIZER'''

[[key.invalid]]
wrap = "strategy"
text = "MAXEVAL 0"
error = "MAXEVAL must be an integer from 1 to 2147483647, got '0'"

[[key.invalid]]
wrap = "strategy"
text = "MAXEVAL 2147483648"
error = "MAXEVAL must be an integer from 1 to 2147483647, got '2147483648'"

[[key.invalid]]
