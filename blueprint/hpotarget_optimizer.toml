[[key]]
id = "OPTIMIZER.PARAM"
name = "PARAM"
group = "OPTIMIZER"
synopsis = "PARAM <name> <value> | PARAM INIT_MODE UNIFORM | JITTER [<fraction> | AUTO <tolerance>]"
args = [
  { name = "name", kind = "name", doc = "A PARAM key of the optimiser." },
  { name = "value", kind = "tokens", doc = "Its value; INIT_MODE takes the forms of the synopsis." },
]
repeat = "add"
repeat_doc = "Each line sets one PARAM key, and one name is given once for each optimiser, as a key of the optimiser group is."
doc = """\
Sets one PARAM key of the optimiser: an algorithm parameter, by name, with \
its value. The PARAM keys each optimiser takes have entries of their own."""
long_doc = """\
The value is one token. A value shaped like a number must be a finite \
number; another word is kept as written, for a PARAM key that takes a \
word. INIT_MODE takes UNIFORM, JITTER, JITTER and a fraction, or JITTER \
AUTO and a tolerance; the numbers of these forms must be finite numbers. \
The line reads these extra values whatever the case of the name and of \
JITTER and AUTO, while the annealers take the name INIT_MODE and the words \
JITTER and UNIFORM as written, and AUTO in any case. Which PARAM keys an \
optimiser takes, and their ranges, are checked at startup."""
checks = [
  { msg = "PARAM requires a name and a value", doc = "At the line: PARAM without a name, or a name without a value." },
  { msg = "PARAM {key} is set twice in the {block} block (first on line {first_line}); each key is given once", doc = "At the line: one PARAM name given twice for one optimiser; {key} is the name." },
]

