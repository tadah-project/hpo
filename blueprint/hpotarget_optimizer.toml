# ======================================================= STRATEGY types ==

[[strategy_type]]
id = "STRATEGY.TYPE.PLAIN"
name = "PLAIN"
doc = """\
The STRATEGY-level optimiser runs once. It is the TYPE of a STRATEGY block \
without a TYPE line and of a file without a STRATEGY block."""

[[strategy_type.examples]]
wrap = "strategy"
text = "TYPE PLAIN"

[[strategy_type]]
id = "STRATEGY.TYPE.MULTISTART"
name = "MULTISTART"
keys = ["STRATEGY.N_STARTS", "STRATEGY.PARALLEL", "STRATEGY.BUDGET_PER_START"]
doc = """\
The STRATEGY-level optimiser runs once from each of the first N_STARTS \
starting points of its INIT block, SEED + i for start i. An optimiser \
that takes several starting points in one run, such as DLIB:GFS, runs \
once with all of them."""

[[strategy_type.checks]]
msg = "BUDGET_PER_START has no effect with {name}, which runs every start in one optimiser; use MAXEVAL"
doc = "At startup, at the ENDOPTIMIZER line: the optimiser runs from each start."

[[strategy_type.checks]]
msg = "STRATEGY TYPE MULTISTART cannot run {name}: it is a global optimiser that consumes a single starting point, so restarting it from each INIT point is rejected for any N_STARTS. Use a local or multi-seed optimiser ({list}), or STRATEGY TYPE PLAIN to run {name} once."
doc = """\
At startup, at the ENDOPTIMIZER line: the optimiser is a local one or \
takes several starting points; {list} names them."""

[[strategy_type.examples]]
wrap = "opt_multistart"
text = "N_STARTS 2"

[[strategy_type.examples]]
wrap = "none"
doc = "Four starts from four RANDOM starting points, each with its share of MAXEVAL 40."
text = '''
OPTIM CGRID2B (1) 0.5 1.5
PC_ERMSE 0 1
OPTIMIZER
INIT
METHOD RANDOM 4
SEED 7
ENDINIT
STRATEGY
TYPE MULTISTART
N_STARTS 4
LIB NLOPT
ALGO LN_BOBYQA
MAXEVAL 40
ENDSTRATEGY
ENDOPTIMIZER'''

[[strategy_type.invalid]]
wrap = "none"
check = "startup"
at = "ENDOPTIMIZER"
text = '''
OPTIM CGRID2B (1) 0.5 1.5
PC_ERMSE 0 1
OPTIMIZER
STRATEGY
TYPE MULTISTART
LIB DLIB
ALGO GFS
MAXEVAL 10
BUDGET_PER_START 5
ENDSTRATEGY
ENDOPTIMIZER'''
error = "BUDGET_PER_START has no effect with DLIB:GFS, which runs every start in one optimiser; use MAXEVAL"

[[strategy_type.invalid]]
wrap = "none"
check = "startup"
at = "ENDOPTIMIZER"
text = '''
OPTIM CGRID2B (1) 0.5 1.5
PC_ERMSE 0 1
OPTIMIZER
STRATEGY
TYPE MULTISTART
LIB NLOPT
ALGO GN_DIRECT_L
MAXEVAL 10
ENDSTRATEGY
ENDOPTIMIZER'''
error = "STRATEGY TYPE MULTISTART cannot run NLOPT:GN_DIRECT_L: it is a global optimiser that consumes a single starting point, so restarting it from each INIT point is rejected for any N_STARTS. Use a local or multi-seed optimiser (CERES:STEEPEST_DESCENT, DLIB:BFGS, DLIB:GFS, NLOPT:AUGLAG, NLOPT:AUGLAG_EQ, NLOPT:LD_AUGLAG, ... (18 more)), or STRATEGY TYPE PLAIN to run NLOPT:GN_DIRECT_L once."

[[strategy_type]]
id = "STRATEGY.TYPE.PRESTAGE"
name = "PRESTAGE"
keys = ["STRATEGY.TOPK"]
doc = """\
An exploration with the optimiser of the EXPLORE block, then a refinement \
with the STRATEGY-level optimiser, or that of the REFINE block, from the \
TOPK best candidates of the exploration."""

[[strategy_type.checks]]
msg = "STRATEGY TYPE PRESTAGE requires an EXPLORE ... ENDEXPLORE block inside the STRATEGY block (it defines the exploration phase); the refinement optimiser is the STRATEGY-level LIB/ALGO or an optional REFINE ... ENDREFINE block."
doc = "At startup, at the ENDOPTIMIZER line: the STRATEGY block has an EXPLORE block."

[[strategy_type.checks]]
msg = "STRATEGY TYPE PRESTAGE cannot refine with {name}: it does not start at the point it is given ({note}), so the refinement would never use the exploration's candidates, for any TOPK. Use a local optimiser, which starts at each candidate ({list}), or run {name} as the exploration (EXPLORE block) or once, as STRATEGY TYPE PLAIN."
doc = """\
At startup, at the ENDOPTIMIZER line: the refinement optimiser starts at \
the point it is given; {note} says where it starts instead."""

[[strategy_type.checks]]
msg = "STRATEGY TYPE PRESTAGE with TOPK {value} cannot refine with {name}: the refinement runs its optimiser once from each of the TOPK candidates the exploration forwards, and {name} is a global optimiser that consumes a single starting point. Use a local or multi-seed refinement optimiser ({list}), or TOPK 1 to refine the best candidate once."
doc = "At startup, at the ENDOPTIMIZER line, with TOPK above 1: the refinement optimiser runs from each candidate."

[[strategy_type.examples]]
wrap = "opt_prestage"
text = "TOPK 2"

[[strategy_type.invalid]]
wrap = "strategy"
check = "startup"
at = "ENDOPTIMIZER"
text = "TYPE PRESTAGE"
error = "STRATEGY TYPE PRESTAGE requires an EXPLORE ... ENDEXPLORE block inside the STRATEGY block (it defines the exploration phase); the refinement optimiser is the STRATEGY-level LIB/ALGO or an optional REFINE ... ENDREFINE block."

[[strategy_type.invalid]]
wrap = "none"
check = "startup"
at = "ENDOPTIMIZER"
text = '''
OPTIM CGRID2B (1) 0.5 1.5
PC_ERMSE 0 1
OPTIMIZER
STRATEGY
TYPE PRESTAGE
LIB NLOPT
ALGO GN_DIRECT_L
MAXEVAL 10
EXPLORE
LIB TADAH
ALGO RANDOM
MAXEVAL 5
ENDEXPLORE
ENDSTRATEGY
ENDOPTIMIZER'''
error = "STRATEGY TYPE PRESTAGE cannot refine with NLOPT:GN_DIRECT_L: it does not start at the point it is given (DIRECT evaluates the centre of the OPTIM box first and then divides the whole box; NLopt never reads that point), so the refinement would never use the exploration's candidates, for any TOPK. Use a local optimiser, which starts at each candidate (CERES:STEEPEST_DESCENT, DLIB:BFGS, NLOPT:LD_AUGLAG, NLOPT:LD_AUGLAG_EQ, NLOPT:LD_CCSAQ, NLOPT:LD_LBFGS, NLOPT:LD_MMA, NLOPT:LD_SLSQP, NLOPT:LD_TNEWTON, NLOPT:LD_TNEWTON_PRECOND, NLOPT:LD_TNEWTON_PRECOND_RESTART, NLOPT:LD_TNEWTON_RESTART, NLOPT:LD_VAR1, NLOPT:LD_VAR2, NLOPT:LN_AUGLAG, NLOPT:LN_AUGLAG_EQ, NLOPT:LN_BOBYQA, NLOPT:LN_COBYLA, NLOPT:LN_NELDERMEAD, NLOPT:LN_PRAXIS, NLOPT:LN_SBPLX), or run NLOPT:GN_DIRECT_L as the exploration (EXPLORE block) or once, as STRATEGY TYPE PLAIN."

[[strategy_type.invalid]]
wrap = "none"
check = "startup"
at = "ENDOPTIMIZER"
text = '''
OPTIM CGRID2B (1) 0.5 1.5
PC_ERMSE 0 1
OPTIMIZER
STRATEGY
TYPE PRESTAGE
LIB NLOPT
ALGO GN_CRS2_LM
MAXEVAL 10
EXPLORE
LIB TADAH
ALGO RANDOM
MAXEVAL 5
ENDEXPLORE
TOPK 2
ENDSTRATEGY
ENDOPTIMIZER'''
error = "STRATEGY TYPE PRESTAGE with TOPK 2 cannot refine with NLOPT:GN_CRS2_LM: the refinement runs its optimiser once from each of the TOPK candidates the exploration forwards, and NLOPT:GN_CRS2_LM is a global optimiser that consumes a single starting point. Use a local or multi-seed refinement optimiser (CERES:STEEPEST_DESCENT, DLIB:BFGS, DLIB:GFS, NLOPT:AUGLAG, NLOPT:AUGLAG_EQ, NLOPT:LD_AUGLAG, ... (18 more)), or TOPK 1 to refine the best candidate once."

# ============================================================ INIT keys ==
# Valid in INIT and RESTART blocks. Inside them a STRATEGY line is read as
# a METHOD line (the aliases of BLOCK.INIT and BLOCK.RESTART).

[[key]]
id = "INIT.METHOD"
name = "METHOD"
blocks = ["INIT", "RESTART"]
synopsis = "METHOD <method> [<value>]"
args = [
  { name = "method", kind = "name", msg = "Unknown INIT_STRATEGY method: {tok}", doc = "CONFIG, RANDOM, LHS, SOBOL or WARM (the INIT methods)." },
  { name = "value", kind = "tokens", optional = true, doc = "The value of the method: none for CONFIG, K for RANDOM, LHS and SOBOL, a file for WARM." },
]
repeat = "add"
default = { text = "No METHOD line: one starting point, the values of the training configuration, as METHOD CONFIG." }
doc = """\
Adds the starting points of one INIT method to the chain of the block. \
The chain draws its METHOD lines in the order of the file, and drops a \
point equal to an earlier one."""
long_doc = """\
The method and its values are checked at the line; a WARM file is read, \
and the points are drawn, once the whole file has been read, and a \
refusal then names the METHOD line. Inside an INIT or RESTART block a \
STRATEGY line is a METHOD line. The method names are compared as written, \
in upper case."""
quirk = """\
The messages about a METHOD line name it INIT METHOD, or INIT.METHOD, \
inside a RESTART block too, and the message about an unknown method names \
it an INIT_STRATEGY method."""
checks = [
  { msg = "{key} requires a method name", doc = "At the line: METHOD, or its other name STRATEGY, without a method." },
]

[[key.examples]]
wrap = "init"
text = "METHOD RANDOM 4"

[[key.examples]]
doc = "A chain of three methods: the values of the training configuration, 3 Latin hypercube points and 2 Sobol points."
wrap = "init"
text = '''
METHOD CONFIG
METHOD LHS 3
METHOD SOBOL 2'''

[[key.examples]]
wrap = "init"
doc = "STRATEGY inside an INIT block is a METHOD line."
text = "STRATEGY RANDOM 2"

[[key.examples]]
doc = "In a RESTART block, the METHOD lines draw the starting points of each restart."
wrap = "restart"
text = '''
AFTER_STAGNATION 20
MAX 3
METHOD RANDOM 2'''

[[key.invalid]]
wrap = "init"
text = "METHOD"
error = "METHOD requires a method name"

[[key.invalid]]
wrap = "init"
text = "STRATEGY"
error = "STRATEGY requires a method name"

[[key.invalid]]
wrap = "init"
text = "METHOD FOO 2"
error = "Unknown INIT_STRATEGY method: FOO"

[[key.invalid]]
wrap = "restart"
text = "METHOD random 2"
error = "Unknown INIT_STRATEGY method: random"

[[key]]
id = "INIT.K_TOTAL"
name = "K_TOTAL"
blocks = ["INIT", "RESTART"]
synopsis = "K_TOTAL <n>"
args = [ { name = "n", kind = "integer", min = 0, max = 1000000, what = "{key}" } ]
repeat = "error"
repeat_msg = "K_TOTAL is set twice in the {block} block (first on line {first_line}); each key is given once"
repeat_doc = """\
Once for each set of starting points. A second line is refused in the same \
block, in a second block of that type, or in another INIT block inside \
OPTIMIZER, STRATEGY or REFINE, which set the starting points of one \
optimiser."""
default = { text = "The sum of the K of the METHOD lines, 1 for CONFIG and WARM.", unchecked = "The numbers count starting points; they are no setting." }
doc = """\
The number of starting points of the chain of the block: a chain of \
several METHOD lines stops at K_TOTAL points. 0 sets no limit."""
long_doc = """\
In a RESTART block it is the number of points of each restart."""
quirk = """\
With a single METHOD line of RANDOM, LHS or SOBOL, K_TOTAL replaces its K \
and can draw more points than K."""

[[key.examples]]
wrap = "init"
text = '''
METHOD CONFIG
METHOD RANDOM 5
K_TOTAL 3'''

[[key.examples]]
doc = "With a single METHOD line K_TOTAL replaces its K: eight points are drawn."
wrap = "init"
text = '''
METHOD RANDOM 2
K_TOTAL 8'''

[[key.invalid]]
wrap = "init"
text = "K_TOTAL x"
error = "K_TOTAL must be an integer from 0 to 1000000, got 'x'"

[[key.invalid]]
wrap = "init"
text = "K_TOTAL 1 2"
error = "K_TOTAL takes a single value (unexpected '2')"

[[key.invalid]]
wrap = "init"
at = 3
text = '''
METHOD RANDOM 4
K_TOTAL 4
K_TOTAL 5'''
error = "K_TOTAL is set twice in the INIT block (first on line 6); each key is given once"

[[key]]
id = "INIT.SEED"
name = "SEED"
blocks = ["INIT", "RESTART"]
synopsis = "SEED <n>"
args = [ { name = "n", kind = "integer", min = 0, max = "UINT64_MAX", what = "{key}" } ]
repeat = "error"
repeat_msg = "SEED is set twice in the {block} block (first on line {first_line}); each key is given once"
repeat_doc = """\
Once for each set of starting points. A second line is refused in the same \
block, in a second block of that type, or in another INIT block inside \
OPTIMIZER, STRATEGY or REFINE, which set the starting points of one \
optimiser."""
default = { text = "Not set: each run takes a seed of its own, so the drawn points differ between runs." }
doc = """\
The seed of the RANDOM, LHS and SOBOL lines of the block. An NLopt \
optimiser without a SEED of its own takes this seed too."""
long_doc = """\
Restart r of a RESTART block draws with SEED + r. A chain without RANDOM, \
LHS or SOBOL does not use the seed, with a warning. SEED inside an \
optimiser block is another key, the seed of the optimiser."""

[[key.examples]]
wrap = "init"
text = '''
METHOD SOBOL 4
SEED 7'''

[[key.invalid]]
wrap = "init"
text = "SEED -1"
error = "SEED must be an integer >= 0, got '-1'"

[[key.invalid]]
wrap = "init"
at = 2
text = '''
SEED 1
SEED 2'''
error = "SEED is set twice in the INIT block (first on line 5); each key is given once"

[[key]]
id = "INIT.WARM_ON_MISMATCH"
name = "WARM_ON_MISMATCH"
blocks = ["INIT", "RESTART"]
synopsis = "WARM_ON_MISMATCH warn | error | skip"
args = [ { name = "policy", kind = "word", words = ["warn", "error", "skip"], msg = "WARM_ON_MISMATCH must be one of: warn, error, skip" } ]
repeat = "error"
repeat_msg = "WARM_ON_MISMATCH is set twice in the {block} block (first on line {first_line}); each key is given once"
repeat_doc = """\
Once for each set of starting points. A second line is refused in the same \
block, in a second block of that type, or in another INIT block inside \
OPTIMIZER, STRATEGY or REFINE, which set the starting points of one \
optimiser."""
default = { literal = "warn" }
doc = """\
How the WARM lines of the block treat a seed file that lacks a search \
parameter or holds one outside its OPTIM box. The value warn keeps the \
seed, with the value of the training configuration or the value moved \
into the box; skip drops the seed, and error refuses it."""
long_doc = """\
It applies to every WARM line of the block, before or after it. A seed \
file that cannot be opened or read is refused whatever the value."""

[[key.examples]]
wrap = "init"
text = "WARM_ON_MISMATCH error"

[[key.examples]]
doc = "The default, written out."
wrap = "init"
text = "WARM_ON_MISMATCH warn"

[[key.examples]]
wrap = "init"
doc = "The seed holds a value outside the box: it is dropped."
text = '''
METHOD WARM opt_seed_outside.tadah
METHOD CONFIG
WARM_ON_MISMATCH skip'''

[[key.invalid]]
wrap = "init"
text = "WARM_ON_MISMATCH ERROR"
error = "WARM_ON_MISMATCH must be one of: warn, error, skip"

[[key.invalid]]
wrap = "init"
text = "WARM_ON_MISMATCH"
error = "WARM_ON_MISMATCH requires a value"

[[key.invalid]]
wrap = "init"
text = '''
METHOD WARM opt_seed_outside.tadah
WARM_ON_MISMATCH error'''
error = "WARM: 1 parameter(s) from opt_seed_outside.tadah clamped into OPTIM bounds -- the seed point is NOT the one on disk: dim[1] 3 -> 1.5 (bounds [0.5, 1.5])"
msg_of = "METHOD.WARM"

[[key.invalid]]
wrap = "init"
text = '''
METHOD WARM opt_seed_other.tadah
WARM_ON_MISMATCH error'''
error = "WARM: 1 parameter(s) not found in opt_seed_other.tadah: CGRID2B[1]"
msg_of = "METHOD.WARM"

[[key.invalid]]
wrap = "init"
at = 2
text = '''
WARM_ON_MISMATCH warn
WARM_ON_MISMATCH error'''
error = "WARM_ON_MISMATCH is set twice in the INIT block (first on line 5); each key is given once"

# ========================================================== INIT methods ==

[[init_method]]
id = "METHOD.CONFIG"
name = "CONFIG"
doc = """\
One starting point: the values of the training configuration for the \
search parameters."""

[[init_method.checks]]
msg = "INIT METHOD CONFIG takes no arguments"
doc = "At the METHOD line: CONFIG takes no value."

[[init_method.examples]]
