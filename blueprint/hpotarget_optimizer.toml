[[key]]
id = "STRATEGY.TOPK"
name = "TOPK"
blocks = ["STRATEGY"]
synopsis = "TOPK <n>"
args = [ { name = "n", kind = "integer", min = 1, max = 1000000, what = "{key}" } ]
repeat = "error"
repeat_msg = "TOPK is set twice in the STRATEGY block (first on line {first_line}); each key is given once"
default = { literal = "1" }
doc = """\
The number of best candidates of the PRESTAGE exploration that the \
refinement starts from: it runs its optimiser once from each, or once from \
all of them for an optimiser that takes several starting points in one \
run."""
long_doc = """\
Above 1, the refinement optimiser must be one that runs from each start, \
as under STRATEGY TYPE MULTISTART, or one that takes several starting \
points in one run, such as DLIB:GFS. The refinement shares its MAXEVAL \
among the candidates, while DLIB:GFS runs once with all of them and the \
whole MAXEVAL."""

[[key.examples]]
