error = "the STRATEGY-level optimiser: CERES:STEEPEST_DESCENT requires FTOL_REL >= 0 (Ceres' function_tolerance), got -1"

[[key.invalid]]
wrap = "opt_bfgs"
check = "startup"
at = "ENDOPTIMIZER"
