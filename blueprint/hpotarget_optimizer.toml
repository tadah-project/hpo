error = "GRAD_STRATEGY must be one of NUMERICAL, ANALYTICAL, HYBRID (got 'numerical')"

[[key.invalid]]
wrap = "opt_lbfgs"
text = "GRAD_STRATEGY"
error = "GRAD_STRATEGY must be one of NUMERICAL, ANALYTICAL, HYBRID (got '')"

[[key.invalid]]
wrap = "opt_lbfgs"
text = "GRAD_STRATEGY AUTODIFF"
error = "GRAD_STRATEGY=AUTODIFF was renamed to ANALYTICAL; the prior stub now backs a closed-form analytical gradient. Use GRAD_STRATEGY ANALYTICAL (strict -- every theta must have a registered analytical derivative) or GRAD_STRATEGY HYBRID (analytical-where-registered + finite-difference fallback)."

[[key.invalid]]
wrap = "opt_lbfgs"
text = "GRAD_STRATEGY HYBRID NUMERICAL"
error = "GRAD_STRATEGY takes no further value here (unexpected 'NUMERICAL')"

[[key.invalid]]
wrap = "strategy"
check = "startup"
at = "ENDOPTIMIZER"
text = "GRAD_STRATEGY NUMERICAL"
error = "the STRATEGY-level optimiser NLOPT:LN_SBPLX: GRAD_STRATEGY never takes effect: NLOPT:LN_SBPLX takes no gradient; remove it."

