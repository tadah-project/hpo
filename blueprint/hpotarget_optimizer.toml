[[key]]
id = "OPTIMIZER.STEP"
name = "STEP"
group = "OPTIMIZER"
synopsis = "STEP <fraction> | STEP <KEY>[(<indices>)] <fraction>"
args = [
  { name = "KEY", kind = "name", optional = true, doc = "An OPTIM key, in upper case: the fraction applies to its search parameters only." },
  { name = "indices", kind = "indices", optional = true, doc = "The values of the key the fraction applies to, right after the key or after a blank." },
  { name = "fraction", kind = "number", min = 0, min_open = true, max = 0.5, doc = "The first step as a fraction of the width of the box in the coordinates of the search." },
]
repeat = "error"
repeat_msg = "STEP is set twice in the {block} block (first on line {first_line}); each key is given once"
repeat_doc = "A line with a fraction alone is given once for each optimiser, as a key of the optimiser group is. Each line with a key adds an override, given once for its key and its indices; of two overrides of one search parameter the later line wins."
default = { text = "Not set: the optimiser chooses its first step." }
doc = """\
The first step of the optimiser as a fraction, in (0, 0.5], of the width \
of each OPTIM box in the coordinates of the search. With an OPTIM key, and \
optionally its indices, the fraction applies to those search parameters \
only."""
long_doc = """\
The coordinates of the search are the logarithm of the value for a \
log-scaled box (LOG, or LOG_HP), and asinh(x/c) for an ASINH box. A first \
value shaped like a number is the fraction of every search parameter, \
given once for each optimiser. Each line with a key adds an override for \
the search parameters of that key: all of them, or those of the index \
list. The list is written KEY(1,3-5) or KEY (1,3-5), without a blank \
inside the parentheses. One key and index list is given once, KEY(1) and \
KEY (1) being one. The key is matched as written against the OPTIM keys, \
which are upper case. Of two overrides of one search parameter the later \
line wins. Without a fraction for every search parameter, the overrides \
must cover each of them. The fraction and the keys are checked once the \
whole file is read. A refusal names the ENDOPTIMIZER line, or the \
ENDEXPLORE or ENDINNER line for the optimiser of that block; an optimiser \
that does not use STEP is refused there too. An NLopt MLSL or AUGLAG hands \
its STEP to its local search: a STEP in its block replaces the STEP of its \
INNER block, and hpo_run.log has a warning."""
quirk = """\
The key of an override is matched as written, while an OPTIM line reads \
its key in any case: STEP cgrid2b refers to no OPTIM key. The index list \
of an override takes no blank, while that of an OPTIM line does."""
checks = [
  { msg = "{lib}:{algo} ({phase}) does not use STEP; {why}", doc = "Once the whole file is read, at the END line of its optimiser: an optimiser that does not use STEP; {phase} is OUTER, INNER, PRESTAGE or PRESTAGE.INNER, and {why} says what sets its first step instead." },
  { msg = "STEP override '{text}': expected KEY(indices) <frac>", doc = "At the line: an index list without its closing parenthesis, or text after it." },
  { msg = "STEP override '{text}': empty index list", doc = "At the line: an empty index list." },
  { msg = "STEP override '{text}': bad index list ({why})", doc = "At the line: an index list the OPTIM grammar refuses, or an index 0." },
  { msg = "STEP override names OPTIM key '{key}' which is not optimised (no OPTIM line for it)", doc = "Once the whole file is read, at the END line of its optimiser: a key no OPTIM line searches, matched as written." },
  { msg = "STEP {key}({index}): index {index} is not an OPTIM'd index of {key}", doc = "Once the whole file is read, at the END line of its optimiser: an index no OPTIM line of the key selects." },
  { msg = "STEP overrides cover only some dimensions and no block-wide STEP is set; add `STEP <frac>` or override every OPTIM'd dimension", doc = "At startup, at the END line of its optimiser: overrides without a block-wide STEP that leave a search parameter without a fraction." },
  { msg = "{lib}:{algo} ({phase}): STEP must be > 0 and finite (got {value})", doc = "Once the whole file is read, at the END line of its optimiser: a fraction of 0 or below." },
  { msg = "{lib}:{algo} ({phase}): STEP must be a fraction of the OPTIM width in (0, 0.5] (got {value}); values above 0.5 cannot satisfy BOBYQA's width >= 2*step rule and exceed NLopt's own 0.25 default", doc = "Once the whole file is read, at the END line of its optimiser: a fraction above 0.5." },
  { msg = "STEP {key} is set twice in the {block} block (first on line {first_line}); each key is given once", doc = "At the line: an override given twice for one key and index list; {key} is the key with its index list." },
]

