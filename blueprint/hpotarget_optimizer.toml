error = "FTOL_REL must be a finite number, got '1e-6x'"

[[key.invalid]]
wrap = "explore"
check = "startup"
at = "ENDEXPLORE"
text = "FTOL_REL 1e-4"
error = "the PRESTAGE exploration (EXPLORE block): TADAH:RANDOM does not support FTOL_REL: uniform random search has no convergence test to apply it to; stop it with MAXEVAL, MAXTIME or STOPVAL"

[[key.invalid]]
wrap = "none"
check = "startup"
at = "ENDOPTIMIZER"
doc = "FTOL_REL in the block of an AUGLAG with an INNER block."
text = '''
