[[key]]
id = "OPTIMIZER.SEED"
name = "SEED"
group = "OPTIMIZER"
synopsis = "SEED <n>"
args = [ { name = "n", kind = "integer", min = 0, max = "UINT64_MAX", what = "{key}" } ]
repeat = "error"
repeat_msg = "SEED is set twice in the {block} block (first on line {first_line}); each key is given once"
repeat_doc = "Once for each optimiser: a second line is refused, in the same block, in a second block of that type, or in another of OPTIMIZER, STRATEGY and REFINE, which set the same optimiser."
default = { text = "Not set: each run takes a seed of its own, so two runs differ." }
doc = """\
The seed of the random numbers of the optimiser, for a reproducible \
search. An optimiser that does not read SEED refuses it when tadah hpo \
starts, or only warns where the optimiser list says so; that list shows \
which optimisers read it."""
long_doc = """\
Under STRATEGY TYPE MULTISTART start i runs with SEED + i. Under STRATEGY \
TYPE PRESTAGE an EXPLORE block whose optimiser reads SEED, and that has no \
seed of its own, takes the STRATEGY-level SEED. A SEED line, and for NLopt \
a SEED in its INIT block, is a seed of its own; the refinement draws \
random numbers of its own. Restart r of an active RESTART block runs the \
optimiser with SEED + r times the number of starts (N_STARTS under \
MULTISTART, TOPK under PRESTAGE, 1 under PLAIN), and the EXPLORE block \
with its SEED + r. An INNER block refuses SEED: NLopt draws its local \
search from the random numbers of the enclosing run. SEED inside an INIT \
or RESTART block is another key, the seed of the starting points."""
quirk = """\
DLIB:GFS, which does not read SEED, warns only when its search starts: \
tadah hpo --check does not show the warning."""
checks = [
  { msg = "{phase}: {lib}:{algo} does not use SEED: it draws no random numbers; remove it", doc = "At startup, at the END line of its optimiser: an optimiser that does not read SEED and does not only warn." },
  { msg = "{phase}: {lib}:{algo} does not support SEED", doc = "At startup, at the END line of its optimiser: DLIB:BFGS or CERES:STEEPEST_DESCENT." },
]

[[key.examples]]
wrap = "strategy"
text = "SEED 42"

[[key.examples]]
doc = "The largest seed, 2^64 - 1."
wrap = "strategy"
text = "SEED 18446744073709551615"

[[key.examples]]
wrap = "none"
doc = "The exploration, TADAH:RANDOM without a SEED of its own, takes SEED 7 of the STRATEGY block."
text = '''
OPTIM CGRID2B (1) 0.5 1.5
PC_ERMSE 0 1
OPTIMIZER
STRATEGY
TYPE PRESTAGE
LIB NLOPT
ALGO LN_SBPLX
MAXEVAL 10
SEED 7
EXPLORE
LIB TADAH
ALGO RANDOM
MAXEVAL 5
ENDEXPLORE
ENDSTRATEGY
ENDOPTIMIZER'''

[[key.invalid]]
wrap = "strategy"
text = "SEED -1"
error = "SEED must be an integer >= 0, got '-1'"

[[key.invalid]]
wrap = "strategy"
text = "SEED 18446744073709551616"
error = "SEED must be an integer >= 0, got '18446744073709551616'"

