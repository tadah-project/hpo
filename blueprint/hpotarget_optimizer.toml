[[init_method]]
id = "METHOD.RANDOM"
name = "RANDOM"
args = [ { name = "K", kind = "integer", min = 0, max = 1000000, what = "INIT METHOD RANDOM K" } ]
doc = """\
K starting points drawn uniformly in the OPTIM boxes, in the coordinates \
of the search (a log-scaled search parameter is drawn in its logarithm)."""

[[init_method.checks]]
msg = "INIT METHOD RANDOM expects exactly one arg: K"
doc = "At the METHOD line: RANDOM takes one value."

[[init_method.examples]]
wrap = "init"
