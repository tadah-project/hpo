[[key]]
id = "OPTIMIZER.XTOL_REL"
name = "XTOL_REL"
group = "OPTIMIZER"
synopsis = "XTOL_REL <tolerance>"
args = [ { name = "tolerance", kind = "number", what = "{key}" } ]
repeat = "error"
repeat_msg = "XTOL_REL is set twice in the {block} block (first on line {first_line}); each key is given once"
repeat_doc = "Once for each optimiser: a second line is refused, in the same block, in a second block of that type, or in another of OPTIMIZER, STRATEGY and REFINE, which set the same optimiser."
default = { text = "Not set: no tolerance; CERES:STEEPEST_DESCENT uses 1e-8, and the local search of an NLopt MLSL 1e-7 when it has no other tolerance.", unchecked = "NLopt applies its own tolerances to the local search of an MLSL; tadah hpo does not set them." }
doc = """\
The relative tolerance on the search parameters: the search stops when an \
iteration moves them by less than this fraction."""
long_doc = """\
Only the optimisers that test it take it (the optimiser list names them); \
another optimiser is refused at startup with this key. An NLopt MLSL or \
AUGLAG without an INNER block hands the tolerance to NLopt's default \
local optimiser, which tests it; with an INNER block the block refuses \
it, and the INNER block takes it. NLopt takes a value of 0 or below as no \
tolerance; CERES:STEEPEST_DESCENT refuses a negative value at startup. \
The local search of an NLopt MLSL that has none of FTOL_REL, FTOL_ABS and \
XTOL_REL above 0, in a block without XTOL_ABS above 0, runs with NLopt's \
FTOL_REL 1e-15 and XTOL_REL 1e-7."""
checks = [
  { msg = "{phase}: CERES:{algo} requires XTOL_REL >= 0 (Ceres' parameter_tolerance), got {value}", doc = "At startup, at the END line of its optimiser." },
  { msg = "{phase}: DLIB:BFGS does not support XTOL_REL", doc = "At startup, at the END line of its optimiser." },
  { msg = "{phase}: ASA:ASA does not implement XTOL_REL/XTOL_ABS", doc = "At startup, at the END line of its optimiser." },
  { msg = "{phase}: TADAH:{algo} does not implement XTOL_REL/XTOL_ABS (no x-space convergence test); remove them or use FTOL_REL/FTOL_ABS (eps-NEPS plateau stop)", doc = "At startup, at the END line of its optimiser: an annealer." },
  { msg = "{phase}: {lib}:{algo} does not support XTOL_REL{note}", doc = "At startup, at the END line of its optimiser: an optimiser that does not test XTOL_REL; {note} says why and names the stops it honours." },
  { msg = "{phase}: {lib}:{algo} does not support XTOL_REL with an INNER block: {why}; set it in the INNER block, whose local search tests it", doc = "At startup, at the END line of its optimiser: an NLopt MLSL or AUGLAG with an INNER block; {why} says how the INNER search ends the run." },
]

