BUMPGATE CANDIDATE'''
error = "BUMPGATE is set twice (first on line 1); each key is given once"

[[key.examples]]
wrap = "main_ream"
doc = "CANDIDATE accepts the box that STRICT refuses: each candidate whose bump 4 reaches past RCUT2B is refused before it is trained."
text = '''
BUMPGATE CANDIDATE
OPTIM CGRID2B (4) 4.0 5.0'''

[[key.invalid]]
wrap = "main_ream"
check = "startup"
at = "none"
doc = "Under STRICT: the worst corner of the box of bump 4 reaches past RCUT2B."
text = '''
