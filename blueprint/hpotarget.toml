OPTIM CGRID2B (4) 4.0 5.0'''
error = "bump-support gate: with a hard (Cut_Dummy) cutoff every compact bump must vanish at or before RCUT (c + w/eta <= RCUT) — a truncated overhang is an energy/force STEP at the cutoff. Violations:\n  - the OPTIM bounds let bump 4 of CGRID2B reach 6, past RCUT2B = 5.5 — need the OPTIM SGRID2B (4) low bound >= w/(RCUT2B - c_hi) = 6 (currently 3).\n  To search longer range, raise RCUT2B/RCUTMB in the config (the potential stays smooth: bumps still vanish at their own support edge)."

