[[key]]
id = "ROOT.DUMP"
name = "DUMP"
blocks = ["ROOT"]
synopsis = "DUMP <n> <directory>"
checks = [
  { msg = "{key} requires a cadence and a directory", doc = "Fewer than two values follow the key." },
  { msg = "{key} takes a cadence and a directory (unexpected '{tok}')", doc = "A value follows the directory." },
  { msg = "{key} directory '{name}' exists and is not a directory", doc = "Once the file is read, at the line: the path exists and is no directory." },
  { msg = "{key} directory '{name}' is not writable", doc = "Once the file is read, at the line: the directory exists, and the run cannot create a file in it." },
  { msg = "{key} directory '{name}' is a symbolic link to '{file}', which does not exist", doc = "Once the file is read, at the line: the path is a symbolic link to a directory that does not exist, which the run does not create; {file} is the target of the link." },
  { msg = "{key} directory '{name}' cannot be created: the directory '{parent}' does not exist (tadah hpo creates only the last directory of the path)", doc = "Once the file is read, at the line: the directory that would hold it does not exist; {parent} is its absolute path." },
  { msg = "{key} directory '{name}' cannot be created: '{parent}' is not a directory", doc = "Once the file is read, at the line: the path that would hold the directory is no directory." },
  { msg = "{key} directory '{name}' cannot be created: the directory '{parent}' is not writable", doc = "Once the file is read, at the line: the run cannot create a directory in the directory that would hold it." },
  { msg = "{key} directory '{name}' cannot be read: {why}", doc = "Once the file is read, at the line: the state of the directory cannot be read; {why} is the message of the file system." },
  { msg = "{key} directory '{name}' cannot be resolved: {why}", doc = "Once the file is read, at the line: the path cannot be followed to a directory, and {why} says why. Examples are '.' or '..' in a directory that does not exist, a directory on the way that cannot be read, and more than 40 symbolic links." },
]
args = [
  { name = "n", kind = "integer", min = 1, what = "{key} cadence" },
  { name = "directory", kind = "name", doc = "A directory the run can write into: one that exists, or one the run creates in a directory that exists." },
]
repeat = "error"
repeat_msg = "DUMP is set twice (first on line {first_line}); each key is given once"
default = { text = "no potential of an evaluation is written" }
doc = """\
Writes the potential of every nth evaluation to <directory>/pot_<i>.tadah, \
where i is the number of the evaluation."""
long_doc = """\
The directory is checked once the file is read, and the run creates it \
right before its first evaluation: a run that stops before then, and tadah \
hpo --check, create no directory. The run creates only the last directory \
of the path. Its parent is a directory that exists and can be written \
into, or the directory of the BDUMP line, which the run creates first. A \
symbolic link to a directory that does not exist is refused. The path is \
followed as the operating system follows it, symbolic links and '..' \
included. A point outside the OPTIM box is not evaluated, and its \
potential is not written. A candidate refused before it is trained, or \
whose training fails, is written as a file with the comment header only."""
untested = [
  { msg = "{key} directory '{name}' is not writable", why = "Needs a directory without write or read permission, which a run with the rights of root does not have." },
  { msg = "{key} directory '{name}' is a symbolic link to '{file}', which does not exist", why = "Needs a symbolic link, which a case cannot write." },
  { msg = "{key} directory '{name}' cannot be created: the directory '{parent}' does not exist (tadah hpo creates only the last directory of the path)", why = "The message names an absolute path in the working directory of the run, which differs from run to run." },
  { msg = "{key} directory '{name}' cannot be created: the directory '{parent}' is not writable", why = "Needs a directory without write or read permission, which a run with the rights of root does not have." },
  { msg = "{key} directory '{name}' cannot be read: {why}", why = "Needs a directory without write or read permission, which a run with the rights of root does not have." },
]

