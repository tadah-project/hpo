[[key]]
id = "ROOT.RHOBARGATE"
name = "RHOBARGATE"
blocks = ["ROOT"]
synopsis = "RHOBARGATE bcc | fcc | hcp <a0> <f_lo> <f_hi> [NPTS <n>] [SEED ERROR | WARN]"
args = [
  { name = "lattice", kind = "word", words = ["bcc", "fcc", "hcp"], msg = "RHOBARGATE lattice must be bcc, fcc or hcp, got '{tok}'" },
  { name = "a0", kind = "number", what = "RHOBARGATE a0", doc = "The lattice constant in Å, above 0; for hcp the in-plane one." },
  { name = "f_lo", kind = "number", what = "RHOBARGATE f_lo", doc = "The smallest lattice constant, as a fraction of a0, above 0 and below f_hi. The largest RCUTMB a candidate can have lies within 20 lattice constants of the smallest lattice, f_lo a0." },
  { name = "f_hi", kind = "number", what = "RHOBARGATE f_hi", doc = "The largest lattice constant, as a fraction of a0. NPTS and SEED follow it, each with its value, in any order and each at most once." },
]
repeat = "error"
repeat_msg = "RHOBARGATE is set twice (first on line {first_line}); each key is given once"
doc = """\
The lattice condition of a many-body density: a candidate whose \
monatomic lattice density rhobar(a) does not decrease strictly for a from \
f_lo a0 to f_hi a0 is refused before it is trained, as a failed \
evaluation."""
long_doc = """\
RHOBARGATE applies under every density form. The many-body term of the \
training configuration is a bare DM_REAM term or a single DM_Embed \
component; a DM_mJoin or several components are refused at startup. At \
startup, too, every density pair weight (WATOM) can be above 0, and the \
first shell of the lattice at f_hi a0 lies inside the smallest RCUTMB a \
candidate can have. The largest RCUTMB a candidate can have lies within 20 \
lattice constants of the smallest lattice, f_lo a0. An OPTIM line on a \
density key arms RHOBARGATE, and hcp takes the ideal c/a. At startup the \
CONFIG and WARM starting points of the INIT and RESTART chains are checked \
as candidates, and SEED says what a failing one does. A training \
configuration that is no such starting point and fails has a warning \
instead; RANDOM, LHS and SOBOL points are checked when they are evaluated."""
quirk = """\
The lattice, the options NPTS and SEED and the values ERROR and WARN are \
read in any case (BCC, npts, seed warn), while every key is matched as \
written."""
checks = [
  { msg = "RHOBARGATE: the lattice, a0, f_lo and f_hi are required; expected RHOBARGATE <bcc|fcc|hcp> <a0> <f_lo> <f_hi> [NPTS <n>] [SEED ERROR|WARN]", doc = "Fewer than four values follow the key." },
  { msg = "RHOBARGATE a0 must be > 0, got '{tok}'", doc = "Once a0, f_lo and f_hi are read as numbers: a0 is 0 or below." },
  { msg = "RHOBARGATE needs 0 < f_lo < f_hi, got f_lo '{low}', f_hi '{high}'", doc = "Once a0, f_lo and f_hi are read as numbers and a0 is above 0: f_lo is 0 or below, or not below f_hi." },
  { msg = "RHOBARGATE: unexpected token '{tok}'; expected RHOBARGATE <bcc|fcc|hcp> <a0> <f_lo> <f_hi> [NPTS <n>] [SEED ERROR|WARN]", doc = "A word after f_hi, in the place of an option, is not NPTS or SEED." },
  { msg = "{keys} {what} the density of one DM_REAM many-body term or of one DM_Embed component, and {why}", doc = "At startup, at the RHOGATE or RHOBARGATE line (the first of them when both are given): as for RHOGATE." },
  { msg = "RHOBARGATE: f_lo = {low} puts the largest reachable RCUTMB, {max} A, at {value} lattice constants of the smallest lattice (a = f_lo a0 = {min} A); the limit is 20. f_lo and f_hi are fractions of a0 (0.75 scans down to 25 % compression), and a larger f_lo puts that RCUTMB at fewer lattice constants.", doc = "At startup, without a line: the largest RCUTMB a candidate can have, {max}, is more than 20 lattice constants of the smallest lattice, {min}." },
  { msg = "RHOBARGATE: seed {name} fails the lattice rhobar(a) gate: {why}. A seed that fails is refused under SEED ERROR, the default, and is evaluated as a rejected start under SEED WARN. tadah refit --edit changes the density of a potential file; a WARM seed takes the values of its search parameters from its file and the others from the training configuration.", doc = "At startup, without a line, under SEED ERROR: a CONFIG or WARM starting point of the INIT or RESTART chain fails the condition; {name} names it. Under SEED WARN hpo_run.log has a warning instead, and the run goes on." },
  { msg = "RHOBARGATE: the first {name} shell at a = f_hi a0 = {high} A lies at r = {value} A, beyond the smallest cutoff a candidate can have, RCUTMB = {max} A{note}: rhobar(a) would lose its nearest neighbours; a smaller f_hi or a0, or a larger RCUTMB, keeps the first shell inside the cutoff.", doc = "At startup, at the RHOBARGATE line: the nearest neighbours of the lattice {name} at f_hi a0, {high}, lie at {value}, beyond the smallest RCUTMB a candidate can have, {max}; {note} is \" (the largest CGRIDMB knot over its OPTIM box)\" when that knot sets it." },
]

