[context.main_dm_embed]
doc = """\
A one-species potential with the two-body term of the default \
configuration and one DM_Embed many-body component h: a Blip5 density \
under FORM SIGNED with positive amplitudes, and a Gaussian embedding."""
config = """
ATOM H
WATOM 1
VERBOSE 0
DBFILE dummy.db
INIT2B true
INITMB true
TYPE2B D2_BP 2 2 H H
CGRID2B 1.0 2.0
SGRID2B 0.5 1.0
RCTYPE2B Cut_Cos
RCUT2B 5.0
MODEL M_BLR BF_Linear
LAMBDA 1e-3
OALGO 4
DESCRIPTOR h DM_Embed
PAIRS H H
DENSITY
BASIS Blip5
FORM SIGNED
CENTRES 1 2
ETA 1 1
AMPLITUDES 1 0.5
CUTOFF
TYPE Cut_Poly
RADIUS 3
ENDCUTOFF
ENDDENSITY
EMBEDDING
BASIS Gaussian
CENTRES 0 0.5 1
ETA 2 2 2
REFERENCE ZERO
ENDEMBEDDING
ENDDESCRIPTOR
"""
