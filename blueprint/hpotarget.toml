[[key]]
id = "ROOT.FAILSCORE_GRADING"
name = "FAILSCORE_GRADING"
blocks = ["ROOT"]
synopsis = "FAILSCORE_GRADING ON | OFF"
args = [ { name = "mode", kind = "word", words = ["ON", "OFF"], msg = "FAILSCORE_GRADING must be ON or OFF, got '{tok}'" } ]
repeat = "error"
repeat_msg = "FAILSCORE_GRADING is set twice (first on line {first_line}); each key is given once"
default = { literal = "OFF" }
env = "TADAH_FAILSCORE_GRADING"
doc = """\
ON gives a failed evaluation a loss in [0.999 FAILSCORE, FAILSCORE) that \
grows with the size of the failure, so the optimiser can move towards \
candidates that do not fail; OFF gives it FAILSCORE."""
long_doc = """\
ON takes any FAILSCORE, the default largest double too, except with \
ASA:ASA, which takes a cost of about 1e18 or more for an invalid state: an \
ASA:ASA search under ON needs a FAILSCORE below 1e18 (checked at \
startup). A --failvar value above 0 and a PC_FAILPROBE probe value above --gate fail \
the evaluation under ON and OFF alike: under ON with a graded loss, under \
OFF with FAILSCORE. The settings that only grade a failure, PC_FAILPROBE \
--s0 and a --failvar scale, are refused under OFF. A point outside the \
OPTIM boxes, which a CERES optimiser can propose, is not evaluated. Under \
ON and OFF alike its loss lies in [0.99975 FAILSCORE, FAILSCORE) and grows \
with its distance from the boxes."""
checks = [
  { msg = "{phase}: ASA:ASA: under FAILSCORE_GRADING ON a failed evaluation scores from 0.999 FAILSCORE to below FAILSCORE ({value}), and ASA:ASA takes a cost of about 1e+18 or more for an invalid state and draws another, so it would not see the graded failures at or above that cost; a FAILSCORE of 1e+18 or less keeps every graded failure below it", doc = "At startup, under ON, at the line that closes the block of an ASA:ASA search, in any phase: FAILSCORE is 1e18 or more, as it is without a FAILSCORE line; {value} is FAILSCORE." },
]

[[key.examples]]
wrap = "root"
text = '''
FAILSCORE 1e9
FAILSCORE_GRADING ON'''

[[key.examples]]
wrap = "root"
doc = "The default, written out: a failed evaluation scores FAILSCORE."
text = "FAILSCORE_GRADING OFF"

[[key.examples]]
wrap = "root"
doc = "Without a FAILSCORE line a failed evaluation scores from 0.999 times the largest double."
text = "FAILSCORE_GRADING ON"

[[key.invalid]]
wrap = "none"
check = "startup"
at = "ENDOPTIMIZER"
doc = "ASA:ASA takes a cost of about 1e18 or more for an invalid state."
text = '''
FAILSCORE_GRADING ON
OPTIM CGRID2B (1) 0.5 1.5
PC_ERMSE 0 1
OPTIMIZER
STRATEGY
LIB ASA
ALGO ASA
MAXEVAL 10
ENDSTRATEGY
ENDOPTIMIZER'''
error = "the STRATEGY-level optimiser: ASA:ASA: under FAILSCORE_GRADING ON a failed evaluation scores from 0.999 FAILSCORE to below FAILSCORE (1.7976931348623157e+308, the largest double, as without a FAILSCORE line), and ASA:ASA takes a cost of about 1e+18 or more for an invalid state and draws another, so it would not see the graded failures at or above that cost; a FAILSCORE of 1e+18 or less keeps every graded failure below it"

