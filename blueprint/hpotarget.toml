error = "RHOGATE R_LO 6 A must lie below the smallest cutoff a candidate can have, RCUTMB = 5.5000 A: the window [R_LO, RCUTMB] would be empty; a smaller R_LO gives the window a width."

[[line_option]]
id = "RHOGATE.NPTS"
