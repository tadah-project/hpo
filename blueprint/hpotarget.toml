# file when the run starts; an empty one is ignored. TADAH_OPTIM_SCALE is
# read with the target file.

[[env]]
name = "TADAH_OPTIM_SCALE"
key = "ROOT.OPTIM_SCALE"
values = ["AUTO", "NONE"]
msg = "TADAH_OPTIM_SCALE must be AUTO or NONE (got '{tok}')"
doc = """\
Replaces OPTIM_SCALE of the target file when it is set and not empty; \
the value is AUTO or NONE, read in any case."""

[[env.examples]]
wrap = "root"
env = { TADAH_OPTIM_SCALE = "none" }
doc = "The run uses OPTIM_SCALE NONE: the variable replaces the line of the file."
text = "OPTIM_SCALE AUTO"

[[env.invalid]]
wrap = "root"
env = { TADAH_OPTIM_SCALE = "unit" }
at = "none"
text = "OPTIM_SCALE AUTO"
error = "TADAH_OPTIM_SCALE must be AUTO or NONE (got 'unit')"

[[env.examples]]
wrap = "root"
env = { TADAH_OPTIM_SCALE = "" }
doc = "An empty value is ignored: the run uses the OPTIM_SCALE AUTO of the file."
text = "OPTIM_SCALE AUTO"

