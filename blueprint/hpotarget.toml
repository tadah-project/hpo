# The target-file registry: every line, block and key of the target file
# (`tadah hpo --hpotarget`), with its syntax, values, defaults, ranges and
# refusals, as the parser reads them.
#
# This file holds the frame of the registry: how a file is read ([lexing],
# [reading], [structure]), the optimiser group, the eight blocks, the
# top-level keys that hpotarget_lines.toml does not hold (with the options
# of RHOGATE and RHOBARGATE), the removed keywords, the cross-key rules, the
# environment overrides, the example wrappers and the training
# configurations of the examples. The part files that meta.parts lists hold
# the rest.
# hpotarget_registry.py loads and checks all of them; blueprint/README.md
# ("The target-file registry") describes every table and field, and the
# tests that compare the registry with the parser.
#
# Every message is the parser's own text, copied from the code. A message
# with {name} placeholders is a template: the parser puts the value there.
# The `examples` and `invalid` entries are target-file lines; the
# conformance test puts each into its wrapper and requires the parser to
# accept the example and to refuse the invalid line with exactly its error.

[meta]
version = 1
api = 1
parts = ["hpotarget_optimizer.toml", "hpotarget_lines.toml",
         "hpotarget_params.toml"]
anneal_keys = "anneal_keys.toml"
optimizers = "optimizers_gen.toml"
optimizer_docs = "optimizers_doc.toml"

# What the abbreviations of the registry's text stand for. The reference
# pages spell each out at its first use on a page.
[abbreviations]
ASA = "Adaptive Simulated Annealing"
AUGLAG = "augmented Lagrangian"
BFGS = "Broyden-Fletcher-Goldfarb-Shanno"
BOBYQA = "bound optimisation by quadratic approximation"
CCSAQ = "conservative convex separable approximation with quadratic terms"
COBYLA = "constrained optimisation by linear approximation"
DEO = "deterministic even/odd"
DIRECT = "dividing rectangles"
ISRES = "improved stochastic ranking evolution strategy"
L-BFGS = "low-storage Broyden-Fletcher-Goldfarb-Shanno"
LDS = "low-discrepancy sequence"
LHS = "Latin hypercube sampling"
MAE = "mean absolute error"
MLSL = "multi-level single-linkage"
MMA = "method of moving asymptotes"
MPI = "Message Passing Interface"
NEWUOA = "Powell's new unconstrained optimisation algorithm"
PRAXIS = "principal axis method"
SBPLX = "Subplex"
SLSQP = "sequential least-squares quadratic programming"
StoGO = "stochastic global optimisation"

# ------------------------------------------------------------- lexing ----

[lexing]
doc = """\
A target file is read line by line, and everything from # to the end of a \
line is a comment. The first word of a line is its key, matched as \
written."""
long_doc = """\
Trailing blanks are removed, and a line left empty is skipped. A line that \
ends with \\ continues on the next line, and the two are joined without a \
separator. A file whose last line ends with \\ is refused. Keys are \
written as this reference writes them: in upper case, and PC_ErRMSE with \
its lower-case r. Each error names the line it is about: for a continued \
line, its last line and the joined text."""
comment = "#"
continuation = "\\"
key_case = "exact"
error_frame = "Error on line {line}: {what}\nLine: {text}"
unfinished_msg = "the line ends with \\, which continues it on the next line, and the file has no next line"
missing_file_msg = "the target file {file} (--hpotarget) cannot be opened"
bool_true = ["true", "1", "yes", "on"]
bool_false = ["false", "0", "no", "off"]
timespec_words = ["off", "unlimited"]
untested = [
  { msg = "the target file {file} (--hpotarget) cannot be opened", why = "The file of every case exists; tadah hpo gives the message when --hpotarget names a file that does not exist or cannot be read." },
]

[[lexing.examples]]
wrap = "root"
text = "FAILSCORE 1e6   # the comment ends the line"

[[lexing.examples]]
doc = "A line that ends with a backslash continues on the next one."
wrap = "root"
text = '''
FAILSCORE \
1e6'''

[[lexing.invalid]]
wrap = "strategy"
text = "maxeval 5"
error = "unknown key 'maxeval' inside the STRATEGY block opened on line 4 (ENDSTRATEGY closes it)"

[[lexing.invalid]]
wrap = "none"
at = 8
text = '''
OPTIM CGRID2B (1) 0.5 1.5
PC_ERMSE 0 1
OPTIMIZER
LIB NLOPT
ALGO LN_SBPLX
MAXEVAL 10
ENDOPTIMIZER
FAILSCORE \'''
error = "the line ends with \\, which continues it on the next line, and the file has no next line"

# ------------------------------------------------------------ reading ----
# The value readers every key shares. The `args` of a key name the reader
# (`kind`) and the words of its message (`what`, `min`, `max`, `noun`).

[reading]
doc = """\
A number is one whole token in the decimal syntax, and a finite double. An \
integer is decimal digits only, without a sign."""
long_doc = """\
The decimal syntax is an optional sign, digits with at most one decimal \
point, and an optional exponent (5, -0.5, .5, 5., +1e-3, 2.5E+07). A \
number is 0 or not below the smallest normal double in magnitude; \
hexadecimal, inf and nan are refused. A boolean is one of true, 1, yes, \
on, false, 0, no, off, in any case."""
integer_msg = "{what} must be an integer >= {min}, got '{tok}'"
integer_range_msg = "{what} must be an integer from {min} to {max}, got '{tok}'"
note_msg = " ({note})"
finite_msg = "{what} must be a finite number, got '{tok}'{underflow}"
positive_msg = "{what} must be a positive {noun}, got '{tok}'{underflow}"
underflow_note = " (too small: its magnitude is below the smallest normal double, 2.2250738585072014e-308)"
requires_value_msg = "{key} requires a value"
single_value_msg = "{key} takes one value (unexpected '{tok}')"
bool_msg = "{what}: expected boolean (true/false/1/0/yes/no/on/off), got '{tok}'"
timespec_msg = "{what} must be 'off', 'unlimited' or a time [[HH:]MM:]SS, got '{tok}'{underflow}"
script_timeout_msg = "{what} must be a positive time, 'off' or 'unlimited' (a limit <= 0 stops every script), got '{tok}'"
script_timeout_large_msg = "{what} is too large for the worker deadline, got '{tok}' (the PC_ISOLATION PROCESS deadline max(3t, t + 120 s) is kept in 64-bit milliseconds: t must stay below about 3.07e15 s)"
untested = [
  { msg = " ({note})", why = "A part of other messages, which their cases show." },
]

# ---------------------------------------------------------- structure ----

[structure]
doc = """\
A block is the lines from NAME to ENDNAME, and keys outside every block \
are top-level keys. A line that opens or closes a block holds its key \
alone."""
long_doc = """\
A block opens only where its parents allow, an END line closes the \
innermost open block, and every block is closed before the file ends. An \
END line without an open block, or one that names another block than the \
innermost, is refused. An unknown key is refused, at the top level and in \
every block, and a top-level key inside an open block is refused with \
that block and the line that opened it."""
check_order = ["block_lines", "removed", "inner_refusal", "group_keys",
               "init_restart_keys", "noise_keys", "log_hp", "strategy_keys",
               "block_unknown", "root_keys"]
end_without_open_msg = "{end} without matching {name}"
end_mismatch_msg = "{end} does not close the innermost open block, the {open} block opened on line {open_line} (END{open} closes it)"
end_takes_no_value_msg = "{end} closes the {name} block and takes no value (unexpected '{tok}')"
open_takes_no_value_msg = "{name} opens a block and takes no value (unexpected '{tok}'); each key stands on its own line inside the block"
unclosed_msg = "{name} block not closed with {end}"
unknown_root_msg = "unknown key '{key}'"
root_key_in_block_msg = "{key} is a top-level key, and the {name} block opened on line {open_line} is still open ({end} closes it)"
removed_msg = "'{key}' was removed from the grammar: {hint}"

[[structure.invalid]]
wrap = "root"
text = "FOO 1"
error = "unknown key 'FOO'"

[[structure.invalid]]
wrap = "end"
text = "ENDSTRATEGY"
error = "ENDSTRATEGY without matching STRATEGY"

[[structure.invalid]]
wrap = "end"
text = "ENDOPTIMIZER"
error = "ENDOPTIMIZER without matching OPTIMIZER"

[[structure.invalid]]
wrap = "strategy"
text = "ENDOPTIMIZER"
error = "ENDOPTIMIZER does not close the innermost open block, the STRATEGY block opened on line 4 (ENDSTRATEGY closes it)"

[[structure.invalid]]
wrap = "init"
text = "ENDSTRATEGY"
error = "ENDSTRATEGY does not close the innermost open block, the INIT block opened on line 4 (ENDINIT closes it)"

[[structure.invalid]]
wrap = "optimizer"
text = "NOISE AUTO"
error = "NOISE opens a block and takes no value (unexpected 'AUTO'); each key stands on its own line inside the block"

[[structure.invalid]]
wrap = "noise"
text = "ENDNOISE AUTO"
error = "ENDNOISE closes the NOISE block and takes no value (unexpected 'AUTO')"

[[structure.invalid]]
wrap = "none"
at = 3
text = '''
OPTIM CGRID2B (1) 0.5 1.5
PC_ERMSE 0 1
OPTIMIZER
STRATEGY
LIB NLOPT
ALGO LN_SBPLX
MAXEVAL 10
ENDSTRATEGY'''
error = "OPTIMIZER block not closed with ENDOPTIMIZER"

[[structure.invalid]]
wrap = "none"
at = 4
text = '''
OPTIM CGRID2B (1) 0.5 1.5
PC_ERMSE 0 1
OPTIMIZER
STRATEGY
LIB NLOPT
ALGO LN_SBPLX
MAXEVAL 10'''
error = "STRATEGY block not closed with ENDSTRATEGY"

# -------------------------------------------------------------- groups ----

[group.OPTIMIZER]
doc = """\
The keys of an optimiser: its LIB and ALGO, its stops and its settings. \
They are valid in each block that configures an optimiser."""
long_doc = """\
These refusals name the line of their key. A STEP the optimiser does not \
use, or a STEP value out of range, is refused at its STEP line. Beside a \
PC_LAMMPS or PC_FAILPROBE line, a gradient-based ALGO is refused at its \
ALGO line, and a GRAD_STRATEGY at its own line. Beside a PC_OBSERVABLE \
line, GRAD_STRATEGY NUMERICAL is refused at its line. Every other refusal \
of a key when tadah hpo starts, such as that of a SEED the optimiser does \
not use, names the END line of its optimiser, as does the refusal of a \
combination of keys. That is ENDOPTIMIZER for the STRATEGY-level \
optimiser, whose keys are written in OPTIMIZER, STRATEGY or REFINE, and \
ENDEXPLORE for the optimiser of the EXPLORE block."""
blocks = ["OPTIMIZER", "STRATEGY", "EXPLORE", "REFINE", "INNER"]
leftover_msg = "{key} takes no further value here (unexpected '{tok}')"

[[group.OPTIMIZER.invalid]]
wrap = "strategy"
text = "SEED 1 2"
error = "SEED takes no further value here (unexpected '2')"

# -------------------------------------------------------------- blocks ----

[[block]]
name = "OPTIMIZER"
end = "ENDOPTIMIZER"
parents = ["ROOT"]
repeat = "error"
repeat_msg = "OPTIMIZER block given more than once (the first opens on line {first_line}); one OPTIMIZER block holds every optimiser setting"
misplaced_msg = "OPTIMIZER block must appear at the top level of the file (it is inside the {parent} block opened on line {parent_line})"
unknown_msg = "unknown key '{key}' inside the OPTIMIZER block opened on line {open_line} (ENDOPTIMIZER closes it)"
doc = """\
The search: its optimiser, its starting points, the noise settings and the \
strategy. A target file has one OPTIMIZER block."""
long_doc = """\
The keys of the optimiser are written inside its STRATEGY block or \
directly inside OPTIMIZER; both set the same optimiser, so each key is \
given in one of them."""

[[block.close_checks]]
msg = "the OPTIMIZER block names no optimiser: {missing}; LIB and ALGO in its STRATEGY block (or directly inside OPTIMIZER) name it"
doc = """\
At ENDOPTIMIZER, and at the end of a file without an OPTIMIZER block (that \
refusal names no line), under STRATEGY TYPE PLAIN. {missing} is "LIB and \
ALGO are not set", "LIB is not set" or "ALGO is not set"."""

[[block.close_checks]]
msg = "STRATEGY TYPE MULTISTART names no optimiser to run from each start: {missing}; LIB and ALGO in the STRATEGY block name it"
doc = "At ENDOPTIMIZER, under STRATEGY TYPE MULTISTART."

[[block.close_checks]]
msg = "STRATEGY TYPE PRESTAGE names no refinement optimiser: {missing}; LIB and ALGO in the STRATEGY block or in a REFINE block name it"
doc = "At ENDOPTIMIZER, under STRATEGY TYPE PRESTAGE."

[[block.close_checks]]
msg = "{phase}: unknown optimiser {lib}:{algo}: {why}; `tadah explain ALGO` lists the optimisers"
doc = """\
At ENDOPTIMIZER: LIB and ALGO name an optimiser of the optimiser list. \
{phase} is "the STRATEGY-level optimiser", or "the PRESTAGE refinement" \
under STRATEGY TYPE PRESTAGE."""

[[block.close_checks]]
msg = "{phase}: {lib}:{algo} is refused: {why}"
doc = "At ENDOPTIMIZER: an optimiser the optimiser list refuses, with its reason."

[[block.examples]]
wrap = "none"
text = '''
OPTIM CGRID2B (1) 0.5 1.5
PC_ERMSE 0 1
OPTIMIZER
LIB NLOPT
ALGO LN_SBPLX
MAXEVAL 10
ENDOPTIMIZER'''

[[block.invalid]]
wrap = "end"
text = "OPTIMIZER"
error = "OPTIMIZER block given more than once (the first opens on line 3); one OPTIMIZER block holds every optimiser setting"

[[block.invalid]]
wrap = "strategy"
text = "OPTIMIZER"
error = "OPTIMIZER block must appear at the top level of the file (it is inside the STRATEGY block opened on line 4)"

[[block.invalid]]
wrap = "optimizer"
text = "TYPE PLAIN"
error = "unknown key 'TYPE' inside the OPTIMIZER block opened on line 3 (ENDOPTIMIZER closes it)"

[[block.invalid]]
wrap = "none"
at = 3
text = '''
OPTIM CGRID2B (1) 0.5 1.5
PC_ERMSE 0 1
OPTIMIZER LIB NLOPT
ALGO LN_SBPLX
ENDOPTIMIZER'''
error = "OPTIMIZER opens a block and takes no value (unexpected 'LIB'); each key stands on its own line inside the block"

[[block.invalid]]
wrap = "none"
at = 5
text = '''
OPTIM CGRID2B (1) 0.5 1.5
PC_ERMSE 0 1
OPTIMIZER
MAXEVAL 10
ENDOPTIMIZER'''
error = "the OPTIMIZER block names no optimiser: LIB and ALGO are not set; LIB and ALGO in its STRATEGY block (or directly inside OPTIMIZER) name it"

[[block.invalid]]
wrap = "none"
at = 9
text = '''
OPTIM CGRID2B (1) 0.5 1.5
PC_ERMSE 0 1
OPTIMIZER
STRATEGY
TYPE MULTISTART
N_STARTS 2
LIB NLOPT
ENDSTRATEGY
ENDOPTIMIZER'''
error = "STRATEGY TYPE MULTISTART names no optimiser to run from each start: ALGO is not set; LIB and ALGO in the STRATEGY block name it"

[[block.invalid]]
wrap = "none"
at = 12
text = '''
OPTIM CGRID2B (1) 0.5 1.5
PC_ERMSE 0 1
OPTIMIZER
STRATEGY
TYPE PRESTAGE
EXPLORE
LIB TADAH
ALGO RANDOM
MAXEVAL 5
ENDEXPLORE
ENDSTRATEGY
ENDOPTIMIZER'''
error = "STRATEGY TYPE PRESTAGE names no refinement optimiser: LIB and ALGO are not set; LIB and ALGO in the STRATEGY block or in a REFINE block name it"

[[block.invalid]]
wrap = "none"
at = "ENDOPTIMIZER"
text = '''
OPTIM CGRID2B (1) 0.5 1.5
PC_ERMSE 0 1
OPTIMIZER
LIB NLOPT
ALGO LN_NOPE
MAXEVAL 10
ENDOPTIMIZER'''
error = "the STRATEGY-level optimiser: unknown optimiser NLOPT:LN_NOPE: LIB NLOPT has no ALGO LN_NOPE; `tadah explain ALGO` lists the optimisers"

[[block.invalid]]
wrap = "none"
at = "ENDOPTIMIZER"
text = '''
OPTIM CGRID2B (1) 0.5 1.5
PC_ERMSE 0 1
OPTIMIZER
LIB CERES
ALGO DOGLEG
MAXEVAL 10
ENDOPTIMIZER'''
error = "the STRATEGY-level optimiser: CERES:DOGLEG is refused: tadah hpo does not run Ceres' least-squares solver (LEVENBERG_MARQUARDT, DOGLEG, SUBSPACE_DOGLEG): it minimises a sum of squared residuals with their derivatives, and tadah hpo gives an optimiser one scalar loss, over which these methods degenerate. The recommended replacements are CERES:STEEPEST_DESCENT, Ceres' line-search solver of a scalar loss that tadah hpo runs, and the bound-constrained gradient searches NLOPT:LD_LBFGS and DLIB:BFGS"

[[block]]
name = "STRATEGY"
end = "ENDSTRATEGY"
parents = ["OPTIMIZER"]
repeat = "error"
repeat_msg = "STRATEGY block given more than once (the first opens on line {first_line}); one STRATEGY block holds every STRATEGY key"
misplaced_msg = "STRATEGY block must appear directly inside OPTIMIZER"
unknown_msg = "unknown key '{key}' inside the STRATEGY block opened on line {open_line} (ENDSTRATEGY closes it)"
doc = """\
How the search runs its optimiser: once (TYPE PLAIN), from several \
starting points (MULTISTART), or as an exploration followed by a \
refinement (PRESTAGE). Without a STRATEGY block the search is PLAIN."""
long_doc = """\
Its optimiser keys set the STRATEGY-level optimiser."""

[[block.close_checks]]
msg = "{key} is not accepted with STRATEGY TYPE {type}{note}: {effect}, so it would have no effect; {key} takes effect under STRATEGY TYPE {home}"
doc = """\
At ENDSTRATEGY, reported at the line of the key: a key of one TYPE (the \
STRATEGY types) is checked against the TYPE the block ends with, so TYPE \
may follow it. {note} is " (the default when the block has no TYPE line)" \
when the block has no TYPE line, and empty otherwise."""

[[block.examples]]
wrap = "optimizer"
text = '''
STRATEGY
TYPE PLAIN
ENDSTRATEGY'''

[[block.invalid]]
wrap = "root"
text = "STRATEGY"
error = "STRATEGY block must appear directly inside OPTIMIZER"

[[block.invalid]]
wrap = "explore"
text = "STRATEGY"
error = "STRATEGY block must appear directly inside OPTIMIZER"

[[block.invalid]]
wrap = "none"
at = 9
text = '''
OPTIM CGRID2B (1) 0.5 1.5
PC_ERMSE 0 1
OPTIMIZER
STRATEGY
LIB NLOPT
ALGO LN_SBPLX
MAXEVAL 10
ENDSTRATEGY
STRATEGY
ENDSTRATEGY
ENDOPTIMIZER'''
error = "STRATEGY block given more than once (the first opens on line 4); one STRATEGY block holds every STRATEGY key"

[[block.invalid]]
wrap = "strategy"
text = "AFTER_STAGNATION 3"
error = "unknown key 'AFTER_STAGNATION' inside the STRATEGY block opened on line 4 (ENDSTRATEGY closes it)"

[[block.invalid]]
wrap = "strategy"
text = "N_STARTS 4"
error = "N_STARTS is not accepted with STRATEGY TYPE PLAIN (the default when the block has no TYPE line): only TYPE MULTISTART runs N_STARTS starts, so it would have no effect; N_STARTS takes effect under STRATEGY TYPE MULTISTART"

[[block]]
name = "INIT"
end = "ENDINIT"
parents = ["OPTIMIZER", "STRATEGY", "EXPLORE", "REFINE"]
repeat = "merge"
misplaced_msg = "INIT block must appear inside OPTIMIZER, STRATEGY, EXPLORE, or REFINE"
unknown_msg = "unknown key '{key}' inside the INIT block opened on line {open_line} (ENDINIT closes it)"
unknown_first = true
aliases = { STRATEGY = "INIT.METHOD" }
unreachable_msgs = ["INIT block requires an active OptimizerSpec"]
quirk = """\
An INIT block inside OPTIMIZER, STRATEGY or REFINE sets the starting \
points of the one STRATEGY-level optimiser. The METHOD lines of these \
blocks make one chain, in the order of the file, and each other key is \
given in one of them."""
doc = """\
The starting points of the optimiser of the block around it: a chain of \
METHOD lines, each adding points. Inside an INIT block a STRATEGY line is \
read as a METHOD line."""
long_doc = """\
A second INIT block in the same block continues the first, and a key other \
than METHOD set in both is refused."""

[[block.examples]]
wrap = "strategy"
text = '''
INIT
METHOD LHS 4
ENDINIT'''

[[block.examples]]
wrap = "none"
doc = "Two INIT blocks of one block make one chain: the values of the training configuration, then 3 Latin hypercube points."
text = '''
OPTIM CGRID2B (1) 0.5 1.5
PC_ERMSE 0 1
OPTIMIZER
INIT
METHOD CONFIG
ENDINIT
INIT
METHOD LHS 3
ENDINIT
LIB NLOPT
ALGO LN_SBPLX
MAXEVAL 10
ENDOPTIMIZER'''

[[block.invalid]]
wrap = "root"
text = "INIT"
error = "INIT block must appear inside OPTIMIZER, STRATEGY, EXPLORE, or REFINE"

[[block.invalid]]
wrap = "inner"
text = "INIT"
error = "INIT block must appear inside OPTIMIZER, STRATEGY, EXPLORE, or REFINE"

[[block.invalid]]
wrap = "init"
text = "LIB NLOPT"
error = "unknown key 'LIB' inside the INIT block opened on line 4 (ENDINIT closes it)"

[[block.invalid]]
wrap = "init"
text = "LOG_HP 10"
error = "unknown key 'LOG_HP' inside the INIT block opened on line 4 (ENDINIT closes it)"

[[block]]
name = "NOISE"
end = "ENDNOISE"
parents = ["OPTIMIZER"]
repeat = "merge"
misplaced_msg = "NOISE block must appear directly inside OPTIMIZER"
unknown_msg = "unknown key '{key}' inside the NOISE block opened on line {open_line} (only AUTO and CALIBRATION are valid; ENDNOISE closes it)"
unknown_first = true
doc = """\
The noise settings of the STRATEGY-level optimiser: AUTO derives the \
finite-difference step from the OPTIM boxes, and CALIBRATION measures the \
noise of the loss at the first starting point before the search. No \
optimiser receives its lines."""
long_doc = """\
A second NOISE block continues the first, and a key set in both is \
refused."""

[[block.examples]]
wrap = "optimizer"
text = '''
NOISE
CALIBRATION 5
ENDNOISE'''

[[block.invalid]]
wrap = "strategy"
text = "NOISE"
error = "NOISE block must appear directly inside OPTIMIZER"

[[block.invalid]]
wrap = "noise"
text = "MAXEVAL 5"
error = "unknown key 'MAXEVAL' inside the NOISE block opened on line 4 (only AUTO and CALIBRATION are valid; ENDNOISE closes it)"

[[block]]
name = "EXPLORE"
end = "ENDEXPLORE"
parents = ["STRATEGY"]
repeat = "merge"
misplaced_msg = "EXPLORE block must appear inside STRATEGY"
unknown_msg = "unknown key '{key}' inside the EXPLORE block opened on line {open_line} (ENDEXPLORE closes it)"
doc = """\
The exploration of STRATEGY TYPE PRESTAGE: an optimiser of its own, whose \
best candidates (TOPK) the refinement starts from. A second EXPLORE block \
continues the first, and a key set in both is refused."""

[[block.requires]]
msg = "EXPLORE block is only valid with TYPE PRESTAGE (declare TYPE before EXPLORE)"
doc = "At the EXPLORE line: the STRATEGY block has TYPE PRESTAGE before it."

[[block.close_checks]]
msg = "the EXPLORE block names no optimiser: {missing}; LIB and ALGO inside the EXPLORE block name the optimiser of the exploration of STRATEGY TYPE PRESTAGE"
doc = "At ENDEXPLORE: the exploration has LIB and ALGO."

[[block.close_checks]]
msg = "the EXPLORE block: unknown optimiser {lib}:{algo}: {why}; `tadah explain ALGO` lists the optimisers"
doc = "At ENDEXPLORE: LIB and ALGO name an optimiser of the optimiser list."

[[block.close_checks]]
msg = "the EXPLORE block: {lib}:{algo} is refused: {why}"
doc = "At ENDEXPLORE: an optimiser the optimiser list refuses, with its reason."

[[block.examples]]
wrap = "strategy"
text = '''
TYPE PRESTAGE
EXPLORE
LIB TADAH
ALGO RANDOM
MAXEVAL 5
ENDEXPLORE'''

[[block.invalid]]
wrap = "strategy"
text = "EXPLORE"
error = "EXPLORE block is only valid with TYPE PRESTAGE (declare TYPE before EXPLORE)"

[[block.invalid]]
wrap = "optimizer"
text = "EXPLORE"
error = "EXPLORE block must appear inside STRATEGY"

[[block.invalid]]
wrap = "explore"
text = "TOPK 2"
error = "unknown key 'TOPK' inside the EXPLORE block opened on line 9 (ENDEXPLORE closes it)"

[[block.invalid]]
wrap = "strategy"
at = 7
doc = "A TYPE line after the EXPLORE block is a second TYPE line."
text = '''
TYPE PRESTAGE
EXPLORE
LIB TADAH
ALGO RANDOM
MAXEVAL 5
ENDEXPLORE
TYPE PLAIN'''
error = "TYPE is set twice in the STRATEGY block (first on line 8); each key is given once"
msg_of = "STRATEGY.TYPE"

[[block.invalid]]
wrap = "strategy"
at = 4
text = '''
TYPE PRESTAGE
EXPLORE
MAXEVAL 5
ENDEXPLORE'''
error = "the EXPLORE block names no optimiser: LIB and ALGO are not set; LIB and ALGO inside the EXPLORE block name the optimiser of the exploration of STRATEGY TYPE PRESTAGE"

[[block.invalid]]
wrap = "none"
at = "ENDEXPLORE"
text = '''
OPTIM CGRID2B (1) 0.5 1.5
PC_ERMSE 0 1
OPTIMIZER
STRATEGY
TYPE PRESTAGE
LIB NLOPT
ALGO LN_SBPLX
MAXEVAL 10
EXPLORE
LIB TADAH
ALGO NOPE
MAXEVAL 5
ENDEXPLORE
ENDSTRATEGY
ENDOPTIMIZER'''
error = "the EXPLORE block: unknown optimiser TADAH:NOPE: LIB TADAH has no ALGO NOPE; `tadah explain ALGO` lists the optimisers"

[[block.invalid]]
wrap = "none"
at = "ENDEXPLORE"
doc = "An optimiser of the exploration that the optimiser list refuses."
text = '''
OPTIM CGRID2B (1) 0.5 1.5
PC_ERMSE 0 1
OPTIMIZER
STRATEGY
TYPE PRESTAGE
LIB NLOPT
ALGO LN_SBPLX
MAXEVAL 10
EXPLORE
LIB CERES
ALGO DOGLEG
MAXEVAL 5
ENDEXPLORE
ENDSTRATEGY
ENDOPTIMIZER'''
error = "the EXPLORE block: CERES:DOGLEG is refused: tadah hpo does not run Ceres' least-squares solver (LEVENBERG_MARQUARDT, DOGLEG, SUBSPACE_DOGLEG): it minimises a sum of squared residuals with their derivatives, and tadah hpo gives an optimiser one scalar loss, over which these methods degenerate. The recommended replacements are CERES:STEEPEST_DESCENT, Ceres' line-search solver of a scalar loss that tadah hpo runs, and the bound-constrained gradient searches NLOPT:LD_LBFGS and DLIB:BFGS"

[[block]]
name = "REFINE"
end = "ENDREFINE"
parents = ["STRATEGY"]
repeat = "merge"
misplaced_msg = "REFINE block must appear inside STRATEGY"
unknown_msg = "unknown key '{key}' inside the REFINE block opened on line {open_line} (ENDREFINE closes it)"
quirk = """\
The REFINE block sets the STRATEGY-level optimiser, as the STRATEGY block \
does. A key given in both is refused, an INIT block in either adds to the \
same chain, and an INNER block in each is refused as given twice."""
doc = """\
The refinement of STRATEGY TYPE PRESTAGE, started from the best candidates \
of the exploration. Without a REFINE block the STRATEGY-level optimiser \
refines."""
long_doc = """\
A second REFINE block continues the first, and a key set in both is \
refused."""

[[block.requires]]
msg = "REFINE block is only valid with TYPE PRESTAGE (declare TYPE before REFINE)"
doc = "At the REFINE line: the STRATEGY block has TYPE PRESTAGE before it."

[[block.examples]]
wrap = "none"
text = '''
OPTIM CGRID2B (1) 0.5 1.5
PC_ERMSE 0 1
OPTIMIZER
STRATEGY
TYPE PRESTAGE
EXPLORE
LIB TADAH
ALGO RANDOM
MAXEVAL 5
ENDEXPLORE
REFINE
LIB NLOPT
ALGO LN_BOBYQA
MAXEVAL 8
ENDREFINE
ENDSTRATEGY
ENDOPTIMIZER'''

