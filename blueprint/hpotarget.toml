# ----------------------------------------------------- top-level keys ----
# The top-level keys of this file: the failure loss, the PC_LAMMPS script
# limits, the output files, the density conditions of a DM_REAM potential
# and the coordinates of the search. Inside a block each of them is an
# unknown key of that block.

[[key]]
id = "ROOT.FAILSCORE"
name = "FAILSCORE"
blocks = ["ROOT"]
synopsis = "FAILSCORE <loss>"
args = [ { name = "loss", kind = "positive", what = "{key}", noun = "finite number" } ]
repeat = "error"
repeat_msg = "FAILSCORE is set twice (first on line {first_line}) and no line between reads the first (a PC_LAMMPS or PC_FAILPROBE line without --failscore); each key is given once"
repeat_doc = "Again only after a line that reads the value given above it, a PC_LAMMPS or PC_FAILPROBE line without --failscore; a second line with no such line between is refused."
default = { text = "the largest finite double, 1.7976931348623157e308" }
doc = """\
The loss of a failed evaluation under FAILSCORE_GRADING OFF, and the \
largest loss an evaluation can have: a larger loss is lowered to it. A \
loss at or above 0.999 FAILSCORE counts as a failure."""
long_doc = """\
A PC_LAMMPS line without --failscore gives its variables this value when \
its simulation fails, and a PC_FAILPROBE line without --failscore takes \
it as its --failscore. DLIB:GFS, DLIB:BFGS and NLopt are given a finite \
stand-in for a \
failed evaluation: the worst usable loss of the search so far plus a \
margin, or, before any, FAILSCORE capped at 1e100. A loss NLopt asks for \
together with its gradient is given the stand-in only for a graded \
failure with a usable gradient; a failed point whose gradient fails is \
rejected. The result files and the journal record the loss the \
evaluation reported."""
quirk = """\
A PC_LAMMPS or PC_FAILPROBE line without --failscore takes the FAILSCORE \
of the lines above it: a FAILSCORE line below it leaves that line's \
failure value as it was. The loss of a failed evaluation is the value of \
the last FAILSCORE line."""

[[key.examples]]
wrap = "root"
text = "FAILSCORE 1e9"

[[key.invalid]]
wrap = "root"
text = "FAILSCORE 0"
error = "FAILSCORE must be a positive finite number, got '0'"

[[key.invalid]]
wrap = "root"
text = "FAILSCORE inf"
error = "FAILSCORE must be a positive finite number, got 'inf'"

[[key.invalid]]
wrap = "root"
text = "FAILSCORE 1e-320"
error = "FAILSCORE must be a positive finite number, got '1e-320' (too small: its magnitude is below the smallest normal double, 2.2250738585072014e-308)"

[[key.invalid]]
wrap = "root"
text = "FAILSCORE"
error = "FAILSCORE requires a value"

[[key.invalid]]
wrap = "root"
text = "FAILSCORE 1e9 1e10"
error = "FAILSCORE takes one value (unexpected '1e10')"

[[key.invalid]]
wrap = "optimizer"
text = "FAILSCORE 1e9"
error = "FAILSCORE is a top-level key, and the OPTIMIZER block opened on line 3 is still open (ENDOPTIMIZER closes it)"

[[key.invalid]]
wrap = "strategy"
text = "FAILSCORE 1e9"
error = "FAILSCORE is a top-level key, and the STRATEGY block opened on line 4 is still open (ENDSTRATEGY closes it)"

[[key.invalid]]
wrap = "root"
at = 2
text = '''
FAILSCORE 1e9
FAILSCORE 1e10'''
error = "FAILSCORE is set twice (first on line 1) and no line between reads the first (a PC_LAMMPS or PC_FAILPROBE line without --failscore); each key is given once"

[[key.invalid]]
wrap = "root"
at = 3
doc = "The PC_LAMMPS line between has a failure value of its own."
text = '''
FAILSCORE 1e9
PC_LAMMPS --script main_pc.in --varloss E -5.0 1.0 --failscore 5
FAILSCORE 1e10
PC_LAMMPS --script main_pc.in --varloss E -5.0 1.0'''
error = "FAILSCORE is set twice (first on line 1) and no line between reads the first (a PC_LAMMPS or PC_FAILPROBE line without --failscore); each key is given once"

[[key]]
id = "ROOT.PC_SCRIPT_TIMEOUT"
name = "PC_SCRIPT_TIMEOUT"
blocks = ["ROOT"]
synopsis = "PC_SCRIPT_TIMEOUT <time>"
args = [ { name = "time", kind = "timespec", what = "{key}", doc = "off, unlimited, or a positive time [[HH:]MM:]SS." } ]
repeat = "error"
repeat_msg = "PC_SCRIPT_TIMEOUT is set twice (first on line {first_line}) and no line between reads the first (a PC_LAMMPS or PC_FAILPROBE line without --maxtime); each key is given once"
repeat_doc = "Again only after a line that reads the value given above it, a PC_LAMMPS or PC_FAILPROBE line without --maxtime; a second line with no such line between is refused. PC_SCRIPT_TIMEOUT and MAXTIME are one key."
default = { literal = "off" }
doc = """\
The wall-clock limit of each section of a PC_LAMMPS and PC_FAILPROBE \
script: the lines up to the first clear, and those after each clear. A \
section that reaches it stops the script, and its simulation counts as \
failed."""
long_doc = """\
The limit is set in each script as LAMMPS `timer timeout` at its start and \
after every clear, so each section has the whole limit; the --maxtime \
option of a line sets that line's own. A script with a timer command of \
its own gets no limit. Under PC_ISOLATION PROCESS a script limit t also \
sets the deadline of a worker task, max(3t, t + 120 s), unless \
PC_WORKER_TIMEOUT sets one: each line's own limit sizes the deadline of \
its tasks. MAXTIME is another name for this key. A PC_LAMMPS or \
PC_FAILPROBE line without --maxtime takes the limit of the lines above it, \
and a line of the key that no such line follows is refused. hpo_run.log \
gives the limit of each PC_LAMMPS and PC_FAILPROBE line, where it comes \
from and the deadline of its worker tasks."""

[[key.checks]]
msg = "{key} sets the script timeout of the PC_LAMMPS and PC_FAILPROBE lines after it that give no --maxtime, and no such line follows it; it would have no effect"
doc = "At the end of the file: no PC_LAMMPS or PC_FAILPROBE line without --maxtime follows the line; {key} is the name the line writes."

[[key.examples]]
wrap = "root"
text = '''
PC_SCRIPT_TIMEOUT 1:30:00
PC_LAMMPS --script main_pc.in --varloss E -5.0 1.0'''

[[key.examples]]
doc = "A time in seconds."
wrap = "root"
text = '''
PC_SCRIPT_TIMEOUT 600
PC_LAMMPS --script main_pc.in --varloss E -5.0 1.0'''

[[key.examples]]
doc = "No limit."
wrap = "root"
text = '''
PC_SCRIPT_TIMEOUT unlimited
PC_LAMMPS --script main_pc.in --varloss E -5.0 1.0'''

[[key.invalid]]
wrap = "root"
doc = "No PC_LAMMPS or PC_FAILPROBE line follows the line."
text = "PC_SCRIPT_TIMEOUT 600"
error = "PC_SCRIPT_TIMEOUT sets the script timeout of the PC_LAMMPS and PC_FAILPROBE lines after it that give no --maxtime, and no such line follows it; it would have no effect"

[[key.invalid]]
wrap = "root"
doc = "The PC_LAMMPS line is above the line."
at = 2
text = '''
PC_LAMMPS --script main_pc.in --varloss E -5.0 1.0
PC_SCRIPT_TIMEOUT 600'''
error = "PC_SCRIPT_TIMEOUT sets the script timeout of the PC_LAMMPS and PC_FAILPROBE lines after it that give no --maxtime, and no such line follows it; it would have no effect"

[[key.invalid]]
wrap = "root"
doc = "The only PC_LAMMPS line after the line has a limit of its own."
text = '''
PC_SCRIPT_TIMEOUT 600
PC_LAMMPS --script main_pc.in --varloss E -5.0 1.0 --maxtime 60'''
error = "PC_SCRIPT_TIMEOUT sets the script timeout of the PC_LAMMPS and PC_FAILPROBE lines after it that give no --maxtime, and no such line follows it; it would have no effect"

[[key.invalid]]
wrap = "root"
text = "PC_SCRIPT_TIMEOUT 0"
error = "PC_SCRIPT_TIMEOUT must be a positive time, 'off' or 'unlimited' (a limit <= 0 stops every script), got '0'"

[[key.invalid]]
wrap = "root"
text = "PC_SCRIPT_TIMEOUT OFF"
error = "PC_SCRIPT_TIMEOUT must be 'off', 'unlimited' or a time [[HH:]MM:]SS, got 'OFF'"

[[key.invalid]]
wrap = "root"
text = "PC_SCRIPT_TIMEOUT 1:2:3:4"
error = "PC_SCRIPT_TIMEOUT must be 'off', 'unlimited' or a time [[HH:]MM:]SS, got '1:2:3:4'"

[[key.invalid]]
wrap = "root"
text = "PC_SCRIPT_TIMEOUT 1e-320"
error = "PC_SCRIPT_TIMEOUT must be 'off', 'unlimited' or a time [[HH:]MM:]SS, got '1e-320' (too small: its magnitude is below the smallest normal double, 2.2250738585072014e-308)"

[[key.invalid]]
wrap = "root"
text = "PC_SCRIPT_TIMEOUT 1e16"
error = "PC_SCRIPT_TIMEOUT is too large for the worker deadline, got '1e16' (the PC_ISOLATION PROCESS deadline max(3t, t + 120 s) is kept in 64-bit milliseconds: t must stay below about 3.07e15 s)"

[[key.invalid]]
wrap = "root"
text = "PC_SCRIPT_TIMEOUT 10 20"
error = "PC_SCRIPT_TIMEOUT takes one value (unexpected '20')"

[[key.invalid]]
wrap = "root"
at = 2
text = '''
PC_SCRIPT_TIMEOUT 600
PC_SCRIPT_TIMEOUT 300'''
error = "PC_SCRIPT_TIMEOUT is set twice (first on line 1) and no line between reads the first (a PC_LAMMPS or PC_FAILPROBE line without --maxtime); each key is given once"

[[key]]
id = "ROOT.MAXTIME"
name = "MAXTIME"
blocks = ["ROOT"]
synopsis = "MAXTIME <time>"
args = [ { name = "time", kind = "timespec", what = "{key}", doc = "off, unlimited, or a positive time [[HH:]MM:]SS." } ]
repeat = "error"
repeat_msg = "MAXTIME is set twice (first on line {first_line}) and no line between reads the first (a PC_LAMMPS or PC_FAILPROBE line without --maxtime); each key is given once"
repeat_doc = "Again only after a line that reads the value given above it, a PC_LAMMPS or PC_FAILPROBE line without --maxtime; a second line with no such line between is refused. MAXTIME and PC_SCRIPT_TIMEOUT are one key."
alias_of = "ROOT.PC_SCRIPT_TIMEOUT"
default = { literal = "off" }
doc = """\
Another name for PC_SCRIPT_TIMEOUT, the wall-clock limit of each section \
of a PC_LAMMPS and PC_FAILPROBE script."""
long_doc = """\
The two names are one key: a second line, of either name, comes only \
after a PC_LAMMPS or PC_FAILPROBE line without --maxtime, which reads the \
first. hpo_run.log notes that a top-level MAXTIME line is \
PC_SCRIPT_TIMEOUT under another name."""
quirk = """\
MAXTIME at the top level is the script limit PC_SCRIPT_TIMEOUT, while \
MAXTIME inside OPTIMIZER, STRATEGY, EXPLORE, REFINE or INNER is a time \
limit of the search: the same word names two settings."""

[[key.checks]]
msg = "{key} sets the script timeout of the PC_LAMMPS and PC_FAILPROBE lines after it that give no --maxtime, and no such line follows it; it would have no effect"
doc = "At the end of the file: no PC_LAMMPS or PC_FAILPROBE line without --maxtime follows the line; {key} is the name the line writes."

[[key.examples]]
wrap = "root"
text = '''
MAXTIME 10:00
PC_LAMMPS --script main_pc.in --varloss E -5.0 1.0'''

[[key.invalid]]
wrap = "root"
doc = "No PC_LAMMPS or PC_FAILPROBE line follows the line."
text = "MAXTIME 10:00"
error = "MAXTIME sets the script timeout of the PC_LAMMPS and PC_FAILPROBE lines after it that give no --maxtime, and no such line follows it; it would have no effect"

[[key.invalid]]
wrap = "root"
text = "MAXTIME 0"
error = "MAXTIME must be a positive time, 'off' or 'unlimited' (a limit <= 0 stops every script), got '0'"

[[key.invalid]]
wrap = "root"
text = "MAXTIME 1h"
error = "MAXTIME must be 'off', 'unlimited' or a time [[HH:]MM:]SS, got '1h'"

[[key.invalid]]
wrap = "root"
at = 2
text = '''
MAXTIME 10:00
MAXTIME 5:00'''
error = "MAXTIME is set twice (first on line 1) and no line between reads the first (a PC_LAMMPS or PC_FAILPROBE line without --maxtime); each key is given once"

[[key.invalid]]
wrap = "root"
at = 2
doc = "Both names, with no PC_LAMMPS line between."
text = '''
MAXTIME 10:00
PC_SCRIPT_TIMEOUT 5:00'''
error = "PC_SCRIPT_TIMEOUT is set twice (first on line 1, as MAXTIME) and no line between reads the first (a PC_LAMMPS or PC_FAILPROBE line without --maxtime); each key is given once"
msg_of = "RULE.settings_taken_by_lines"

[[key]]
id = "ROOT.PC_ISOLATION"
name = "PC_ISOLATION"
blocks = ["ROOT"]
synopsis = "PC_ISOLATION THREAD | PROCESS"
args = [ { name = "mode", kind = "word", words = ["THREAD", "PROCESS"], msg = "PC_ISOLATION must be THREAD or PROCESS, got '{tok}'" } ]
repeat = "error"
repeat_msg = "PC_ISOLATION is set twice (first on line {first_line}); each key is given once"
default = { text = "PROCESS; THREAD in the MPI build of tadah" }
env = "TADAH_PC_ISOLATION"
doc = """\
Where the PC_LAMMPS and PC_FAILPROBE scripts run: PROCESS runs them in \
worker processes, one per worker of the pool, and THREAD runs them inside \
the tadah process."""
long_doc = """\
Under PROCESS each worker process has its own LAMMPS library state, and a \
task that passes its deadline (PC_WORKER_TIMEOUT) is stopped. PROCESS is \
the supported mode of the serial build: there THREAD is deprecated, and \
hpo_run.log has a warning when the run uses it. The MPI build refuses \
PROCESS when the file or TADAH_PC_ISOLATION sets it."""
checks = [
  { msg = "PC_ISOLATION PROCESS is not supported in the MPI build (TADAH_HPO_MPI): the worker processes cannot initialize MPI. Use the serial build, or PC_ISOLATION THREAD.", doc = "When the run starts, in the MPI build of tadah: the file or TADAH_PC_ISOLATION sets PROCESS. The message names no line." },
]
untested = [
  { msg = "PC_ISOLATION PROCESS is not supported in the MPI build (TADAH_HPO_MPI): the worker processes cannot initialize MPI. Use the serial build, or PC_ISOLATION THREAD.", why = "The MPI build only; the cases run in the serial build." },
]

