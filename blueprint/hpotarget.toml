env = { TADAH_PC_WORKER_TIMEOUT = "600" }
at = "none"
text = "PC_ISOLATION THREAD"
error = "TADAH_PC_WORKER_TIMEOUT (got '600') sets the deadline of a script task in a worker process (PC_ISOLATION PROCESS); under PC_ISOLATION THREAD, set on line 1, the scripts run inside the tadah process without a worker deadline, so it would have no effect"

# ------------------------------------------------------------ wrappers ----
# A wrapper is a complete target file with one slot line, {line}. The
# conformance test puts the text of an example in the slot; with the slot
# left empty the file is accepted by the parser and the startup checks.
# wrap = "none" takes the text of an example as the whole file.

[wrapper.root]
block = "ROOT"
doc = "The slot is the first line, at the top level."
text = """
{line}
OPTIM CGRID2B (1) 0.5 1.5
PC_ERMSE 0 1
OPTIMIZER
STRATEGY
LIB NLOPT
ALGO LN_SBPLX
MAXEVAL 10
ENDSTRATEGY
ENDOPTIMIZER
"""

[wrapper.end]
block = "ROOT"
doc = "The slot is the last line, at the top level after the OPTIMIZER block."
text = """
OPTIM CGRID2B (1) 0.5 1.5
PC_ERMSE 0 1
OPTIMIZER
STRATEGY
LIB NLOPT
ALGO LN_SBPLX
MAXEVAL 10
ENDSTRATEGY
ENDOPTIMIZER
{line}
"""

[wrapper.optimizer]
block = "OPTIMIZER"
doc = "The slot is inside the OPTIMIZER block, after its optimiser keys; the file has no STRATEGY block."
text = """
OPTIM CGRID2B (1) 0.5 1.5
PC_ERMSE 0 1
OPTIMIZER
LIB NLOPT
ALGO LN_SBPLX
MAXEVAL 10
{line}
ENDOPTIMIZER
"""

[wrapper.strategy]
block = "STRATEGY"
optimizer = "NLOPT:LN_SBPLX"
doc = "The slot is inside the STRATEGY block, after its optimiser keys."
text = """
OPTIM CGRID2B (1) 0.5 1.5
PC_ERMSE 0 1
OPTIMIZER
STRATEGY
LIB NLOPT
ALGO LN_SBPLX
MAXEVAL 10
{line}
ENDSTRATEGY
ENDOPTIMIZER
"""

[wrapper.init]
block = "INIT"
doc = "The slot is inside an INIT block of the OPTIMIZER block."
text = """
OPTIM CGRID2B (1) 0.5 1.5
PC_ERMSE 0 1
OPTIMIZER
INIT
{line}
ENDINIT
STRATEGY
LIB NLOPT
ALGO LN_SBPLX
MAXEVAL 10
ENDSTRATEGY
ENDOPTIMIZER
"""

[wrapper.noise]
block = "NOISE"
doc = "The slot is inside a NOISE block; the optimiser takes finite-difference gradients (NLOPT:LD_LBFGS)."
text = """
OPTIM CGRID2B (1) 0.5 1.5
PC_ERMSE 0 1
OPTIMIZER
NOISE
{line}
ENDNOISE
STRATEGY
LIB NLOPT
ALGO LD_LBFGS
MAXEVAL 10
ENDSTRATEGY
ENDOPTIMIZER
"""

[wrapper.restart]
block = "RESTART"
doc = "The slot is inside a RESTART block of the STRATEGY block."
text = """
OPTIM CGRID2B (1) 0.5 1.5
PC_ERMSE 0 1
OPTIMIZER
STRATEGY
LIB NLOPT
ALGO LN_SBPLX
MAXEVAL 10
RESTART
AFTER_STAGNATION 20
MAX 2
{line}
ENDRESTART
ENDSTRATEGY
ENDOPTIMIZER
"""

[wrapper.explore]
block = "EXPLORE"
doc = "The slot is inside the EXPLORE block of STRATEGY TYPE PRESTAGE, after its optimiser keys."
text = """
OPTIM CGRID2B (1) 0.5 1.5
PC_ERMSE 0 1
OPTIMIZER
STRATEGY
TYPE PRESTAGE
LIB NLOPT
ALGO LN_SBPLX
MAXEVAL 10
EXPLORE
LIB TADAH
ALGO RANDOM
MAXEVAL 5
{line}
ENDEXPLORE
ENDSTRATEGY
ENDOPTIMIZER
"""

[wrapper.refine]
block = "REFINE"
doc = "The slot is inside the REFINE block of STRATEGY TYPE PRESTAGE, after its optimiser keys."
text = """
OPTIM CGRID2B (1) 0.5 1.5
PC_ERMSE 0 1
OPTIMIZER
STRATEGY
TYPE PRESTAGE
EXPLORE
LIB TADAH
ALGO RANDOM
MAXEVAL 5
ENDEXPLORE
REFINE
LIB NLOPT
ALGO LN_SBPLX
MAXEVAL 10
{line}
ENDREFINE
ENDSTRATEGY
ENDOPTIMIZER
"""

[wrapper.inner]
block = "INNER"
doc = "The slot is inside the INNER block of an NLOPT:LN_AUGLAG search, after its optimiser keys."
text = """
OPTIM CGRID2B (1) 0.5 1.5
PC_ERMSE 0 1
OPTIMIZER
STRATEGY
LIB NLOPT
ALGO LN_AUGLAG
MAXEVAL 10
INNER
LIB NLOPT
ALGO LN_BOBYQA
MAXEVAL 5
{line}
ENDINNER
ENDSTRATEGY
ENDOPTIMIZER
"""

[wrapper.main_ream]
block = "ROOT"
doc = """\
The slot is the first line, at the top level, of a search of a DM_REAM \
potential whose OPTIM line on AMPGRIDMB arms RHOGATE and RHOBARGATE."""
context = "main_ream"
text = """
{line}
OPTIM AMPGRIDMB (3) -0.5 0.5
PC_ERMSE 0 1
OPTIMIZER
STRATEGY
LIB NLOPT
ALGO LN_SBPLX
MAXEVAL 10
ENDSTRATEGY
ENDOPTIMIZER
"""

# ------------------------------------------------------------ contexts ----
# The training configuration (-c) of a conformance case, as the
# configuration parser reads it. A wrapper or an example names one with
# `context`; "default" otherwise.

[fixture.main_script]
path = "main_pc.in"
doc = "A LAMMPS script that defines the equal-style variable E, for a PC_LAMMPS line after a PC_SCRIPT_TIMEOUT line."
text = """
variable E equal 1.0
"""

[context.default]
doc = "A one-species two-body model that builds without data: H, D2_BP, M_BLR."
config = """
ATOM H
WATOM 1.0
DBFILE dummy.db
INIT2B true
INITMB false
TYPE2B D2_BP 2 2 H H
CGRID2B 1.0 2.0
SGRID2B 0.5 1.0
RCTYPE2B Cut_Cos
RCUT2B 5.0
VERBOSE 0
MODEL M_BLR BF_Linear
OALGO 4
LAMBDA 1e-3
"""

[context.main_ream]
doc = """\
A one-species Ta model with a bare DM_REAM many-body term under RHOFORM \
SIGNED that builds without data: D2_Blip5, DM_REAM, M_BLR."""
