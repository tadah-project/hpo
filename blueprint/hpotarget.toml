[[env]]
name = "TADAH_PC_WORKER_TIMEOUT"
key = "ROOT.PC_WORKER_TIMEOUT"
msg = "TADAH_PC_WORKER_TIMEOUT must be a finite number of seconds >= 0 (0 derives the deadline from each script's timeout), got '{tok}'{underflow}"
doc = """\
Replaces PC_WORKER_TIMEOUT of the target file when it is set and not \
empty, with the same values."""
checks = [
  { msg = "TADAH_PC_WORKER_TIMEOUT is too large for the worker deadline, got '{tok}' (it is kept in 64-bit milliseconds: at most about 9.2e15 s)", doc = "When the run starts: a value above about 9.2e15 s." },
  { msg = "TADAH_PC_WORKER_TIMEOUT (got '{tok}') sets the deadline of a script task in a worker process (PC_ISOLATION PROCESS); under PC_ISOLATION THREAD, {why}, the scripts run inside the tadah process without a worker deadline, so it would have no effect", doc = "When the run starts, for any value: the run uses PC_ISOLATION THREAD; {why} says what sets it." },
]

[[env.invalid]]
