[[key]]
id = "ROOT.PC_WORKER_TIMEOUT"
name = "PC_WORKER_TIMEOUT"
blocks = ["ROOT"]
synopsis = "PC_WORKER_TIMEOUT <seconds>"
args = [ { name = "seconds", kind = "number", min = 0, msg = "PC_WORKER_TIMEOUT must be a finite number of seconds >= 0 (0 derives the deadline from each script's timeout), got '{tok}'{underflow}" } ]
repeat = "error"
repeat_msg = "PC_WORKER_TIMEOUT is set twice (first on line {first_line}); each key is given once"
default = { literal = "0" }
env = "TADAH_PC_WORKER_TIMEOUT"
doc = """\
The deadline, in seconds, of one script task under PC_ISOLATION PROCESS: \
a worker process that passes it is stopped, and the task fails. 0 \
derives it from the script limit t as max(3t, t + 120 s), and without a \
script limit there is no deadline."""
long_doc = """\
The deadline is kept in 64-bit milliseconds, so a value above about \
9.2e15 s is refused. Under PC_ISOLATION THREAD the scripts run inside \
the tadah process, without a worker deadline: the key, for any value, and \
TADAH_PC_WORKER_TIMEOUT are refused when the run starts, whether the \
PC_ISOLATION line, TADAH_PC_ISOLATION or the MPI build of tadah sets \
THREAD."""
checks = [
  { msg = "PC_WORKER_TIMEOUT is too large for the worker deadline, got '{tok}' (it is kept in 64-bit milliseconds: at most about 9.2e15 s)", doc = "The value is above about 9.2e15 s." },
  { msg = "PC_WORKER_TIMEOUT sets the deadline of a script task in a worker process (PC_ISOLATION PROCESS); under PC_ISOLATION THREAD, {why}, the scripts run inside the tadah process without a worker deadline, so it would have no effect", doc = "When the run starts, at the line, for any value: the run uses PC_ISOLATION THREAD; {why} says what sets it: its line, TADAH_PC_ISOLATION, or the MPI build of tadah, whose only mode it is." },
]

