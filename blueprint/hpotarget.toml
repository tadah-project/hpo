[[block]]
name = "INNER"
end = "ENDINNER"
parents = ["STRATEGY", "EXPLORE", "REFINE"]
repeat = "error_per_parent"
repeat_msg = "INNER block given twice for one optimiser (the first on line {first_line}); STRATEGY and REFINE configure the same optimiser, and so do two EXPLORE blocks"
misplaced_msg = "INNER block must appear inside STRATEGY, EXPLORE or REFINE: it holds the local search that an NLopt MLSL or AUGLAG algorithm runs"
unknown_msg = "unknown key '{key}' inside the INNER block opened on line {open_line} (only {keys} are valid; ENDINNER closes it)"
refuse_msg = "{key} is not accepted inside an INNER block: {why}; the enclosing {enclosing} block takes {key}"
refuse = [
  { key = "SEED", why = "NLopt draws the INNER search from the enclosing run's random stream" },
  { key = "GRAD_STRATEGY", why = "the enclosing block's GRAD_STRATEGY applies to its local search" },
  { key = "STOPVAL", why = "NLopt's MLSL and AUGLAG replace the INNER search's STOPVAL with the enclosing block's" },
]
unreachable_msgs = ["INNER block has no parent OptimizerSpec"]
doc = """\
The local search that NLopt's MLSL and AUGLAG run inside the run of the \
block around it. There is one INNER block for each optimiser: the STRATEGY \
and REFINE blocks share one, and so do two EXPLORE blocks."""
long_doc = """\
It takes the keys of the optimiser group except SEED, GRAD_STRATEGY and \
STOPVAL, which the enclosing block sets. Under an MLSL, an INNER search \
with none of FTOL_REL, FTOL_ABS and XTOL_REL above 0 runs with NLopt's \
FTOL_REL 1e-15 and XTOL_REL 1e-7."""
quirk = """\
The rule is one INNER block for each optimiser, not for each enclosing \
block: an INNER block in REFINE after one in STRATEGY is refused as given \
twice, and so is one in a second EXPLORE block."""

[[block.close_checks]]
msg = "the INNER block inside {enclosing} names no optimiser: {missing}; LIB and ALGO inside the INNER block name the local optimiser that NLopt's MLSL and AUGLAG run"
doc = "At ENDINNER: the INNER search has LIB and ALGO. {enclosing} is STRATEGY, EXPLORE or REFINE."

[[block.close_checks]]
msg = "the INNER block inside {enclosing}: unknown optimiser {lib}:{algo}: {why}; `tadah explain ALGO` lists the optimisers"
doc = "At ENDINNER, with LIB NLOPT: ALGO names an NLopt algorithm of the optimiser list."

[[block.close_checks]]
msg = "the INNER block inside {enclosing}: {lib}:{algo} is refused: {why}"
doc = "At ENDINNER, with LIB NLOPT: an NLopt algorithm the optimiser list refuses."

[[block.examples]]
wrap = "none"
doc = "An INNER block sets the local search of an MLSL or AUGLAG algorithm."
text = '''
OPTIM CGRID2B (1) 0.5 1.5
PC_ERMSE 0 1
OPTIMIZER
STRATEGY
LIB NLOPT
ALGO LN_AUGLAG
MAXEVAL 10
INNER
LIB NLOPT
ALGO LN_BOBYQA
ENDINNER
ENDSTRATEGY
ENDOPTIMIZER'''

