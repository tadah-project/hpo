# ------------------------------------- RHOGATE and RHOBARGATE options ----
# RHOGATE and RHOBARGATE take their options as word-value pairs after
# their values. NPTS has another range and default on each line, so each
# line has its own entries.

[[line_option]]
id = "RHOGATE.R_LO"
option = "R_LO"
lines = ["RHOGATE"]
synopsis = "R_LO <r>"
args = [ { name = "r", kind = "number", min = 0, what = "RHOGATE R_LO", msg = "RHOGATE R_LO must be >= 0, got '{tok}'" } ]
repeat = "error"
repeat_msg = "RHOGATE: R_LO is given twice on this line; each option is given once"
default = { text = "0.15 RCUTMB of each candidate", unchecked = "RHOGATE takes the window of each candidate from its RCUTMB when it checks it; no setting holds it." }
checks = [
  { msg = "RHOGATE: R_LO needs a value; expected RHOGATE <tol> [R_LO <r>] [NPTS <n>] [SEED ERROR|WARN]", doc = "R_LO is the last word of the line." },
  { msg = "RHOGATE R_LO {value} A must lie below the smallest cutoff a candidate can have, RCUTMB = {max} A{note}: the window [R_LO, RCUTMB] would be empty; a smaller R_LO gives the window a width.", doc = "At startup, at the RHOGATE line: R_LO is not below the smallest RCUTMB a candidate can have, {max}; {note} is \" (the largest CGRIDMB knot over its OPTIM box)\" when that knot sets it." },
]
doc = """\
The lower end, in Å, of the window [R_LO, RCUTMB] on which RHOGATE checks \
rho(r); it lies below the smallest RCUTMB a candidate can have."""

[[line_option.examples]]
wrap = "main_ream"
text = "RHOGATE 1e-5 R_LO 2.0"

[[line_option.invalid]]
wrap = "root"
text = "RHOGATE 1e-5 R_LO -1"
error = "RHOGATE R_LO must be >= 0, got '-1'"

[[line_option.invalid]]
wrap = "root"
text = "RHOGATE 1e-5 R_LO 0x1p-1"
error = "RHOGATE R_LO must be a finite number, got '0x1p-1'"

[[line_option.invalid]]
wrap = "root"
text = "RHOGATE 1e-5 R_LO"
error = "RHOGATE: R_LO needs a value; expected RHOGATE <tol> [R_LO <r>] [NPTS <n>] [SEED ERROR|WARN]"

[[line_option.invalid]]
