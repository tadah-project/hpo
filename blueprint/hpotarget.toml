# ---------------------------------------------------- cross-key rules ----

[[rule]]
id = "RULE.density_key_arming"
title = "RHOGATE and RHOBARGATE need a search of the density"
check = "parse"
msg = "{key} cannot act: no OPTIM line searches a key that changes the density or its window ({keys} of a DM_REAM many-body term, or a DENSITY parameter <ID>.DENSITY.<parameter> of a DM_Embed component), so every candidate has the density of the training configuration and its one verdict (OPTIM WATOM only scales the density; the verdict does not change). The {key} line takes effect with an OPTIM line on one of these keys, anywhere in the file."
keys = ["ROOT.RHOGATE", "ROOT.RHOBARGATE", "ROOT.OPTIM"]
doc = """\
A file with RHOGATE or RHOBARGATE searches a key that changes the DM_REAM \
density or its window: AMPGRIDMB, CGRIDMB, SGRIDMB or RCUTMB, or a DENSITY \
key of a DM_Embed component. An OPTIM line anywhere in the file counts; \
without one the file is refused at its first RHOGATE or RHOBARGATE line."""

[[rule.examples]]
wrap = "main_ream"
doc = "The OPTIM line on AMPGRIDMB below the RHOGATE line arms it."
text = "RHOGATE 1e-5"

[[rule.invalid]]
wrap = "root"
text = "RHOGATE 1e-5"
error = "RHOGATE cannot act: no OPTIM line searches a key that changes the density or its window (AMPGRIDMB, CGRIDMB, SGRIDMB or RCUTMB of a DM_REAM many-body term, or a DENSITY parameter <ID>.DENSITY.<parameter> of a DM_Embed component), so every candidate has the density of the training configuration and its one verdict (OPTIM WATOM only scales the density; the verdict does not change). The RHOGATE line takes effect with an OPTIM line on one of these keys, anywhere in the file."

[[rule.invalid]]
wrap = "root"
text = '''
RHOBARGATE bcc 3.3 0.9 1.1
RHOGATE 1e-5'''
error = "RHOBARGATE cannot act: no OPTIM line searches a key that changes the density or its window (AMPGRIDMB, CGRIDMB, SGRIDMB or RCUTMB of a DM_REAM many-body term, or a DENSITY parameter <ID>.DENSITY.<parameter> of a DM_Embed component), so every candidate has the density of the training configuration and its one verdict (OPTIM WATOM only scales the density; the verdict does not change). The RHOBARGATE line takes effect with an OPTIM line on one of these keys, anywhere in the file."

