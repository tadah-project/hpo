error = "FAILSCORE_GRADING is set twice (first on line 2); each key is given once"

[[key]]
id = "ROOT.BUMPGATE"
name = "BUMPGATE"
blocks = ["ROOT"]
synopsis = "BUMPGATE CANDIDATE | STRICT"
args = [ { name = "mode", kind = "word", words = ["CANDIDATE", "STRICT"], msg = "BUMPGATE must be CANDIDATE or STRICT, got '{tok}'" } ]
repeat = "error"
repeat_msg = "BUMPGATE is set twice (first on line {first_line}); each key is given once"
default = { literal = "CANDIDATE" }
env = "TADAH_BUMPGATE"
doc = """\
How a bump basis on a channel with a discontinuous cutoff, such as \
Cut_Dummy, is kept inside that cutoff over the OPTIM boxes. CANDIDATE \
refuses each candidate with a bump past the cutoff before it is trained, \
and STRICT refuses at startup a box whose worst corner puts a bump past \
it."""
long_doc = """\
Under CANDIDATE the startup checks refuse only a box with no valid point. \
In both modes they refuse a training configuration with a bump past its \
cutoff."""
checks = [
  { msg = "bump-support gate: with a hard (Cut_Dummy) cutoff every compact bump must vanish at or before RCUT (c + w/eta <= RCUT) — a truncated overhang is an energy/force STEP at the cutoff. Violations:{list}\n  To search longer range, raise RCUT2B/RCUTMB in the config (the potential stays smooth: bumps still vanish at their own support edge).", doc = "At startup, without a line: a bump basis under a Cut_Dummy cutoff has a bump past the cutoff, and {list} names each. In both modes a bump of the training configuration is refused. Under STRICT an OPTIM box whose worst corner puts a bump past the cutoff is refused, and under CANDIDATE a box with no point that keeps the bump inside it." },
]

[[key.examples]]
wrap = "root"
text = "BUMPGATE STRICT"

[[key.invalid]]
wrap = "root"
text = "BUMPGATE strict"
error = "BUMPGATE must be CANDIDATE or STRICT, got 'strict'"

[[key.invalid]]
