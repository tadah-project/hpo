[[block]]
name = "RESTART"
end = "ENDRESTART"
parents = ["STRATEGY"]
repeat = "merge"
misplaced_msg = "RESTART block must appear inside STRATEGY"
unknown_msg = "unknown key '{key}' inside the RESTART block opened on line {open_line} (ENDRESTART closes it)"
unknown_first = true
aliases = { STRATEGY = "INIT.METHOD" }
doc = """\
The stagnation restart of the STRATEGY-level optimiser: when to restart, \
how often, and the chain of METHOD lines that draws the points of each \
restart. A run on more than one MPI rank refuses a RESTART block."""
long_doc = """\
A second RESTART block continues the first. Inside a RESTART block a \
STRATEGY line is read as a METHOD line."""

[[block.close_checks]]
msg = "the RESTART block never restarts the search: a restart needs AFTER_STAGNATION and MAX, and the block has {missing}; a search without restarts has no RESTART block"
doc = """\
At ENDSTRATEGY, reported at the last ENDRESTART line: {missing} is "no \
AFTER_STAGNATION line", "no MAX line" or "no AFTER_STAGNATION line and no \
MAX line"."""

[[block.examples]]
wrap = "strategy"
text = '''
RESTART
AFTER_STAGNATION 20
MAX 3
METHOD RANDOM 2
ENDRESTART'''

