[[key]]
id = "ROOT.RHOGATE"
name = "RHOGATE"
blocks = ["ROOT"]
synopsis = "RHOGATE <tol> [R_LO <r>] [NPTS <n>] [SEED ERROR | WARN]"
args = [
  { name = "tol", kind = "number", min = 0, what = "RHOGATE tol", msg = "RHOGATE tol must be >= 0, got '{tok}'", doc = "The tolerance, a fraction of the largest density. R_LO, NPTS and SEED follow it, each with its value, in any order and each at most once." },
]
repeat = "error"
repeat_msg = "RHOGATE is set twice (first on line {first_line}); each key is given once"
doc = """\
The sign condition of a many-body density under the SIGNED form: a \
candidate whose pair density rho(r) falls below -tol times its largest \
value on [R_LO, RCUTMB] is refused before it is trained, as a failed \
evaluation."""
long_doc = """\
The many-body term of the training configuration is a bare DM_REAM term or \
a single DM_Embed component; a DM_mJoin or several components are refused \
at startup. Its density form, RHOFORM for DM_REAM or the FORM of the \
component, is SIGNED, and every density pair weight (WATOM) can be above 0 \
(both checked at startup). An OPTIM line on a density key arms RHOGATE. At \
startup the CONFIG and WARM starting points of the INIT and RESTART chains \
are checked as candidates, and SEED says what a failing one does. A \
training configuration that is no such starting point and fails has a \
warning instead; RANDOM, LHS and SOBOL points are checked when they are \
evaluated."""
quirk = """\
The options R_LO, NPTS and SEED and the values ERROR and WARN are read \
in any case (npts, seed warn), while every key is matched as written."""
checks = [
  { msg = "RHOGATE: the tolerance is missing; expected RHOGATE <tol> [R_LO <r>] [NPTS <n>] [SEED ERROR|WARN]", doc = "The line has no value." },
  { msg = "RHOGATE: unexpected token '{tok}'; expected RHOGATE <tol> [R_LO <r>] [NPTS <n>] [SEED ERROR|WARN]", doc = "A word after the tolerance, in the place of an option, is not R_LO, NPTS or SEED." },
  { msg = "{keys} {what} the density of one DM_REAM many-body term or of one DM_Embed component, and {why}", doc = "At startup, at the RHOGATE or RHOBARGATE line (the first of them when both are given): the many-body term is neither one DM_REAM term nor one DM_Embed component. {keys} is RHOGATE, RHOBARGATE, or both joined by and, with the verb {what} agreeing. {why} says that the configuration has no many-body term, names its many-body term (DM_mJoin is not read by these checks), or gives the number of its DM_Embed components." },
  { msg = "RHOGATE: under {form} every density rho(r) is >= 0, so the sign condition of RHOGATE holds for every candidate; RHOGATE is taken under RHOFORM SIGNED only (RHOBARGATE under every form)", doc = "At startup, at its line: the density form is NONNEG or MONOTONE." },
  { msg = "{keys}: the many-body cutoff RCUTMB is not set.", doc = "At startup, at the RHOGATE or RHOBARGATE line (the first of them when both are given): the smallest RCUTMB a candidate can have is not a number above 0." },
  { msg = "{keys}: {why} on every candidate (WATOM has no OPTIM line, or its OPTIM box does not reach above 0), so every evaluation would be refused before training, under SEED ERROR and SEED WARN alike. The checks of {keys} need every density pair weight > 0, which a WATOM above 0 gives (under RHOFORM SIGNED the sign of rho is that of the AMPGRIDMB amplitudes); without the {keys} line(s) the run makes no such check.", doc = "At startup, at the RHOGATE or RHOBARGATE line (the first of them when both are given): a density pair weight is not above 0 with WATOM at the upper end of its OPTIM box, or at its value in the training configuration when no OPTIM line searches it. {why} names the weight: \"a density pair weight W = <w> (WATOM) is not finite and > 0\"." },
  { msg = "RHOGATE: seed {name} fails the rho(r) sign gate: {why}. A seed that fails is refused under SEED ERROR, the default, and is evaluated as a rejected start under SEED WARN. tadah refit --edit changes the density of a potential file; a WARM seed takes the values of its search parameters from its file and the others from the training configuration.", doc = "At startup, without a line, under SEED ERROR: a CONFIG or WARM starting point of the INIT or RESTART chain fails the condition; {name} names it, and {why} gives the smallest and largest density on the window. Under SEED WARN hpo_run.log has a warning instead, and the run goes on." },
]
untested = [
  { msg = "{keys}: the many-body cutoff RCUTMB is not set.", why = "Needs a DM_REAM term without RCUTMB, which the training configuration refuses first." },
]

