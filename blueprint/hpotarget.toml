wrap = "root"
check = "check"
env = { TADAH_BUMPGATE = "MAYBE" }
at = "none"
text = ""
error = "TADAH_BUMPGATE must be CANDIDATE or STRICT (got 'MAYBE')"

[[env]]
name = "TADAH_PC_ISOLATION"
key = "ROOT.PC_ISOLATION"
