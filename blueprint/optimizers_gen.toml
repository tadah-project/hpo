explain_text = """
Options for DLIB:BFGS
   * MAXEVAL      (objective evaluations, the finite-difference
                   ones included)
   * FTOL_ABS     (objective-delta stop, default 1e-7: the loss
                   changed by less from one iteration to the next)
   * PARAM fd_step <double>      (finite-difference step, default 1e-6)
   * PARAM fd_kernel inhouse|ceres (the step rule)
   * PARAM diff_method 0|1       (CENTRAL, default, or FORWARD)
   * PARAM tol_gradinf <double>  (stop once the largest component of the
                   gradient falls below it, as CERES's; alternative to FTOL_ABS)
   * a point that no step can move (each coordinate at a bound its
                   gradient points out of, or a step below its
                   rounding), or whose line search from the farthest
                   step comes back to it, ends the search, 'no step
                   within the OPTIM box', unless FTOL_ABS ends it
                   first: its loss does not change
"""

