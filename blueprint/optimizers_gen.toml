[[optimizer]]
lib = "CERES"
algo = "STEEPEST_DESCENT"
status = "registered"
row_text = "local, gradient-based, ignores the OPTIM box"
global = false
gradient_based = true
accepts_inner = false
default_inner = ""
accepts_multi_seed = false
reads = []
algorithm_params = []
stops = ["MAXEVAL", "FTOL_REL", "XTOL_REL"]
needs_stop = false
stop_note = ""
ignores_forced_stop = false
tolerance_note = ""
untested_tolerance_note = ""
step_use = "rejected"
step_use_text = "rejected (no initial-step concept)"
step_consumed = false
step_note = "Ceres chooses the initial line-search step itself; remove STEP (PARAM max_ls_iter caps the line-search iterations)"
starts_at_x0 = true
start_note = ""
random_draws = "not_recorded"
ignores_bounds = true
bounds_note = "ignores the OPTIM box: Ceres' line-search solver has no bounds, so its line searches can propose points outside the box (a LOG dimension stays positive, a linear one is unbounded). Such a point is not evaluated: it is scored as a failure graded by its distance to the box, whose slope points away from the box, so a descent step leads back into it; it counts against MAXEVAL and it is never the best; the first is reported with a WARNING and the DIAGNOSTICS section of hpo_run.log counts them all. DLIB:BFGS and the NLopt LD_* algorithms keep to the box"
explain_text = """
Options for CERES:STEEPEST_DESCENT
   * Ceres' line-search solver: steepest descent, Armijo line search; local, gradient-based (GRAD_STRATEGY NUMERICAL by default)
   * Stops that end a run: MAXEVAL, FTOL_REL, XTOL_REL
   * PARAM tol_gradinf <double>  (gradient tolerance, the largest component, default 1e-10)
   * PARAM max_iter <int>        (Ceres' max_num_iterations, 0 to 2147483647; MAXEVAL counts the evaluations)
   * PARAM max_ls_iter <int>     (line-search step-size iterations, 1 to 2147483647)
   * PARAM fd_step, fd_kernel, diff_method  (the finite differences of the gradient)
   * STEP is rejected: Ceres chooses the initial line-search step itself; remove STEP (PARAM max_ls_iter caps the line-search iterations)
   * WARNING: ignores the OPTIM box: Ceres' line-search solver has no bounds, so its line searches can propose points outside the box (a LOG dimension stays positive, a linear one is unbounded). Such a point is not evaluated: it is scored as a failure graded by its distance to the box, whose slope points away from the box, so a descent step leads back into it; it counts against MAXEVAL and it is never the best; the first is reported with a WARNING and the DIAGNOSTICS section of hpo_run.log counts them all. DLIB:BFGS and the NLopt LD_* algorithms keep to the box
"""

