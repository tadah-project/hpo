     No PARAM.
   * FTOL_ABS     (dlib's solver epsilon, default 1e-3; it ends no
                   run). FTOL_REL/XTOL_REL/XTOL_ABS are rejected.
   * Stops that end a run: MAXEVAL, MAXTIME, STOPVAL
     One of them is required, or an active RESTART: dlib's global search has no convergence test (FTOL_ABS sets its solver's precision, which stops nothing) and runs until it is interrupted.
"""

