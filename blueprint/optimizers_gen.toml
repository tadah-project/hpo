# The optimisers of tadah hpo: every LIB:ALGO an OPTIMIZER block can
# name, registered or refused, with its capabilities and its ALGO help.
#
# Generated by hpo_registry_export (tests/tools/hpo_registry_export.cpp)
# from the optimiser registry (src/optimizer_caps.cpp), the ALGO help
# (src/optimizer_spec.cpp, src/asa_options.cpp, and
# blueprint/anneal_keys.toml for the PARAM keys of the annealers) and
# the NLopt version. It is not edited by hand: README.md, next to it,
# says how it is regenerated and describes the fields.

[meta]
schema = 1
nlopt_version = "2.10.0"
libraries = ["ASA", "CERES", "DLIB", "NLOPT", "TADAH"]

[[optimizer]]
lib = "ASA"
algo = "ASA"
status = "registered"
row_text = "global, derivative-free"
global = true
gradient_based = false
accepts_inner = false
default_inner = ""
accepts_multi_seed = false
reads = ["SEED"]
warns_unread_seed = false
stops = ["MAXEVAL", "MAXTIME", "STOPVAL"]
needs_stop = false
stop_note = ""
ignores_forced_stop = false
tolerance_note = ""
untested_tolerance_note = ""
step_use = "rejected"
step_use_text = "rejected (no initial-step concept)"
step_consumed = false
step_note = "the generating distribution width is driven by the per-dim temperatures (Initial_Parameter_Temperature, Temperature_Ratio_Scale)"
starts_at_x0 = true
start_note = ""
random_draws = "not_recorded"
ignores_bounds = false
bounds_note = ""
explain_text = """
Options for ASA:ASA
   * Adaptive Simulated Annealing (Lester Ingber, ASA-30.53,
     BSD-3-Clause; its source is part of Tadah!)
   * single-instance: one ASA run per process at a time
   * stops: MAXEVAL / MAXTIME / STOPVAL plus ASA's own
     Limit_* and plateau options below; FTOL/XTOL rejected
   * SEED seeds the proposal stream; INIT seed auto-sets
     User_Initial_Parameters
   * PARAM keys use the original ASA option spellings
     (case-sensitive); per-dim options accept Name[i]
  PARAM Limit_Acceptances  (default 10000)  max accepted states; 0 = no limit
  PARAM Limit_Generated  (default 99999)  max generated states; 0 = no limit
  PARAM Limit_Invalid_Generated_States  (default 1000)  invalid-state budget; 0 = exit ASAP, -1 = bypass test
  PARAM Accepted_To_Generated_Ratio  (default 1e-6)  min accepted/generated ratio before reanneal test (must be > 0)
  PARAM Cost_Precision  (default 1e-18)  |last-best| threshold of the cost-repeat plateau test (must be > 0)
  PARAM Maximum_Cost_Repeat  (default 5)  consecutive plateau cycles before COST_REPEATING exit; 0 = bypass
  PARAM Number_Cost_Samples  (default 5)  >0: initial cost temp from mean |cost|; <-1: from a deviation sample
  PARAM Temperature_Ratio_Scale  (default 1e-5)  the main control of the annealing rate: m = -log(TRS)
  PARAM Cost_Parameter_Scale_Ratio  (default 1.0)  cost temperature schedule scale relative to parameters
  PARAM Temperature_Anneal_Scale  (default 100.0)  n = log(TAS); keep > dim for large problems
  PARAM Include_Integer_Parameters  (default 0)  include INTEGER-typed dims in derivative/reanneal calculations
  PARAM User_Initial_Parameters  (default auto)  1 = start from the INIT seed; auto-set from the INIT block
  PARAM Sequential_Parameters  (default -1)  start cyclic per-dim generation at this index; any negative = off
  PARAM Initial_Parameter_Temperature  (default 1.0)  initial parameter temperature (must be > 0)
  PARAM Acceptance_Frequency_Modulus  (default 100)  periodic-test cadence in accepted states; 0 = off
  PARAM Generated_Frequency_Modulus  (default 10000)  periodic-test cadence in generated states; 0 = off
  PARAM Reanneal_Cost  (default 1)  0 = off, 1 = default, >1 / <-1 = deviation-sample variants (-1 invalid)
  PARAM Reanneal_Parameters  (default 1)  adapt per-dim temperatures to tangent sensitivities
  PARAM Delta_X  (default 0.001)  finite-difference step for tangents; 0 disables tangents
  PARAM User_Tangents  (default 0)  unsupported: tadah hpo has no analytic tangents (1 = error)
  PARAM Curvature_0  (default 1)  1 = skip curvature array (Tadah!'s default; ASA's own default 0 costs O(dim^2) exit evals), 0 = full curvature at exit, -1 = periodic
  PARAM User_Quench_Cost_Scale  (default 1.0)  cost-temperature quench exponent Q (>1 quenches; proof-safe)
  PARAM User_Quench_Param_Scale[/i]  (default 1.0)  per-dim quench exponent Q_i (>1 voids the sampling proof)
  PARAM User_Temperature_Ratio[/i]  (default 1.0)  per-dim multiplier of -log(Temperature_Ratio_Scale)
  PARAM User_Delta_Parameter[/i]  (default Delta_X)  per-dim finite-difference step (defaults to Delta_X)
  PARAM User_Parameter_Temperature[/i]  (default IPT)  per-dim initial temperature (defaults to Initial_Parameter_Temperature)
  PARAM Multi_Number  (default 1)  track the best N distinct minima (reported in the journal)
  PARAM Multi_Specify  (default 1)  1 = strict < for new minima (Tadah!'s default); 0 = <=, as in ASA's example options
  PARAM Multi_Grid[/i]  (default 0.0)  per-dim distinctness grid for MULTI_MIN (0 -> EPS_DOUBLE)
  PARAM Queue_Size  (default 0)  FIFO eval-cache size; 0 = cache off
  PARAM Queue_Resolution[/i]  (default 0.0)  per-dim cache-hit resolution
  PARAM Gener_Block  (default 1)  initial generated-state block size; 1 (with Gener_Block_Max 1) = canonical serial sampling, >1 evaluates the block concurrently (THREADS-wide) and changes sampling
  PARAM Gener_Block_Max  (default Gener_Block)  block-size cap (buffers sized once); the adaptive resizing keeps the block between 1 and this cap, so it can shrink below Gener_Block
  PARAM Gener_Mov_Avr  (default 3)  moving-average window of the adaptive block resizing; 0 = no resizing: every block holds Gener_Block states
"""

[[optimizer]]
lib = "CERES"
algo = "DOGLEG"
status = "refused"
reason = "tadah hpo does not run Ceres' least-squares Solver (LEVENBERG_MARQUARDT, DOGLEG, SUBSPACE_DOGLEG): it minimises a sum of squared residuals with their derivatives, and tadah hpo gives an optimiser one scalar loss, over which these methods degenerate. The recommended replacements are CERES:STEEPEST_DESCENT, Ceres' line-search solver of a scalar loss that tadah hpo runs, and the bound-constrained gradient searches NLOPT:LD_LBFGS and DLIB:BFGS"
explain_text = """
Options for CERES:DOGLEG
   * REFUSED: tadah hpo does not run Ceres' least-squares Solver (LEVENBERG_MARQUARDT, DOGLEG, SUBSPACE_DOGLEG): it minimises a sum of squared residuals with their derivatives, and tadah hpo gives an optimiser one scalar loss, over which these methods degenerate. The recommended replacements are CERES:STEEPEST_DESCENT, Ceres' line-search solver of a scalar loss that tadah hpo runs, and the bound-constrained gradient searches NLOPT:LD_LBFGS and DLIB:BFGS
"""

[[optimizer]]
lib = "CERES"
algo = "LBFGS"
status = "refused"
reason = "Ceres' GradientProblemSolver has no bounds, and a point it proposes outside the OPTIM box is not evaluated: it is scored as a failure graded by its distance to the box, in [0.99975, 1) x FAILSCORE, far above every usable loss. Ceres' Wolfe line search interpolates that value and shrinks its step to almost nothing (a 2-D run stopped at its start after 16 evaluations, 'Parameter tolerance reached' with a step of 0; a 1-D run moved by 2.5e-7 per iteration until MAXEVAL). The recommended replacements are NLOPT:LD_LBFGS (L-BFGS within the box), DLIB:BFGS and CERES:STEEPEST_DESCENT, whose Armijo line search steps back from such a point"
explain_text = """
Options for CERES:LBFGS
   * REFUSED: Ceres' GradientProblemSolver has no bounds, and a point it proposes outside the OPTIM box is not evaluated: it is scored as a failure graded by its distance to the box, in [0.99975, 1) x FAILSCORE, far above every usable loss. Ceres' Wolfe line search interpolates that value and shrinks its step to almost nothing (a 2-D run stopped at its start after 16 evaluations, 'Parameter tolerance reached' with a step of 0; a 1-D run moved by 2.5e-7 per iteration until MAXEVAL). The recommended replacements are NLOPT:LD_LBFGS (L-BFGS within the box), DLIB:BFGS and CERES:STEEPEST_DESCENT, whose Armijo line search steps back from such a point
"""

