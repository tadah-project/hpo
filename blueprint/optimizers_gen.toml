[[optimizer]]
lib = "TADAH"
algo = "ANNEAL"
status = "registered"
row_text = "global, derivative-free"
global = true
gradient_based = false
accepts_inner = false
default_inner = ""
accepts_multi_seed = false
reads = ["SEED"]
warns_unread_seed = false
stops = ["MAXEVAL", "MAXTIME", "STOPVAL", "FTOL_REL", "FTOL_ABS"]
needs_stop = false
stop_note = ""
ignores_forced_stop = false
tolerance_note = ""
untested_tolerance_note = ""
step_use = "width_fraction"
step_use_text = "family-owned width fraction (PARAM STEP_FRAC)"
step_consumed = false
step_note = "set PARAM STEP_FRAC (and PARAM STEP_MODE for ANNEAL_PT) instead"
starts_at_x0 = true
start_note = ""
random_draws = "not_recorded"
ignores_bounds = false
bounds_note = ""
explain_text = """
Options for TADAH:ANNEAL
   * Serial simulated annealing: classic whole-vector Gaussian kernel
     (Kirkpatrick et al. 1983; Metropolis et al. 1953) by default;
     PARAM CORANA ON selects the per-dimension adaptive kernel
     (Corana et al. 1987). Geometric cooling T <- T*RT; automatic T0
     calibration unless PARAM T_INIT is set; CHAIN_LENGTH/NT default
     AUTO (MAXEVAL budget spread over the cooling schedule).
   * Stops: MAXEVAL / MAXTIME / STOPVAL; FTOL_REL/FTOL_ABS (> 0) arm the
     Corana eps-NEPS plateau; T < T_MIN ends a schedule (REANNEAL
     restarts from the best until the budget runs out).
   * SEED <int>  seed of the random numbers (default: one drawn from
     the system's random source). THREADS <n> sizes the shared
     per-eval fan-out pool (the chain itself is serial).
   * Keys it does not read are refused: STEP, XTOL_*, VECTOR_ARR,
     GRAD_STRATEGY, unknown PARAM keys, and
     POPULATION, which TADAH:ANNEAL_PA reads.
   * temperature:
     PARAM T_INIT (default auto)
        Starting temperature of the cooling schedule; when set, the T0 calibration probes are skipped.
     PARAM T_MIN (default auto)
        Stop temperature of the cooling schedule; unset derives T0 * 1e-6.
     PARAM RT (default 0.85)
        Geometric cooling ratio per temperature rung (Corana 1987 r_T = 0.85). ANNEAL_PT uses a ladder with fixed endpoints and optional interior adaptation; it rejects RT.
     PARAM T0_PROBES (default 20)
        Local probes used by the automatic T0 calibration.
     PARAM T0_ACCEPT (default 0.05)
        Target initial uphill-acceptance probability: T0 = median(uphill dE) / ln(1/T0_ACCEPT).
     PARAM REANNEAL (default 1)
        When the schedule cools below T_MIN with budget left, restart from the best point at a raised temperature.
     PARAM REANNEAL_SCALE (default 0.25)
        Start temperature of re-anneal cycle n, as a fraction: T_start = T0 * REANNEAL_SCALE^n.
   * steps:
     PARAM CORANA (default 0)
        Kernel selection: ON uses Corana per-dimension adaptive steps; OFF uses whole-vector CLASSIC proposals.
     PARAM STEP_FRAC (default 0.1)
        Initial proposal scale per dimension as a fraction of the OPTIM interval width.
     PARAM CHAIN_LENGTH (default auto) [accepts AUTO]
        CLASSIC kernel: whole-vector proposals per temperature rung. Serial default AUTO: the MAXEVAL budget spread evenly over the cooling schedule (written to the journal).
     PARAM NS (default 20)
        Corana kernel: step-variation cycles per step adjustment (Corana 1987 NS = 20). ANNEAL_PT: sweeps between per-slot step adjustments.
     PARAM NT (default auto) [accepts AUTO]
        Corana kernel: step-adjustment cycles per temperature rung. Serial default AUTO: budget-derived, capped at the Corana 1987 value max(100, 5n).
     PARAM CORANA_C (default 2)
        Corana kernel: step-adjustment gain in the 0.4/0.6 acceptance-ratio rule (Corana 1987 c = 2).
     PARAM V_FLOOR_FRAC (default 0.001)
        Corana kernel: lower clamp on the per-dimension step as a fraction of the OPTIM interval width.
     PARAM BOUNDARY_MODE <REFLECT|REDRAW> (default REFLECT)
        Out-of-box proposal handling: REFLECT = exact mirror fold; REDRAW = resample the offending coordinate.
     PARAM RESET_TO_BEST (default auto)
        Snap the chain back to the best-so-far point after each cooling step (PT: coldest slot only, after each epoch).
   * stopping:
     PARAM NEPS (default 4)
        FTOL stopping history. ANNEAL compares the current rung-end loss with this many previous rung-end losses and the running best. ANNEAL_PA applies that rule to the current population minimum after each temperature step. ANNEAL_PT counts consecutive diagnostics windows without a significant global-best improvement. Requires an active FTOL_REL or FTOL_ABS to affect stopping.
"""

[[optimizer]]
lib = "TADAH"
algo = "ANNEAL_PA"
status = "registered"
row_text = "global, derivative-free"
global = true
gradient_based = false
