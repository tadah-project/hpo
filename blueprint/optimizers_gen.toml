starts_at_x0 = true
start_note = ""
random_draws = "not_recorded"
ignores_bounds = false
bounds_note = ""
explain_text = """
Options for TADAH:ANNEAL_PA
   * Population annealing over the ANNEAL stepper (classic by
     default, PARAM CORANA ON for the adaptive variant). R walkers
     anneal from T_HOT to T_MIN; each temperature step reweights by
     exp(-dbeta*f), resamples (systematic; FAILSCORE walkers receive zero
     weight when at least one feasible walker exists; all-fail skips
     resampling and continues geometric cooling), then every walker runs
     SWEEPS rungs at the new T. Same SEED => same evaluated set for any
     THREADS.
   * POPULATION <R> population size (default 4*THREADS, min 16).
   * V is walker state (children inherit the parent's step calibration
     on resample). Per-step journal line: T, ESS, unique parents,
     culled, finite field (feasible fraction), population best.
   * temperature:
     PARAM T_HOT (default: calibrated with probes)
        The hottest temperature of the ladder of TADAH:ANNEAL_PT, and the starting temperature of TADAH:ANNEAL_PA. Without it, the search calibrates it with probes (T0_PROBES, T0_ACCEPT).
     PARAM T_MIN (default: 1e-6 times the starting temperature)
        The temperature at which the cooling schedule ends; without it, 1e-6 times the starting temperature.
     PARAM RT (default 0.9)
        The ratio of two successive temperatures of the geometric cooling schedule, above 0 and below 1.
     PARAM T0_PROBES (default 20)
        The number of probes near the starting point with which the search calibrates its starting temperature.
     PARAM T0_ACCEPT (default 0.05)
        The probability with which the calibrated starting temperature accepts a step up in loss: the temperature is the median rise of the loss over the probes divided by ln(1/T0_ACCEPT).
     PARAM ESS_TARGET (default 0.5) [accepts OFF]
        The effective sample size that each temperature step of TADAH:ANNEAL_PA keeps, as a fraction of the population: it sets the size of the step. OFF cools on the geometric schedule of RT.
   * steps:
     PARAM CORANA (default OFF)
        Selects the proposal kernel: ON takes Corana's adaptive steps, one coordinate at a time with a step for each dimension; OFF takes the CLASSIC kernel, which moves every coordinate at once.
     PARAM STEP_FRAC (default 0.1)
        The first proposal scale of each dimension, as a fraction of the width of its OPTIM box.
     PARAM CHAIN_LENGTH (default 50)
        The number of proposals of the CLASSIC kernel at each temperature step.
        The default of TADAH:ANNEAL is AUTO: MAXEVAL spread evenly over the cooling schedule, which hpo_run.log reports.
     PARAM NS (default 20)
        Corana kernel: the number of cycles through the dimensions between two adjustments of the steps. Under TADAH:ANNEAL_PT, the number of sweeps between two adjustments of the steps of a slot.
     PARAM NT (default 5)
        Corana kernel: the number of step adjustments at each temperature step.
        The default of TADAH:ANNEAL is AUTO: a number that follows from MAXEVAL, at most the larger of 100 and 5n for n dimensions.
     PARAM CORANA_C (default 2)
        Corana kernel: the gain of the step adjustment, which lengthens the step of a dimension whose acceptance ratio is above 0.6 and shortens one below 0.4.
     PARAM V_FLOOR_FRAC (default 0.001)
        Corana kernel: the smallest step of each dimension, as a fraction of the width of its OPTIM box.
     PARAM BOUNDARY_MODE <REFLECT|REDRAW> (default REFLECT)
        What a proposal outside the OPTIM box becomes: REFLECT folds it back into the box as a mirror does; REDRAW draws each coordinate outside the box again.
     PARAM SWEEPS (default 1)
        The number of rounds each walker of TADAH:ANNEAL_PA runs at each temperature: a round is CHAIN_LENGTH proposals of the CLASSIC kernel, or NT step adjustments of the Corana kernel.
   * init:
     PARAM INIT_MODE <JITTER|UNIFORM> (default JITTER)
        How the replicas or walkers start: the first at the starting point of the search; JITTER moves the others away from it, UNIFORM draws them from the OPTIM box.
        JITTER alone draws Gaussian displacements with the first proposal scales, and JITTER <fraction> uniform displacements of up to the fraction times the width of each box. Under TADAH:ANNEAL_PT, JITTER AUTO <p> measures the bounds of the uniform displacements of each dimension against a band of the loss relative to that of the starting point, and scales them by INIT_JITTER_LADDER, which scales the other JITTER forms too. Under TADAH:ANNEAL_PA, JITTER AUTO takes no tolerance: the bounds are the first proposal scales.
   * stopping:
     PARAM NEPS (default 4)
        The length of the history of the FTOL_REL and FTOL_ABS stop, which has an effect only with one of them.
        TADAH:ANNEAL compares the loss at the end of a temperature step with the losses at the end of this many earlier steps and with the best loss; TADAH:ANNEAL_PA applies the same rule to the lowest loss of the population after each temperature step; TADAH:ANNEAL_PT counts the successive diagnostics windows without a significant improvement of the best loss.
"""

[[optimizer]]
lib = "TADAH"
algo = "ANNEAL_PT"
status = "registered"
row_text = "global, derivative-free, needs a stop"
global = true
gradient_based = false
accepts_inner = false
default_inner = ""
accepts_multi_seed = false
reads = ["SEED", "THREADS"]
algorithm_params = []
stops = ["MAXEVAL", "MAXTIME", "STOPVAL", "FTOL_REL", "FTOL_ABS"]
needs_stop = true
stop_note = "parallel tempering keeps its temperature ladder, so no schedule ends it, and it runs until it is interrupted"
ignores_forced_stop = false
tolerance_note = ""
untested_tolerance_note = ""
step_use = "width_fraction"
step_use_text = "a fraction of the width (PARAM STEP_FRAC)"
step_consumed = false
step_note = "set PARAM STEP_FRAC (and PARAM STEP_MODE for ANNEAL_PT) instead"
starts_at_x0 = true
start_note = ""
random_draws = "not_recorded"
ignores_bounds = false
bounds_note = ""
explain_text = """
Options for TADAH:ANNEAL_PT
   * Parallel tempering (replica exchange): K replicas on a static
     (optionally self-adapting) log temperature ladder, slot 1 coldest.
     A replica runs ONE sweep per epoch (CLASSIC: one whole-vector
     proposal; CORANA: one single-coordinate move per dimension),
     then adjacent pairs attempt a state swap every SWAP_EVERY
     epochs with deterministic even/odd (DEO) pairing.
     With REPLICAS fixed, a deterministic objective, and no
     timing-dependent stop, the same SEED gives the same evaluated
     set for any THREADS.
   * Stops: MAXEVAL / MAXTIME / STOPVAL; FTOL_REL/FTOL_ABS (> 0) arm the
     best-stall stop (global best unimproved over NEPS diagnostics
     windows). One of them is required: the ladder keeps its
     temperatures, so no schedule ends a run. Cooling schedules
     belong to serial ANNEAL: RT/T_MIN are rejected here.
   * THREADS <n>  shared worker-pool width (replica evals + PC_LAMMPS
     fan-out + MLIP train/predict); also the REPLICAS default.
   * Diagnostics: per-pair swap tables + step reports every SWAP_WINDOW
     epochs; ladder updates in hpo_temperature_ladder.tsv; calibrated
     step scales in hpo_step_scales.tsv. Under CORANA, the
     per-dimension acceptance the stepper adapts on is summarised per
     slot in the journal and written in full to
     hpo_corana_acceptance.tsv (per SLOT/temperature, not per walker).
   * temperature:
     PARAM T_HOT (default: calibrated with probes)
        The hottest temperature of the ladder of TADAH:ANNEAL_PT, and the starting temperature of TADAH:ANNEAL_PA. Without it, the search calibrates it with probes (T0_PROBES, T0_ACCEPT).
     PARAM T0_PROBES (default 20)
        The number of probes near the starting point with which the search calibrates its starting temperature.
     PARAM T0_ACCEPT (default 0.05)
        The probability with which the calibrated starting temperature accepts a step up in loss: the temperature is the median rise of the loss over the probes divided by ln(1/T0_ACCEPT).
     PARAM T_COLD (default: T_HOT divided by LADDER_SPAN)
        The coldest temperature of the ladder; without it, T_HOT divided by LADDER_SPAN.
   * ladder:
     PARAM REPLICAS (default: AUTO, the larger of THREADS and 2) [accepts AUTO]
        The number of replicas, one for each temperature of the ladder; AUTO takes the larger of THREADS and 2.
     PARAM LADDER_SPAN (default 1000)
        The ratio of T_HOT to T_COLD from which an omitted T_COLD follows.
     PARAM LADDER_POWER (default 1)
        The shape of the first ladder: of K slots, slot k lies at the fraction (k/(K-1))^LADDER_POWER of the span of the logarithm of the temperature. 1 gives a geometric ladder.
     PARAM LADDER_ADAPT (default OFF)
        ON adapts the inner temperatures of the ladder towards the same swap acceptance for every pair of neighbours; the hottest and the coldest temperature stay. It needs 3 replicas or more.
     PARAM LADDER_ADAPT_EVERY (default 20)
        The number of swap attempts of each pair before each update of the ladder.
     PARAM LADDER_ADAPT_GAIN (default 1)
        The first gain of the update of the ladder, a stochastic approximation.
     PARAM LADDER_ADAPT_DECAY (default 0.6)
        The exponent with which the gain of the ladder update falls: the gain of update u is LADDER_ADAPT_GAIN times u to the power -LADDER_ADAPT_DECAY.
     PARAM LADDER_MIN_GAP (default 0.1)
        The smallest gap between neighbouring temperatures of the ladder, in their logarithm, as a fraction of the mean gap; 0 sets no smallest gap.
     PARAM LADDER_FREEZE (default ON)
        ON stops the adaptation of the ladder once the swap acceptances of the pairs cannot be told apart statistically from equal ones.
   * swaps:
     PARAM SWAP_EVERY (default 1)
        The number of epochs between two rounds of swap attempts; 1 attempts swaps in every epoch.
     PARAM SWAP_WINDOW (default 20) [accepts OFF]
        The number of epochs of a window of the swap diagnostics in hpo_run.log: the tables of a window, the reports of the steps and the summaries of the epochs. OFF writes cumulative tables only.
   * steps:
     PARAM CORANA (default OFF)
        Selects the proposal kernel: ON takes Corana's adaptive steps, one coordinate at a time with a step for each dimension; OFF takes the CLASSIC kernel, which moves every coordinate at once.
     PARAM STEP_FRAC (default 0.1)
        The first proposal scale of each dimension, as a fraction of the width of its OPTIM box.
     PARAM NS (default 20)
        Corana kernel: the number of cycles through the dimensions between two adjustments of the steps. Under TADAH:ANNEAL_PT, the number of sweeps between two adjustments of the steps of a slot.
     PARAM CORANA_C (default 2)
        Corana kernel: the gain of the step adjustment, which lengthens the step of a dimension whose acceptance ratio is above 0.6 and shortens one below 0.4.
     PARAM V_FLOOR_FRAC (default 0.001)
        Corana kernel: the smallest step of each dimension, as a fraction of the width of its OPTIM box.
     PARAM BOUNDARY_MODE <REFLECT|REDRAW> (default REFLECT)
        What a proposal outside the OPTIM box becomes: REFLECT folds it back into the box as a mirror does; REDRAW draws each coordinate outside the box again.
     PARAM RESET_TO_BEST (default OFF)
        ON moves the chain back to the best point so far after each cooling step; under TADAH:ANNEAL_PT it moves the coldest slot after each epoch.
     PARAM STEP_MODE <FIXED|FROZEN|ADAPTIVE> (default FROZEN)
        How the CLASSIC kernel sets its steps: FIXED keeps the scales STEP_FRAC gives; FROZEN calibrates the scales of each slot, then keeps them; ADAPTIVE calibrates them and keeps adapting them, a diagonal form of robust adaptive Metropolis.
     PARAM STEP_WARMUP_SWEEPS (default 12)
        The smallest number of calibration attempts of each coordinate in the warm-up of the steps; the largest is twice this number.
     PARAM STEP_TRUST_FACTOR (default 64) [accepts OFF]
        Under STEP_MODE ADAPTIVE, keeps each adapted scale between the calibrated scale divided by this factor and multiplied by it; OFF sets no bound.
   * init:
     PARAM INIT_MODE <JITTER|UNIFORM> (default JITTER)
        How the replicas or walkers start: the first at the starting point of the search; JITTER moves the others away from it, UNIFORM draws them from the OPTIM box.
        JITTER alone draws Gaussian displacements with the first proposal scales, and JITTER <fraction> uniform displacements of up to the fraction times the width of each box. Under TADAH:ANNEAL_PT, JITTER AUTO <p> measures the bounds of the uniform displacements of each dimension against a band of the loss relative to that of the starting point, and scales them by INIT_JITTER_LADDER, which scales the other JITTER forms too. Under TADAH:ANNEAL_PA, JITTER AUTO takes no tolerance: the bounds are the first proposal scales.
     PARAM INIT_JITTER_MAX (default 0.5)
        Under INIT_MODE JITTER AUTO of TADAH:ANNEAL_PT, the largest measured displacement, as a fraction of the width of the OPTIM box, where the first probe lies too.
     PARAM INIT_JITTER_PROBES (default 8)
        Under INIT_MODE JITTER AUTO of TADAH:ANNEAL_PT, the largest number of probes of the loss in each dimension, split between its two sides.
     PARAM INIT_JITTER_MAXEVAL (default AUTO) [accepts AUTO]
        Under INIT_MODE JITTER AUTO of TADAH:ANNEAL_PT, the largest number of calibration probes, which MAXEVAL does not count.
        AUTO takes the number of measured dimensions times INIT_JITTER_PROBES, plus the smaller of INIT_JITTER_AUDIT and the number of measured dimensions; INIT_JITTER_SAMPLE limits the measured dimensions.
     PARAM INIT_JITTER_MAXTIME_FRAC (default 0.25)
        Under INIT_MODE JITTER AUTO of TADAH:ANNEAL_PT, the share of the MAXTIME of the search that the calibration may take, when MAXTIME is set; INIT_JITTER_MAXEVAL caps its probes, which have a budget of their own.
     PARAM INIT_JITTER_SAMPLE (default 0)
        Under INIT_MODE JITTER AUTO of TADAH:ANNEAL_PT, the largest number of dimensions measured, taken in turn from the families of parameters; 0 measures every dimension.
        A dimension that is not measured takes the median displacement of its family, as a fraction of the width, and hpo_run.log marks it inferred.
     PARAM INIT_JITTER_AUDIT (default 32)
        Under INIT_MODE JITTER AUTO of TADAH:ANNEAL_PT, the largest number of measured dimensions probed again at half their displacement, to check the measured displacements for a loss that does not grow with the displacement; 0 checks none.
     PARAM INIT_JITTER_LADDER (default AUTO) [accepts AUTO/OFF]
        Scales the first displacement of each replica of TADAH:ANNEAL_PT by (T_k/T_HOT)^gamma, so that cold replicas start near the starting point and hot ones farther away. AUTO takes gamma 0.5, OFF gives every replica the same displacement, and a number above 0 and up to 4 is gamma.
        AUTO follows the equipartition law: about a quadratic minimum, the spread of a coordinate at equilibrium grows as the square root of the temperature; its displacements are at least the smallest change of a coordinate that the number format resolves. The scaling applies to every JITTER form of INIT_MODE, AUTO included.
   * stopping:
     PARAM NEPS (default 4)
        The length of the history of the FTOL_REL and FTOL_ABS stop, which has an effect only with one of them.
        TADAH:ANNEAL compares the loss at the end of a temperature step with the losses at the end of this many earlier steps and with the best loss; TADAH:ANNEAL_PA applies the same rule to the lowest loss of the population after each temperature step; TADAH:ANNEAL_PT counts the successive diagnostics windows without a significant improvement of the best loss.
"""

[[optimizer]]
lib = "TADAH"
algo = "GRID"
status = "registered"
row_text = "global, derivative-free"
global = true
gradient_based = false
accepts_inner = false
default_inner = ""
accepts_multi_seed = false
reads = []
algorithm_params = []
stops = ["MAXEVAL", "MAXTIME", "STOPVAL"]
needs_stop = false
stop_note = ""
ignores_forced_stop = false
tolerance_note = ""
untested_tolerance_note = "the grid search has no convergence test to apply it to"
step_use = "grid_count"
step_use_text = "grid point count (use PARAM GRID_POINTS)"
step_consumed = false
step_note = "STEP is not the grid resolution; use PARAM GRID_POINTS <n> (integer >= 2, default 20 points per dimension)"
starts_at_x0 = true
start_note = ""
random_draws = "not_recorded"
ignores_bounds = false
bounds_note = ""
explain_text = """
Options for TADAH:GRID
   * PARAM GRID_POINTS <int>  (default 20 points per dimension;
     spacing = width/(n-1); total cost = n^d in d dimensions).
     STEP and any other PARAM are rejected. The INIT point, then
     the grid in order.
   * Stops that end a run: MAXEVAL, MAXTIME, STOPVAL
"""

