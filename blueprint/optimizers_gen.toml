ignores_bounds = false
bounds_note = ""
explain_text = """
Options for NLOPT:G_MLSL
   * Stops that end a run: MAXEVAL, MAXTIME, STOPVAL
     One of them is required, or a RESTART block: MLSL's multistart loop has no convergence test (the tolerances reach only its local searches) and runs until it is interrupted.
   * PARAM: NLopt reads no PARAM key of this algorithm
   * global optimiser
   * STEP <double>  initial step; consumption: passed to the optimiser of the INNER block
     passed to the local optimiser of the INNER block; a STEP of the enclosing block replaces the STEP of the INNER block; with neither STEP set, an INNER LN_BOBYQA or LN_COBYLA takes 0.25 of the width of each search parameter
   * INNER ... ENDINNER: the local search it runs, from the points it
     samples in the OPTIM box: LIB NLOPT and a local ALGO; a global one
     (`tadah explain ALGO` marks each) is refused, and so is one that needs
     an INNER block of its own. The block is required: NLopt has no default
     local optimiser for it.
"""

