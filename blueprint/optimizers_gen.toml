accepts_multi_seed = false
reads = ["POPULATION", "SEED"]
warns_unread_seed = false
stops = ["MAXEVAL", "MAXTIME", "STOPVAL", "FTOL_REL", "FTOL_ABS"]
needs_stop = false
stop_note = ""
ignores_forced_stop = false
tolerance_note = ""
untested_tolerance_note = ""
step_use = "width_fraction"
step_use_text = "family-owned width fraction (PARAM STEP_FRAC)"
step_consumed = false
step_note = "set PARAM STEP_FRAC (and PARAM STEP_MODE for ANNEAL_PT) instead"
starts_at_x0 = true
start_note = ""
random_draws = "not_recorded"
ignores_bounds = false
bounds_note = ""
explain_text = """
Options for TADAH:ANNEAL_PA
   * Population annealing over the ANNEAL stepper (classic by
     default, PARAM CORANA ON for the adaptive variant). R walkers
     anneal from T_HOT to T_MIN; each temperature step reweights by
     exp(-dbeta*f), resamples (systematic; FAILSCORE walkers receive zero
     weight when at least one feasible walker exists; all-fail skips
     resampling and continues geometric cooling), then every walker runs
     SWEEPS rungs at the new T. Same SEED => same evaluated set for any
     THREADS.
   * POPULATION <R> population size (default 4*THREADS, min 16).
   * V is walker state (children inherit the parent's step calibration
     on resample). Per-step journal line: T, ESS, unique parents,
     culled, finite field (feasible fraction), population best.
   * temperature:
     PARAM T_HOT (default auto)
        Hottest ladder temperature (PT) / starting temperature (PA); when set, the T0 calibration probes are skipped.
     PARAM T_MIN (default auto)
        Stop temperature of the cooling schedule; unset derives T0 * 1e-6.
     PARAM RT (default 0.9)
        Geometric cooling ratio per temperature rung (Corana 1987 r_T = 0.85). ANNEAL_PT uses a ladder with fixed endpoints and optional interior adaptation; it rejects RT.
     PARAM T0_PROBES (default 20)
        Local probes used by the automatic T0 calibration.
     PARAM T0_ACCEPT (default 0.05)
        Target initial uphill-acceptance probability: T0 = median(uphill dE) / ln(1/T0_ACCEPT).
     PARAM ESS_TARGET (default 0.5) [accepts OFF]
        Adaptive temperature-step target for the effective sample size; OFF selects the geometric RT schedule.
   * steps:
     PARAM CORANA (default 0)
        Kernel selection: ON uses Corana per-dimension adaptive steps; OFF uses whole-vector CLASSIC proposals.
     PARAM STEP_FRAC (default 0.1)
        Initial proposal scale per dimension as a fraction of the OPTIM interval width.
     PARAM CHAIN_LENGTH (default 50)
        CLASSIC kernel: whole-vector proposals per temperature rung. Serial default AUTO: the MAXEVAL budget spread evenly over the cooling schedule (written to the journal).
     PARAM NS (default 20)
        Corana kernel: step-variation cycles per step adjustment (Corana 1987 NS = 20). ANNEAL_PT: sweeps between per-slot step adjustments.
     PARAM NT (default 5)
        Corana kernel: step-adjustment cycles per temperature rung. Serial default AUTO: budget-derived, capped at the Corana 1987 value max(100, 5n).
     PARAM CORANA_C (default 2)
        Corana kernel: step-adjustment gain in the 0.4/0.6 acceptance-ratio rule (Corana 1987 c = 2).
     PARAM V_FLOOR_FRAC (default 0.001)
        Corana kernel: lower clamp on the per-dimension step as a fraction of the OPTIM interval width.
     PARAM BOUNDARY_MODE <REFLECT|REDRAW> (default REFLECT)
        Out-of-box proposal handling: REFLECT = exact mirror fold; REDRAW = resample the offending coordinate.
     PARAM RESET_TO_BEST (default auto)
        Snap the chain back to the best-so-far point after each cooling step (PT: coldest slot only, after each epoch).
     PARAM SWEEPS (default 1)
        Rungs per walker per temperature step.
   * init:
     PARAM INIT_MODE <JITTER|UNIFORM> (default JITTER)
        Slot 1 starts at the seed. Other slots: JITTER uses Gaussian displacements with the initial proposal scales; JITTER <fraction> uses uniform displacements on +/-fraction*width; UNIFORM draws from the OPTIM box. ANNEAL_PT JITTER AUTO <p> measures per-dimension uniform bounds against a seed-relative loss band, then applies INIT_JITTER_LADDER scaling. ANNEAL_PA JITTER AUTO <p> uses the initial proposal scales as uniform bounds; p and the calibration controls are inactive. INIT_JITTER_LADDER also scales the other PT JITTER forms.
     PARAM INIT_JITTER_MAX (default 0.5)
        ANNEAL_PT INIT_MODE JITTER AUTO: cap on the measured sigma as a fraction of the OPTIM interval; also the screen probe point. ANNEAL_PA accepts it and does not use it.
     PARAM INIT_JITTER_PROBES (default 8)
        ANNEAL_PT INIT_MODE JITTER AUTO: maximum objective probes per dimension, split between the two sides. ANNEAL_PA accepts it and does not use it.
     PARAM INIT_JITTER_MAXEVAL (default AUTO) [accepts AUTO]
        ANNEAL_PT INIT_MODE JITTER AUTO: hard cap on calibration probes. AUTO resolves to measured_dimensions * INIT_JITTER_PROBES + min(INIT_JITTER_AUDIT, measured_dimensions), where INIT_JITTER_SAMPLE limits the measured dimensions. These probes are outside MAXEVAL. ANNEAL_PA accepts it and does not use it.
     PARAM INIT_JITTER_MAXTIME_FRAC (default 0.25)
        ANNEAL_PT INIT_MODE JITTER AUTO: share of the search's MAXTIME available to calibration when MAXTIME is set. INIT_JITTER_MAXEVAL separately caps the calibration probes, which use their own budget. ANNEAL_PA accepts it and does not use it.
     PARAM INIT_JITTER_SAMPLE (default 0)
        ANNEAL_PT INIT_MODE JITTER AUTO measures at most this many dimensions, chosen round-robin across parameter families; the rest inherit their family's median sigma/width and are flagged `inferred`. 0 = measure every dimension. ANNEAL_PA accepts it and does not use it.
     PARAM INIT_JITTER_AUDIT (default 32)
        ANNEAL_PT INIT_MODE JITTER AUTO re-probes at most this many measured dimensions at sigma/2 to detect a loss that is non-monotone in displacement. The audit assesses the sampled displacements. 0 = no audit. ANNEAL_PA accepts it and does not use it.
   * stopping:
     PARAM NEPS (default 4)
        FTOL stopping history. ANNEAL compares the current rung-end loss with this many previous rung-end losses and the running best. ANNEAL_PA applies that rule to the current population minimum after each temperature step. ANNEAL_PT counts consecutive diagnostics windows without a significant global-best improvement. Requires an active FTOL_REL or FTOL_ABS to affect stopping.
"""

