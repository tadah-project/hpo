[[optimizer]]
lib = "NLOPT"
algo = "LN_NEWUOA_BOUND"
status = "refused"
reason = "NLopt 2.10 plans each LN_NEWUOA_BOUND step with a nested LD_MMA run that has no time limit and sees no stop request. Once a non-finite value reaches its model, each step takes about 10-60 s without evaluating the loss. Such a value reaches it after every stop tadah hpo makes through the objective (a signal, a RESTART stagnation stop, an error that ends the run) from a run's (2n+1)-th evaluation on, the last of NEWUOA's starting points for n OPTIM dimensions, as the objective then returns HUGE_VAL, NLopt's convention for a forced stop. It reaches it too when the loss barely changes over the trust region. Ctrl-C, SIGTERM, MAXTIME and RESTART wait that long. The recommended replacement is NLOPT:LN_BOBYQA, Powell's bound-constrained successor of NEWUOA (its STEP rescales each dimension instead of setting one radius)"
