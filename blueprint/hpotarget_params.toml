  { msg = "{phase}: ASA:ASA: PARAM {key} must be >= {min}", doc = "For a value below 0, written with six decimals." },
  { msg = "{phase}: ASA:ASA: PARAM {key} must be > 0", doc = "For 0, as the value of every dimension or of one." },
  { msg = "{phase} ASA:ASA: ASA's finite-difference probes -- the reannealing and exit tangents at (1 + Delta) x, or (1 - Delta) x when that lies outside the box{note} -- would be evaluated outside the OPTIM box of these dimensions:{list}\n  Lower the Delta{why}.", doc = "At startup: a probe falls outside the OPTIM box of a dimension. {note} adds the probes of the exit curvature when Curvature_0 is 0 or -1, and {list} has a line for each such dimension, with the largest Delta that fits it. {why} adds, under OPTIM_SCALE NONE, the limits of OPTIM_SCALE AUTO." },
]
examples = [
  { wrap = "params_asa", text = "PARAM User_Delta_Parameter 1e-4" },
