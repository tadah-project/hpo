# ---------------------------------------------------- policies ----
# What each optimiser does with a PARAM key that no [[param]] entry below
# names for it.

[[param_policy]]
id = "PARAM.NLOPT"
optimizers = ["NLOPT"]
msg = "{phase}: NLOPT:{algo}: unknown PARAM '{key}' (it takes {keys})"
doc = """\
An NLopt algorithm takes, with a number, the PARAM keys NLopt reads for it \
(the optimiser list names them: tolg of LD_LBFGS, magic_eps of the \
GN_DIRECT algorithms), which tadah hpo passes to NLopt, and, when it \
takes finite-difference gradients, the finite-difference keys fd_step, \
fd_kernel (a word) and diff_method. Any other name, and a word given to a \
key NLopt reads, are refused when tadah hpo starts; the refusal lists the \
keys the algorithm takes."""
checks = [
  { msg = "{phase}: NLOPT:{algo}: PARAM {key} takes a number (got '{value}')", doc = "At startup, at the END line of its optimiser: a word given to a PARAM key the algorithm reads." },
]
examples = [
  { wrap = "params_lbfgs", text = "PARAM tolg 1e-8" },
]
invalid = [
  { wrap = "strategy", check = "startup", at = "ENDOPTIMIZER", text = "PARAM magic_eps 1e-4", error = "the STRATEGY-level optimiser: NLOPT:LN_SBPLX: unknown PARAM 'magic_eps' (it takes none)", doc = "LN_SBPLX reads no PARAM key; magic_eps is read by the DIRECT algorithms." },
  { wrap = "params_lbfgs", check = "startup", at = "ENDOPTIMIZER", text = "PARAM magic_eps 1e-4", error = "the STRATEGY-level optimiser: NLOPT:LD_LBFGS: unknown PARAM 'magic_eps' (it takes tolg, fd_step, fd_kernel and diff_method)" },
  { wrap = "params_lbfgs", check = "startup", at = "ENDOPTIMIZER", text = "PARAM tolg tight", error = "the STRATEGY-level optimiser: NLOPT:LD_LBFGS: PARAM tolg takes a number (got 'tight')" },
  { wrap = "inner", check = "startup", at = "ENDINNER", text = "PARAM tolg 1e-8", error = "the INNER block of the STRATEGY-level optimiser: NLOPT:LN_BOBYQA: unknown PARAM 'tolg' (it takes none)" },
]

[[param_policy]]
id = "PARAM.TADAH:RANDOM"
optimizers = ["TADAH:RANDOM"]
msg = "{phase}: TADAH:RANDOM: unknown PARAM '{key}' (it takes none)"
doc = "TADAH:RANDOM takes no PARAM key: each one is refused when tadah hpo starts."
invalid = [
