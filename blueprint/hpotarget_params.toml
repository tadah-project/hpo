[[param]]
id = "PARAM.ASA:ASA.Temperature_Ratio_Scale"
name = "Temperature_Ratio_Scale"
optimizers = ["ASA:ASA"]
args = [{ name = "value", kind = "number", min = 0, min_open = true }]
default = { literal = "1e-5" }
doc = """\
The main control of the annealing rate, through m = \
-ln(Temperature_Ratio_Scale); above 0."""
long_doc = """\
The temperature of dimension i falls as T(k) = T0 exp(-c k^(1/D)) with the \
number k of generated states, D the number of dimensions and c = m \
exp(-n/D). Here m = -ln(Temperature_Ratio_Scale), n = \
ln(Temperature_Anneal_Scale), and User_Temperature_Ratio multiplies m for \
each dimension."""
checks = [
  { msg = "{phase}: ASA:ASA: PARAM {key} must be >= {min}", doc = "For a value below 0, written with six decimals." },
  { msg = "{phase}: ASA:ASA: PARAM Temperature_Ratio_Scale must be > 0", doc = "For a value of 0." },
]
examples = [
