DLIB:BFGS takes the PARAM keys fd_step, fd_kernel, diff_method and \
tol_gradinf: any other name, and a word given to tol_gradinf, are refused \
when tadah hpo starts."""
checks = [
  { msg = "{phase}: DLIB:BFGS: PARAM {key} takes a number (got '{value}')", doc = "At startup, at the END line of its optimiser: a word given to tol_gradinf." },
]
invalid = [
  { wrap = "params_bfgs", check = "startup", at = "ENDOPTIMIZER", text = "PARAM max_iter 50", error = "the STRATEGY-level optimiser: DLIB:BFGS does not support PARAM max_iter; supported PARAM keys are fd_step, fd_kernel, diff_method and tol_gradinf" },
