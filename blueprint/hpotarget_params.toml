[[param]]
id = "PARAM.ASA:ASA.User_Delta_Parameter"
name = "User_Delta_Parameter"
optimizers = ["ASA:ASA"]
indexed = true
args = [{ name = "value", kind = "number", min = 0, min_open = true }]
default = { text = "the value of Delta_X" }
doc = """\
The finite-difference step of the tangents in each dimension; above 0."""
