[[param]]
id = "PARAM.ASA:ASA.Delta_X"
name = "Delta_X"
optimizers = ["ASA:ASA"]
args = [{ name = "value", kind = "number", min = 0 }]
default = { literal = "0.001" }
doc = """\
The relative step of the finite differences of the tangents: ASA probes at \
(1 + Delta_X) x, x in the coordinates of the search. 0 switches the \
tangents off."""
long_doc = """\
ASA's finite-difference probes stay inside the OPTIM box, whatever \
Reanneal_Parameters is: at startup a Delta whose probes leave the box of \
a dimension is refused. Under OPTIM_SCALE AUTO that holds up to 1, and up \
to 0.5 when Curvature_0 is 0 or -1; under NONE the limit depends on each \
box."""
checks = [
  { msg = "{phase}: ASA:ASA: PARAM {key} must be >= {min}", doc = "For a value below 0, written with six decimals." },
  { msg = "{phase} ASA:ASA: ASA's finite-difference probes -- the reannealing and exit tangents at (1 + Delta) x, or (1 - Delta) x when that lies outside the box{note} -- would be evaluated outside the OPTIM box of these dimensions:{list}\n  Lower the Delta{why}.", doc = "At startup: a probe falls outside the OPTIM box of a dimension. {note} adds the probes of the exit curvature when Curvature_0 is 0 or -1, and {list} has a line for each such dimension, with the largest Delta that fits it. {why} adds, under OPTIM_SCALE NONE, the limits of OPTIM_SCALE AUTO." },
]
examples = [
  { wrap = "params_asa", text = "PARAM Delta_X 1e-4" },
]
invalid = [
  { wrap = "params_asa", check = "startup", at = "ENDOPTIMIZER", text = "PARAM Delta_X -1", error = "the STRATEGY-level optimiser: ASA:ASA: PARAM Delta_X must be >= 0.000000" },
