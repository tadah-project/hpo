]

# ---------------------------------------------- finite differences ----
# Read by every search that takes finite-difference gradients, whatever its
# optimiser; refused by every other search.

[[param]]
id = "PARAM.FD.fd_step"
name = "fd_step"
optimizers = ["*"]
args = [{ name = "step", kind = "number", min = 0, min_open = true }]
default = { literal = "1e-6" }
doc = """\
The step of the finite differences of the gradient, above 0. It is read by \
a search that takes finite-difference gradients and refused by any other."""
long_doc = """\
A search takes finite-difference gradients when its optimiser asks for \
gradients (a gradient-based one, or an NLopt MLSL or AUGLAG whose local \
search is gradient-based) under GRAD_STRATEGY NUMERICAL, the default, or \
HYBRID. PARAM fd_kernel says how the step is applied. Without the key, the \
AUTO of a NOISE block derives the step from the size of the search space. \
An INNER block refuses the key: its search takes the gradient of the \
enclosing block. No finite-difference point is evaluated outside the \
OPTIM box, and the step is not shrunk: at startup every point of every \
box has a stencil inside the box, or the step is refused. Under \
OPTIM_SCALE AUTO that holds up to fd_step 1/3 for central differences and \
1/2 for forward ones with fd_kernel inhouse, and up to 1/2 and 1 with \
fd_kernel ceres; under NONE the limit depends on each box."""
checks = [
  { msg = "{phase} {lib}:{algo}: PARAM fd_step must be a positive finite number (got {value})", doc = "For a number of 0 or below, written with up to ten significant digits, or a word, written in quotes." },
  { msg = "{phase} {lib}:{algo}: PARAM fd_step never takes effect: {why}; remove it.", doc = "In a search that takes no finite-difference gradients; with more keys of the finite differences, the message names them all." },
  { msg = "{phase} {lib}:{algo}: PARAM fd_step never takes effect: an INNER search takes the gradient of the block it runs in, with that block's finite-difference settings; set it in the enclosing block.", doc = "In an INNER block." },
  { msg = "{phase} {lib}:{algo}: NOISE AUTO has no effect: PARAM fd_step {value} is set; remove one of them.", doc = "When the OPTIMIZER block also has a NOISE block with AUTO." },
  { msg = "{phase} {lib}:{algo}: {value} does not fit these OPTIM boxes: no finite-difference point is evaluated outside the box, and next to a bound the {why} inside it; the step is not shrunk:{list}\n  {note}.", doc = "The step does not give every point of a box a stencil inside it. {value} is PARAM fd_step <v>, the default fd_step <v>, or fd_step <v>, derived by the NOISE block's AUTO from the box diagonal. {why} says how many steps the stencil takes, {list} has a line for each such box with the largest fd_step that fits it, and {note} says what to change." },
  { msg = "{phase} {lib}:{algo}: PARAM {list} never take effect: {why}; remove them.", doc = "In a search that takes no finite-difference gradients, with two or more of fd_step, fd_kernel and diff_method; {list} names them." },
]
examples = [
  { wrap = "params_lbfgs", text = "PARAM fd_step 1e-4" },
  { wrap = "params_bfgs", text = "PARAM fd_step 1e-5", doc = "The step of DLIB:BFGS." },
  { wrap = "params_ceres", text = "PARAM fd_step 1e-5", doc = "The step of CERES:STEEPEST_DESCENT." },
]
invalid = [
  { wrap = "params_lbfgs", check = "startup", at = "ENDOPTIMIZER", text = "PARAM fd_step 0", error = "the STRATEGY-level optimiser NLOPT:LD_LBFGS: PARAM fd_step must be a positive finite number (got 0)" },
  { wrap = "params_lbfgs", check = "startup", at = "ENDOPTIMIZER", text = "PARAM fd_step small", error = "the STRATEGY-level optimiser NLOPT:LD_LBFGS: PARAM fd_step must be a positive finite number (got 'small')" },
  { wrap = "params_lbfgs", text = "PARAM fd_step 1e999", error = "PARAM fd_step must be a finite number, got '1e999'", doc = "Refused when the file is read, as any PARAM value shaped like a number that is not finite." },
  { wrap = "params_lbfgs", check = "startup", at = "ENDOPTIMIZER", text = "PARAM fd_step 0.34", error = "the STRATEGY-level optimiser NLOPT:LD_LBFGS: PARAM fd_step 0.34 does not fit these OPTIM boxes: no finite-difference point is evaluated outside the box, and next to a bound the CENTRAL stencil turns one-sided and needs two steps of h = 0.34 of each box width (in-house rule) inside it; the step is not shrunk:\n  - CGRID2B[1]: OPTIM box [0.5, 1.5] (internal [0, 1]); no stencil fits at CGRID2B[1] = 0.83; fd_step up to 0.333333 fits it\n  Set PARAM fd_step to at most 0.333333.", doc = "Above 1/3 under OPTIM_SCALE AUTO, central differences and fd_kernel inhouse." },
  { wrap = "strategy", check = "startup", at = "ENDOPTIMIZER", text = "PARAM fd_step 1e-3", error = "the STRATEGY-level optimiser NLOPT:LN_SBPLX: PARAM fd_step never takes effect: NLOPT:LN_SBPLX takes no gradient; remove it." },
  { wrap = "params_lbfgs", check = "startup", at = "ENDOPTIMIZER", text = "GRAD_STRATEGY ANALYTICAL\nPARAM fd_step 1e-3", error = "the STRATEGY-level optimiser NLOPT:LD_LBFGS: PARAM fd_step never takes effect: GRAD_STRATEGY ANALYTICAL takes no finite differences; remove it." },
  { wrap = "strategy", check = "startup", at = "ENDOPTIMIZER", text = "PARAM fd_step 1e-3\nPARAM diff_method 1", error = "the STRATEGY-level optimiser NLOPT:LN_SBPLX: PARAM fd_step and diff_method never take effect: NLOPT:LN_SBPLX takes no gradient; remove them." },
  { wrap = "inner", check = "startup", at = "ENDINNER", text = "PARAM fd_step 1e-3", error = "the INNER block of the STRATEGY-level optimiser NLOPT:LN_BOBYQA: PARAM fd_step never takes effect: an INNER search takes the gradient of the block it runs in, with that block's finite-difference settings; set it in the enclosing block." },
  { wrap = "none", check = "startup", at = "ENDOPTIMIZER", text = "OPTIM CGRID2B (1) 0.5 1.5\nPC_ERMSE 0 1\nOPTIMIZER\nNOISE\nAUTO\nENDNOISE\nSTRATEGY\nLIB NLOPT\nALGO LD_LBFGS\nMAXEVAL 10\nPARAM fd_step 1e-3\nENDSTRATEGY\nENDOPTIMIZER", error = "the STRATEGY-level optimiser NLOPT:LD_LBFGS: NOISE AUTO has no effect: PARAM fd_step 0.001 is set; remove one of them." },
]

[[param]]
id = "PARAM.FD.fd_kernel"
name = "fd_kernel"
optimizers = ["*"]
args = [{ name = "rule", kind = "word", words = ["inhouse", "INHOUSE", "ceres", "CERES"] }]
default = { text = "inhouse; ceres under OPTIM_SCALE NONE with GRAD_STRATEGY NUMERICAL" }
doc = """\
How the step of the finite differences is applied to the coordinate u the \
optimiser iterates on: inhouse takes fd_step times max(|u|, 1), ceres takes \
the larger of 2^-26 and |u| times fd_step."""
long_doc = """\
The key is read where PARAM fd_step is read, and refused where it is \
refused."""
quirk = "The words are written all in lower case or all in upper case: Ceres or Inhouse is refused."
checks = [
  { msg = "{phase} {lib}:{algo}: PARAM fd_kernel must be inhouse or ceres (got '{value}')", doc = "For another word." },
  { msg = "{phase} {lib}:{algo}: PARAM fd_kernel must be inhouse or ceres (got {value})", doc = "For a number, written with up to ten significant digits." },
  { msg = "{phase} {lib}:{algo}: PARAM fd_kernel never takes effect: {why}; remove it.", doc = "In a search that takes no finite-difference gradients; with more keys of the finite differences, the message names them all." },
  { msg = "{phase} {lib}:{algo}: PARAM fd_kernel never takes effect: an INNER search takes the gradient of the block it runs in, with that block's finite-difference settings; set it in the enclosing block.", doc = "In an INNER block." },
]
examples = [
  { wrap = "params_lbfgs", text = "PARAM fd_kernel ceres" },
  { wrap = "params_bfgs", text = "PARAM fd_kernel INHOUSE", doc = "The word in upper case, for DLIB:BFGS." },
]
invalid = [
  { wrap = "params_lbfgs", check = "startup", at = "ENDOPTIMIZER", text = "PARAM fd_kernel Ceres", error = "the STRATEGY-level optimiser NLOPT:LD_LBFGS: PARAM fd_kernel must be inhouse or ceres (got 'Ceres')" },
  { wrap = "params_lbfgs", check = "startup", at = "ENDOPTIMIZER", text = "PARAM fd_kernel 1", error = "the STRATEGY-level optimiser NLOPT:LD_LBFGS: PARAM fd_kernel must be inhouse or ceres (got 1)" },
  { wrap = "strategy", check = "startup", at = "ENDOPTIMIZER", text = "PARAM fd_kernel ceres", error = "the STRATEGY-level optimiser NLOPT:LN_SBPLX: PARAM fd_kernel never takes effect: NLOPT:LN_SBPLX takes no gradient; remove it." },
  { wrap = "inner", check = "startup", at = "ENDINNER", text = "PARAM fd_kernel inhouse", error = "the INNER block of the STRATEGY-level optimiser NLOPT:LN_BOBYQA: PARAM fd_kernel never takes effect: an INNER search takes the gradient of the block it runs in, with that block's finite-difference settings; set it in the enclosing block." },
]

[[param]]
id = "PARAM.FD.diff_method"
name = "diff_method"
optimizers = ["*"]
args = [{ name = "scheme", kind = "number", min = 0, max = 1, integral = true }]
default = { literal = "0" }
doc = """\
The scheme of the finite differences: 0 takes central differences, 1 \
forward differences."""
long_doc = """\
Near a bound of the OPTIM range, a difference is taken towards the side \
with room, so that no point leaves the range. The key is read where PARAM \
fd_step is read, and refused where it is refused."""
checks = [
  { msg = "{phase} {lib}:{algo}: PARAM diff_method must be 0 (CENTRAL, the default) or 1 (FORWARD) (got {value})", doc = "For another number, written with up to ten significant digits, or a word, written in quotes." },
  { msg = "{phase} {lib}:{algo}: PARAM diff_method 2 (RIDDERS) is refused: Ridders' extrapolation ignored PARAM fd_step, started from a step of 0.32 x max(|u|, 1) -- outside most OPTIM boxes -- and took up to 20 evaluations per parameter; use diff_method 0 (CENTRAL, the default) or 1 (FORWARD)", doc = "For 2." },
  { msg = "{phase} {lib}:{algo}: PARAM diff_method never takes effect: {why}; remove it.", doc = "In a search that takes no finite-difference gradients; with more keys of the finite differences, the message names them all." },
  { msg = "{phase} {lib}:{algo}: PARAM diff_method never takes effect: an INNER search takes the gradient of the block it runs in, with that block's finite-difference settings; set it in the enclosing block.", doc = "In an INNER block." },
