[[param_policy]]
id = "PARAM.DLIB:BFGS"
optimizers = ["DLIB:BFGS"]
msg = "{phase}: DLIB:BFGS does not support PARAM {key}; supported PARAM keys are fd_step, fd_kernel, diff_method and tol_gradinf"
