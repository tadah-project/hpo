# Part of the target-file registry (hpotarget.toml lists it in meta.parts):
# the PARAM keys of the optimisers.
#
# This file holds the PARAM keys each optimiser reads (TADAH:GRID,
# DLIB:BFGS, the CERES algorithms, ASA:ASA), the finite-difference PARAM
# keys every gradient phase reads, what an NLopt algorithm does with a
# PARAM, and the ASA options that are not available. The PARAM keys of
# the annealers (TADAH:ANNEAL, ANNEAL_PT, ANNEAL_PA) are those of
# anneal_keys.toml, which hpotarget.toml names in meta.anneal_keys. The
# tables and fields are those of blueprint/README.md ("The target-file
# registry").
#
# A PARAM line is read when the file is read: its value is a number (a
# finite one) or a word. The optimiser checks its PARAM keys when tadah hpo
# starts, before any data is loaded, for every search the file runs (the
# STRATEGY-level optimiser, each MULTISTART start, the PRESTAGE exploration
# and refinement, an INNER block). Such a refusal names the search and is
# framed at the line that closes its block: ENDOPTIMIZER for the
# STRATEGY-level optimiser, ENDEXPLORE, ENDINNER. Its examples therefore
# have check = "startup" and at = the END line.

# ------------------------------------------------------------ wrappers ----
# Complete target files whose slot is inside the STRATEGY block, after the
# LIB, ALGO and MAXEVAL of the optimiser the wrapper is named after.

[wrapper.params_grid]
block = "STRATEGY"
optimizer = "TADAH:GRID"
doc = "The slot is inside the STRATEGY block of a TADAH:GRID search, after its optimiser keys."
text = """
OPTIM CGRID2B (1) 0.5 1.5
PC_ERMSE 0 1
OPTIMIZER
STRATEGY
LIB TADAH
ALGO GRID
MAXEVAL 10
{line}
ENDSTRATEGY
ENDOPTIMIZER
"""

