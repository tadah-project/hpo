  { wrap = "params_asa", check = "startup", at = "ENDOPTIMIZER", text = "PARAM Limit_Acceptances[1] 500", error = "the STRATEGY-level optimiser: ASA:ASA: PARAM Limit_Acceptances is a scalar option (indexed form not accepted)" },
  { wrap = "params_asa", check = "startup", at = "ENDOPTIMIZER", text = "PARAM Multi_Grid[0] 0.01", error = "the STRATEGY-level optimiser: ASA:ASA: PARAM Multi_Grid[0] index 0 is not a dimension: per-dimension indices are 1-based and match the dim column of hpo_search_space.tsv. They were 0-based in Tadah 1.4 and earlier, so every old index shifts up by one ([0] is now [1])" },
