# ------------------------------------------------------------- TADAH:GRID ----

[[param]]
id = "PARAM.TADAH:GRID.GRID_POINTS"
name = "GRID_POINTS"
optimizers = ["TADAH:GRID"]
args = [{ name = "n", kind = "number", min = 2, max = "UINT_MAX", integral = true }]
default = { literal = "20" }
doc = """\
The number of grid points in each dimension, a whole number of at least 2. \
The points divide each OPTIM dimension into n - 1 equal steps in the \
coordinates of the search: the value for LIN, its logarithm for LOG, \
asinh(x/c) for ASINH."""
long_doc = """\
The grid has n to the power of the number of dimensions points, evaluated \
in order after the starting point. MAXEVAL counts the starting point too: \
a MAXEVAL below the number of evaluations stops the sweep after that \
many."""
checks = [
  { msg = "{phase}: TADAH:GRID PARAM GRID_POINTS must be an integer >= 2 (got {value}; a 1-point grid divides by zero)", doc = "For a number below 2, with a fraction or above 4294967295, written with six decimals." },
  { msg = "{phase}: TADAH:GRID PARAM GRID_POINTS must be an integer >= 2 (got '{value}')", doc = "For a word." },
]
examples = [
  { wrap = "params_grid", text = "PARAM GRID_POINTS 5" },
  { wrap = "none", doc = "A LOG box: the three points of the grid are 0.1, 1 and 10, equal steps in the logarithm.", text = "OPTIM CGRID2B (1) 0.1 10 LOG\nPC_ERMSE 0 1\nOPTIMIZER\nSTRATEGY\nLIB TADAH\nALGO GRID\nMAXEVAL 10\nPARAM GRID_POINTS 3\nENDSTRATEGY\nENDOPTIMIZER" },
]
invalid = [
  { wrap = "params_grid", check = "startup", at = "ENDOPTIMIZER", text = "PARAM GRID_POINTS 1", error = "the STRATEGY-level optimiser: TADAH:GRID PARAM GRID_POINTS must be an integer >= 2 (got 1.000000; a 1-point grid divides by zero)" },
  { wrap = "params_grid", check = "startup", at = "ENDOPTIMIZER", text = "PARAM GRID_POINTS 2.5", error = "the STRATEGY-level optimiser: TADAH:GRID PARAM GRID_POINTS must be an integer >= 2 (got 2.500000; a 1-point grid divides by zero)" },
  { wrap = "params_grid", check = "startup", at = "ENDOPTIMIZER", text = "PARAM GRID_POINTS AUTO", error = "the STRATEGY-level optimiser: TADAH:GRID PARAM GRID_POINTS must be an integer >= 2 (got 'AUTO')" },
]

# -------------------------------------------------------------- DLIB:BFGS ----

[[param]]
id = "PARAM.DLIB:BFGS.tol_gradinf"
name = "tol_gradinf"
optimizers = ["DLIB:BFGS"]
args = [{ name = "tolerance", kind = "number", min = 0, min_open = true }]
default = { text = "not set: the FTOL_ABS test ends the search, with 1e-7 when FTOL_ABS is not set", unchecked = "DLIB:BFGS takes the value when it starts; no setting of the target file holds it." }
doc = """\
The search ends once the largest component of the gradient, in absolute \
value, falls below this value, above 0, as under CERES. It replaces the \
FTOL_ABS test, and the two are not set together."""
checks = [
  { msg = "{phase}: DLIB:BFGS requires PARAM tol_gradinf > 0", doc = "For a value of 0 or below." },
  { msg = "{phase}: DLIB:BFGS accepts either FTOL_ABS or PARAM tol_gradinf, but not both", doc = "When the block also sets FTOL_ABS." },
]
examples = [
  { wrap = "params_bfgs", text = "PARAM tol_gradinf 1e-4" },
]
invalid = [
  { wrap = "params_bfgs", check = "startup", at = "ENDOPTIMIZER", text = "PARAM tol_gradinf 0", error = "the STRATEGY-level optimiser: DLIB:BFGS requires PARAM tol_gradinf > 0" },
  { wrap = "params_bfgs", check = "startup", at = "ENDOPTIMIZER", text = "FTOL_ABS 1e-6\nPARAM tol_gradinf 1e-4", error = "the STRATEGY-level optimiser: DLIB:BFGS accepts either FTOL_ABS or PARAM tol_gradinf, but not both" },
]

