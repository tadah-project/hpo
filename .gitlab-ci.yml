stages:
  - lint
  - build_debug
  - build_release
  - examples
  - release

cache:
  key: "build-cache-$CI_COMMIT_REF_SLUG"
  paths:
    - ${BUILD_DIR}

before_script:
  - mkdir -p ${DEBUG_DIR}
  - mkdir -p ${RELEASE_SHARED_DIR}
  - mkdir -p ${RELEASE_STATIC_DIR}
  - export OMP_NUM_THREADS=${CPU_SIM}

build_debug:
  stage: build_debug
  script:
    - cd ${DEBUG_DIR}
    - cmake ../.. -DCMAKE_CXX_FLAGS="-g -O1 -Wall -Wpedantic -pedantic-errors -Wextra --coverage"
        -DTADAH_ENABLE_OPENMP=ON -DBUILD_TESTING=ON
    - make -j ${CPU_BUILD}
    - make test
    - cd ..; gcovr -e '.*tests.*|.*lib.*|.*examples.*|build' -r .
  coverage: /^TOTAL.*\s+(\d+\%)$/

build_release_shared:
  stage: build_release
  script:
    - cd ${RELEASE_SHARED_DIR}
    - cmake ../.. -DCMAKE_BUILD_TYPE=Release -DTADAH_ENABLE_OPENMP=ON
        -DCMAKE_INSTALL_PREFIX=${INSTALL_PATH}
    - make -j ${CPU_BUILD}

build_release_static:
  stage: build_release
  script:
    - cd ${RELEASE_STATIC_DIR}
    - cmake ../.. -DCMAKE_BUILD_TYPE=Release -DTADAH_ENABLE_OPENMP=ON
        -DBUILD_SHARED_LIBS=OFF -DCMAKE_INSTALL_PREFIX=${INSTALL_PATH}
    - make -j ${CPU_BUILD}

# ---- HPO examples (driver: examples/run_reference_suite.sh) ------------
# `--fast` runs on every push; `--full` is gated to tag pipelines only.
hpo_examples_fast:
  stage: examples
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
  script:
    - if [ -x examples/run_reference_suite.sh ]; then
        bash examples/run_reference_suite.sh --fast;
      else
        echo "examples/run_reference_suite.sh not present yet (Session C will populate)";
        exit 0;
      fi
  allow_failure: true

hpo_examples_full:
  stage: examples
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - if [ -x examples/run_reference_suite.sh ]; then
        bash examples/run_reference_suite.sh --full;
      else
        echo "examples/run_reference_suite.sh not present (Session C will populate)";
        exit 0;
      fi

# ---- Lint (codespell) ---------------------------------------------------
lint_codespell:
  stage: lint
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
  script:
    - command -v codespell || pip install --user codespell
    - export PATH=$HOME/.local/bin:$PATH
    - codespell --skip='./build*,./external,./_deps,./tests/data,./examples/*/best_*' || true
  allow_failure: true

# ---- Source-tarball release (tag-gated) --------------------------------
release_tarball:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - export TARBALL="${CI_PROJECT_NAME}-${CI_COMMIT_TAG}.tar.gz"
    - git archive --format=tar.gz
        --prefix="${CI_PROJECT_NAME}-${CI_COMMIT_TAG}/"
        -o "${TARBALL}" HEAD
    - 'curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN"
        --upload-file "${TARBALL}"
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${CI_PROJECT_NAME}/${CI_COMMIT_TAG}/${TARBALL}"'
  artifacts:
    paths:
      - "*.tar.gz"
    expire_in: 1 week
